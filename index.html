<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Murat - English Resource Hub</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Vertically centred content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 15px 56px;
            width: 100%;
            box-sizing: border-box;
        }

        .page-title {
            text-align: center;
            margin-bottom: 44px;
            padding: 0 10px;
        }

        .page-title h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.15;
            margin: 0;
            color: #1A1F23;
        }

        .page-title h1 span { color: #0F766E; }

        .page-title .sub-desc {
            font-size: 1.5rem;
            font-weight: 600;
            color: #3D4852;
            margin: 10px 0 0 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 24px;
            width: 100%;
            max-width: 900px;
            padding: 8px;
            box-sizing: border-box;
        }

        /* Grade cards: same look as the activity pages */
        .card {
            width: 200px;
            box-sizing: border-box;
            background: #FFFFFF;
            color: #1A1F23;
            text-decoration: none;
            border: 4px solid #334155;
            border-radius: 20px;
            box-shadow: 0 6px 0 #94A3B8;
            padding: 26px 12px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #94A3B8;
        }

        .card:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #94A3B8;
        }

        .card:focus-visible {
            outline: 4px solid #F0A500;
            outline-offset: 4px;
        }

        .num {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #0F766E;
            border: 3px solid #064E48;
            color: #FFFFFF;
            font-size: 2.6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .name {
            font-size: 1.5rem;
            font-weight: 800;
        }

        /* Grade 6: not ready yet */
        .card.soon {
            background: #EEF2F6;
            border-style: dashed;
            border-color: #64748B;
            box-shadow: none;
            cursor: pointer;
        }

        .card.soon:hover { transform: none; box-shadow: none; }
        .card.soon .num { background: #94A3B8; border-color: #64748B; }
        .card.soon .name { color: #3D4852; }

        .tag {
            margin-top: 8px;
            font-size: 0.875rem;
            font-weight: 800;
            color: #7C2D12;
            background: #FFEDD5;
            border: 2px solid #C2410C;
            border-radius: 12px;
            padding: 2px 10px;
        }

        @media (max-width: 600px) {
            .main-content { padding-bottom: 32px; }
            .page-title { margin-bottom: 28px; }
            .page-title h1 { font-size: 2rem; }
            .page-title .sub-desc { font-size: 1.125rem; }
            .container { gap: 14px; padding: 0; }
            .card { width: calc(50% - 7px); padding: 20px 8px 16px; }
            .num { width: 60px; height: 60px; font-size: 2rem; }
            .name { font-size: 1.125rem; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div id="navbar-placeholder" style="min-height: 64px;"></div>
    <script src="navbar.js"></script>

    <main class="main-content">
        <div class="page-title">
            <h1>TEACHER <span>MURAT</span></h1>
            <p class="sub-desc">Your All-in-One English Resource Hub</p>
        </div>

        <div class="container">
            <a href="5/grade5.html" class="card">
                <div class="num">5</div>
                <div class="name">Grade 5</div>
            </a>
            <a href="6/grade6.html" class="card">
                <div class="num">6</div>
                <div class="name">Grade 6</div>
            </a>
            <a href="7/grade7.html" class="card">
                <div class="num">7</div>
                <div class="name">Grade 7</div>
            </a>
            <a href="8/grade8.html" class="card">
                <div class="num">8</div>
                <div class="name">Grade 8</div>
            </a>
        </div>
    </main>

</body>
</html>

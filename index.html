<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Sayfa genel düzeni - Kaydırma sorunlarını ve taşmaları önler */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle, #ffffff 0%, #CDEFFF 100%);
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        /* Başlık Alanı - Büyütüldü */
        .page-title {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .page-title h1 {
            font-size: 56px; /* 40'tan 56'ya */
            color: #2c3e50;
            margin: 0;
            font-weight: 600;
            letter-spacing: -1px;
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
            line-height: 1.2;
        }

        /* İkinci satır: SECONDARY SCHOOL (orta boy, kalın, renkli) - kaldırıldı ama siz eklemek isterseniz */
        /* .page-title .sub-main { ... } */

        /* Üçüncü satır: Your All-in-One English Resource Hub (büyütüldü) */
        .page-title .sub-desc {
            font-size: 26px; /* 20'den 26'ya */
            font-weight: 400;
            color: #5d6d7e;
            margin: 8px 0 0 0;
            letter-spacing: 1px;
            text-shadow: none;
            background: none;
            -webkit-text-fill-color: #5d6d7e;
        }

        /* Kart Konteynırı */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px; /* Biraz daha açıklık */
            width: 100%;
            max-width: 820px; /* Daha geniş butonlar için max-width artırıldı */
            padding: 5px;
            box-sizing: border-box;
        }

        /* Buton Kartları - Büyütüldü */
        .card {
            width: 185px;   /* 140 → 180 */
            height: 165px;  /* 120 → 160 */
            text-decoration: none;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            color: white;
            box-sizing: border-box;
        }

        .card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 48px; /* 36 → 48 */
            margin-bottom: 8px;
        }

        .label {
            font-size: 22px; /* 18 → 22 */
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* Sınıf Renkleri */
        .grade-5 { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
        .grade-6 { background: linear-gradient(135deg, #4ECDC4, #5563FF); }
        .grade-7 { background: linear-gradient(135deg, #A8E063, #56AB76); }
        .grade-8 { background: linear-gradient(135deg, #F77F00, #FCFF44); color: #333; }

        /* Mobil Ekran Uyum Ayarları (600px ve altı) - Orantılı büyütüldü */
        @media (max-width: 600px) {
            .page-title h1 { 
                font-size: 32px; /* 24 → 32 */
            }
            .page-title .sub-desc {
                font-size: 18px; /* 14 → 18 */
            }
            .container { 
                gap: 14px; 
                max-width: 100%;
            }
            .card { 
                width: calc(50% - 14px); 
                max-width: 160px; 
                height: 140px; /* 110 → 140 */
            }
            .icon { font-size: 38px; /* 30 → 38 */ }
            .label { font-size: 18px; /* 15 → 18 */ }
        }
    </style>

    <link rel="stylesheet" href="site-background.css">
    
</head>
<body>
    
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>
        
    <div class="page-title">
    
    <h1>TEACHER MURAT</h1>
    <p class="sub-desc">Your All-in-One English Resource Hub</p>
</div>

<div class="container">
    <a href="5/grade5.html" class="card grade-5">
        <div class="icon">📝</div>
        <div class="label">Grade 5</div>
    </a>
    <a href="javascript:void(0)" class="card grade-6" onclick="alert('Grade 6 yakında eklenecek!')">
        <div class="icon">📝</div>
        <div class="label">Grade 6</div>
    </a>
    <a href="7/grade7.html" class="card grade-7">
        <div class="icon">📝</div>
        <div class="label">Grade 7</div>
    </a>
    <a href="8/grade8.html" class="card grade-8">
        <div class="icon">📝</div>
        <div class="label">Grade 8</div>
    </a>
</div>
</body>
</html>

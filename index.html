<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Murat - English Resource Hub</title>
    <style>
        /* Sayfa genel düzeni - Kaydırma sorunlarını ve taşmaları önler */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: radial-gradient(circle, #ffffff 0%, #CDEFFF 100%);
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* DİKEY VE OPTİK MERKEZLEME SAĞLAYAN KAPSAYICI */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            width: 100%;
            box-sizing: border-box;
            transform: translateY(-40px); /* Optik denge için yukarı taşıma */
        }

        /* Başlık Alanı */
        .page-title {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .page-title h1 {
            font-size: 3.5rem; /* 56px */
            color: #2c3e50;
            margin: 0;
            font-weight: 600;
            letter-spacing: -1px;
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
            line-height: 1.2;
        }

        .page-title .sub-desc {
            font-size: 1.625rem; /* 26px */
            font-weight: 400;
            color: #5d6d7e;
            margin: 8px 0 0 0;
            letter-spacing: 1px;
            text-shadow: none;
            background: none;
            -webkit-text-fill-color: #5d6d7e;
        }

        /* Kart Konteynırı */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 820px;
            padding: 5px;
            box-sizing: border-box;
        }

        /* Buton Kartları */
        .card {
            width: 185px;
            height: 165px;
            text-decoration: none;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            color: white;
            box-sizing: border-box;
        }

        .card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 3rem; /* 48px */
            margin-bottom: 8px;
        }

        .label {
            font-size: 1.375rem; /* 22px */
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* Sınıf Renkleri */
        .grade-5 { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
        .grade-6 { background: linear-gradient(135deg, #4ECDC4, #5563FF); }
        .grade-7 { background: linear-gradient(135deg, #A8E063, #56AB76); }
        .grade-8 { background: linear-gradient(135deg, #F77F00, #FCFF44); color: #333; }

        /* Mobil Ekran Uyum Ayarları (600px ve altı) */
        @media (max-width: 600px) {
            .main-content {
                transform: translateY(-20px); /* Mobilde ideal optik hizalama */
            }
            .page-title h1 { 
                font-size: 2rem; /* 32px */
            }
            .page-title .sub-desc {
                font-size: 1.125rem; /* 18px */
            }
            .container { 
                gap: 14px; 
                max-width: 100%;
            }
            .card { 
                width: calc(50% - 14px); 
                max-width: 160px; 
                height: 140px;
            }
            .icon { font-size: 2.375rem; } /* 38px */
            .label { font-size: 1.125rem; } /* 18px */
        }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <!-- NAVBAR ALANI (Sabit Kalır) -->
    <div id="navbar-placeholder" style="min-height: 64px;"></div>
    <script src="navbar.js"></script>

    <!-- DİKEY VE OPTİK MERKEZLEME SAĞLAYAN ANA İÇERİK KAPSAYICISI -->
    <main class="main-content">
        <!-- Başlık Alanı -->
        <div class="page-title">
            <h1>TEACHER MURAT</h1>
            <p class="sub-desc">Your All-in-One English Resource Hub</p>
        </div>

        <!-- Kart Konteynırı -->
        <div class="container">
            <a href="5/grade5.html" class="card grade-5">
                <div class="icon">📝</div>
                <div class="label">Grade 5</div>
            </a>
            <!-- Grade 6 kartı modal tetikliyor -->
            <a href="javascript:void(0)" class="card grade-6" onclick="document.getElementById('soonModal').classList.add('open')">
                <div class="icon">📝</div>
                <div class="label">Grade 6</div>
            </a>
            <a href="7/grade7.html" class="card grade-7">
                <div class="icon">📝</div>
                <div class="label">Grade 7</div>
            </a>
            <a href="8/grade8.html" class="card grade-8">
                <div class="icon">📝</div>
                <div class="label">Grade 8</div>
            </a>
        </div>
    </main>

</body>
</html>

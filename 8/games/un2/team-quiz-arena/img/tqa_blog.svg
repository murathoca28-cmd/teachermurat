<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" xmlns:c2pa="http://c2pa.org/manifest"><rect x="6" y="6" width="788" height="508" rx="26" fill="#fff" stroke="#0B2F2C" stroke-width="10"/><rect x="6" y="6" width="788" height="88" rx="26" fill="#FFD23F" stroke="#0B2F2C" stroke-width="10"/><text x="400" y="66" text-anchor="middle" font-size="40" font-weight="900" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">Mia’s blog</text><text x="50" y="150" font-size="36" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">On weekends, I stay at home.</text><text x="50" y="218" font-size="36" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">I read books and write on my</text><text x="50" y="270" font-size="36" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">blog.</text><text x="50" y="338" font-size="36" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">Sometimes my friends come over,</text><text x="50" y="390" font-size="36" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">and we watch movies.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
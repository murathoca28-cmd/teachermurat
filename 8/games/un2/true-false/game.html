<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True or False</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 6px 14px 14px; }
  #card { flex: 1; min-height: 0; background: #fff; border: 6px solid #0B2F2C; border-radius: 22px; padding: 10px 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; }
  #s-en { font-weight: 900; font-size: clamp(1.6rem, 4.6vw, 3.8rem); line-height: 1.2; }
  #s-tr { font-weight: 800; font-size: clamp(1rem, 2.2vw, 1.7rem); color: #0B5C56; }
  #tbar { flex: 0 0 auto; height: 22px; background: #fff; border: 4px solid #0B2F2C; border-radius: 12px; overflow: hidden; }
  #tfill { height: 100%; width: 100%; background: #FFD23F; }
  #tfill.low { background: #D62828; }
  #ans { flex: 0 0 auto; display: flex; gap: 14px; }
  .abtn { flex: 1; font-size: clamp(1.8rem, 5vw, 4rem); font-weight: 900; padding: .25em 0; border: 6px solid #0B2F2C; border-radius: 22px; box-shadow: 0 7px 0 #0B2F2C; color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  .abtn:active { transform: translateY(4px); box-shadow: 0 3px 0 #0B2F2C; }
  #bt { background: #0A7A2F; } #bf { background: #D62828; }
  .abtn:disabled { opacity: .5; cursor: default; }
  #fbbox { flex: 0 0 auto; min-height: 5.2em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  #fb-en { font-weight: 900; font-size: clamp(1.1rem, 2.8vw, 2.1rem); }
  #fb-tr { font-weight: 800; font-size: clamp(.9rem, 1.9vw, 1.4rem); }
  #next { display: none; font-size: clamp(1.1rem, 2.6vw, 1.8rem); }
  .ok { color: #C8F7D4; } .no { color: #FFD6D6; }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">True<br>or False?</h1>
  <p class="subtitle">Read fast. Decide fast!</p>
  <div class="preview">✔ ❌</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Question: <span id="rn">1</span>/12</div>
  <div class="stat">Score: <span id="sc">0</span></div>
  <div class="stat">Streak: <span id="sk">0</span> 🔥</div>
  <button class="restart-btn" id="tmbtn" onclick="toggleTimer()">Timer: On</button>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="card"><div id="s-en"></div><div id="s-tr" class="tr"></div></div>
  <div id="tbar"><div id="tfill"></div></div>
  <div id="ans"><button class="abtn" id="bt" onclick="answer(true)">TRUE ✔</button><button class="abtn" id="bf" onclick="answer(false)">FALSE ✘</button></div>
  <div id="fbbox"><div id="fb-en"></div><div id="fb-tr" class="tr"></div><button class="big-btn" id="next" onclick="nextQ()">Next</button></div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var Q = [["Hiking means walking in nature.", "Hiking, doğada yürümek demektir.", true, "", ""], ["You usually go fishing in a library.", "Genellikle kütüphanede balık tutmaya gidersin.", false, "You usually go fishing near a river, a lake or the sea.", "Genellikle bir nehrin, bir gölün ya da denizin yanında balık tutmaya gidersin."], ["A tent is a place to sleep when you go camping.", "Çadır, kampa gittiğinde uyuyacağın bir yerdir.", true, "", ""], ["A guitar has black and white keys.", "Gitarın siyah ve beyaz tuşları vardır.", false, "A piano has black and white keys. A guitar has strings.", "Piyanonun siyah ve beyaz tuşları vardır. Gitarın telleri vardır."], ["A concert is an event where musicians play live music.", "Konser, müzisyenlerin canlı müzik çaldığı bir etkinliktir.", true, "", ""], ["If something is boring, it is very interesting.", "Bir şey sıkıcıysa çok ilginçtir.", false, "If something is boring, it is not interesting.", "Bir şey sıkıcıysa ilginç değildir."], ["Rock music is usually loud.", "Rock müziği genellikle yüksek sesli olur.", true, "", ""], ["A drum is a wind instrument.", "Davul bir nefesli çalgıdır.", false, "You hit a drum. It is a percussion instrument.", "Davula vurursun. Bu bir vurmalı çalgıdır."], ["A documentary is a film about real people and real events.", "Belgesel, gerçek insanlar ve gerçek olaylar hakkında bir filmdir.", true, "", ""], ["“Unbearable” means you can stand it easily.", "“Unbearable”, ona kolayca katlanabilirsin demektir.", false, "“Unbearable” means you cannot stand it.", "“Unbearable”, ona katlanamazsın demektir."], ["“Terrific” means very good.", "“Terrific”, çok iyi demektir.", true, "", ""], ["If you hate an activity, you really enjoy it.", "Bir etkinlikten nefret ediyorsan ondan gerçekten keyif alırsın.", false, "If you hate an activity, you do not like it at all.", "Bir etkinlikten nefret ediyorsan ondan hiç hoşlanmazsın."], ["If you love an activity, you like it a lot.", "Bir etkinliği seviyorsan ondan çok hoşlanırsın.", true, "", ""], ["“I can’t stand noisy places” means “I like noisy places”.", "“I can’t stand noisy places”, “Gürültülü yerleri severim” demektir.", false, "“I can’t stand noisy places” means “I really dislike noisy places”.", "“I can’t stand noisy places”, “Gürültülü yerlerden gerçekten hoşlanmam” demektir."], ["Surfing the Internet means looking at websites online.", "Surfing the Internet, internette web sitelerine bakmak demektir.", true, "", ""], ["Heavy metal is usually very quiet music.", "Heavy metal genellikle çok sakin bir müziktir.", false, "Heavy metal is usually very loud music.", "Heavy metal genellikle çok gürültülü bir müziktir."], ["“I prefer tea to coffee” means I like tea more than coffee.", "“I prefer tea to coffee”, çayı kahveden daha çok severim demektir.", true, "", ""], ["“Never” means “every day”.", "“Never”, “her gün” demektir.", false, "“Never” means “not at any time”.", "“Never”, “hiçbir zaman” demektir."], ["Teenagers are young people between 13 and 19 years old.", "Gençler, 13 ile 19 yaş arasındaki genç insanlardır.", true, "", ""], ["You wear headphones on your feet.", "Kulaklığı ayaklarına takarsın.", false, "You wear headphones on your ears.", "Kulaklığı kulaklarına takarsın."], ["A violin is a string instrument.", "Keman bir telli çalgıdır.", true, "", ""], ["A trendy jacket is out of fashion.", "Trendy bir ceket modası geçmiş bir ceket demektir.", false, "A trendy jacket is in fashion.", "Trendy bir ceket modaya uygun bir cekettir."], ["Going shopping means going to shops to buy things.", "Alışverişe gitmek, bir şeyler satın almak için mağazalara gitmek demektir.", true, "", ""], ["Teenagers cannot have hobbies.", "Gençlerin hobileri olamaz.", false, "Teenagers can have many different hobbies.", "Gençlerin birçok farklı hobisi olabilir."]], ROUNDS = 12, TIME = 15000;
  var order, qi, score, streak, best, locked, timerOn = true, t0, tid;

  function toggleTimer() { timerOn = !timerOn; document.getElementById('tmbtn').textContent = 'Timer: ' + (timerOn ? 'On' : 'Off'); if (!locked) runTimer(); }
  function runTimer() {
    clearInterval(tid); var f = document.getElementById('tfill'); f.className = ''; f.style.width = '100%';
    if (!timerOn) return;
    t0 = Date.now();
    tid = setInterval(function () {
      var left = 1 - (Date.now() - t0) / TIME;
      f.style.width = Math.max(0, left * 100) + '%'; f.className = left < .3 ? 'low' : '';
      if (left <= 0) { clearInterval(tid); answer(null); }
    }, 100);
  }
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(Q.slice()).slice(0, ROUNDS); qi = 0; score = 0; streak = 0; best = 0;
    document.getElementById('sc').textContent = 0; document.getElementById('sk').textContent = 0;
    showQ();
  }
  function showQ() {
    var q = order[qi]; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('s-en').textContent = q[0]; document.getElementById('s-tr').textContent = q[1];
    document.getElementById('fb-en').textContent = ''; document.getElementById('fb-tr').textContent = '';
    document.getElementById('next').style.display = 'none';
    document.getElementById('bt').disabled = false; document.getElementById('bf').disabled = false;
    runTimer();
  }
  function answer(v) {
    if (locked) return; locked = true; clearInterval(tid);
    var q = order[qi], ok = (v === q[2]);
    document.getElementById('bt').disabled = true; document.getElementById('bf').disabled = true;
    var en = document.getElementById('fb-en'), tr = document.getElementById('fb-tr');
    if (ok) { score++; streak++; best = Math.max(best, streak); } else { streak = 0; }
    document.getElementById('sc').textContent = score; document.getElementById('sk').textContent = streak;
    var head = ok ? '✔ Correct!' : (v === null ? '⏰ Time is up!' : '✘ Not quite.');
    if (q[2]) { en.textContent = head + ' This sentence is true.'; tr.textContent = 'Bu cümle doğru.'; }
    else { en.textContent = head + ' ' + q[3]; tr.textContent = q[4]; }
    en.className = ok ? 'ok' : 'no';
    var nx = document.getElementById('next'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
  }
  function nextQ() {
    qi++;
    if (qi >= order.length) {
      document.getElementById('win-title').textContent = score >= 11 ? 'Perfect!' : (score >= 8 ? 'Great Job!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Score: ' + score + ' / ' + order.length + '  |  Best streak: ' + best;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showQ();
  }
</script>
<div id="ln-screen">
  <div id="ln-top"><div id="ln-title">📖 Learn</div><div id="ln-tabs"></div><button id="ln-close" onclick="lnClose()">Close ✕</button></div>
  <div id="ln-grid"></div>
</div>
<script>
(function () {
  var LN = [["Opinion Words", "Görüş Bildiren Kelimeler", [["🌟", "terrific", "harika, muhteşem"], ["🤩", "awesome", "çok güzel, süper"], ["😌", "relaxing", "rahatlatıcı"], ["🔊", "loud", "gürültülü, yüksek sesli"], ["👏", "impressive", "etkileyici"], ["😴", "boring", "sıkıcı"], ["😖", "unbearable", "dayanılmaz"], ["😄", "enjoyable", "keyifli, zevkli"], ["🔥", "trendy", "modaya uygun"], ["📖", "educative", "eğitici"], ["🛋️", "comfortable", "rahat, konforlu"], ["😫", "tiring", "yorucu"]]], ["Likes and Dislikes", "Sevme ve Sevmeme", [["😍", "love + -ing", "…meye bayılmak"], ["😊", "like / enjoy + -ing", "…mekten hoşlanmak"], ["👍", "be fond of + -ing", "…meyi çok sevmek"], ["⭐", "be keen on + -ing", "…meye düşkün olmak"], ["⚖️", "prefer … to …", "…yi …e tercih etmek"], ["😕", "dislike + -ing", "…mekten hoşlanmamak"], ["😠", "hate + -ing", "…mekten nefret etmek"], ["🙅", "can’t stand + -ing", "…meye katlanamamak"], ["🤷", "not be interested in", "…ile ilgilenmemek"], ["😐", "I don’t mind", "Sakıncası yok, sorun değil"]]], ["Free-Time Activities", "Boş Zaman Etkinlikleri", [["🛍️", "go shopping", "alışverişe gitmek"], ["🥾", "go hiking", "doğa yürüyüşüne gitmek"], ["⛺", "go camping", "kampa gitmek"], ["🎣", "go fishing", "balık tutmaya gitmek"], ["🎬", "go to the cinema", "sinemaya gitmek"], ["🎤", "go to a concert", "konsere gitmek"], ["🎧", "listen to music", "müzik dinlemek"], ["📚", "read books", "kitap okumak"], ["🎮", "play online games", "çevrimiçi oyun oynamak"], ["💻", "surf the Internet", "internette gezinmek"], ["👪", "spend time with family", "ailemle zaman geçirmek"], ["📺", "watch sports programmes", "spor programları izlemek"], ["🧹", "tidy your room", "odanı toplamak"], ["🚶", "hang around", "boş boş gezmek, takılmak"]]]];
  function lnShow(i) {
    Array.prototype.forEach.call(document.querySelectorAll('.ln-tab'), function (b, k) { b.classList.toggle('act', k === i); });
    document.getElementById('ln-grid').innerHTML = LN[i][2].map(function (it) {
      var wide = it[1].length > 26 && it[0].indexOf('<svg') < 0;
      return '<div class="ln-card' + (wide ? ' wide' : '') + '"><div class="le">' + it[0] + '</div><div class="en">' + it[1] + '</div><div class="trl">' + it[2] + '</div></div>';
    }).join('');
    document.getElementById('ln-grid').scrollTop = 0;
  }
  window.lnOpen = function () {
    var tabs = document.getElementById('ln-tabs'); tabs.innerHTML = '';
    LN.forEach(function (s, i) { var b = document.createElement('button'); b.className = 'ln-tab'; b.textContent = s[0]; b.onclick = function () { lnShow(i); }; tabs.appendChild(b); });
    document.getElementById('ln-screen').style.display = 'flex'; lnShow(0);
  };
  window.lnClose = function () { document.getElementById('ln-screen').style.display = 'none'; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.lnClose(); });
})();
</script>
</body>
</html>

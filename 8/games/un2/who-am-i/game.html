ına takarsın.", "Kulaklarını örteriz.", "Bizimle sessizce müzik dinleyebilirsin."], "opts": [["headphones", "🎧", "headphones", "kulaklık"], ["mic", "🎤", "microphone", "mikrofon"], ["laptop", "💻", "laptop", "dizüstü bilgisayar"], ["boots", "🥾", "hiking boots", "doğa yürüyüşü botları"]]}, {"k": "camera", "en": ["I am a small machine.", "I have a lens.", "I take pictures.", "You say “smile!” when I take a photo."], "tr": ["Küçük bir makineyim.", "Bir merceğim var.", "Resim çekerim.", "Ben fotoğraf çekerken “gülümse!” dersin."], "opts": [["camera", "📷", "camera", "fotoğraf makinesi"], ["tent", "⛺", "tent", "çadır"], ["laptop", "💻", "laptop", "dizüstü bilgisayar"], ["ticket", "🎟️", "ticket", "bilet"]]}, {"k": "tent", "en": ["I am made of cloth.", "You put me up in a forest or a field.", "I am a small house for the night.", "You sleep inside me when you go camping."], "tr": ["Kumaştan yapılmışım.", "Beni bir ormanda ya da tarlada kurarsın.", "Gece için küçük bir evim.", "Kampa gittiğinde benim içimde uyursun."], "opts": [["tent", "⛺", "tent", "çadır"], ["book", "📚", "book", "kitap"], ["boots", "🥾", "hiking boots", "doğa yürüyüşü botları"], ["camera", "📷", "camera", "fotoğraf makinesi"]]}, {"k": "rod", "en": ["I am long and thin.", "I have a line and a hook.", "You hold me near the water.", "You use me to catch fish."], "tr": ["Uzun ve inceyim.", "Bir ipim ve bir iğnem var.", "Beni suyun yakınında tutarsın.", "Balık yakalamak için beni kullanırsın."], "opts": [["rod", "🎣", "fishing rod", "olta"], ["boots", "🥾", "hiking boots", "doğa yürüyüşü botları"], ["tent", "⛺", "tent", "çadır"], ["book", "📚", "book", "kitap"]]}, {"k": "book", "en": ["I have many pages.", "I have words and sometimes pictures.", "You read me.", "You can find me in a library."], "tr": ["Birçok sayfam var.", "Kelimelerim ve bazen resimlerim var.", "Beni okursun.", "Beni bir kütüphanede bulabilirsin."], "opts": [["book", "📚", "book", "kitap"], ["laptop", "💻", "laptop", "dizüstü bilgisayar"], ["camera", "📷", "camera", "fotoğraf makinesi"], ["ticket", "🎟️", "ticket", "bilet"]]}, {"k": "mic", "en": ["I am a small tool.", "A singer holds me.", "I make a voice louder.", "You sing into me at a concert."], "tr": ["Küçük bir araç.", "Bir şarkıcı beni tutar.", "Bir sesi daha yüksek yaparım.", "Konserde bana doğru şarkı söylersin."], "opts": [["mic", "🎤", "microphone", "mikrofon"], ["headphones", "🎧", "headphones", "kulaklık"], ["guitar", "🎸", "guitar", "gitar"], ["camera", "📷", "camera", "fotoğraf makinesi"]]}, {"k": "laptop", "en": ["I am a computer.", "I have a screen and a keyboard.", "You can carry me in your bag.", "You use me to surf the Internet."], "tr": ["Bir bilgisayarım.", "Bir ekranım ve bir klavyem var.", "Beni çantanda taşıyabilirsin.", "İnternette gezinmek için beni kullanırsın."], "opts": [["laptop", "💻", "laptop", "dizüstü bilgisayar"], ["tv", "📺", "television", "televizyon"], ["book", "📚", "book", "kitap"], ["tent", "⛺", "tent", "çadır"]]}, {"k": "popcorn", "en": ["I am a snack.", "I am white and light.", "I am made from corn, and I pop in the heat.", "People eat me at the cinema."], "tr": ["Bir atıştırmalığım.", "Beyazım ve hafifim.", "Mısırdan yapılırım ve ısıda patlarım.", "İnsanlar beni sinemada yer."], "opts": [["popcorn", "🍿", "popcorn", "patlamış mısır"], ["ticket", "🎟️", "ticket", "bilet"], ["headphones", "🎧", "headphones", "kulaklık"], ["boots", "🥾", "hiking boots", "doğa yürüyüşü botları"]]}, {"k": "ticket", "en": ["I am a small piece of paper.", "You need me to get in.", "You buy me before the show.", "I show your seat at the cinema or a concert."], "tr": ["Küçük bir kâğıt parçasıyım.", "İçeri girmek için bana ihtiyacın var.", "Beni gösteriden önce satın alırsın.", "Sinemada ya da bir konserde koltuğunu gösteririm."], "opts": [["ticket", "🎟️", "ticket", "bilet"], ["camera", "📷", "camera", "fotoğraf makinesi"], ["mic", "🎤", "microphone", "mikrofon"], ["popcorn", "🍿", "popcorn", "patlamış mısır"]]}, {"k": "boots", "en": ["We come in a pair.", "You wear us on your feet.", "We are strong and have thick soles.", "You need us for hiking in the mountains."], "tr": ["İkili gelirik.", "Bizi ayaklarına giyersin.", "Sağlamızdır ve kalın tabanlarımız vardır.", "Dağlarda doğa yürüyüşü için bize ihtiyacın var."], "opts": [["boots", "🥾", "hiking boots", "doğa yürüyüşü botları"], ["headphones", "🎧", "headphones", "kulaklık"], ["tent", "⛺", "tent", "çadır"], ["rod", "🎣", "fishing rod", "olta"]]}], ROUNDS = 10;
  var order, qi, shown, wrong, score, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(R.slice()).slice(0, ROUNDS); qi = 0; score = 0;
    document.getElementById('sc').textContent = 0;
    showR();
  }
  function addClue() {
    var q = order[qi], i = shown;
    var d = document.createElement('div'); d.className = 'cl';
    d.innerHTML = '<div class="en">' + (i + 1) + '. ' + q.en[i] + '</div><div class="trl tr">' + q.tr[i] + '</div>';
    document.getElementById('cls').appendChild(d);
    shown++;
    document.getElementById('nc').disabled = (shown >= q.en.length);
    if (d.scrollIntoView) d.scrollIntoView({ block: 'nearest' });
  }
  function showR() {
    var q = order[qi]; shown = 0; wrong = 0; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('cls').innerHTML = ''; document.getElementById('qmark').textContent = '?';
    document.getElementById('fb').textContent = ''; document.getElementById('nxt').style.display = 'none';
    document.getElementById('nc').style.display = ''; document.getElementById('nc').disabled = false;
    addClue();
    var box = document.getElementById('right'); box.innerHTML = '';
    shuffle(q.opts.slice()).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = '<div class="e">' + o[1] + '</div><div class="p">' + o[2] + '</div><div class="t tr">' + o[3] + '</div>';
      b.addEventListener('click', function () { guess(b, o[0]); });
      box.appendChild(b);
    });
  }
  function moreClue() { if (locked) return; if (shown < order[qi].en.length) addClue(); }
  function guess(btn, k) {
    if (locked || btn.classList.contains('bad')) return;
    var q = order[qi];
    if (k === q.k) {
      locked = true;
      var pts = Math.max(0, (q.en.length - shown + 1) - wrong); score += pts;
      document.getElementById('sc').textContent = score;
      btn.classList.add('good');
      var o = q.opts[0]; document.getElementById('qmark').textContent = o[1];
      document.getElementById('fb').textContent = '✔ I am ' + (/^[aeiou]/.test(o[2]) ? 'an ' : 'a ') + o[2] + '!  +' + pts + (pts === 1 ? ' point' : ' points');
      document.getElementById('nc').style.display = 'none';
      var nx = document.getElementById('nxt'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      wrong++; btn.classList.add('bad', 'shake');
      document.getElementById('fb').textContent = 'Not this one. Try again!';
    }
  }
  function nextR() {
    qi++;
    if (qi >= order.length) {
      var max = ROUNDS * 4;
      document.getElementById('win-title').textContent = score >= 32 ? 'Super Detective!' : (score >= 22 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Points: ' + score + ' / ' + max;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showR();
  }

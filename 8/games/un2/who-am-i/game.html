<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Am I?</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 4px 12px 12px; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #left { flex: 1.1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #card { flex: 1; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 20px; padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  #qmark { text-align: center; font-weight: 900; font-size: clamp(2rem, 8vh, 4.5rem); line-height: 1; color: #D62828; }
  .cl { border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 12px; background: #FFF3B0; }
  .cl .en { font-weight: 900; font-size: clamp(1.1rem, 2.8vw, 2.1rem); line-height: 1.2; }
  .cl .trl { font-weight: 800; font-size: clamp(.8rem, 1.6vw, 1.2rem); color: #0B5C56; }
  #ctl { flex: 0 0 auto; display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  #nc { font-size: clamp(1rem, 2.4vw, 1.7rem); }
  #nc:disabled { opacity: .45; cursor: default; }
  #fb { font-weight: 900; font-size: clamp(1rem, 2.2vw, 1.6rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; text-align: center; min-height: 1.3em; }
  #right { flex: 1 1 0; min-width: 0; min-height: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .tile { container-type: size; min-width: 0; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B2F2C; }
  .tile .e { font-size: 40cqmin; line-height: 1.1; }
  .tile .p { font-weight: 900; font-size: 13cqmin; line-height: 1.1; }
  .tile .t { font-weight: 800; font-size: 9.5cqmin; color: #0B5C56; }
  .tile.bad { background: #FFD6D6; border-color: #D62828; }
  .tile.good { background: #C8F7D4; border-color: #0A7A2F; border-width: 8px; }
  #nxt { display: none; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }

img.ei{height:1.12em;width:auto;vertical-align:-.2em;display:inline-block;object-fit:contain}
.eiw{display:inline-block;line-height:0;vertical-align:-.15em}
.eiw svg.ei{width:1em;height:1em;display:inline-block}
.preview svg.pv{height:1.15em;width:auto;vertical-align:middle;margin:0 .1em}.preview .eiw svg.ei{width:1.1em;height:1.1em}.win-title svg.pv{height:.85em;width:auto;vertical-align:-.15em;margin:0 .15em}#ln-close .eiw svg.ei path,#fb .eiw svg.ei path,#bt .eiw svg.ei path,#bf .eiw svg.ei path,#fbbox .eiw svg.ei path{stroke:#fff}.tile .e{font-size:56cqmin}.tile .e img.ei{height:1em;max-width:92cqw}.ln-card .le{font-size:clamp(2.2rem,8vh,4rem)}.ln-card .le img.ei{height:1.5em;max-width:100%}.ln-card .le .eiw svg.ei{width:1.5em;height:1.5em}.preview img.ei,.preview .eiw svg.ei{height:1.2em;width:1.2em}.preview img.ei{width:auto}@media (max-height:460px) and (orientation:landscape){#start-screen{gap:1.2vh;padding:6px}#start-screen .title{font-size:clamp(1.5rem,9vh,2.4rem)}#start-screen .subtitle{font-size:clamp(.9rem,4.5vh,1.3rem)}#start-screen .preview{font-size:clamp(1.2rem,7vh,2rem)}#start-screen .big-btn{font-size:clamp(1.1rem,6.5vh,1.8rem)}}@media (max-width:430px) and (max-aspect-ratio:1/1) and (max-height:700px){#qmark{font-size:clamp(1.6rem,6vh,3rem)}}@media (max-width:430px) and (max-aspect-ratio:1/1){.tile .t{font-size:max(9px,9.5cqmin)}}</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Who Am I?</h1>
  <p class="subtitle">Read the clues. Guess who or what I am!</p>
  <div class="preview"><svg class="pv" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.6" fill="#F7C531" stroke="#0B3D41" stroke-width="2"/><path d="M8.9 9.6a3.1 3.1 0 1 1 4.7 2.7c-1 .6-1.6 1.1-1.6 2.5" fill="none" stroke="#0B3D41" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.7" r="1.4" fill="#0B3D41"/></svg> ⟦guitar⟧ ⟦camera⟧ ⟦tent⟧</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">

  <div class="stat">Points: <span id="sc">0</span></div>

</div>
<div id="main">
  <div id="left">
    <div id="card"><div id="qmark">?</div><div id="cls"></div></div>
    <div id="ctl"><button class="restart-btn" id="nc" onclick="moreClue()">Next clue</button><button class="big-btn" id="nxt" onclick="nextR()">Next</button></div>
    <div id="fb"></div>
  </div>
  <div id="right"></div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var R = [{"k": "guitar", "en": ["I am a musical instrument.", "I have six strings.", "I have a long neck and a round hole.", "A rock star often plays me."], "tr": ["Bir müzik aletiyim.", "Altı telim var.", "Uzun bir sapım ve yuvarlak bir deliğim var.", "Bir rock yıldızı sık sık beni çalar."], "opts": [["guitar", "⟦guitar⟧", "guitar", "gitar"], ["piano", "⟦piano⟧", "piano", "piyano"], ["drums", "⟦drum⟧", "drums", "davul"], ["mic", "⟦microphone⟧", "microphone", "mikrofon"]]}, {"k": "piano", "en": ["I am a big musical instrument.", "I have black and white keys.", "You sit in front of me to play.", "People play me with ten fingers."], "tr": ["Büyük bir müzik aletiyim.", "Siyah ve beyaz tuşlarım var.", "Beni çalmak için önüme oturursun.", "İnsanlar beni on parmakla çalar."], "opts": [["piano", "⟦piano⟧", "piano", "piyano"], ["guitar", "⟦guitar⟧", "guitar", "gitar"], ["violin", "⟦violin_bow⟧", "violin", "keman"], ["drums", "⟦drum⟧", "drums", "davul"]]}, {"k": "violin", "en": ["I am small, and I have four strings.", "You play me with a bow.", "You hold me under your chin.", "I am an important part of an orchestra."], "tr": ["Küçüğüm ve dört telim var.", "Beni yayla çalarsın.", "Beni çenenin altında tutarsın.", "Bir orkestranın önemli bir parçasıyım."], "opts": [["violin", "⟦violin_bow⟧", "violin", "keman"], ["piano", "⟦piano⟧", "piano", "piyano"], ["drums", "⟦drum⟧", "drums", "davul"], ["headphones", "⟦headphones⟧", "headphones", "kulaklık"]]}, {"k": "drums", "en": ["We are a set of musical instruments.", "You hit us with sticks.", "We make a strong beat.", "Every rock band needs us."], "tr": ["Bir müzik aleti setiyiz.", "Bize çubuklarla vurursun.", "Güçlü bir ritim yaparız.", "Her rock grubunun bize ihtiyacı vardır."], "opts": [["drums", "⟦drum⟧", "drums", "davul"], ["guitar", "⟦guitar⟧", "guitar", "gitar"], ["violin", "⟦violin_bow⟧", "violin", "keman"], ["camera", "⟦camera⟧", "camera", "fotoğraf makinesi"]]}, {"k": "headphones", "en": ["We come in a pair.", "You wear us on your head.", "We cover your ears.", "With us, you can listen to music quietly."], "tr": ["İkili gelirik.", "Bizi başına takarsın.", "Kulaklarını örteriz.", "Bizimle sessizce müzik dinleyebilirsin."], "opts": [["headphones", "⟦headphones⟧", "headphones", "kulaklık"], ["mic", "⟦microphone⟧", "microphone", "mikrofon"], ["laptop", "⟦technology_laptop⟧", "laptop", "dizüstü bilgisayar"], ["boots", "⟦hiking_boots⟧", "hiking boots", "doğa yürüyüşü botları"]]}, {"k": "camera", "en": ["I am a small machine.", "I have a lens.", "I take pictures.", "You say “smile!” when I take a photo."], "tr": ["Küçük bir makineyim.", "Bir merceğim var.", "Resim çekerim.", "Ben fotoğraf çekerken “gülümse!” dersin."], "opts": [["camera", "⟦camera⟧", "camera", "fotoğraf makinesi"], ["tent", "⟦tent⟧", "tent", "çadır"], ["laptop", "⟦technology_laptop⟧", "laptop", "dizüstü bilgisayar"], ["ticket", "⟦ticket⟧", "ticket", "bilet"]]}, {"k": "tent", "en": ["I am made of cloth.", "You put me up in a forest or a field.", "I am a small house for the night.", "You sleep inside me when you go camping."], "tr": ["Kumaştan yapılmışım.", "Beni bir ormanda ya da tarlada kurarsın.", "Gece için küçük bir evim.", "Kampa gittiğinde benim içimde uyursun."], "opts": [["tent", "⟦tent⟧", "tent", "çadır"], ["book", "⟦book⟧", "book", "kitap"], ["boots", "⟦hiking_boots⟧", "hiking boots", "doğa yürüyüşü botları"], ["camera", "⟦camera⟧", "camera", "fotoğraf makinesi"]]}, {"k": "rod", "en": ["I am long and thin.", "I have a line and a hook.", "You hold me near the water.", "You use me to catch fish."], "tr": ["Uzun ve inceyim.", "Bir ipim ve bir iğnem var.", "Beni suyun yakınında tutarsın.", "Balık yakalamak için beni kullanırsın."], "opts": [["rod", "⟦fishing_rod⟧", "fishing rod", "olta"], ["boots", "⟦hiking_boots⟧", "hiking boots", "doğa yürüyüşü botları"], ["tent", "⟦tent⟧", "tent", "çadır"], ["book", "⟦book⟧", "book", "kitap"]]}, {"k": "book", "en": ["I have many pages.", "I have words and sometimes pictures.", "You read me.", "You can find me in a library."], "tr": ["Birçok sayfam var.", "Kelimelerim ve bazen resimlerim var.", "Beni okursun.", "Beni bir kütüphanede bulabilirsin."], "opts": [["book", "⟦book⟧", "book", "kitap"], ["laptop", "⟦technology_laptop⟧", "laptop", "dizüstü bilgisayar"], ["camera", "⟦camera⟧", "camera", "fotoğraf makinesi"], ["ticket", "⟦ticket⟧", "ticket", "bilet"]]}, {"k": "mic", "en": ["I am a small tool.", "A singer holds me.", "I make a voice louder.", "You sing into me at a concert."], "tr": ["Küçük bir araç.", "Bir şarkıcı beni tutar.", "Bir sesi daha yüksek yaparım.", "Konserde bana doğru şarkı söylersin."], "opts": [["mic", "⟦microphone⟧", "microphone", "mikrofon"], ["headphones", "⟦headphones⟧", "headphones", "kulaklık"], ["guitar", "⟦guitar⟧", "guitar", "gitar"], ["camera", "⟦camera⟧", "camera", "fotoğraf makinesi"]]}, {"k": "laptop", "en": ["I am a computer.", "I have a screen and a keyboard.", "You can carry me in your bag.", "You use me to surf the Internet."], "tr": ["Bir bilgisayarım.", "Bir ekranım ve bir klavyem var.", "Beni çantanda taşıyabilirsin.", "İnternette gezinmek için beni kullanırsın."], "opts": [["laptop", "⟦technology_laptop⟧", "laptop", "dizüstü bilgisayar"], ["tv", "⟦tv⟧", "television", "televizyon"], ["book", "⟦book⟧", "book", "kitap"], ["tent", "⟦tent⟧", "tent", "çadır"]]}, {"k": "popcorn", "en": ["I am a snack.", "I am white and light.", "I am made from corn, and I pop in the heat.", "People eat me at the cinema."], "tr": ["Bir atıştırmalığım.", "Beyazım ve hafifim.", "Mısırdan yapılırım ve ısıda patlarım.", "İnsanlar beni sinemada yer."], "opts": [["popcorn", "⟦popcorn⟧", "popcorn", "patlamış mısır"], ["ticket", "⟦ticket⟧", "ticket", "bilet"], ["headphones", "⟦headphones⟧", "headphones", "kulaklık"], ["boots", "⟦hiking_boots⟧", "hiking boots", "doğa yürüyüşü botları"]]}, {"k": "ticket", "en": ["I am a small piece of paper.", "You need me to get in.", "You buy me before the show.", "I show your seat at the cinema or a concert."], "tr": ["Küçük bir kâğıt parçasıyım.", "İçeri girmek için bana ihtiyacın var.", "Beni gösteriden önce satın alırsın.", "Sinemada ya da bir konserde koltuğunu gösteririm."], "opts": [["ticket", "⟦ticket⟧", "ticket", "bilet"], ["camera", "⟦camera⟧", "camera", "fotoğraf makinesi"], ["mic", "⟦microphone⟧", "microphone", "mikrofon"], ["popcorn", "⟦popcorn⟧", "popcorn", "patlamış mısır"]]}, {"k": "boots", "en": ["We come in a pair.", "You wear us on your feet.", "We are strong and have thick soles.", "You need us for hiking in the mountains."], "tr": ["İkili gelirik.", "Bizi ayaklarına giyersin.", "Sağlamızdır ve kalın tabanlarımız vardır.", "Dağlarda doğa yürüyüşü için bize ihtiyacın var."], "opts": [["boots", "⟦hiking_boots⟧", "hiking boots", "doğa yürüyüşü botları"], ["headphones", "⟦headphones⟧", "headphones", "kulaklık"], ["tent", "⟦tent⟧", "tent", "çadır"], ["rod", "⟦fishing_rod⟧", "fishing rod", "olta"]]}], ROUNDS = 10;
  var order, qi, shown, wrong, score, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(R.slice()).slice(0, ROUNDS); qi = 0; score = 0;
    document.getElementById('sc').textContent = 0;
    showR();
  }
  function addClue() {
    var q = order[qi], i = shown;
    var d = document.createElement('div'); d.className = 'cl';
    d.innerHTML = '<div class="en">' + (i + 1) + '. ' + q.en[i] + '</div><div class="trl tr">' + q.tr[i] + '</div>';
    document.getElementById('cls').appendChild(d);
    shown++;
    document.getElementById('nc').disabled = (shown >= q.en.length);
    if (d.scrollIntoView) d.scrollIntoView({ block: 'nearest' });
  }
  function showR() {
    var q = order[qi]; shown = 0; wrong = 0; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('cls').innerHTML = ''; document.getElementById('qmark').textContent = '?';
    document.getElementById('fb').textContent = ''; document.getElementById('nxt').style.display = 'none';
    document.getElementById('nc').style.display = ''; document.getElementById('nc').disabled = false;
    addClue();
    var box = document.getElementById('right'); box.innerHTML = '';
    shuffle(q.opts.slice()).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = '<div class="e">' + o[1] + '</div><div class="p">' + o[2] + '</div><div class="t tr">' + o[3] + '</div>';
      b.addEventListener('click', function () { guess(b, o[0]); });
      box.appendChild(b);
    });
  }
  function moreClue() { if (locked) return; if (shown < order[qi].en.length) addClue(); }
  function guess(btn, k) {
    if (locked || btn.classList.contains('bad')) return;
    var q = order[qi];
    if (k === q.k) {
      locked = true;
      var pts = Math.max(0, (q.en.length - shown + 1) - wrong); score += pts;
      document.getElementById('sc').textContent = score;
      btn.classList.add('good');
      var o = q.opts[0]; document.getElementById('qmark').textContent = o[1];

    for(var i=0;i<ms.length;i++){var m=ms[i];
      if(m.type==='characterData')walk(m.target);
      else for(var j=0;j<m.addedNodes.length;j++)walk(m.addedNodes[j]);}
  }).observe(document.body,{childList:true,subtree:true,characterData:true});
}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
</script>

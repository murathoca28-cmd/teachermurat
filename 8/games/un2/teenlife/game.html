<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teen Life - Class Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Akıllı tahta için: yüksek kontrast, kalın çerçeve, büyük ve kalın yazı. Her şey tek ekrana sığar, kaydırma yok.
   Düzen: üstte oyun sekmeleri, solda oyun kartı, sağda takım puanları. */
:root{
  color-scheme:light;
  --bg:#0E8A9B; --bg-d:#075C69; --ink:#0A1F26; --line:#0A2A33; --muted:#35525B;
  --acc:#FFC21A; --on-acc:#1A1200; --good:#0A7D3E; --good-d:#06532A; --bad:#C62828; --bad-d:#8E1B1B;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --u:min(1.55vw,2.5vh);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:calc(var(--u)*.6) calc(var(--u)*.9);background:var(--bg);color:#fff;font-family:var(--body);overflow:hidden}
@media (max-height:520px){body{overflow:auto}.app{min-height:560px}}
:focus-visible{outline:4px solid var(--acc);outline-offset:2px}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:calc(var(--u)*.6);min-height:0}

/* üst çubuk */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand tools" "tabs tabs";align-items:center;gap:calc(var(--u)*.5) calc(var(--u)*1);padding-right:52px}
.brand{grid-area:brand;display:flex;align-items:baseline;gap:calc(var(--u)*.9);min-width:0;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:calc(var(--u)*1.8);margin:0;line-height:1;color:#fff}
.crumb{font-weight:800;font-size:calc(var(--u)*.85);color:#fff}
.tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*.5);min-width:0}
.tab{display:flex;align-items:center;gap:.5em;background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:12px;padding:.22em .75em .22em .3em;font-weight:800;font-size:calc(var(--u)*.95);cursor:pointer;text-align:left;line-height:1.05;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.tab b{flex:none;display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);font-size:1.05em}
.tab small{display:block;font-weight:700;color:var(--muted);font-size:.78em}
.tab.on{background:var(--acc);color:var(--on-acc)}
.tab.on small{color:#3B2C00}
.tab.fin b{background:var(--good)}
.tab.fin b::after{content:"✓"}
.tab.fin b span{display:none}
.tools{grid-area:tools;display:flex;gap:calc(var(--u)*.5);flex-wrap:wrap}
.btn{font-weight:800;font-size:calc(var(--u)*.9);border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:.3em .8em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn:hover:not(:disabled){background:#E6F7F9}
.btn:disabled{opacity:.5;cursor:default}
.btn.on{background:var(--acc);color:var(--on-acc)}

/* ana alan */
.stage{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u)*12.5);gap:calc(var(--u)*.8);min-height:0}
.left{display:flex;min-height:0;min-width:0}
.card{flex:1;min-width:0;min-height:0;background:#fff;color:var(--ink);border:4px solid var(--line);border-radius:20px;padding:calc(var(--u)*.8) calc(var(--u)*1.1);display:flex;flex-direction:column;gap:calc(var(--u)*.55);overflow:auto;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.qhead{display:flex;align-items:center;gap:calc(var(--u)*.6);flex-wrap:wrap}
.pill{font-weight:800;font-size:calc(var(--u)*.9);border-radius:999px;padding:.05em .8em;border:3px solid var(--line);background:#fff;color:var(--ink)}
.pill.dark{background:var(--ink);color:#fff}
.pill.turn{margin-left:auto;background:var(--acc);color:var(--on-acc)}
.tag{font-weight:800;font-size:calc(var(--u)*.9);border:3px solid var(--bg-d);color:var(--bg-d);border-radius:999px;padding:0 .8em;background:#fff}
.dots{display:flex;gap:.4em;align-items:center}
.d{width:calc(var(--u)*.85);height:calc(var(--u)*.85);border-radius:50%;border:3px solid var(--line);background:#fff}
.d.ok{background:var(--good)}.d.no{background:var(--bad)}.d.cur{background:var(--acc)}
.tagrow{display:flex;gap:calc(var(--u)*.6);align-items:center}
.trl{margin:0;text-align:center;font-weight:800;color:var(--bg-d);font-size:calc(var(--u)*1.4);min-height:1.35em;line-height:1.25}
.trl.h{visibility:hidden}
.spk{display:inline-block;flex:none;font-weight:800;font-size:.72em;border:3px solid var(--c);color:var(--c);border-radius:999px;padding:0 .65em;background:#fff;white-space:nowrap;line-height:1.35}

/* avatar + konuşma balonu */
.av{--av:min(calc(var(--u)*8.4),19vh);width:var(--av);height:var(--av);border-radius:50%;border:6px solid var(--c);background:#E6F5F7;overflow:hidden;display:block;flex:none}
.av img{width:100%;height:100%;object-fit:contain;display:block}
.askrow{display:flex;align-items:center;gap:calc(var(--u)*1.1);flex:1 1 auto;min-height:0}
.askcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;font-weight:800;font-size:calc(var(--u)*1.1)}
.askcol .av{--av:min(calc(var(--u)*8.6),20vh)}
.bubble{position:relative;flex:1;min-width:0;border:4px solid var(--line);border-radius:22px;padding:calc(var(--u)*.8) calc(var(--u)*1.1);background:#fff;font-family:var(--display);font-weight:800;line-height:1.12;font-size:var(--fs,calc(var(--u)*2.4));text-wrap:balance;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-22px;top:50%;margin-top:-14px;border:14px solid transparent;border-left:0;border-right:20px solid var(--line)}
.bubble::after{content:"";position:absolute;left:-13px;top:50%;margin-top:-10px;border:10px solid transparent;border-left:0;border-right:15px solid #fff}
.bubble.plain::before,.bubble.plain::after{display:none}
.bubble.c{text-align:center}

/* seçenekler */
.opts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:calc(var(--u)*.7)}
.opts.col{grid-template-columns:minmax(0,1fr)}
.ch{background:#fff;color:var(--ink);border:4px solid var(--line);border-radius:18px;padding:calc(var(--u)*.55) calc(var(--u)*.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.3);cursor:pointer;font-family:var(--display);font-weight:800;font-size:calc(var(--u)*1.55);line-height:1.1;box-shadow:0 5px 0 var(--line);position:relative;transition:transform .12s;text-align:center}
.ch:hover{transform:translateY(-3px)}
.opts .ch{min-height:calc(var(--u)*5.2)}
.ch.right{background:var(--good);color:#fff;border-color:var(--good-d);box-shadow:0 5px 0 var(--good-d),0 0 0 6px var(--acc)}
.ch.wrong{background:var(--bad);color:#fff;border-color:var(--bad-d);box-shadow:0 5px 0 var(--bad-d)}
.ch.dim{opacity:.5}
.ch.right::after,.ch.wrong::after{position:absolute;top:-.4em;right:-.2em;width:1.5em;height:1.5em;border-radius:50%;background:#fff;border:4px solid var(--line);display:grid;place-items:center;font-size:.75em;color:var(--ink)}
.ch.right::after{content:"✓"}
.ch.wrong::after{content:"✗"}
.ch.answered{cursor:default}
.ch.answered:hover{transform:none}

/* geri bildirim */
.fbrow{display:flex;align-items:center;gap:calc(var(--u)*.8);min-height:calc(var(--u)*3.8)}
.fbrow.ghost{visibility:hidden}
.fb{flex:1;min-width:0;border:4px solid var(--line);border-radius:14px;padding:.3em .8em;font-weight:800;font-size:calc(var(--u)*1.3);line-height:1.15}
.fb.good{background:var(--good);color:#fff;border-color:var(--good-d)}
.fb.bad{background:var(--bad);color:#fff;border-color:var(--bad-d)}
.fb small{display:block;font-weight:800;font-size:.75em;margin-top:.1em}
.fb .pts{float:right;margin-left:.6em;background:#fff;color:var(--ink);border-radius:999px;padding:0 .6em;font-family:var(--display)}
.go{flex:none;background:var(--acc);color:var(--on-acc);border:4px solid var(--line);border-radius:14px;font-family:var(--display);font-weight:800;font-size:calc(var(--u)*1.6);padding:.3em 1em;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.go:hover:not(:disabled){transform:translateY(-2px)}
.go:disabled{opacity:.45;cursor:default}

/* sınıf kuralları */
.rwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:calc(var(--u)*.9)}
.rpic{min-height:0;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.rpic .pic{flex:1;min-height:0;border:4px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.rpic img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.rcap{flex:none;border:4px solid var(--good);border-radius:14px;padding:.15em .6em;font-weight:800;font-size:calc(var(--u)*1.2);background:#fff;color:var(--ink);line-height:1.15}
.rcap small{display:block;font-size:.78em;color:var(--bg-d)}
.rcap.g{visibility:hidden}
.mpanel{min-height:0;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*.6);justify-content:space-between}
.mpanel>.bubble{flex:none}
.mpanel .askrow{flex:none}
.mpanel .askrow .bubble{flex:1}
.mpanel .askcol{font-size:calc(var(--u)*.9)}
.mpanel .askcol .av{--av:min(calc(var(--u)*4.6),11vh)}
.mpanel .bubble{font-size:min(var(--fs,calc(var(--u)*1.7)),calc(var(--u)*1.7));padding:.3em .6em}
.mpanel .ch{font-size:calc(var(--u)*1.2);min-height:calc(var(--u)*3.4);padding:calc(var(--u)*.35) calc(var(--u)*.5)}
.mpanel .opts{gap:calc(var(--u)*.5)}
.mpanel .fb{font-size:calc(var(--u)*1.1);padding:.15em .5em;border-width:3px}
.mpanel .go{font-size:calc(var(--u)*1.3)}
.mpanel .fbrow{flex-direction:row;align-items:stretch;gap:calc(var(--u)*.5)}
.mpanel .fbrow .go{align-self:center;padding:.3em .6em}
.mpanel .trl{text-align:left;font-size:calc(var(--u)*1.05);min-height:1.3em}
.instr{margin:0;font-weight:800;font-size:calc(var(--u)*1.1);color:var(--muted)}

/* diyalog sıralama */
.owrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--u)*.9)}
.ocol{min-height:0;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*.3)}
.ocol h3{margin:0;font-size:calc(var(--u)*.95);font-weight:800;color:var(--bg-d);line-height:1.1}
.olist{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);gap:calc(var(--u)*.4)}
.orow{display:flex;align-items:stretch;gap:calc(var(--u)*.4);min-height:0;min-width:0}
.onum{flex:none;width:1.8em;display:grid;place-items:center;border-radius:10px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:calc(var(--u)*1.3)}
.slot,.pslot{flex:1;min-width:0;min-height:0;border:4px dashed #8AA0A6;border-radius:12px}
.pslot{border-width:3px;border-color:#C9D6D9}
.oc{flex:1;width:100%;min-width:0;min-height:0;display:flex;align-items:center;gap:calc(var(--u)*.5);background:#fff;color:var(--ink);border:4px solid var(--c);border-radius:12px;padding:.1em .5em .1em .25em;cursor:pointer;text-align:left;font-family:var(--body);font-weight:800;font-size:calc(var(--u)*1.2);line-height:1.1;box-shadow:0 3px 0 var(--c);overflow:hidden}
.oc:hover:not(.lock){transform:translateY(-2px)}
.oc .av{--av:calc(var(--u)*3.2);border-width:3px}
.otx{min-width:0;display:block}
.otx i{display:inline;font-style:normal;font-size:.72em;color:var(--c);margin-right:.5em}
.otx small{display:block;font-size:.74em;color:var(--bg-d);margin-top:.1em}
.oc.good{background:#DDF3E5;border-color:var(--good);box-shadow:0 3px 0 var(--good-d)}
.oc.bad{background:#FADADA;border-color:var(--bad);box-shadow:0 3px 0 var(--bad-d)}
.oc.lock{cursor:default}
.owrap.done{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.owrap.done .oc{font-size:calc(var(--u)*1.05)}
@media (max-height:800px){.oc .av{--av:calc(var(--u)*2.8)}}
.odone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*.6);border:4px dashed var(--good);border-radius:16px;padding:calc(var(--u)*.8);font-weight:800;font-size:calc(var(--u)*1.4);color:var(--ink)}
.odone b{font-family:var(--display);font-size:1.6em;line-height:1.05}
.odone .roles{display:flex;gap:calc(var(--u)*.6)}
.odone .av{--av:calc(var(--u)*4.4)}

/* bölüm sonu */
.finbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*.7)}
.finbox h2{margin:0;font-family:var(--display);font-weight:800;font-size:calc(var(--u)*3.4);line-height:1}
.finrow{display:flex;gap:calc(var(--u)*.7)}
.finrow .av{--av:calc(var(--u)*5)}
.fins{font-weight:800;font-size:calc(var(--u)*1.7)}
.finteams{display:flex;gap:calc(var(--u)*.7);flex-wrap:wrap;justify-content:center}
.ft{border:4px solid var(--line);border-radius:14px;padding:.2em .9em;font-weight:800;font-size:calc(var(--u)*1.3);background:#fff}
.ft b{font-family:var(--display);font-size:1.4em;margin-left:.3em}
.ft.lead{background:var(--acc)}
.finact{display:flex;gap:calc(var(--u)*.7);flex-wrap:wrap;justify-content:center}
.finact .btn{font-size:calc(var(--u)*1.2)}

/* takımlar */
.teams{display:flex;flex-direction:column;gap:calc(var(--u)*.6);min-height:0}
.team{flex:1;min-height:0;position:relative;background:#fff;color:var(--ink);border:4px solid var(--line);border-radius:16px;padding:calc(var(--u)*.45) calc(var(--u)*.6);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*.2);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.team.on{background:var(--acc);border-width:5px}
.team input{width:100%;min-width:0;border:0;border-bottom:3px solid var(--line);background:transparent;color:var(--ink);font:800 calc(var(--u)*.95) var(--body);padding:2px 0}
.sc{font-family:var(--display);font-weight:800;font-size:calc(var(--u)*3.4);line-height:1;font-variant-numeric:tabular-nums}
.team .row{display:flex;align-items:center;justify-content:space-between;gap:.4em}
.team .btn{padding:.1em .6em;font-size:calc(var(--u)*.8)}
.badge{display:none;font-weight:800;font-size:calc(var(--u)*.75);background:var(--ink);color:#fff;border-radius:999px;padding:0 .7em}
.team.on .badge{display:inline-block}

/* alçak ekran (küçük iframe kartı): her şeyi biraz sıkılaştır */
@media (max-height:560px){
  body{padding:6px 8px}
  .app{gap:5px}
  .crumb,.tab small{display:none}
  .brand h1{font-size:calc(var(--u)*1.7)}
  .tab{padding:.15em .6em .15em .25em}
  .card{padding:8px 12px;gap:5px;border-width:3px;border-radius:14px}
  .bubble{font-size:min(var(--fs,calc(var(--u)*2.4)),7.5vh);padding:6px 10px}
  .trl{font-size:calc(var(--u)*1.25);min-height:1.2em}
  .av{--av:min(calc(var(--u)*8.4),14vh)}
  .askcol .av{--av:min(calc(var(--u)*8.6),15vh)}
  .ch{padding:5px 4px;gap:2px;font-size:calc(var(--u)*1.4)}
  .opts .ch{min-height:0}
  .fbrow{min-height:0;gap:8px}
  .fb{padding:.2em .6em;font-size:calc(var(--u)*1.15)}
  .go{font-size:calc(var(--u)*1.4);padding:.2em .7em}
  .team{padding:4px 8px}
  .sc{font-size:calc(var(--u)*2.6)}
  .finbox h2{font-size:calc(var(--u)*2.6)}
  .finrow .av{--av:calc(var(--u)*3.6)}
  .mpanel .askcol{display:none}
  .mpanel .ch{min-height:0;padding:3px 6px;font-size:calc(var(--u)*1.1)}
  .mpanel .fb{font-size:calc(var(--u)*1)}
  .mpanel .go{font-size:calc(var(--u)*1.15)}
  .mpanel .tagrow{display:none}
  .rcap{font-size:calc(var(--u)*1);padding:0 .5em}
  .oc{font-size:calc(var(--u)*1.05);padding:0 .4em 0 .2em;gap:4px}
  .oc .av{--av:calc(var(--u)*2.4)}
  .onum{font-size:calc(var(--u)*1.1)}
  .ocol h3{display:none}
  .odone{font-size:calc(var(--u)*1.1)}
  .mpanel .bubble::before,.mpanel .bubble::after{display:none}
}
@media (max-width:700px),(max-aspect-ratio:1/1){
  .top{grid-template-columns:minmax(0,1fr);grid-template-areas:"brand" "tools" "tabs"}
  .tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tab small{display:none}
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .teams{flex-direction:row}
  .team{flex-direction:row;flex-wrap:wrap;align-items:center}
  .sc{font-size:calc(var(--u)*2.4)}
  .rwrap,.owrap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .opts{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.ch,.go{transition:none}}

/* karşılama */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.6vh,26px);padding:24px;text-align:center;color:#fff;background:linear-gradient(135deg,#075C69,#0E8A9B 55%,#14A89A);font-family:var(--body)}
#splash .s1{margin:0;font-weight:800;font-size:clamp(16px,2.6vh,26px)}
#splash h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,7vh,64px);line-height:1.05;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.3);text-wrap:balance}
#splash .s2{margin:0;max-width:32em;font-weight:800;font-size:clamp(14px,2.4vh,22px);text-wrap:balance}
.cast{display:flex;gap:clamp(10px,2vw,28px);align-items:flex-start}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.cast .av{--av:clamp(64px,17vh,150px)}
.cast figcaption{font-weight:800;font-size:clamp(13px,2.3vh,22px);background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:999px;padding:0 .7em}
#startBtn{width:clamp(110px,22vh,160px);aspect-ratio:1;border-radius:24px;border:4px solid var(--line);border-bottom-width:10px;background:var(--acc);color:var(--on-acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:0 14px 28px rgba(0,0,0,.3);transition:transform .15s}
#startBtn:hover{transform:scale(1.05)}
#startBtn:active{transform:scale(.96)}
#startBtn .ic2{font-size:clamp(40px,9vh,64px);line-height:1}
#startBtn .tx{font-family:var(--body);font-weight:800;font-size:clamp(16px,3vh,24px)}

/* tam ekran düğmesi (karşılama ekranında da görünür) */
#fsBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:200;width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .15s}
#fsBtn:hover{transform:scale(1.08)}
#fsBtn svg{width:22px;height:22px}

/* Türkçe açıkken diyalog kartları */
.owrap.tr .oc{font-size:calc(var(--u)*.95);line-height:1.08}
.owrap.tr .otx small{font-size:.8em;line-height:1.08;margin-top:0}
.owrap.tr .oc .av{--av:calc(var(--u)*2.5)}
.owrap.tr .otx{font-size:1em!important}

/* oyun 2 ve 3 */
.pgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(var(--u)*.6)}
.pcard{min-height:0;min-width:0;display:flex;align-items:center;gap:calc(var(--u)*.7);border:4px solid var(--c);border-radius:16px;padding:calc(var(--u)*.4) calc(var(--u)*.7);background:#fff;font-size:calc(var(--u)*1.25);line-height:1.12;overflow:hidden}
.pcard .av{--av:calc(var(--u)*5.2)}
.ptx{display:block;min-width:0}
.pname{display:block;font-family:var(--display);font-size:1.2em;color:var(--c);line-height:1}
.pl{display:block;font-weight:800;margin-top:.18em}
.pl small{display:block;font-size:.74em;color:var(--bg-d);font-weight:800}
.memtime{flex:1;display:flex;align-items:center;gap:calc(var(--u)*.7);font-family:var(--display);font-weight:800;font-size:calc(var(--u)*2)}
.membar{flex:1;height:calc(var(--u)*1.1);border:4px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}
.membar i{display:block;height:100%;width:100%;background:var(--acc);transition:width 1s linear}
.opts.who{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.who .ch{flex-direction:column;border-color:var(--c);gap:calc(var(--u)*.3);padding:calc(var(--u)*.6)}
.opts.who .ch .av{--av:min(calc(var(--u)*7),15vh)}
.opts.who .ch span:last-child{font-size:calc(var(--u)*1.7)}
.bubble.plain{flex:none;margin:calc(var(--u)*.8) 0 0;text-align:center}
.week{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:calc(var(--u)*.3)}
.wd{border:3px solid var(--line);border-radius:10px;text-align:center;background:#fff;font-weight:800;font-size:calc(var(--u)*.95);line-height:1.1;padding:.15em 0 0}
.wd small{display:block;font-size:.72em;color:var(--bg-d)}
.wd b{display:block;font-size:1.6em;height:1.2em;line-height:1.2;color:#fff}
.wd.on{background:var(--good);color:#fff;border-color:var(--good-d)}
.wd.on small{color:#fff}
.legend{flex:none;font-weight:800;font-size:calc(var(--u)*.9);color:var(--ink);text-align:center;border:3px solid var(--line);border-radius:10px;padding:.1em .4em;background:#fff}
.legend small{color:var(--bg-d)}
.mpanel .tagrow{flex-wrap:wrap}
@media (max-height:560px){.pcard .av{--av:calc(var(--u)*3.6)}.opts.who .ch .av{--av:calc(var(--u)*4)}.legend{display:none}}

/* oyun 1: seçenek ve geri bildirim yazısı uzunluğa göre */
.opts:not(.col) .ch{font-size:var(--of,calc(var(--u)*1.55))}
.fb{font-size:calc(var(--u)*1.1)}
.fb small{font-size:.76em;line-height:1.12;margin-top:0}
.fbrow{flex:none}
/* kabul / ret rozeti */
.kind{display:inline-flex;align-items:baseline;gap:.5em;font-family:var(--display);font-weight:800;font-size:calc(var(--u)*1.45);line-height:1.1;border:4px solid var(--line);border-radius:12px;padding:.05em .7em}
.kind small{font-family:var(--body);font-size:.55em;font-weight:800;opacity:.95}
.kind.a{background:var(--good);color:#fff;border-color:var(--good-d)}
.kind.r{background:var(--bad);color:#fff;border-color:var(--bad-d)}
.kind.s{background:var(--acc);color:var(--on-acc)}
.kind.d{background:#0B5FA5;color:#fff;border-color:#06355F}
.rcap b{font-family:var(--display)}
.rcap{border-color:var(--acc);border-width:5px}
@media (max-height:560px){.kind{font-size:calc(var(--u)*1.1);border-width:3px}.mpanel .instr{display:none}}
.mpanel .tagrow{flex-wrap:wrap}.mpanel .instr{font-size:calc(var(--u)*.95)}
.mpanel .askcol .av{--av:min(calc(var(--u)*4.2),10vh)}.mpanel .ch{min-height:calc(var(--u)*3.0)}.mpanel .trl{min-height:1.15em}
.mpanel .ch{padding-right:calc(var(--u)*1.3);font-size:calc(var(--u)*1.12)}.mpanel .bubble{font-size:min(var(--fs,calc(var(--u)*1.45)),calc(var(--u)*1.45))}.mpanel .fb{font-size:calc(var(--u)*1.0)}.mpanel .tagrow{gap:calc(var(--u)*.4)}.mpanel .bubble{padding:.2em .6em;line-height:1.1}
@media (max-width:700px) and (max-aspect-ratio:1/1){.cast{flex-wrap:wrap;justify-content:center;max-width:100%}}
</style>
</head>

  function $(id){return document.getElementById(id)}

  function prep(id){
    var p=P[id];if(p.items)return;
    if(id==="lh"){
      p.items=shuffle(LH).slice(0,10).map(function(x){
        var asker=pick1(ASKERS),f=x.k==="pr"?{q:x.q,qtr:x.qtr}:(x.k==="g"||x.k==="b")?Q_OPIN:Q_FEEL;
        return {x:x,asker:asker,q:f.q,qtr:f.qtr,ok:x.a,opts:shuffle([x.a].concat(x.w))};
      });
    }else if(id==="who"){
      var items=[];
      shuffle(SETS).forEach(function(s,si){
        s.qs.forEach(function(q,qi){
          items.push({set:s,si:si,first:qi===0,seen:qi!==0,q:q,ok:q.who,opts:shuffle(s.teens.map(function(t){return t.id})),order:shuffle(s.teens)});
        });
      });
      // aynı setin soruları birlikte kalsın, her setin ilk sorusunda ezber ekranı açılır
      p.items=items;
    }else{
      p.items=shuffle(HO).slice(0,10).map(function(h){
        var ix=ADV.indexOf(h.adv);
        var far=ADV.filter(function(a,k){return Math.abs(k-ix)>=2});
        var wr=shuffle(far).slice(0,2);
        function sent(a){return CH[h.ch].n+" "+a+" "+h.vp+"."}
        return {h:h,ok:sent(h.adv),opts:shuffle([sent(h.adv),sent(wr[0]),sent(wr[1])]),q:"How often does "+CH[h.ch].n+" "+h.base+"?"};
      });

  /* ---------- ortak parçalar ---------- */

    for(var k=0;k<n;k++){

      h+='<i class="d '+c+'"></i>';
    }
    h+='</span><span class="pill turn">Sıra: '+esc(tname(turn))+'</span></div>';
    return h;

  function trLine(text,answered){

    h+='<span class="pts">'+(ok?'+'+pts+' → '+esc(tname(p.by)):'0 puan')+'</span>';

  function fitCards(){
    var cs=document.querySelectorAll("#play .pcard"),i,c,t,fs,n;
    for(i=0;i<cs.length;i++){
      c=cs[i];c.style.fontSize="";
      t=c.querySelector(".ptx");if(!t)continue;
      fs=parseFloat(getComputedStyle(c).fontSize);n=0;
      while(t.offsetHeight>c.clientHeight-16&&fs>10&&n<30){fs*=0.94;c.style.fontSize=fs+"px";n++}
    }
  }
  window.addEventListener("resize",fitCards);

  /* ---------- çizim ---------- */
  function render(){
    var sec=SECS[cur],p=P[sec.id],h,mem=false;
    stopMem();
    prep(sec.id);
    if(p.fin)h=viewFin(sec,p,cur);
    else if(sec.id==="lh")h=viewLH(sec,p);
    else if(sec.id==="who"){mem=!p.items[p.i].seen;h=viewWho(sec,p)}
    else h=viewHO(sec,p);
    $("play").innerHTML=h;
    fitCards();
    renderTabs();
    if(mem)startMem();
    var nb=$("nextBtn");
    if(nb){try{nb.focus({preventScroll:true})}catch(e){}}
  }
  function renderTabs(){
    $("tabs").innerHTML=SECS.map(function(s,i){
      return '<button type="button" class="tab'+(i===cur?' on':'')+(P[s.id].fin?' fin':'')+'" data-sec="'+i+'"><b><span>'+(i+1)+'</span></b><span>'+esc(s.en)+'<small>'+esc(s.tr)+'</small></span></button>';
    }).join("");
  }

  /* ---------- oyun akışı ---------- */
  function pick(v){
    var sec=SECS[cur],p=P[sec.id];
    if(p.fin||p.ans!==null)return;
    var it=p.items[p.i];
    if(sec.id==="who"&&!it.seen)return;
    v=+v;
    var ok=(it.opts[v]===it.ok);
    p.ans=v;p.res=ok;p.by=turn;p.log.push(ok);
    if(ok){p.ok++;award(10)}
    render();updateTeams();
  }
  function next(){
    var sec=SECS[cur],p=P[sec.id];
    if(p.ans===null)return;
    p.ans=null;p.res=null;
    if(p.i<p.items.length-1)p.i++;else p.fin=true;
    turn=(turn+1)%teams.length;
    render();updateTeams();
  }
  function goSec(i){cur=i;render()}
  function again(){
    var id=SECS[cur].id;
    P[id]={i:0,ans:null,res:null,ok:0,log:[],fin:false,by:0,items:null};
    render();
  }

  /* ---------- takımlar ---------- */
  function renderTeams(){
    $("teams").innerHTML=teams.map(function(t,i){
      return '<div class="team" data-i="'+i+'"><input type="text" id="tn'+i+'" data-i="'+i+'" aria-label="Takım adı" maxlength="20">'
        +'<div class="row"><div class="sc" id="sc'+i+'">0</div><span class="badge">SIRA</span></div>'
        +'<div class="row"><button type="button" class="btn undo" data-i="'+i+'">Geri al</button></div></div>';
    }).join("");
    teams.forEach(function(t,i){$("tn"+i).value=t.n});
    updateTeams();
  }
  function updateTeams(){
    var boxes=document.querySelectorAll(".team");
    teams.forEach(function(t,i){
      var b=boxes[i];if(!b)return;
      b.classList.toggle("on",i===turn);
      $("sc"+i).textContent=t.s;
      b.querySelector(".undo").disabled=!t.h.length;
    });
    var pill=document.querySelector(".pill.turn");
    if(pill)pill.textContent="Sıra: "+tname(turn);
  }
  $("teams").addEventListener("click",function(e){
    var u=e.target.closest(".undo");
    if(u){var t=teams[+u.getAttribute("data-i")];if(t.h.length){t.s-=t.h.pop()}updateTeams();return}
    if(e.target.tagName==="INPUT")return;
    var tm=e.target.closest(".team");
    if(tm){turn=+tm.getAttribute("data-i");updateTeams()}
  });
  $("teams").addEventListener("input",function(e){
    if(e.target.tagName==="INPUT"){teams[+e.target.getAttribute("data-i")].n=e.target.value;var pill=document.querySelector(".pill.turn");if(pill)pill.textContent="Sıra: "+tname(turn)}
  });
  $("addTeam").addEventListener("click",function(){
    if(teams.length>=4)return;
    teams.push({n:"Takım "+(teams.length+1),s:0,h:[]});
    renderTeams();
    $("addTeam").disabled=teams.length>=4;
  });
  var resetArm=null;
  $("reset").addEventListener("click",function(){
    var b=$("reset");
    if(!resetArm){
      b.textContent="Emin misin? Tekrar tıkla";b.classList.add("on");
      resetArm=setTimeout(function(){resetArm=null;b.textContent="Baştan başla";b.classList.remove("on")},3000);
      return;
    }
    clearTimeout(resetArm);resetArm=null;
    b.textContent="Baştan başla";b.classList.remove("on");
    teams.forEach(function(t){t.s=0;t.h=[]});
    turn=0;cur=0;initP();render();updateTeams();
  });
  function setTr(v){
    showTr=v;
    var b=$("trBtn");
    b.textContent="Türkçe: "+(v?"Açık":"Kapalı");
    b.classList.toggle("on",v);
    b.setAttribute("aria-pressed",v?"true":"false");
    var memBefore=null;
    if(cur===1&&P.who.items&&!P.who.fin&&!P.who.items[P.who.i].seen){memBefore=$("memT")?$("memT").textContent:null}
    render();
    if(memBefore!==null&&$("memT")){/* süre yeniden başlar */}
  }
  $("trBtn").addEventListener("click",function(){setTr(!showTr)});

  /* ---------- olaylar ---------- */
  $("play").addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;
    var a=b.getAttribute("data-act"),v=b.getAttribute("data-v");
    if(a==="pick")pick(v);
    else if(a==="next")next();
    else if(a==="mem")hideMem();
    else if(a==="nextsec")goSec((cur+1)%SECS.length);
    else if(a==="again")again();
  });
  $("tabs").addEventListener("click",function(e){
    var b=e.target.closest(".tab");if(b)goSec(+b.getAttribute("data-sec"));
  });
  document.addEventListener("keydown",function(e){
    if(!$("splash").hidden)return;
    var tg=e.target;
    if(tg&&(tg.tagName==="INPUT"||tg.tagName==="BUTTON"))return;
    if(e.key==="t"||e.key==="T"){setTr(!showTr);return}
    if(e.key===" "||e.key==="Enter"){
      var p=P[SECS[cur].id];
      if(SECS[cur].id==="who"&&p.items&&!p.fin&&!p.items[p.i].seen){e.preventDefault();hideMem();return}
      if(p.ans!==null&&!p.fin){e.preventDefault();next()}
    }
  });

  /* karşılama: oyuncu kadrosu */
  $("cast").innerHTML=["ela","tom","lily","ali","zeynep"].map(function(k){
    return '<figure>'+av(k)+'<figcaption>'+esc(CH[k].n)+'</figcaption></figure>';
  }).join("");

  renderTeams();
  render();
  $("startBtn").addEventListener("click",function(){$("splash").hidden=true});
  try{$("startBtn").focus({preventScroll:true})}catch(err){}

  /* tam ekran / tam ekrandan çık */
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
  function syncFs(){var on=isFs();$("fsOn").hidden=on;$("fsOff").hidden=!on}
  $("fsBtn").addEventListener("click",function(){
    try{
      if(!isFs()){
        var el=document.documentElement;
        var req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
        if(req){var p=req.call(el);if(p&&p.catch)p.catch(function(){})}
      }else{
        var ex=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
        if(ex){var q=ex.call(document);if(q&&q.catch)q.catch(function(){})}
      }
    }catch(err){}
  });
  document.addEventListener("fullscreenchange",syncFs);
  document.addEventListener("webkitfullscreenchange",syncFs);
})();

</script>
</body>
</html>

<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var Q = [["Friends should trust each other.", "Arkadaşlar birbirine güvenmelidir.", true, "", ""], ["A true friend always tells lies to you.", "Gerçek bir arkadaş sana her zaman yalan söyler.", false, "A true friend is honest and tells you the truth.", "Gerçek bir arkadaş dürüsttür ve sana doğruyu söyler."], ["If you cannot go to a party, you should say sorry and give a reason.", "Bir partiye gidemiyorsan özür dilemeli ve bir neden söylemelisin.", true, "", ""], ["“Would you like some cake?” is a question about a trip.", "“Biraz pasta ister misin?” bir gezi hakkında sorudur.", false, "“Would you like some cake?” offers you something to eat.", "“Biraz pasta ister misin?” sana yiyecek bir şey ikram eder."], ["“I’m full” means you do not want any more food.", "“I’m full”, daha fazla yemek istemediğin anlamına gelir.", true, "", ""], ["“I’m stuffed” means you are very hungry.", "“I’m stuffed”, çok aç olduğun anlamına gelir.", false, "“I’m stuffed” means you are very full.", "“I’m stuffed”, çok tok olduğun anlamına gelir."], ["A loyal friend stays with you in good and bad times.", "Sadık bir arkadaş iyi ve kötü günlerde yanında olur.", true, "", ""], ["An outgoing person never talks to new people.", "Dışa dönük bir insan yeni insanlarla asla konuşmaz.", false, "An outgoing person likes meeting and talking to new people.", "Dışa dönük bir insan yeni insanlarla tanışmayı ve konuşmayı sever."], ["“Sure!” is a way to accept an invitation.", "“Sure!”, bir daveti kabul etmenin bir yoludur.", true, "", ""], ["“I’m sorry, but I can’t” is a way to accept an invitation.", "“I’m sorry, but I can’t”, bir daveti kabul etmenin bir yoludur.", false, "“I’m sorry, but I can’t” is a polite way to refuse an invitation.", "“I’m sorry, but I can’t”, bir daveti reddetmenin kibar bir yoludur."], ["A punctual person arrives on time.", "Dakik bir insan zamanında gelir.", true, "", ""], ["A reliable friend often breaks his or her promises.", "Güvenilir bir arkadaş sözlerini sık sık bozar.", false, "A reliable friend keeps his or her promises.", "Güvenilir bir arkadaş sözlerini tutar."], ["“Buddy” and “mate” are informal words for a friend.", "“Buddy” ve “mate”, arkadaş için kullanılan günlük sözcüklerdir.", true, "", ""], ["If someone is laid-back, he or she panics easily.", "Biri rahat tabiatlıysa kolayca paniğe kapılır.", false, "If someone is laid-back, he or she is calm and relaxed.", "Biri rahat tabiatlıysa sakin ve rahattır."], ["“How about going to the cinema?” is a suggestion.", "“How about going to the cinema?” bir öneridir.", true, "", ""], ["To refuse politely, you should shout at your friend.", "Kibarca reddetmek için arkadaşına bağırmalısın.", false, "To refuse politely, you should say sorry and give a reason.", "Kibarca reddetmek için özür dilemeli ve bir neden söylemelisin."], ["We can say “It sounds awesome” when we like a plan.", "Bir planı beğendiğimizde “It sounds awesome” diyebiliriz.", true, "", ""], ["“Count on” means “to forget”.", "“Count on”, “unutmak” anlamına gelir.", false, "“Count on” means “to rely on someone”.", "“Count on”, “birine güvenmek, bel bağlamak” anlamına gelir."], ["Supporting a friend means helping him or her when needed.", "Bir arkadaşı desteklemek, ihtiyacı olduğunda ona yardım etmek demektir.", true, "", ""], ["A secret is something you tell everybody.", "Sır, herkese anlattığın bir şeydir.", false, "A secret is something you tell only to a person you trust.", "Sır, yalnızca güvendiğin bir kişiye anlattığın bir şeydir."], ["Friends can be different and still get on well.", "Arkadaşlar farklı olabilir ve yine de iyi geçinebilir.", true, "", ""], ["When you break a promise, your friend trusts you more.", "Sözünü bozduğunda arkadaşın sana daha çok güvenir.", false, "When you break a promise, your friend trusts you less.", "Sözünü bozduğunda arkadaşın sana daha az güvenir."], ["“Would you like to come over?” invites you to visit someone’s home.", "“Would you like to come over?” seni birinin evini ziyaret etmeye davet eder.", true, "", ""], ["When we talk about people, “cool” always means “cold”.", "İnsanlardan söz ederken “cool” her zaman “soğuk” anlamına gelir.", false, "When we talk about people, “cool” can mean “fashionable” or “very good”.", "İnsanlardan söz ederken “cool”, “havalı” ya da “çok iyi” anlamına gelebilir."]], ROUNDS = 12, TIME = 15000;
  var order, qi, score, streak, best, locked, timerOn = true, t0, tid;

  function toggleTimer() { timerOn = !timerOn; document.getElementById('tmbtn').textContent = 'Timer: ' + (timerOn ? 'On' : 'Off'); if (!locked) runTimer(); }
  function runTimer() {
    clearInterval(tid); var f = document.getElementById('tfill'); f.className = ''; f.style.width = '100%';
    if (!timerOn) return;
    t0 = Date.now();
    tid = setInterval(function () {
      var left = 1 - (Date.now() - t0) / TIME;
      f.style.width = Math.max(0, left * 100) + '%'; f.className = left < .3 ? 'low' : '';
      if (left <= 0) { clearInterval(tid); answer(null); }
    }, 100);
  }
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(Q.slice()).slice(0, ROUNDS); qi = 0; score = 0; streak = 0; best = 0;
    document.getElementById('sc').textContent = 0; document.getElementById('sk').textContent = 0;
    showQ();
  }
  function showQ() {
    var q = order[qi]; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('s-en').textContent = q[0]; document.getElementById('s-tr').textContent = q[1];
    document.getElementById('fb-en').textContent = ''; document.getElementById('fb-tr').textContent = '';
    document.getElementById('next').style.display = 'none';
    document.getElementById('bt').disabled = false; document.getElementById('bf').disabled = false;
    runTimer();
  }
  function answer(v) {
    if (locked) return; locked = true; clearInterval(tid);
    var q = order[qi], ok = (v === q[2]);
    document.getElementById('bt').disabled = true; document.getElementById('bf').disabled = true;
    var en = document.getElementById('fb-en'), tr = document.getElementById('fb-tr');
    if (ok) { score++; streak++; best = Math.max(best, streak); } else { streak = 0; }
    document.getElementById('sc').textContent = score; document.getElementById('sk').textContent = streak;
    var head = ok ? '✔ Correct!' : (v === null ? 'Time is up!' : '✘ Not quite.');
    if (q[2]) { en.textContent = head + ' This sentence is true.'; tr.textContent = 'Bu cümle doğru.'; }
    else { en.textContent = head + ' ' + q[3]; tr.textContent = q[4]; }
    en.className = ok ? 'ok' : 'no';
    var nx = document.getElementById('next'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
  }
  function nextQ() {
    qi++;
    if (qi >= order.length) {
      document.getElementById('win-title').textContent = score >= 11 ? 'Perfect!' : (score >= 8 ? 'Great Job!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Score: ' + score + ' / ' + order.length + '  |  Best streak: ' + best;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showQ();
  }
</script>

  function lnShow(i) {

})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 6px 12px 12px; }
  #clue { background: #fff; border: 5px solid #0B2F2C; border-radius: 20px; padding: 8px 18px; text-align: center; }
  #c-en { font-weight: 900; font-size: clamp(1.3rem, 3.6vw, 2.8rem); line-height: 1.2; }
  #c-tr { font-weight: 800; font-size: clamp(1rem, 2.1vw, 1.6rem); color: #0B5C56; }
  #sky { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-evenly; gap: 10px; padding: 0 6px 10px; }
  .balloon { position: relative; width: clamp(110px, 20vw, 250px); aspect-ratio: .82; background: var(--c); border: 6px solid #0B2F2C; border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 6px;
    font-weight: 900; font-size: clamp(1.2rem, 3.4vw, 2.6rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; line-height: 1.05; animation: bob 2.4s ease-in-out infinite; }
  .balloon:nth-child(2) { animation-delay: -.6s; } .balloon:nth-child(3) { animation-delay: -1.2s; } .balloon:nth-child(4) { animation-delay: -1.8s; }
  .balloon::before { content: ''; position: absolute; left: 50%; top: 100%; width: 0; height: 0; transform: translateX(-50%);
    border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 16px solid #0B2F2C; margin-top: 2px; }
  .balloon::after { content: ''; position: absolute; left: 50%; top: calc(100% + 16px); width: 0; height: 60px; border-left: 5px solid #0B2F2C; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
  .balloon.pop { animation: pop .45s forwards; }
  @keyframes pop { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
  .balloon.wrong { filter: grayscale(1); opacity: .45; animation: none; }
  .balloon:disabled { cursor: default; }
  #fb { min-height: 1.3em; text-align: center; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  #next { display: none; align-self: center; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Balloon<br>Pop</h1>
  <p class="subtitle">Read the clue and pop the right balloon!</p>
  <div class="preview">🎈 🎈 🎈</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Clue: <span id="rn">1</span>/10</div>
  <div class="stat">Score: <span id="sc">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="clue"><div id="c-en"></div><div id="c-tr" class="tr"></div></div>
  <div id="sky"></div>
  <div id="fb"></div>
  <button class="big-btn" id="next" onclick="nextClue()">Next</button>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { var f = document.getElementById('fb'); if (f) f.textContent = fbParts ? fbParts[0] + (TR && fbParts[1] ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var CLUES = [["You eat outside on the grass in this activity.", "Bu etkinlikte çimenlerin üzerinde dışarıda yemek yersin.", ["picnic", "cinema", "concert", "museum"], "picnic"], ["You blow out the candles on this day.", "Bu günde mumları üflersin.", ["birthday", "picnic", "homework", "concert"], "birthday"], ["You tell this only to a close friend.", "Bunu yalnızca yakın bir arkadaşına anlatırsın.", ["secret", "homework", "birthday", "museum"], "secret"], ["A friend who always tells the truth is ...", "Her zaman doğruyu söyleyen bir arkadaş ...", ["honest", "boring", "loud", "busy"], "honest"], ["A friend who always stays with you is ...", "Her zaman yanında kalan bir arkadaş ...", ["loyal", "late", "tired", "loud"], "loyal"], ["A person who always arrives on time is ...", "Her zaman zamanında gelen biri ...", ["punctual", "sick", "busy", "bored"], "punctual"], ["You say “I’m ...” when you apologize.", "Özür dilediğinde “I’m ...” dersin.", ["sorry", "hello", "goodbye", "please"], "sorry"], ["You visit this doctor when your tooth hurts.", "Dişin ağrıdığında bu doktora gidersin.", ["dentist", "teacher", "driver", "singer"], "dentist"], ["You send this to a friend to ask him or her to your party.", "Arkadaşını partine çağırmak için bunu gönderirsin.", ["invitation", "homework", "museum", "picnic"], "invitation"], ["You do this when you help a friend in a difficult time.", "Zor bir zamanda bir arkadaşına yardım ettiğinde bunu yaparsın.", ["support", "ignore", "refuse", "forget"], "support"], ["“You can count on me” means you can ... me.", "“You can count on me”, bana ... edebilirsin demektir.", ["trust", "forget", "refuse", "leave"], "trust"], ["You cannot go out because you feel ill. You are ...", "Hasta hissettiğin için dışarı çıkamıyorsun. Sen ...", ["sick", "happy", "punctual", "outgoing"], "sick"], ["A person who loves meeting new people is ...", "Yeni insanlarla tanışmayı seven biri ...", ["outgoing", "tired", "sick", "late"], "outgoing"], ["You say “No, thanks” or “I can’t” when you ... an invitation.", "Bir daveti ... ettiğinde “No, thanks” ya da “I can’t” dersin.", ["refuse", "accept", "invite", "promise"], "refuse"]];
  var COLORS = ['#D62828', '#1F5FBF', '#0A7A2F', '#7B2CBF'], order, qi, score, tries, done;
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(CLUES.slice()).slice(0, 10); qi = 0; score = 0; document.getElementById('sc').textContent = 0; showClue();
  }
  function showClue() {
    var q = order[qi]; tries = 0; done = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('c-en').textContent = q[0]; document.getElementById('c-tr').textContent = q[1];
    fbParts = null; renderFb(); document.getElementById('next').style.display = 'none';
    var sky = document.getElementById('sky'); sky.innerHTML = '';
    shuffle(q[2].slice()).forEach(function (w, i) {
      var b = document.createElement('button'); b.className = 'balloon'; b.style.setProperty('--c', COLORS[i]); b.textContent = w;
      b.addEventListener('click', function () { popIt(b, w); });
      sky.appendChild(b);
    });
  }
  function popIt(b, w) {
    if (done || b.classList.contains('wrong')) return;
    var q = order[qi];
    if (w === q[3]) {
      done = true; b.classList.add('pop'); if (tries === 0) { score++; document.getElementById('sc').textContent = score; }
      setFb('✔ Pop! It is "' + q[3] + '".', 'Doğru!');
      Array.prototype.forEach.call(document.querySelectorAll('.balloon'), function (x) { if (x !== b) x.disabled = true; });
      var nx = document.getElementById('next'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      tries++; b.classList.add('wrong'); b.disabled = true; setFb('✘ Not this one. Try again!', 'Bu değil. Tekrar dene!');
    }
  }
  function nextClue() {
    qi++;
    if (qi >= order.length) {
      document.getElementById('win-title').textContent = score >= 9 ? 'Balloon Master!' : (score >= 6 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Score: ' + score + ' / ' + order.length;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showClue();
  }
</script>
<div id="ln-screen">
  <div id="ln-top"><div id="ln-title">📖 Learn</div><div id="ln-tabs"></div><button id="ln-close" onclick="lnClose()">Close ✕</button></div>
  <div id="ln-grid"></div>
</div>
<script>
(function () {
  var LN = [["Friendship Words", "Arkadaşlık Kelimeleri", [["🤝", "buddy / mate", "arkadaş, dost"], ["👫", "close friend", "yakın arkadaş"], ["🔑", "trust", "güvenmek, güven"], ["💪", "support", "desteklemek"], ["🤞", "count on", "güvenmek, bel bağlamak"], ["😇", "honest", "dürüst"], ["🐕", "loyal", "sadık"], ["😎", "cool", "havalı, harika"], ["😌", "laid-back", "rahat, sakin"], ["🗣️", "outgoing", "dışa dönük"], ["⏰", "punctual", "dakik"], ["🛡️", "reliable", "güvenilir"], ["🤗", "supportive", "destekleyici"], ["🤫", "share a secret", "sır paylaşmak"], ["🙂", "get on well with", "ile iyi geçinmek"], ["🙏", "respect", "saygı"]]], ["Accepting and Refusing", "Kabul Etme ve Reddetme", [["✅", "Sure! / Of course.", "Tabii! / Elbette."], ["✅", "It sounds great / awesome / good.", "Kulağa harika / çok güzel / güzel geliyor."], ["✅", "Yeah, that would be great.", "Evet, harika olur."], ["✅", "I’d love to.", "Çok isterim."], ["✅", "Yes, I’d love some.", "Evet, çok isterim."], ["❌", "I’m sorry, but I can’t.", "Üzgünüm ama gelemem / yapamam."], ["❌", "I’m afraid I can’t.", "Korkarım yapamam."], ["❌", "I’d love to, but I have other plans.", "Çok isterdim ama başka planlarım var."], ["❌", "No, thanks. I’m full.", "Hayır, teşekkürler. Doydum."], ["❌", "No, thanks. I’m stuffed.", "Hayır, teşekkürler. Tıka basa doydum."]]], ["Plans and Invitations", "Planlar ve Davetler", [["🎉", "have a party", "parti vermek"], ["🧺", "go on a picnic", "pikniğe gitmek"], ["🎬", "go to the cinema", "sinemaya gitmek"], ["🏠", "come over", "uğramak, eve gelmek"], ["🍕", "have a pizza party", "pizza partisi yapmak"], ["🎤", "go to a concert", "konsere gitmek"], ["🏛️", "visit a museum", "müzeyi gezmek"], ["🎮", "play online games", "çevrimiçi oyun oynamak"], ["⚽", "go to a match", "maça gitmek"], ["🎂", "go to a birthday party", "doğum günü partisine gitmek"], ["⛺", "go camping", "kampa gitmek"], ["☕", "meet at the café", "kafede buluşmak"]]]];
  function lnShow(i) {
    Array.prototype.forEach.call(document.querySelectorAll('.ln-tab'), function (b, k) { b.classList.toggle('act', k === i); });
    document.getElementById('ln-grid').innerHTML = LN[i][2].map(function (it) {
      var wide = it[1].length > 26 && it[0].indexOf('<svg') < 0;
      return '<div class="ln-card' + (wide ? ' wide' : '') + '"><div class="le">' + it[0] + '</div><div class="en">' + it[1] + '</div><div class="trl">' + it[2] + '</div></div>';
    }).join('');
    document.getElementById('ln-grid').scrollTop = 0;
  }
  window.lnOpen = function () {
    var tabs = document.getElementById('ln-tabs'); tabs.innerHTML = '';
    LN.forEach(function (s, i) { var b = document.createElement('button'); b.className = 'ln-tab'; b.textContent = s[0]; b.onclick = function () { lnShow(i); }; tabs.appendChild(b); });
    document.getElementById('ln-screen').style.display = 'flex'; lnShow(0);
  };
  window.lnClose = function () { document.getElementById('ln-screen').style.display = 'none'; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.lnClose(); });
})();
</script>
</body>
</html>

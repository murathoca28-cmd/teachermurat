<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make the Sentence</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 6px 14px 14px; justify-content: space-evenly; }
  #hint { text-align: center; background: #fff; border: 5px solid #0B2F2C; border-radius: 18px; padding: 6px 14px; font-weight: 900; font-size: clamp(1.1rem, 2.8vw, 2.1rem); }
  #line { min-height: clamp(80px, 17vh, 150px); background: #fff; border: 6px dashed #0B2F2C; border-radius: 20px; padding: 10px; display: flex; flex-wrap: wrap;
    gap: 8px; align-content: center; justify-content: center; }
  #line.ok { border-style: solid; border-color: #0A7A2F; background: #C8F7D4; }
  #bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center; min-height: clamp(90px, 20vh, 200px); }
  .chip { font-size: clamp(1.1rem, 3vw, 2.3rem); font-weight: 900; padding: .1em .6em; background: #FFD23F; color: #0B2F2C; border: 5px solid #0B2F2C; border-radius: 14px; box-shadow: 0 5px 0 #0B2F2C; }
  .chip:active { transform: translateY(3px); box-shadow: 0 2px 0 #0B2F2C; }
  #line .chip { background: #fff; }
  .chip.used { visibility: hidden; }
  #btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  #btns .big-btn { font-size: clamp(1.1rem, 2.8vw, 2rem); }
  #fb { min-height: 1.4em; text-align: center; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  #next { display: none; }
.modes { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Make the<br>Sentence</h1>
  <p class="subtitle">Tap the words in the right order!</p>
  <div class="preview">Would you like to come over</div>
  <div class="modes">
    <button class="big-btn" onclick="startGame('s')">Inviting and Replying</button>
    <button class="big-btn" onclick="startGame('ci')">Reasons and Excuses</button>
  </div>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <div class="modes">
    <button class="big-btn" onclick="startGame()">Play Again</button>
    <button class="big-btn" style="background:#fff" onclick="menu()">Menu</button>
  </div>
</div>
<div id="topbar">
  <div class="stat"><span id="lbl">Sentence</span>: <span id="rn">1</span>/<span id="rt">10</span></div>
  <div class="stat">Stars: <span id="st">0</span> ⭐</div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="hint" class="tr"></div>
  <div id="line"></div>
  <div id="bank"></div>
  <div id="fb"></div>
  <div id="btns">
    <button class="big-btn" id="check" onclick="check()">Check</button>
    <button class="big-btn" id="clear" onclick="clearLine()" style="background:#fff">Clear</button>
    <button class="big-btn" id="next" onclick="nextS()">Next</button>
  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var S = [["Would you like to come over this evening?", "Bu akşam bize gelmek ister misin?"], ["How about going to the cinema on Saturday?", "Cumartesi sinemaya gitmeye ne dersin?"], ["What about having a pizza party?", "Pizza partisi yapmaya ne dersin?"], ["Are you busy tomorrow evening?", "Yarın akşam meşgul müsün?"], ["Yes, I’d love to come.", "Evet, gelmeyi çok isterim."], ["Sure, that sounds great!", "Tabii, kulağa harika geliyor!"], ["I’m sorry, but I can’t come.", "Üzgünüm ama gelemem."], ["No, thanks. I’m full.", "Hayır, teşekkürler. Doydum."], ["Would you like some chocolate cake?", "Biraz çikolatalı pasta ister misin?"], ["Thanks for the invitation.", "Davet için teşekkürler."], ["I will text our friends, too.", "Arkadaşlarımıza da mesaj atacağım."], ["We trust each other.", "Birbirimize güveniriz."], ["My best friend is honest and loyal.", "En iyi arkadaşım dürüst ve sadıktır."], ["True friends count on each other.", "Gerçek arkadaşlar birbirine güvenir."], ["He is a laid-back and funny boy.", "O, rahat ve komik bir çocuktur."], ["We get on well with each other.", "Birbirimizle iyi geçiniriz."], ["Meet us in front of the cinema at seven.", "Bizimle saat yedide sinemanın önünde buluş."], ["Why don’t you join us?", "Neden bize katılmıyorsun?"], ["Yeah, why not?", "Evet, neden olmasın?"], ["Have a great time!", "İyi eğlenceler!"]], ROUNDS = 10, CI = [["I can’t come because I have a piano lesson.", "Piyano dersim olduğu için gelemem."], ["I’m going to the dentist tomorrow.", "Yarın dişçiye gidiyorum."], ["I have to do my homework.", "Ödevimi yapmam gerekiyor."], ["My cousin is coming to our house.", "Kuzenim bize geliyor."], ["I’m visiting my grandmother this weekend.", "Bu hafta sonu büyükannemi ziyaret ediyorum."], ["I promised to help my brother.", "Erkek kardeşime yardım etmeye söz verdim."], ["We have a football match on Saturday.", "Cumartesi günü bir futbol maçımız var."], ["I’m not feeling well today.", "Bugün kendimi iyi hissetmiyorum."], ["I’d love to come, but I have other plans.", "Gelmeyi çok isterdim ama başka planlarım var."], ["I promise I will be with you next time.", "Bir dahaki sefere seninle olacağıma söz veriyorum."], ["I’m afraid I can’t join you.", "Korkarım sana katılamam."], ["My family and I are going out tonight.", "Ailemle ben bu akşam dışarı çıkıyoruz."]], CI_ROUNDS = 8, mode = "s", pool, total;
  var order, qi, line, words, stars, tried, locked;

  function startGame(m) {
    if (m) mode = m;
    pool = mode === 'ci' ? CI : S; total = mode === 'ci' ? CI_ROUNDS : ROUNDS;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(pool.slice()).slice(0, total); qi = 0; stars = 0;
    document.getElementById('st').textContent = 0;
    showS();
  }
  function menu() { document.getElementById('win-screen').style.display = 'none'; document.getElementById('start-screen').style.display = 'flex'; }
  function showS() {
    var s = order[qi][0];
    words = s.split(' ').map(function (w, i) { return { w: w, id: i }; });
    var bank; do { bank = shuffle(words.slice()); } while (bank.map(function (x) { return x.id; }).join() === words.map(function (x) { return x.id; }).join());
    words = bank; line = []; tried = false; locked = false;
    document.getElementById('rn').textContent = qi + 1; document.getElementById('rt').textContent = total; document.getElementById('lbl').textContent = mode === 'ci' ? 'Reason' : 'Sentence';
    document.getElementById('hint').textContent = order[qi][1];
    document.getElementById('fb').textContent = '';
    document.getElementById('line').className = '';
    document.getElementById('next').style.display = 'none';
    document.getElementById('check').style.display = ''; document.getElementById('clear').style.display = '';
    draw();
  }
  function draw() {
    var ln = document.getElementById('line'); ln.innerHTML = '';
    line.forEach(function (id) {
      var b = document.createElement('button'); b.className = 'chip'; b.textContent = words.filter(function (x) { return x.id === id; })[0].w;
      b.addEventListener('click', function () { if (locked) return; line.splice(line.indexOf(id), 1); draw(); });
      ln.appendChild(b);
    });
    var bk = document.getElementById('bank'); bk.innerHTML = '';
    words.forEach(function (x) {
      var b = document.createElement('button'); b.className = 'chip' + (line.indexOf(x.id) >= 0 ? ' used' : ''); b.textContent = x.w;
      b.addEventListener('click', function () { if (locked || line.indexOf(x.id) >= 0) return; line.push(x.id); draw(); });
      bk.appendChild(b);
    });
  }
  function clearLine() { if (locked) return; line = []; draw(); document.getElementById('fb').textContent = ''; }
  function check() {
    if (locked) return;
    var fb = document.getElementById('fb');
    if (line.length < words.length) { fb.textContent = 'Use all the words!'; return; }
    var got = line.map(function (id) { return words.filter(function (x) { return x.id === id; })[0].w; }).join(' ');
    if (got === order[qi][0]) {
      locked = true; if (!tried) { stars++; document.getElementById('st').textContent = stars; }
      document.getElementById('line').className = 'ok'; fb.textContent = '✔ Great job!';
      document.getElementById('check').style.display = 'none'; document.getElementById('clear').style.display = 'none';
      var nx = document.getElementById('next'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      tried = true; fb.textContent = 'Not yet. Try again!';
      var l = document.getElementById('line'); l.classList.remove('shake'); void l.offsetWidth; l.classList.add('shake');
    }
  }
  function nextS() {
    qi++;
    if (qi >= order.length) {
      document.getElementById('win-title').textContent = stars >= total * 0.8 ? (mode === 'ci' ? 'Excuse Master!' : 'Sentence Master!') : (stars >= total * 0.5 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Stars: ' + stars + ' / ' + order.length;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showS();
  }
</script>
<div id="ln-screen">
  <div id="ln-top"><div id="ln-title">📖 Learn</div><div id="ln-tabs"></div><button id="ln-close" onclick="lnClose()">Close ✕</button></div>
  <div id="ln-grid"></div>
</div>
<script>
(function () {
  var LN = [["Inviting and Offering", "Davet Etme ve İkram", [["✉️", "Would you like to come over?", "Bize gelmek ister misin?"], ["🍕", "How about having a pizza party?", "Pizza partisi yapmaya ne dersin?"], ["🎬", "What about going to the cinema?", "Sinemaya gitmeye ne dersin?"], ["📅", "Are you busy tomorrow evening?", "Yarın akşam meşgul müsün?"], ["🏠", "Do you want to come over to watch a film?", "Film izlemek için bize gelmek ister misin?"], ["☕", "Why don’t you join us?", "Neden bize katılmıyorsun?"], ["🍰", "Would you like some cake?", "Biraz pasta ister misin?"]]], ["Accepting and Refusing", "Kabul Etme ve Reddetme", [["✅", "Sure! / Of course.", "Tabii! / Elbette."], ["✅", "It sounds great / awesome / good.", "Kulağa harika / çok güzel / güzel geliyor."], ["✅", "Yeah, that would be great.", "Evet, harika olur."], ["✅", "I’d love to.", "Çok isterim."], ["✅", "Yes, I’d love some.", "Evet, çok isterim."], ["❌", "I’m sorry, but I can’t.", "Üzgünüm ama gelemem / yapamam."], ["❌", "I’m afraid I can’t.", "Korkarım yapamam."], ["❌", "I’d love to, but I have other plans.", "Çok isterdim ama başka planlarım var."], ["❌", "No, thanks. I’m full.", "Hayır, teşekkürler. Doydum."], ["❌", "No, thanks. I’m stuffed.", "Hayır, teşekkürler. Tıka basa doydum."]]], ["Giving Reasons", "Neden ve Mazeret Bildirme", [["🦷", "I’m going to the dentist.", "Dişçiye gidiyorum."], ["📝", "I have to do my homework.", "Ödevimi yapmam gerekiyor."], ["👵", "I’m visiting my grandmother.", "Büyükannemi ziyaret ediyorum."], ["🏋️", "I have a training session.", "Antrenmanım var."], ["🎹", "I have a piano lesson.", "Piyano dersim var."], ["🤒", "I’m not feeling well.", "Kendimi iyi hissetmiyorum."], ["👪", "My cousin is coming to our house.", "Kuzenim bize geliyor."], ["🤞", "I promised to help my brother.", "Erkek kardeşime yardım etmeye söz verdim."], ["🧹", "I’m helping my mother at home.", "Evde anneme yardım ediyorum."]]]];
  function lnShow(i) {
    Array.prototype.forEach.call(document.querySelectorAll('.ln-tab'), function (b, k) { b.classList.toggle('act', k === i); });
    document.getElementById('ln-grid').innerHTML = LN[i][2].map(function (it) {
      var wide = it[1].length > 26 && it[0].indexOf('<svg') < 0;
      return '<div class="ln-card' + (wide ? ' wide' : '') + '"><div class="le">' + it[0] + '</div><div class="en">' + it[1] + '</div><div class="trl">' + it[2] + '</div></div>';
    }).join('');
    document.getElementById('ln-grid').scrollTop = 0;
  }
  window.lnOpen = function () {
    var tabs = document.getElementById('ln-tabs'); tabs.innerHTML = '';
    LN.forEach(function (s, i) { var b = document.createElement('button'); b.className = 'ln-tab'; b.textContent = s[0]; b.onclick = function () { lnShow(i); }; tabs.appendChild(b); });
    document.getElementById('ln-screen').style.display = 'flex'; lnShow(0);
  };
  window.lnClose = function () { document.getElementById('ln-screen').style.display = 'none'; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.lnClose(); });
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" xmlns:c2pa="http://c2pa.org/manifest"><rect x="6" y="6" width="788" height="508" rx="26" fill="#fff" stroke="#0B2F2C" stroke-width="10"/><rect x="6" y="6" width="788" height="84" rx="26" fill="#FFD23F" stroke="#0B2F2C" stroke-width="10"/><text x="400" y="64" text-anchor="middle" font-size="40" font-weight="900" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">A Simple Recipe</text><text x="44" y="170" font-size="34" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">First, boil water in a pot.</text><text x="44" y="250" font-size="34" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">Next, put a tea bag in a cup.</text><text x="44" y="330" font-size="34" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">Then, pour the hot water in it.</text><text x="44" y="410" font-size="34" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">Finally, add a slice of lemon.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" xmlns:c2pa="http://c2pa.org/manifest"><rect x="6" y="6" width="788" height="508" rx="26" fill="#fff" stroke="#0B2F2C" stroke-width="10"/><rect x="6" y="6" width="788" height="84" rx="26" fill="#FFD23F" stroke="#0B2F2C" stroke-width="10"/><text x="400" y="64" text-anchor="middle" font-size="40" font-weight="900" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">Pancake Tips</text><text x="44" y="160" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">1. Hold a sieve over a bowl.</text><text x="44" y="230" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">2. Sift the flour through it:</text><text x="44" y="300" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">&#160;&#160;&#160;&#160;the&#160;lumps&#160;stay&#160;on&#160;top&#160;and&#160;only</text><text x="44" y="370" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">&#160;&#160;&#160;&#160;fine&#160;flour&#160;falls&#160;into&#160;the&#160;bowl.</text><text x="44" y="440" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">3. Then, add the milk and the eggs.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
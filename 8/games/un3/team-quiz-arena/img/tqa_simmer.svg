<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" xmlns:c2pa="http://c2pa.org/manifest"><rect x="6" y="6" width="788" height="508" rx="26" fill="#fff" stroke="#0B2F2C" stroke-width="10"/><rect x="6" y="6" width="788" height="84" rx="26" fill="#FFD23F" stroke="#0B2F2C" stroke-width="10"/><text x="400" y="64" text-anchor="middle" font-size="40" font-weight="900" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">Tomato Soup</text><text x="44" y="160" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">1. Chop the tomatoes and the onion.</text><text x="44" y="230" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">2. Simmer the soup for 20 minutes:</text><text x="44" y="300" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">&#160;&#160;&#160;&#160;it&#160;cooks&#160;slowly&#160;on&#160;low&#160;heat&#160;and</text><text x="44" y="370" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">&#160;&#160;&#160;&#160;does&#160;not&#160;boil&#160;fast.</text><text x="44" y="440" font-size="31" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xml:space="preserve">3. Finally, serve it hot.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
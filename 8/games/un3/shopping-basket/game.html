    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(TRIPS.slice()); ti = 0; score = 0;
    document.getElementById('sc').textContent = 0;
    showTrip();
  }
  function showTrip() {
    var t = order[ti]; sel = []; locked = false;
    document.getElementById('rn').textContent = ti + 1;
    document.getElementById('scene').textContent = t.scene;
    document.getElementById('t-en').textContent = t.en;
    document.getElementById('t-tr').textContent = t.tr;
    document.getElementById('ask').textContent = ASK[0];
    fbParts = null; renderFb();
    document.getElementById('next').style.display = 'none';
    document.getElementById('check').style.display = '';
    var box = document.getElementById('items'); box.innerHTML = '';
    shuffle(t.good.concat(t.bad)).forEach(function (id) {
      var it = ITEMS[id], b = document.createElement('button');
      b.className = 'tile'; b.dataset.id = id;
      b.innerHTML = '<div class="e">' + it[0] + '</div><div class="p">' + it[1] + '</div><div class="t tr">' + it[2] + '</div>';
      b.addEventListener('click', function () { toggleItem(id); });
      box.appendChild(b);
    });
    renderCase();
  }
  function toggleItem(id) {
    if (locked) return;
    var k = sel.indexOf(id);
    if (k >= 0) sel.splice(k, 1); else if (sel.length < 3) sel.push(id);
    renderCase();
  }
  function renderCase() {
    Array.prototype.forEach.call(document.querySelectorAll('.slot'), function (s, i) {
      s.innerHTML = sel[i] ? '<div class="e">' + ITEMS[sel[i]][0] + '</div>' : '';
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (b) { b.classList.toggle('sel', sel.indexOf(b.dataset.id) >= 0); });
    document.getElementById('check').disabled = (sel.length !== 3);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.slot'), function (s) {
    s.addEventListener('click', function () { if (!locked && sel[+s.dataset.i]) { sel.splice(+s.dataset.i, 1); renderCase(); } });
  });
  document.getElementById('check').addEventListener('click', function () {
    if (locked || sel.length !== 3) return; locked = true;
    var t = order[ti], right = 0;
    sel.forEach(function (id) { if (t.good.indexOf(id) >= 0) right++; });
    score += right; document.getElementById('sc').textContent = score;
    Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (b) {
      b.classList.remove('sel');
      var good = t.good.indexOf(b.dataset.id) >= 0, chosen = sel.indexOf(b.dataset.id) >= 0;
      if (good) b.classList.add('good'); else if (chosen) b.classList.add('bad', 'shake');
    });
    if (right === 3) setFb('✔ Perfect shopping!', 'Harika bir alışveriş!');
    else setFb('✘ ' + right + ' / 3. The green ones are right.', 'Yeşil olanlar doğru.');
    document.getElementById('check').style.display = 'none';
    var nx = document.getElementById('next'); nx.textContent = (ti === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
  });
  function nextTrip() {
    ti++;
    if (ti >= order.length) {
      var total = order.length * 3;
      document.getElementById('win-title').textContent = score >= total - 2 ? 'Super Shopper!' : (score >= total * 0.65 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Score: ' + score + ' / ' + total;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showTrip();
  }
</script>

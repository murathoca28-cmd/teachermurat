<style>

  .word .e svg { width: clamp(1.8rem, 6.5vh, 3.2rem); height: clamp(1.8rem, 6.5vh, 3.2rem); display: block; }
  .word .p { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.6rem); line-height: 1.1; }
  .word .t { font-weight: 800; font-size: clamp(.7rem, 1.4vw, 1rem); color: #0B5C56; }
  .word.sel { background: #FFF3B0; border-color: #D62828; border-width: 7px; }
  .word.gone { display: none; }
  #bins { flex: 1; min-height: 0; display: flex; gap: 12px; }
  @media (orientation: portrait) { #bins { flex-direction: column; } }
  .bin { flex: 1; min-width: 0; min-height: 0; background: #fff; border: 6px solid #0B2F2C; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; }
  .bin .bh { color: #fff; text-align: center; padding: 4px 8px; border-bottom: 6px solid #0B2F2C; }
  .bin .bh .be { font-size: clamp(1.6rem, 5vh, 2.8rem); line-height: 1.1; }
  .bin .bh .bn { font-weight: 900; font-size: clamp(1.1rem, 2.8vw, 2.2rem); line-height: 1.1; text-shadow: 2px 2px 0 #0B2F2C; }
  .bin .bh .bt { font-weight: 800; font-size: clamp(.8rem, 1.6vw, 1.2rem); }
  .bin .chips { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 8px; }
  .chip { background: #C8F7D4; border: 4px solid #0A7A2F; border-radius: 12px; padding: 0 10px; font-weight: 900; font-size: clamp(.9rem, 2vw, 1.5rem); display: flex; align-items: center; gap: 6px; }
  .chip svg { width: 1.4em; height: 1.4em; }
  #fb { min-height: 1.3em; text-align: center; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  #next { display: none; align-self: center; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }

-size:clamp(.65rem,3.6vh,.95rem)}#pool{min-height:0;gap:4px}.word{padding:0 6px;min-width:clamp(64px,8vw,105px);border-width:3px;border-radius:10px}.word .e{font-size:clamp(.95rem,6vh,1.5rem)}.word .e svg{width:1.2em;height:1.2em}.word .p{font-size:clamp(.7rem,4vh,1rem)}.word .t{font-size:clamp(.58rem,3.2vh,.8rem)}#bins{gap:6px}.bin{border-width:4px;border-radius:12px}.bin .bh{padding:1px 6px;border-bottom-width:3px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.bin .bh .be{font-size:clamp(.95rem,5.2vh,1.4rem)}.bin .bh .bn{font-size:clamp(.8rem,4.4vh,1.2rem)}.bin .bh .bt{font-size:clamp(.6rem,3.2vh,.85rem)}.bin .chips{padding:3px;gap:3px}.chip{font-size:clamp(.65rem,3.7vh,.95rem);border-width:2px;padding:0 6px}#fb{min-height:1.05em;font-size:clamp(.75rem,4.2vh,1.1rem)}#next{font-size:clamp(.85rem,4.8vh,1.2rem);padding:.05em 1.1em}}@media (max-width:430px) and (max-aspect-ratio:1/1){#topbar{padding-top:4px;gap:6px}.stat,.restart-btn{font-size:.8rem!important;padding:0 8px;border-width:3px}#main{gap:4px;padding:3px 8px 6px}#head{border-width:4px}#h-en{font-size:1rem}#h-tr{font-size:.75rem}#pool{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;min-height:0}.word{min-width:0;padding:0 3px;border-width:3px;border-radius:10px}.word .e{font-size:1.25rem}.word .e svg{width:1.25em;height:1.25em}.word .p{font-size:.78rem;overflow-wrap:break-word}.word .t{font-size:max(9px,.55rem);overflow-wrap:anywhere;line-height:1.05}#bins{gap:5px}.bin{border-width:4px;border-radius:12px}.bin .bh{padding:1px 6px;border-bottom-width:3px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.bin .bh .be{font-size:1.1rem}.bin .bh .bn{font-size:.85rem}.bin .bh .bt{font-size:max(9px,.6rem)}.bin .chips{padding:3px;gap:3px}.chip{font-size:.7rem;border-width:2px;padding:0 5px}#fb{min-height:1.05em;font-size:.8rem}#next{font-size:1rem}}</style>

<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Sort<br>It Out</h1>
  <p class="subtitle">Put each word in the right box!</p>
  <div class="preview">⟦k_tool_bowl⟧ ⟦lemon⟧ ⟦cookies⟧</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Round: <span id="rn">1</span>/4</div>
  <div class="stat">Mistakes: <span id="mi">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="head"><div id="h-en"></div><div id="h-tr" class="tr"></div></div>
  <div id="pool"></div>
  <div id="bins"></div>
  <div id="fb"></div>
  <button class="big-btn" id="next" onclick="nextRound()">Next</button>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { var f = document.getElementById('fb'); if (f) f.textContent = fbParts ? fbParts[0] + (TR && fbParts[1] ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var ROUNDS = [["Verb, tool or ingredient?", "Fiil mi, alet mi, malzeme mi?", [["verb", "Cooking verb", "Pişirme fiili", "⟦k_chop_carrot⟧", "#1F5FBF"], ["tool", "Kitchen tool", "Mutfak aleti", "⟦k_tool_pan⟧", "#0A7A2F"], ["ing", "Ingredient", "Malzeme", "⟦tomato⟧", "#C45A00"]], [["verb", "⟦k_peel_apple⟧", "peel", "soymak"], ["verb", "⟦k_boil_pot⟧", "boil", "kaynatmak"], ["verb", "⟦k_tool_whisk⟧", "whisk", "çırpmak"], ["verb", "⟦k_knead_dough⟧", "knead", "yoğurmak"], ["tool", "⟦k_pasta_pot_water⟧", "pot", "tencere"], ["tool", "⟦knife⟧", "knife", "bıçak"], ["tool", "⟦k_tool_grater⟧", "grater", "rende"], ["tool", "⟦k_tool_bowl⟧", "bowl", "kase"], ["ing", "⟦k_flour_cup⟧", "flour", "un"], ["ing", "⟦k_sugar_cup⟧", "sugar", "şeker"], ["ing", "⟦honey⟧", "honey", "bal"], ["ing", "⟦lemon⟧", "lemon", "limon"]]], ["Fry, boil or bake?", "Kızart, haşla ya da fırında pişir?", [["fry", "Fry", "Kızartmak", "⟦k_tool_pan⟧", "#D62828"], ["boil", "Boil", "Kaynatmak", "⟦k_boil_pot⟧", "#1F5FBF"], ["bake", "Bake", "Fırında pişirmek", "⟦oven⟧", "#C45A00"]], [["fry", "⟦chips⟧", "chips", "patates kızartması"], ["fry", "⟦k_fry_egg⟧", "fried egg", "sahanda yumurta"], ["fry", "⟦k_pancake_serve⟧", "pancake", "krep"], ["fry", "⟦doughnut⟧", "doughnut", "donut"], ["boil", "⟦pasta⟧", "pasta", "makarna"], ["boil", "⟦k_eggs_six⟧", "boiled egg", "haşlanmış yumurta"], ["boil", "⟦rice⟧", "rice", "pirinç"], ["boil", "⟦soup⟧", "soup", "çorba"], ["bake", "⟦bread⟧", "bread", "ekmek"], ["bake", "⟦k_cake_slice⟧", "cake", "kek"], ["bake", "⟦cookies⟧", "cookie", "kurabiye"], ["bake", "⟦pizza⟧", "pizza", "pizza"]]], ["Liquid or solid?", "Sıvı mı, katı mı?", [["liq", "Liquid", "Sıvı", "⟦water⟧", "#1F5FBF"], ["sol", "Solid", "Katı", "⟦solid_block⟧", "#7B2CBF"]], [["liq", "⟦milk⟧", "milk", "süt"], ["liq", "⟦water_glass⟧", "water", "su"], ["liq", "⟦tea_cup⟧", "tea", "çay"], ["liq", "⟦orange_juice⟧", "juice", "meyve suyu"], ["liq", "⟦soup⟧", "soup", "çorba"], ["sol", "⟦bread⟧", "bread", "ekmek"], ["sol", "⟦cheese⟧", "cheese", "peynir"], ["sol", "⟦k_eggs_six⟧", "egg", "yumurta"], ["sol", "⟦apple⟧", "apple", "elma"], ["sol", "⟦k_cake_slice⟧", "cake", "kek"]]], ["Sweet or sour?", "Tatlı mı, ekşi mi?", [["sweet", "Sweet", "Tatlı", "⟦k_sugar_cup⟧", "#B5179E"], ["sour", "Sour", "Ekşi", "⟦k_squeeze_lemon⟧", "#0A7A2F"]], [["sweet", "⟦honey⟧", "honey", "bal"], ["sweet", "⟦k_cake_slice⟧", "cake", "kek"], ["sweet", "⟦ice_cream⟧", "ice cream", "dondurma"], ["sweet", "⟦chocolate⟧", "chocolate", "çikolata"], ["sweet", "⟦sweets⟧", "candy", "şeker"], ["sour", "⟦lemon⟧", "lemon", "limon"], ["sour", "⟦cherry⟧", "sour cherry", "vişne"], ["sour", "⟦green_apple⟧", "green apple", "yeşil elma"], ["sour", "⟦pickle⟧", "pickle", "turşu"]]]];
  var ri, sel, left, mistakes;
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    ri = 0; mistakes = 0; document.getElementById('mi').textContent = 0; showRound();
  }
  function showRound() {
    var r = ROUNDS[ri]; sel = null; left = r[3].length;
    document.getElementById('rn').textContent = ri + 1;
    document.getElementById('h-en').textContent = r[0]; document.getElementById('h-tr').textContent = r[1];
    fbParts = null; renderFb(); document.getElementById('next').style.display = 'none';
    var bins = document.getElementById('bins'); bins.innerHTML = '';
    r[2].forEach(function (b) {
      var d = document.createElement('div'); d.className = 'bin'; d.dataset.id = b[0];
      d.innerHTML = '<div class="bh" style="background:' + b[4] + '"><div class="be">' + b[3] + '</div><div class="bn">' + b[1] + '</div><div class="bt tr">' + b[2] + '</div></div><div class="chips"></div>';
      d.addEventListener('click', function () { dropIn(d); });
      bins.appendChild(d);
    });
    var pool = document.getElementById('pool'); pool.innerHTML = '';
    shuffle(r[3].slice()).forEach(function (w) {

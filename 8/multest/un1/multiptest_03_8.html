<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grade 8 – Friendship Test 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      min-height: 100vh;
      color: #1f2937;
      padding: 14px 12px 70px
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .hide {
      display: none !important
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #4338ca, #7e22ce, #db2777)
    }

    #splash h1 {
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 900;
      text-shadow: 0 3px 8px rgba(0, 0, 0, .25)
    }

    #splash p {
      font-weight: 700;
      max-width: 460px;
      font-size: clamp(14px, 2.4vw, 20px);
      opacity: .92
    }

    .start {
      width: 140px;
      height: 140px;
      border: 0;
      border-bottom: 8px solid #0284c7;
      border-radius: 28px;
      background: #38bdf8;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .3);
      transition: transform .15s
    }

    .start:hover {
      transform: scale(1.05)
    }

    .start:active {
      transform: scale(.96)
    }

    .start span:first-child {
      font-size: 52px;
      line-height: 1
    }

    .start span:last-child {
      font-size: 20px;
      font-weight: 900;
      margin-top: 4px
    }

    .fab {
      position: fixed;
      bottom: 10px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #bfdbfe;
      background: rgba(255, 255, 255, .92);
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2)
    }

    #fs {
      right: 10px;
      z-index: 50
    }

    #menuBtn {
      left: 10px;
      z-index: 60;
      background: #171717;
      border-color: #525252;
      color: #fff;
      font-size: 20px
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 70
    }

    #menu div {
      position: absolute;
      bottom: 60px;
      left: 10px;
      width: 220px;
      background: #171717;
      color: #fff;
      border-radius: 12px;
      border: 2px solid #525252;
      padding: 10px
    }

    #menu small {
      display: block;
      color: #a3a3a3;
      font-weight: 900;
      letter-spacing: .1em;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 2px solid #000
    }

    #menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      color: #fff;
      font-weight: 900;
      font-size: 17px;
      padding: 8px 10px;
      border-radius: 8px
    }

    #menu button:hover {
      background: #404040
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto
    }

    .top {
      background: rgba(255, 255, 255, .9);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 10px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .12);
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 900;
      color: #6b21a8
    }

    .bar {
      flex: 1;
      height: 12px;
      background: #e9d5ff;
      border-radius: 99px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      transition: width .3s
    }

    .card {
      margin-top: 12px;
      background: #fff;
      border: 6px solid #60a5fa;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .2)
    }

    .intro {
      font-weight: 900;
      color: #1e40af;
      font-size: clamp(15px, 2.4vw, 19px);
      margin-bottom: 10px
    }

    .n {
      display: inline-block;
      background: #7e22ce;
      color: #fff;
      border-radius: 10px;
      padding: 0 10px;
      margin-right: 8px
    }

    .cols {
      display: grid;
      gap: 14px
    }

    @media(min-width:760px) {
      .cols {
        grid-template-columns: 1fr 1fr;
        align-items: start
      }
    }

    .ctx {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 15px
    }

    .ctx p {
      margin: 3px 0
    }

    .ctx table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px
    }

    .ctx th,
    .ctx td {
      border: 1px solid #93c5fd;
      padding: 4px 6px;
      text-align: left
    }

    .pic {
      display: block;
      max-width: 100%;
      max-height: max(240px, calc(100vh - 240px));
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 12px
    }

    .qt {
      font-weight: 900;
      font-size: clamp(16px, 2.6vw, 21px);
      margin-bottom: 10px
    }

    .opts {
      display: grid;
      gap: 8px
    }

    .opt {
      text-align: left;
      padding: 10px 14px;
      border: 3px solid #93c5fd;
      border-bottom-width: 6px;
      border-radius: 16px;
      background: #fff;
      font-weight: 800;
      font-size: clamp(14px, 2.2vw, 18px);
      color: #1e3a8a;
      transition: transform .12s
    }

    .opt:hover {
      transform: translateY(-2px)
    }

    .opt.sel {
      background: #fde047;
      border-color: #f59e0b
    }

    .opts.lo {
      grid-template-columns: repeat(4, 1fr)
    }

    .lo .opt {
      text-align: center;
      font-size: 24px
    }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px
    }

    .btn {
      border: 0;
      border-bottom: 5px solid #0284c7;
      border-radius: 16px;
      background: linear-gradient(#4facfe, #00f2fe);
      color: #fff;
      font-weight: 900;
      font-size: clamp(15px, 2.4vw, 20px);
      padding: 10px 22px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, .3)
    }

    a.btn {
      display: inline-block;
      text-decoration: none
    }

    .btn.g {
      background: linear-gradient(#4ade80, #16a34a);
      border-color: #166534
    }

    .btn:disabled {
      background: #cbd5e1;
      border-color: #94a3b8;
      cursor: default
    }

    .res {
      text-align: center
    }

    .res h2 {
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 900;
      color: #7e22ce
    }

    .big {
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 900;
      color: #1e3a8a;
      margin: 6px 0
    }

    .rv {
      text-align: left;
      margin-top: 16px;
      display: grid;
      gap: 8px
    }

    .rv div {
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      border: 2px solid
    }

    .rv .ok {
      background: #dcfce7;
      border-color: #4ade80
    }

    .rv .no {
      background: #fee2e2;
      border-color: #f87171
    }

    .rv .bl {
      background: #f1f5f9;
      border-color: #cbd5e1
    }

    .rv small {
      display: block;
      font-weight: 700;
      color: #475569
    }
  </style>
  <link rel="stylesheet" href="../../../theme.css">
</head>

  <main class="wrap hide" id="game"></main>
  <script>
    const Q = [
      {
        t: "Read what four friends say about Sam.",
        c: `<p><b>Lily:</b> “I can always count on him.”</p><p><b>Tom:</b> “He never keeps his promises.”</p><p><b>Emma:</b> “We get on well.”</p><p><b>Jake:</b> “He is honest and loyal.”</p>`,
        q: "According to the comments above, who says something negative about Sam?",
        o: ["Jake", "Lily", "Tom", "Emma"], a: 2, w: "Tom, Sam hakkında olumsuz bir şey söylüyor."
      },
      {
        t: "Ryan invites his friends. Below, you see their replies.",
        c: `<p><b>Ryan:</b> “Do you want to watch a film tonight?”</p>`,
        q: "Who refuses Ryan's invitation with <b>NO</b> excuse?",
        o: ["<b>Amy:</b> “I'm sorry, but I have to study for my exam.”", "<b>Brian:</b> “I'd love to, but I'm visiting my aunt.”", "<b>Carol:</b> “Sorry, I can't come. Maybe next time.”", "<b>David:</b> “That sounds great, but I have a match.”"], a: 2, w: "Carol hiçbir sebep söylemeden reddediyor."
      },
      {
        t: "Daisy asks her friends about their plans for Saturday.",
        c: `<p><b>Daisy:</b> “Would you like to go to the cinema on Saturday evening?”</p><table><tr><th>Friend</th><th>Saturday morning</th><th>Saturday evening</th></tr><tr><td>Oscar</td><td>Has a swimming lesson</td><td>Visits his cousin</td></tr><tr><td>Kevin</td><td>No plans</td><td>Has a basketball match</td></tr><tr><td>Sally</td><td>Visits her aunt</td><td>Has to study for an exam</td></tr><tr><td>Lara</td><td>Is busy</td><td>No plans</td></tr></table>`,
        q: "According to the table above, which friend can accept Daisy's invitation?",
        o: ["Sally", "Kevin", "Oscar", "Lara"], a: 3, w: "Lara'nın Saturday evening için planı yok."
      },
      {
        t: "Look at the poster below.",
        c: `<p><b>FRIENDSHIP DAY PICNIC</b></p><p><i>Come and join us!</i></p><p>Place: City Park<br>Day: Sunday<br>Time: 11 a.m.<br>Invited by: Ella</p>`,
        q: "Which of the following information is <u>NOT</u> given on the poster?",
        o: ["what the guests should bring", "where the event is", "which day it is", "who invites the guests"], a: 0, w: "Afişte misafirlerin ne getireceği yazmıyor."
      },
      {
        t: "Anna and Ben are talking about their plans.",
        c: `<p><b>Anna:</b> “Would you like to come over after school?”</p><p><b>Ben:</b> “- - - -”</p><p><b>Anna:</b> “OK. Then how about Friday?”</p>`,
        q: "Which of the following completes the conversation above?",
        o: ["Yes, please.", "I'm sorry, but I can't. I have to study for my exam.", "No, thanks. I'm full.", "Sure, I'd love some."], a: 1, w: "Anna “Then how about Friday?” diyor; yani Ben daveti reddetmiş."
      },
      {
        t: "Read the sentences below.",
        c: `<p><b>I.</b> Sure, that sounds great!</p><p><b>II.</b> Hi, Mia! Are you busy tomorrow afternoon?</p><p><b>III.</b> Then how about going to the park?</p><p><b>IV.</b> No, not really. Why?</p>`,
        q: "Which of the following is the correct order of the sentences in the conversation above?",
        o: ["II - IV - I - III", "IV - II - III - I", "II - IV - III - I", "III - II - IV - I"], a: 2, w: "Soru (II), cevap (IV), teklif (III), kabul (I)."
      },
      {
        t: "Below, there are four short conversations.",
        c: "",
        q: "Which of the following conversations is <u>NOT</u> logical?",
        o: ["“Would you like some tea?” – “No, thanks. I'm full.”", "“Are you busy tonight?” – “Yes, I'd love to.”", "“How about going to the park?” – “Sure, that sounds great!”", "“Why don't you join us?” – “Sorry, I have other plans.”"], a: 1, w: "“Are you busy tonight?” sorusuna “Yes, I'd love to.” denmez."
      },
      {
        t: "Nora wrote the following message to her friend Paul.",
        c: `<p>Dear Paul,<br>Thanks for inviting me to your birthday party. I'm so sorry, but I can't come because my cousins are staying at our house this weekend. I promise I will join you next time.<br>Bye,<br>Nora</p>`,
        q: "According to the message above, which of the following is correct?",
        o: ["Nora gives a promise to Paul for the future.", "Nora's cousins are going to Paul's party.", "Nora doesn't want to see Paul again.", "Paul is staying at Nora's house this weekend."], a: 0, w: "Nora “I promise I will join you next time” diyerek gelecek için söz veriyor."
      },
      {
        t: "Below, there are some sentences that have the same function.",
        c: `<p>How about going for a walk?</p><p>Why don't you join us?</p><p>Would you like to come over?</p>`,
        q: "What is the function of these sentences?",
        o: ["Apologizing to a friend", "Refusing an offer", "Giving a reason", "Inviting someone to an activity"], a: 3, w: "Üç cümle de bir etkinliğe davet eder."
      },
      {
        t: "Read the conversation below.",
        c: `<p><b>Lucy:</b> Hi, Tim! - - - -?</p><p><b>Tim:</b> No, not really. Why?</p><p><b>Lucy:</b> - - - -?</p><p><b>Tim:</b> Sure, that sounds great!</p>`,
        q: "Which of the following does <u>NOT</u> fill in any of the blanks?",
        o: ["Are you busy tomorrow evening", "Do you want to go to the cinema", "What about going to the cinema", "I'm afraid I can't join you"], a: 3, w: "D bir ret cümlesi; boşluklar soru/davet cümlesi olmalı."
      }

      $("game").innerHTML = `<div class="top"><span>Soru ${i + 1} / ${Q.length}</span><div class="bar"><i style="width:${(i + 1) / Q.length * 100}%"></i></div></div>
  <div class="card"><p class="intro"><span class="n">${i + 1}</span>${d.t}</p><div class="cols"><div>${IMG[i] ? `<img class="pic" src="${IMG[i]}" alt="${alt(d, i)}">` : `<div class="ctx">${d.c}</div>`}</div>
  <div><p class="qt">${d.q}</p><div class="opts${lo ? " lo" : ""}">${d.o.map((t, j) => `<button class="opt${sel[i] === j ? " sel" : ""}" aria-label="${L[j]}) ${strip(t)}" onclick="pick(${j})"><b>${L[j]})</b>${lo ? "" : " " + t}</button>`).join("")}</div></div></div></div>
  <div class="nav"><button class="btn" onclick="go(-1)" ${i ? "" : "disabled"}>◀ Önceki</button><button class="btn${last ? " g" : ""}" onclick="go(1)">${last ? "Bitir ✔" : "Sonraki ▶"}</button></div>`;
      window.scrollTo(0, 0);
    }
    function pick(j) { sel[i] = sel[i] === j ? null : j; document.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("sel", k === sel[i])) }
    function go(n) { if (i + n >= Q.length) finish(); else { i += n; render() } }
    function finish() {
      const ok = Q.filter((d, k) => sel[k] === d.a).length, b = sel.filter(s => s === null).length, ot = (d, j) => L[j] + ") " + strip(d.o[j]);
      $("game").innerHTML = `<div class="card res"><h2>🏆 Test bitti! 🏆</h2><div class="big">${ok} / ${Q.length}</div><p><b>${ok}</b> doğru • <b>${Q.length - ok - b}</b> yanlış • <b>${b}</b> boş</p>
  <div class="nav" style="justify-content:center"><button class="btn g" onclick="restart()">🔄 Yeniden Başla</button></div>
  <div class="rv">${Q.map((d, k) => { const s = sel[k], c = s === d.a; return `<div class="${s === null ? "bl" : c ? "ok" : "no"}">${c ? "✅" : s === null ? "⬜" : "❌"} <b>${k + 1}.</b> ${s === null ? "Boş bırakıldı" : c ? "Doğru" : "Senin cevabın: " + L[s]}<small>Doğru cevap: ${ot(d, d.a)} — ${d.w}</small></div>` }).join("")}</div>
  <div class="nav" style="justify-content:center"><a class="btn" href="lgs3_test3.pdf" download>📄 Testi indir (PDF)</a></div></div>`;
      window.scrollTo(0, 0);
    }
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grade 8 – Friendship Test 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      min-height: 100vh;
      color: #1f2937;
      padding: 14px 12px 70px
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .hide {
      display: none !important
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #4338ca, #7e22ce, #db2777)
    }

    #splash h1 {
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 900;
      text-shadow: 0 3px 8px rgba(0, 0, 0, .25)
    }

    #splash p {
      font-weight: 700;
      max-width: 460px;
      font-size: clamp(14px, 2.4vw, 20px);
      opacity: .92
    }

    .start {
      width: 140px;
      height: 140px;
      border: 0;
      border-bottom: 8px solid #0284c7;
      border-radius: 28px;
      background: #38bdf8;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .3);
      transition: transform .15s
    }

    .start:hover {
      transform: scale(1.05)
    }

    .start:active {
      transform: scale(.96)
    }

    .start span:first-child {
      font-size: 52px;
      line-height: 1
    }

    .start span:last-child {
      font-size: 20px;
      font-weight: 900;
      margin-top: 4px
    }

    .fab {
      position: fixed;
      bottom: 10px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #bfdbfe;
      background: rgba(255, 255, 255, .92);
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2)
    }

    #fs {
      right: 10px;
      z-index: 50
    }

    #menuBtn {
      left: 10px;
      z-index: 60;
      background: #171717;
      border-color: #525252;
      color: #fff;
      font-size: 20px
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 70
    }

    #menu div {
      position: absolute;
      bottom: 60px;
      left: 10px;
      width: 220px;
      background: #171717;
      color: #fff;
      border-radius: 12px;
      border: 2px solid #525252;
      padding: 10px
    }

    #menu small {
      display: block;
      color: #a3a3a3;
      font-weight: 900;
      letter-spacing: .1em;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 2px solid #000
    }

    #menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      color: #fff;
      font-weight: 900;
      font-size: 17px;
      padding: 8px 10px;
      border-radius: 8px
    }

    #menu button:hover {
      background: #404040
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto
    }

    .top {
      background: rgba(255, 255, 255, .9);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 10px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .12);
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 900;
      color: #6b21a8
    }

    .bar {
      flex: 1;
      height: 12px;
      background: #e9d5ff;
      border-radius: 99px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      transition: width .3s
    }

    .card {
      margin-top: 12px;
      background: #fff;
      border: 6px solid #60a5fa;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .2)
    }

    .intro {
      font-weight: 900;
      color: #1e40af;
      font-size: clamp(15px, 2.4vw, 19px);
      margin-bottom: 10px
    }

    .n {
      display: inline-block;
      background: #7e22ce;
      color: #fff;
      border-radius: 10px;
      padding: 0 10px;
      margin-right: 8px
    }

    .cols {
      display: grid;
      gap: 14px
    }

    @media(min-width:760px) {
      .cols {
        grid-template-columns: 1fr 1fr;
        align-items: start
      }
    }

    .ctx {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 15px
    }

    .ctx p {
      margin: 3px 0
    }

    .ctx table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px
    }

    .ctx th,
    .ctx td {
      border: 1px solid #93c5fd;
      padding: 4px 6px;
      text-align: left
    }

    .pic {
      display: block;
      max-width: 100%;
      max-height: max(240px, calc(100vh - 240px));
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 12px
    }

    .qt {
      font-weight: 900;
      font-size: clamp(16px, 2.6vw, 21px);
      margin-bottom: 10px
    }

    .opts {
      display: grid;
      gap: 8px
    }

    .opt {
      text-align: left;
      padding: 10px 14px;
      border: 3px solid #93c5fd;
      border-bottom-width: 6px;
      border-radius: 16px;
      background: #fff;
      font-weight: 800;
      font-size: clamp(14px, 2.2vw, 18px);
      color: #1e3a8a;
      transition: transform .12s
    }

    .opt:hover {
      transform: translateY(-2px)
    }

    .opt.sel {
      background: #fde047;
      border-color: #f59e0b
    }

    .opts.lo {
      grid-template-columns: repeat(4, 1fr)
    }

    .lo .opt {
      text-align: center;
      font-size: 24px
    }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px
    }

    .btn {
      border: 0;
      border-bottom: 5px solid #0284c7;
      border-radius: 16px;
      background: linear-gradient(#4facfe, #00f2fe);
      color: #fff;
      font-weight: 900;
      font-size: clamp(15px, 2.4vw, 20px);
      padding: 10px 22px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, .3)
    }

    a.btn {
      display: inline-block;
      text-decoration: none
    }

    .btn.g {
      background: linear-gradient(#4ade80, #16a34a);
      border-color: #166534
    }

    .btn:disabled {
      background: #cbd5e1;
      border-color: #94a3b8;
      cursor: default
    }

    .res {
      text-align: center
    }

    .res h2 {
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 900;
      color: #7e22ce
    }

    .big {
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 900;
      color: #1e3a8a;
      margin: 6px 0
    }

    .rv {
      text-align: left;
      margin-top: 16px;
      display: grid;
      gap: 8px
    }

    .rv div {
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      border: 2px solid
    }

    .rv .ok {
      background: #dcfce7;
      border-color: #4ade80
    }

    .rv .no {
      background: #fee2e2;
      border-color: #f87171
    }

    .rv .bl {
      background: #f1f5f9;
      border-color: #cbd5e1
    }

    .rv small {
      display: block;
      font-weight: 700;
      color: #475569
    }
  </style>
</head>

nts below, which two people are talking about a friend they can trust?", "c": "Cem, Bora, Cansu ve Derya’nın yorumları", "q": "", "o": ["Cem and Bora", "Bora and Cansu", "Cem and Derya", "Cansu and Derya"], "a": 2, "w": "Cem ve Derya, güvenebildikleri arkadaşlarından söz ediyor." }, { "t": "According to the poster and Ela’s message, which of the following activities can Ela join?", "c": "Friendship Club afişi ve Ela’nın mesajı", "q": "", "o": ["Chess Tournament", "Football Match", "Cooking Class", "Bike Ride"], "a": 0, "w": "Ela Pazar günü 13:00’e kadar müsait; Chess Tournament 11:00–12:30." }, { "t": "According to the invitation below, which of the following is <u>NOT</u> correct?", "c": "Sinem’in film gecesi davetiyesi", "q": "", "o": ["The guests should bring something to eat.", "The guests should call Sinem if they are busy.", "The movie night will be at a cinema.", "The movie night starts in the evening."], "a": 2, "w": "Film gecesi Sinem’in evinde, sinemada değil." }, { "t": "What is the function of the sentence in bold in the conversation below?", "c": "Mert ve Can’ın konuşması", "q": "", "o": ["Asking for a reason", "Accepting an invitation", "Offering some food", "Making a promise"], "a": 0, "w": "“Oh! Why not?” bir sebep soruyor." }];

    const L = "ABCD", $ = s => document.getElementById(s), strip = h => h.replace(/<[^>]+>/g, "");
    let i = 0, sel = [];
    function begin() { $("splash").classList.add("hide"); $("menuBtn").classList.remove("hide"); restart() }
    function restart() { sel = Array(Q.length).fill(null); i = 0; menu(0); $("game").classList.remove("hide"); render() }
    function menu(f) { $("menu").classList.toggle("hide", !f) }
    function fullscr() { const d = document, e = d.documentElement; if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (e.requestFullscreen || e.webkitRequestFullscreen).call(e) }
    function render() {
      const d = Q[i], lo = LO.includes(i), last = i == Q.length - 1;
      $("game").innerHTML = `<div class="top"><span>Soru ${i + 1} / ${Q.length}</span><div class="bar"><i style="width:${(i + 1) / Q.length * 100}%"></i></div></div>
  <div class="card"><p class="intro"><span class="n">${i + 1}</span>${d.t}</p><div class="cols"><div>${IMG[i] ? `<img class="pic" src="${IMG[i]}" alt="${alt(d, i)}">` : `<div class="ctx">${d.c}</div>`}</div>
  <div>${d.q ? `<p class="qt">${d.q}</p>` : ""}<div class="opts${lo ? " lo" : ""}">${d.o.map((t, j) => `<button class="opt${sel[i] === j ? " sel" : ""}" aria-label="${L[j]}) ${strip(t)}" onclick="pick(${j})"><b>${L[j]})</b>${lo ? "" : " " + t}</button>`).join("")}</div></div></div></div>
  <div class="nav"><button class="btn" onclick="go(-1)" ${i ? "" : "disabled"}>◀ Önceki</button><button class="btn${last ? " g" : ""}" onclick="go(1)">${last ? "Bitir ✔" : "Sonraki ▶"}</button></div>`;
      window.scrollTo(0, 0);
    }
    function pick(j) { sel[i] = sel[i] === j ? null : j; document.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("sel", k === sel[i])) }
    function go(n) { if (i + n >= Q.length) finish(); else { i += n; render() } }
    function finish() {
      const ok = Q.filter((d, k) => sel[k] === d.a).length, b = sel.filter(s => s === null).length, ot = (d, j) => L[j] + ") " + strip(d.o[j]);
      $("game").innerHTML = `<div class="card res"><h2>🏆 Test bitti! 🏆</h2><div class="big">${ok} / ${Q.length}</div><p><b>${ok}</b> doğru • <b>${Q.length - ok - b}</b> yanlış • <b>${b}</b> boş</p>
  <div class="nav" style="justify-content:center"><button class="btn g" onclick="restart()">🔄 Yeniden Başlat</button></div>
  <div class="rv">${Q.map((d, k) => { const s = sel[k], c = s === d.a; return `<div class="${s === null ? "bl" : c ? "ok" : "no"}">${c ? "✅" : s === null ? "⬜" : "❌"} <b>${k + 1}.</b> ${s === null ? "Boş bırakıldı" : c ? "Doğru" : "Senin cevabın: " + L[s]}<small>Doğru cevap: ${ot(d, d.a)} — ${d.w}</small></div>` }).join("")}</div>
  <div class="nav" style="justify-content:center"><a class="btn" href="8_LGS_TEST_1.pdf" download>📄 Testi indir (PDF)</a></div></div>`;

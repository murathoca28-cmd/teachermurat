<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grade 8 – Friendship Test 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      min-height: 100vh;
      color: #1f2937;
      padding: 14px 12px 70px
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .hide {
      display: none !important
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #4338ca, #7e22ce, #db2777)
    }

    #splash h1 {
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 900;
      text-shadow: 0 3px 8px rgba(0, 0, 0, .25)
    }

    #splash p {
      font-weight: 700;
      max-width: 460px;
      font-size: clamp(14px, 2.4vw, 20px);
      opacity: .92
    }

    .start {
      width: 140px;
      height: 140px;
      border: 0;
      border-bottom: 8px solid #0284c7;
      border-radius: 28px;
      background: #38bdf8;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .3);
      transition: transform .15s
    }

    .start:hover {
      transform: scale(1.05)
    }

    .start:active {
      transform: scale(.96)
    }

    .start span:first-child {
      font-size: 52px;
      line-height: 1
    }

    .start span:last-child {
      font-size: 20px;
      font-weight: 900;
      margin-top: 4px
    }

    .fab {
      position: fixed;
      bottom: 10px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #bfdbfe;
      background: rgba(255, 255, 255, .92);
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2)
    }

    #fs {
      right: 10px;
      z-index: 50
    }

    #menuBtn {
      left: 10px;
      z-index: 60;
      background: #171717;
      border-color: #525252;
      color: #fff;
      font-size: 20px
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 70
    }

    #menu div {
      position: absolute;
      bottom: 60px;
      left: 10px;
      width: 220px;
      background: #171717;
      color: #fff;
      border-radius: 12px;
      border: 2px solid #525252;
      padding: 10px
    }

    #menu small {
      display: block;
      color: #a3a3a3;
      font-weight: 900;
      letter-spacing: .1em;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 2px solid #000
    }

    #menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      color: #fff;
      font-weight: 900;
      font-size: 17px;
      padding: 8px 10px;
      border-radius: 8px
    }

    #menu button:hover {
      background: #404040
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto
    }

    .top {
      background: rgba(255, 255, 255, .9);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 10px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .12);
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 900;
      color: #6b21a8
    }

    .bar {
      flex: 1;
      height: 12px;
      background: #e9d5ff;
      border-radius: 99px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      transition: width .3s
    }

    .card {
      margin-top: 12px;
      background: #fff;
      border: 6px solid #60a5fa;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .2)
    }

    .intro {
      font-weight: 900;
      color: #1e40af;
      font-size: clamp(15px, 2.4vw, 19px);
      margin-bottom: 10px
    }

    .n {
      display: inline-block;
      background: #7e22ce;
      color: #fff;
      border-radius: 10px;
      padding: 0 10px;
      margin-right: 8px
    }

    .cols {
      display: grid;
      gap: 14px
    }

    @media(min-width:760px) {
      .cols {
        grid-template-columns: 1fr 1fr;
        align-items: start
      }
    }

    .ctx {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 15px
    }

    .ctx p {
      margin: 3px 0
    }

    .ctx table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px
    }

    .ctx th,
    .ctx td {
      border: 1px solid #93c5fd;
      padding: 4px 6px;
      text-align: left
    }

    .pic {
      display: block;
      max-width: 100%;
      max-height: max(240px, calc(100vh - 240px));
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 12px
    }

    .qt {
      font-weight: 900;
      font-size: clamp(16px, 2.6vw, 21px);
      margin-bottom: 10px
    }

    .opts {
      display: grid;
      gap: 8px
    }

    .opt {
      text-align: left;
      padding: 10px 14px;
      border: 3px solid #93c5fd;
      border-bottom-width: 6px;
      border-radius: 16px;
      background: #fff;
      font-weight: 800;
      font-size: clamp(14px, 2.2vw, 18px);
      color: #1e3a8a;
      transition: transform .12s
    }

    .opt:hover {
      transform: translateY(-2px)
    }

    .opt.sel {
      background: #fde047;
      border-color: #f59e0b
    }

    .opts.lo {
      grid-template-columns: repeat(4, 1fr)
    }

    .lo .opt {
      text-align: center;
      font-size: 24px
    }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px
    }

    .btn {
      border: 0;
      border-bottom: 5px solid #0284c7;
      border-radius: 16px;
      background: linear-gradient(#4facfe, #00f2fe);
      color: #fff;
      font-weight: 900;
      font-size: clamp(15px, 2.4vw, 20px);
      padding: 10px 22px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, .3)
    }

    a.btn {
      display: inline-block;
      text-decoration: none
    }

    .btn.g {
      background: linear-gradient(#4ade80, #16a34a);
      border-color: #166534
    }

    .btn:disabled {
      background: #cbd5e1;
      border-color: #94a3b8;
      cursor: default
    }

    .res {
      text-align: center
    }

    .res h2 {
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 900;
      color: #7e22ce
    }

    .big {
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 900;
      color: #1e3a8a;
      margin: 6px 0
    }

    .rv {
      text-align: left;
      margin-top: 16px;
      display: grid;
      gap: 8px
    }

    .rv div {
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      border: 2px solid
    }

    .rv .ok {
      background: #dcfce7;
      border-color: #4ade80
    }

    .rv .no {
      background: #fee2e2;
      border-color: #f87171
    }

    .rv .bl {
      background: #f1f5f9;
      border-color: #cbd5e1
    }

    .rv small {
      display: block;
      font-weight: 700;
      color: #475569
    }
  </style>
</head>

    <p>Unit 1: Friendship</p>
    <h1>Grade 8 – Friendship Test 2</h1>

  </div>

  <main class="wrap hide" id="game"></main>
  <script>
    const Q = [{ "t": "Read the responses below. Who refuses Kevin's invitation with <b>NO</b> excuse?", "c": "Kevin'in daveti ve arkadaşlarının cevapları (grup sohbeti)", "q": "", "o": ["Mia", "Ali", "Ben", "Zeynep"], "a": 2, "w": "Ben hiçbir sebep söylemeden reddediyor (“I'm afraid I can't.”)." }, { "t": "Which of the following completes the conversation below?", "c": "Cem ve Elif'in mesajlaşması", "q": "", "o": ["Yes, I'd love some.", "I'd love to, but I have to look after my little brother.", "No, thanks. I'm full.", "Yes, please."], "a": 1, "w": "Cem “No problem. What about Friday?” diyor; Elif daveti sebep göstererek reddetmiş." }, { "t": "David accepts Andy's invitation. Which of the following can be David's answer to Andy?", "c": "Andy'nin pizza daveti ve David'in boş bırakılan cevabı", "q": "", "o": ["I'm afraid I can't. I have a match.", "No, thanks. I'm full.", "I'm sorry, but I'm visiting my aunt.", "Yeah, that would be great!"], "a": 3, "w": "Daveti kabul eden tek cevap D." }, { "t": "Which of the following is the correct order of the sentences in the phone conversation below?", "c": "Telefon konuşmasından karışık cümleler", "q": "", "o": ["I – IV – II – III", "I – II – IV – III", "IV – I – II – III", "I – IV – III – II"], "a": 0, "w": "Selam ve soru (I), cevap (IV), teklif (II), kabul (III)." }, { "t": "According to the information below, which of the following is <u>NOT</u> correct?", "c": "Zeynep'in haftalık planı tablosu", "q": "", "o": ["Zeynep is free on Wednesday.", "Zeynep has a swimming lesson on Monday.", "Zeynep is visiting her grandparents on Thursday.", "Zeynep has to study for an exam on Thursday."], "a": 2, "w": "Büyükanne ve büyükbabasını Salı günü ziyaret ediyor, Perşembe günü değil." }, { "t": "According to the comments below, who says something positive about his/her friend?", "c": "#FriendshipDay yorumları", "q": "", "o": ["Aylin", "Can", "Defne", "Kaan"], "a": 1, "w": "Can, Elif hakkında olumlu konuşuyor." }, { "t": "Which of the following words <u>CANNOT</u> you use in any of the sentences below?", "c": "Boşluk doldurma cümleleri", "q": "", "o": ["generous", "punctual", "loyal", "full"], "a": 3, "w": "Cümlelere punctual, loyal ve generous uyar; full uymaz." }, { "t": "According to the e-mail below, why did Burak write this e-mail? To - - - -.", "c": "Burak'ın Selin'e yazdığı e-posta", "q": "", "o": ["refuse an invitation politely", "invite Selin to a football match", "ask Selin about her plans", "accept an invitation to a party"], "a": 0, "w": "Burak daveti nazikçe reddediyor." }, { "t": "Which of the following completes the conversation below?", "c": "Defne ile sohbet", "q": "", "o": ["Would you like some lemonade?", "Why don't you join us?", "Are you busy on Saturday afternoon?", "Yes, I'd love to."], "a": 2, "w": "Defne “No, I'm free. Why?” diyor; bu bir “Are you busy…?” sorusunun cevabı." }, { "t": "Which of the following does <u>NOT</u> fill in any of the blanks in the conversation below?", "c": "Ece ve Can'ın mesajlaşması", "q": "", "o": ["Yes, I'd love some.", "No, thanks. I'm full.", "Yes, please.", "I'm afraid I can't."], "a": 1, "w": "Boşluk (1) için A/C, (2) için D uyar. B hiçbirine uymaz." }];

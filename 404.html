<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found - Teacher Murat</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        .nf-wrap{min-height:calc(100dvh - 64px);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
        .nf-box{background:#fff;border:4px solid #334155;border-radius:20px;box-shadow:0 6px 0 #94A3B8;max-width:520px;width:100%;padding:32px 24px;text-align:center}
        .nf-code{font-size:4.5rem;font-weight:800;color:#0F766E;line-height:1;margin:0 0 8px}
        .nf-title{font-size:1.5rem;font-weight:800;color:#1A1F23;margin:0 0 10px}
        .nf-text{font-size:1.125rem;font-weight:600;color:#3D4852;line-height:1.5;margin:0 0 22px}
        .nf-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
        .nf-btn{display:inline-block;text-decoration:none;font-family:inherit;font-weight:800;font-size:1.0625rem;color:#fff;background:#0F766E;border:3px solid #134E4A;box-shadow:0 4px 0 #134E4A;border-radius:12px;padding:9px 22px}
        .nf-btn:active{transform:translateY(2px);box-shadow:none}
        .nf-btn.alt{background:#fff;color:#134E4A}
    </style>
</head>
<body>
    <div id="navbar-placeholder" style="min-height: 64px;"></div>
    <script src="/navbar.js"></script>

    <main class="nf-wrap">

            <div class="nf-btns">
                <a class="nf-btn" href="/">Home</a>
                <a class="nf-btn alt" href="/5/grade5.html">Grade 5</a>
                <a class="nf-btn alt" href="/6/grade6.html">Grade 6</a>
                <a class="nf-btn alt" href="/7/grade7.html">Grade 7</a>

        </div>

</body>
</html>

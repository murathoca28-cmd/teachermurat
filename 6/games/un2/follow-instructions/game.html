<body>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Follow the <br>Instructions</h1>
  <p class="subtitle">Pick the right two pictures!</p>
  <div class="preview">⟦quiet_shh⟧ ⟦megaphone⟧ ⟦support⟧ ⟦tick⟧</div>

</div>

<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var ITEMS = {"silently": ["⟦quiet_shh⟧", "read silently", "sessizce okumak"], "aloud": ["⟦megaphone⟧", "read aloud", "yüksek sesle okumak"], "pairs": ["⟦support⟧", "work in pairs", "ikili çalışmak"], "groups": ["⟦they⟧", "work in groups", "grup halinde çalışmak"], "notes": ["⟦notebook⟧", "take notes", "not almak"], "check": ["⟦tick⟧", "check answers", "cevapları kontrol etmek"], "questions": ["⟦q_mark⟧", "answer questions", "soruları cevaplamak"], "research": ["⟦world_map_magnifier⟧", "do research", "araştırma yapmak"], "present": ["⟦microphone⟧", "give a presentation", "sunum yapmak"], "puzzle": ["⟦puzzle_piece⟧", "do a puzzle", "bulmaca çözmek"], "practise": ["⟦speech_bubble⟧", "practise words", "kelime çalışmak"], "share": ["⟦helpful⟧", "share ideas", "fikir paylaşmak"]};
  var ORDERS = [{"en": "Read the text silently and take notes.", "tr": "Metni sessizce oku ve not al.", "w": ["silently", "notes"]}, {"en": "Work in pairs and give a presentation.", "tr": "İkili çalış ve bir sunum yap.", "w": ["pairs", "present"]}, {"en": "Read the words aloud and practise them.", "tr": "Kelimeleri yüksek sesle oku ve çalış.", "w": ["aloud", "practise"]}, {"en": "Work in groups and do some research.", "tr": "Grup halinde çalış ve biraz araştırma yap.", "w": ["groups", "research"]}, {"en": "Answer the questions and check your answers.", "tr": "Soruları cevapla ve cevaplarını kontrol et.", "w": ["questions", "check"]}, {"en": "Do the puzzle in pairs, please.", "tr": "Lütfen bulmacayı ikili çalışarak çöz.", "w": ["puzzle", "pairs"]}, {"en": "Please give a presentation and share your ideas.", "tr": "Lütfen bir sunum yap ve fikirlerini paylaş.", "w": ["present", "share"]}, {"en": "Read the text aloud and answer the questions.", "tr": "Metni yüksek sesle oku ve soruları cevapla.", "w": ["aloud", "questions"]}];
  var oi, sel, stars, tried, lock;

  function toggleEN() {
    var off = document.body.classList.toggle('no-en');
    document.getElementById('enbtn').textContent = 'English Labels: ' + (off ? 'Off' : 'On');
  }
  function toggleTR() {
    var off = document.body.classList.toggle('no-tr');
    document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On');
  }

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    oi = 0; stars = 0; document.getElementById('stars').textContent = 0;
    var m = document.getElementById('menu'); m.innerHTML = '';
    shuffle(Object.keys(ITEMS)).forEach(function (k) {
      var it = ITEMS[k], b = document.createElement('button'); b.className = 'tile'; b.dataset.k = k;
      b.innerHTML = '<div class="e">' + it[0] + '</div><div class="p">' + it[1] + '</div><div class="t">' + it[2] + '</div>';
      b.addEventListener('click', function () { pick(k); });
      m.appendChild(b);
    });
    showOrder();
  }
  function showOrder() {
    var o = ORDERS[oi]; sel = []; tried = false; lock = false;
    document.getElementById('no').textContent = oi + 1;
    document.getElementById('who').textContent = '⟦speech_bubble⟧ The teacher says:';
    document.getElementById('order-en').textContent = '"' + o.en + '"';
    document.getElementById('order-tr').textContent = o.tr;
    document.getElementById('fb').textContent = '';
    draw();
  }
  function pick(k) {
    if (lock) return;
    var i = sel.indexOf(k);
    if (i >= 0) sel.splice(i, 1); else if (sel.length < 2) sel.push(k);
    draw();
  }
  function removeAt(i) { if (lock || !sel[i]) return; sel.splice(i, 1); draw(); }
  function draw() {
    var slots = document.querySelectorAll('.slot');
    for (var i = 0; i < 2; i++) {
      slots[i].innerHTML = sel[i] ? '<div class="e">' + ITEMS[sel[i]][0] + '</div><div class="w">' + ITEMS[sel[i]][1] + '</div>' : '?';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (t) { t.classList.toggle('sel', sel.indexOf(t.dataset.k) >= 0); });
    document.getElementById('serve').disabled = (sel.length !== 2);
  }
  function serve() {
    if (lock || sel.length !== 2) return;
    var w = ORDERS[oi].w, ok = sel.every(function (k) { return w.indexOf(k) >= 0; });
    var fb = document.getElementById('fb');
    if (ok) {
      lock = true;
      if (!tried) { stars++; document.getElementById('stars').textContent = stars; }
      fb.textContent = '🎉 Well done! You follow instructions!';
      setTimeout(function () { oi++; if (oi >= ORDERS.length) finish(); else showOrder(); }, 1500);
    } else {
      tried = true; fb.textContent = 'Oops! Read the instruction again.';
      var tr = document.getElementById('tray'); tr.classList.remove('shake'); void tr.offsetWidth; tr.classList.add('shake');
      sel = []; draw();
    }
  }
  function finish() {
    document.getElementById('win-title').textContent = stars >= 7 ? 'Super Listener!' : (stars >= 4 ? 'Well Done!' : 'Good Try!');
    document.getElementById('win-stats').textContent = 'Stars: ' + stars + ' / ' + ORDERS.length + ' (first try)';
    document.getElementById('win-screen').style.display = 'flex';
  }
</script>

    else key=EM[s.replace(/️/g,'').replace(/‍[\s\S]*$/,'')];
    var n=key&&mk(key); if(n)out.push(n);
  }
  out.push(v.slice(last));
  if(inSvg){t.nodeValue=out.join('').replace(/\s{2,}/g,' ').trim();return;}
  var f=document.createDocumentFragment();
  out.forEach(function(x){f.appendChild(typeof x==='string'?document.createTextNode(x):x);});
  p.replaceChild(f,t);
}
function fillImgs(root){
  var l=root.querySelectorAll?root.querySelectorAll('img[data-i]'):[];
  for(var i=0;i<l.length;i++){var e=l[i];if(!e.getAttribute('src')&&IM[e.getAttribute('data-i')])e.src=IM[e.getAttribute('data-i')];}
  if(root.tagName==='IMG'&&root.getAttribute('data-i')&&!root.getAttribute('src'))root.src=IM[root.getAttribute('data-i')];
}
function walk(n){
  if(n.nodeType===3){fixText(n);return;}
  if(n.nodeType!==1||SKIP[n.nodeName])return;
  fillImgs(n);
  var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),a=[],x;
  while((x=w.nextNode()))a.push(x);
  a.forEach(function(t){if(t.parentNode&&!SKIP[t.parentNode.nodeName])fixText(t);});
}
function start(){
  walk(document.body);
  new MutationObserver(function(ms){
    for(var i=0;i<ms.length;i++){var m=ms[i];
      if(m.type==='characterData')walk(m.target);
      else for(var j=0;j<m.addedNodes.length;j++)walk(m.addedNodes[j]);}
  }).observe(document.body,{childList:true,subtree:true,characterData:true});
}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
</script>

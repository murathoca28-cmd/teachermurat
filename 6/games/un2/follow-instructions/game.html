<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow the Instructions</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }

  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 8px 12px 12px; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #left { flex: 0 0 38%; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  @media (orientation: portrait) { #left { flex: 0 0 44%; } }
  #bubble { flex: 1 1 auto; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 22px; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  #who { font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.7rem); color: #0B5C56; }
  #order-en { font-weight: 900; font-size: clamp(1.2rem, 3vw, 2.4rem); line-height: 1.2; }
  #order-tr { font-weight: 800; font-size: clamp(.9rem, 1.9vw, 1.4rem); color: #0B5C56; }
  #tray { flex: 0 0 auto; display: flex; gap: 10px; background: #FFD23F; border: 5px solid #0B2F2C; border-radius: 18px; padding: 8px; }
  .slot { flex: 1; min-height: clamp(70px, 14vh, 130px); background: #fff; border: 4px dashed #0B2F2C; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: clamp(.8rem, 1.7vw, 1.2rem); text-align: center; padding: 2px; cursor: pointer; }
  .slot .e { font-size: clamp(1.6rem, 5vh, 3rem); line-height: 1.1; }
  #serve { font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 900; padding: .25em 1em; border: 5px solid #0B2F2C; border-radius: 16px; background: #1F5FBF; color: #fff; box-shadow: 0 5px 0 #0B2F2C; }
  #serve:disabled { background: #B8C2C1; color: #5B6B69; cursor: not-allowed; }
  #fb { min-height: 1.3em; text-align: center; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  #menu { flex: 1; min-width: 0; min-height: 0; display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); }
  @media (orientation: portrait) { #menu { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); } }
  .tile { container-type: size; min-width: 0; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B2F2C; }
  .tile .e { font-size: 40cqmin; line-height: 1.05; }
  .tile .p { font-weight: 900; font-size: 11cqmin; line-height: 1.1; padding: 0 4px; }
  .tile .t { font-weight: 800; font-size: 8.5cqmin; color: #0B5C56; }
  .tile.sel { background: #FFF3B0; border-color: #D62828; border-width: 7px; }
  body.no-tr .tile .t, body.no-tr #order-tr { display: none; }
  body.no-en .tile .p, body.no-en .slot .w { display: none; }
  body.no-en .tile .e { font-size: 44cqmin; line-height: 1.25; }
  .tile .e svg { width: 50cqmin; height: 50cqmin; display: block; }
  body.no-en .tile .e svg { width: 52cqmin; height: 52cqmin; }
  .slot .e svg { width: clamp(2rem, 8vh, 4.4rem); height: clamp(2rem, 8vh, 4.4rem); display: block; }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
<style id="phone-fix">
@media (max-width:700px) and (max-aspect-ratio:1/1) {
  #topbar { gap: 4px; padding: 4px 56px 2px 6px; }
  .stat, .restart-btn { font-size: .8rem; padding: 0 8px; border-width: 3px; border-radius: 10px; }
  #main { gap: 6px; padding: 4px 8px 8px; }
  #left { flex: 0 0 40%; gap: 6px; }
  #bubble { padding: 6px 10px; gap: 2px; border-width: 4px; border-radius: 14px; }
  #who { font-size: .85rem; } #order-en { font-size: clamp(1rem, 4.6vw, 1.3rem); line-height: 1.15; } #order-tr { font-size: .78rem; }
  #tray { padding: 4px; gap: 6px; border-width: 4px; border-radius: 12px; } .slot { min-height: 48px; border-width: 3px; font-size: .75rem; } .slot .e { font-size: 1.4rem; }
  #serve { font-size: 1rem; padding: .1em .8em; border-width: 4px; box-shadow: 0 3px 0 #0B2F2C; } #fb { font-size: .85rem; min-height: 1.1em; }
  .tile { border-width: 4px; border-radius: 12px; }
  .tile .e { font-size: 30cqmin; line-height: 1.05; } .tile .e svg { width: 30cqmin; height: 30cqmin; }
  .tile .p { font-size: max(11cqmin, 11px); line-height: 1.05; } .tile .t { font-size: max(8.5cqmin, 9.5px); line-height: 1.05; }
}
@media (max-height: 480px) {
  #main { gap: 6px; padding: 4px 8px 6px; }
  #bubble { padding: 4px 10px; gap: 2px; border-width: 4px; border-radius: 14px; }
  #who { font-size: .8rem; } #order-en { font-size: 1.05rem; line-height: 1.12; } #order-tr { font-size: .75rem; }
  #left { gap: 4px; } #tray { padding: 4px; gap: 6px; border-width: 4px; border-radius: 12px; } .slot { min-height: 40px; border-width: 3px; font-size: .7rem; } .slot .e { font-size: 1.2rem; }
  #serve { font-size: 1rem; padding: .05em .8em; border-width: 4px; box-shadow: 0 3px 0 #0B2F2C; } #fb { font-size: .8rem; min-height: 1em; line-height: 1.1; }
  #menu { gap: 5px; } .tile { border-width: 3px; border-radius: 10px; }
}
</style>
<style id="phone-short">
@media (max-height: 480px) {
  #start-screen, #win-screen { gap: 1.2vh; padding: 6px 10px; }
  .title { font-size: 2rem; } .title br { display: none; } .subtitle { font-size: 1rem; } .preview { font-size: 1.6rem; }
  .big-btn { font-size: 1.25rem; padding: .12em 1em; border-width: 4px; box-shadow: 0 3px 0 #0B2F2C; }
  .win-title { font-size: 2rem; } .win-stats { font-size: 1.05rem; }
  .og, .ob { font-size: 1rem; } .ob { border-width: 3px; padding: 0 .6em; }
  #topbar { padding-top: 4px; padding-bottom: 2px; gap: 8px; }
  .stat, .restart-btn { font-size: .95rem; border-width: 3px; padding: 0 12px; }
}
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Follow the <br>Instructions</h1>
  <p class="subtitle">Pick the right two pictures!</p>
  <div class="preview">🤫 📢 👫 ✅</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Instruction: <span id="no">1</span>/8</div>
  <div class="stat">Stars: <span id="stars">0</span> ⭐</div>
  <button class="restart-btn" id="enbtn" onclick="toggleEN()">English Labels: On</button>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="left">
    <div id="bubble"><div id="who"></div><div id="order-en"></div><div id="order-tr"></div></div>
    <div id="tray"><div class="slot" onclick="removeAt(0)"></div><div class="slot" onclick="removeAt(1)"></div></div>
    <button id="serve" onclick="serve()" disabled>Check</button>
    <div id="fb"></div>
  </div>
  <div id="menu"></div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var ITEMS = {"silently": ["🤫", "read silently", "sessizce okumak"], "aloud": ["📢", "read aloud", "yüksek sesle okumak"], "pairs": ["👫", "work in pairs", "ikili çalışmak"], "groups": ["👥", "work in groups", "grup halinde çalışmak"], "notes": ["🗒️", "take notes", "not almak"], "check": ["✅", "check answers", "cevapları kontrol etmek"], "questions": ["❓", "answer questions", "soruları cevaplamak"], "research": ["🔎", "do research", "araştırma yapmak"], "present": ["🎤", "give a presentation", "sunum yapmak"], "puzzle": ["🧩", "do a puzzle", "bulmaca çözmek"], "practise": ["🔁", "practise words", "kelime çalışmak"], "share": ["🤝", "share ideas", "fikir paylaşmak"]};
  var ORDERS = [{"en": "Read the text silently and take notes.", "tr": "Metni sessizce oku ve not al.", "w": ["silently", "notes"]}, {"en": "Work in pairs and check your answers together.", "tr": "İkili çalış ve cevaplarını birlikte kontrol et.", "w": ["pairs", "check"]}, {"en": "Read the words aloud and practise them.", "tr": "Kelimeleri yüksek sesle oku ve çalış.", "w": ["aloud", "practise"]}, {"en": "Work in groups and do some research.", "tr": "Grup halinde çalış ve biraz araştırma yap.", "w": ["groups", "research"]}, {"en": "Answer the questions and check your answers.", "tr": "Soruları cevapla ve cevaplarını kontrol et.", "w": ["questions", "check"]}, {"en": "Do the puzzle in pairs, please.", "tr": "Lütfen bulmacayı ikili çalışarak çöz.", "w": ["puzzle", "pairs"]}, {"en": "Please give a presentation and share your ideas.", "tr": "Lütfen bir sunum yap ve fikirlerini paylaş.", "w": ["present", "share"]}, {"en": "Read the text aloud and answer the questions.", "tr": "Metni yüksek sesle oku ve soruları cevapla.", "w": ["aloud", "questions"]}];
  var oi, sel, stars, tried, lock;

  function toggleEN() {
    var off = document.body.classList.toggle('no-en');
    document.getElementById('enbtn').textContent = 'English Labels: ' + (off ? 'Off' : 'On');
  }
  function toggleTR() {
    var off = document.body.classList.toggle('no-tr');
    document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On');
  }

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    oi = 0; stars = 0; document.getElementById('stars').textContent = 0;
    var m = document.getElementById('menu'); m.innerHTML = '';
    shuffle(Object.keys(ITEMS)).forEach(function (k) {
      var it = ITEMS[k], b = document.createElement('button'); b.className = 'tile'; b.dataset.k = k;
      b.innerHTML = '<div class="e">' + it[0] + '</div><div class="p">' + it[1] + '</div><div class="t">' + it[2] + '</div>';
      b.addEventListener('click', function () { pick(k); });
      m.appendChild(b);
    });
    showOrder();
  }
  function showOrder() {
    var o = ORDERS[oi]; sel = []; tried = false; lock = false;
    document.getElementById('no').textContent = oi + 1;
    document.getElementById('who').textContent = '🗣️ The teacher says:';
    document.getElementById('order-en').textContent = '"' + o.en + '"';
    document.getElementById('order-tr').textContent = o.tr;
    document.getElementById('fb').textContent = '';
    draw();
  }
  function pick(k) {
    if (lock) return;
    var i = sel.indexOf(k);
    if (i >= 0) sel.splice(i, 1); else if (sel.length < 2) sel.push(k);
    draw();
  }
  function removeAt(i) { if (lock || !sel[i]) return; sel.splice(i, 1); draw(); }
  function draw() {
    var slots = document.querySelectorAll('.slot');
    for (var i = 0; i < 2; i++) {
      slots[i].innerHTML = sel[i] ? '<div class="e">' + ITEMS[sel[i]][0] + '</div><div class="w">' + ITEMS[sel[i]][1] + '</div>' : '?';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (t) { t.classList.toggle('sel', sel.indexOf(t.dataset.k) >= 0); });
    document.getElementById('serve').disabled = (sel.length !== 2);
  }
  function serve() {
    if (lock || sel.length !== 2) return;
    var w = ORDERS[oi].w, ok = sel.every(function (k) { return w.indexOf(k) >= 0; });
    var fb = document.getElementById('fb');
    if (ok) {
      lock = true;
      if (!tried) { stars++; document.getElementById('stars').textContent = stars; }
      fb.textContent = '🎉 Well done! You follow instructions!';
      setTimeout(function () { oi++; if (oi >= ORDERS.length) finish(); else showOrder(); }, 1500);
    } else {
      tried = true; fb.textContent = 'Oops! Read the instruction again.';
      var tr = document.getElementById('tray'); tr.classList.remove('shake'); void tr.offsetWidth; tr.classList.add('shake');
      sel = []; draw();
    }
  }
  function finish() {
    document.getElementById('win-title').textContent = stars >= 7 ? 'Super Listener!' : (stars >= 4 ? 'Well Done!' : 'Good Try!');
    document.getElementById('win-stats').textContent = 'Stars: ' + stars + ' / ' + ORDERS.length + ' (first try)';
    document.getElementById('win-screen').style.display = 'flex';
  }
</script>
<div id="ln-screen">
  <div id="ln-top"><div id="ln-title">📖 Learn</div><div id="ln-tabs"></div><button id="ln-close" onclick="lnClose()">Close ✕</button></div>
  <div id="ln-grid"></div>
</div>
<script>
(function () {
  var LN = [["Classroom Instructions", "Sınıf Talimatları", [["🤫", "Read the text silently.", "Metni sessizce oku."], ["📢", "Read the text aloud.", "Metni yüksek sesle oku."], ["👫", "Work in pairs.", "İkili çalış."], ["👥", "Work in groups.", "Grup halinde çalış."], ["🗒️", "Take notes.", "Not al."], ["✅", "Check your answers together.", "Cevaplarını birlikte kontrol et."], ["❓", "Answer the questions.", "Soruları cevapla."], ["🔎", "Do some research.", "Biraz araştırma yap."], ["🎤", "Give a presentation.", "Bir sunum yap."], ["🧩", "Do the puzzle.", "Bulmacayı çöz."], ["🔁", "Practise the words.", "Kelimeleri çalış."], ["🤝", "Share your ideas.", "Fikirlerini paylaş."], ["👍", "Please continue.", "Lütfen devam edin."], ["🔊", "Speak carefully.", "Dikkatle konuş."]]], ["Study and Learning", "Çalışma ve Öğrenme", [["📝", "revise lessons", "dersleri tekrar etmek"], ["🔍", "review words", "kelimeleri gözden geçirmek"], ["💭", "remember", "hatırlamak"], ["🔁", "practise English", "İngilizce pratik yapmak"], ["👫", "work in pairs", "ikili çalışmak"], ["👥", "work in groups", "grup halinde çalışmak"], ["🤫", "read silently", "sessizce okumak"], ["📢", "read aloud", "yüksek sesle okumak"], ["🤝", "together", "birlikte"], ["🔎", "do research", "araştırma yapmak"], ["📊", "focus on a project", "bir projeye odaklanmak"], ["📋", "share a task", "görev paylaşmak"], ["🧩", "learning method", "öğrenme yöntemi"], ["✅", "effective", "etkili"], ["🔄", "habit", "alışkanlık"], ["💯", "full marks", "tam puan"]]]];
  function lnShow(i) {
    Array.prototype.forEach.call(document.querySelectorAll('.ln-tab'), function (b, k) { b.classList.toggle('act', k === i); });
    document.getElementById('ln-grid').innerHTML = LN[i][2].map(function (it) {
      var wide = it[1].length > 26 && it[0].indexOf('<svg') < 0;
      return '<div class="ln-card' + (wide ? ' wide' : '') + '"><div class="le">' + it[0] + '</div><div class="en">' + it[1] + '</div><div class="trl">' + it[2] + '</div></div>';
    }).join('');
    document.getElementById('ln-grid').scrollTop = 0;
  }
  window.lnOpen = function () {
    var tabs = document.getElementById('ln-tabs'); tabs.innerHTML = '';
    LN.forEach(function (s, i) { var b = document.createElement('button'); b.className = 'ln-tab'; b.textContent = s[0]; b.onclick = function () { lnShow(i); }; tabs.appendChild(b); });
    document.getElementById('ln-screen').style.display = 'flex'; lnShow(0);
  };
  window.lnClose = function () { document.getElementById('ln-screen').style.display = 'none'; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.lnClose(); });
})();
</script>
</body>
</html>

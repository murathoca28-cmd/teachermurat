<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Am I?</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 4px 12px 12px; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #left { flex: 1.1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #card { flex: 1; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 20px; padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  #qmark { text-align: center; font-weight: 900; font-size: clamp(2rem, 8vh, 4.5rem); line-height: 1; color: #D62828; }
  .cl { border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 12px; background: #FFF3B0; }
  .cl .en { font-weight: 900; font-size: clamp(1.1rem, 2.8vw, 2.1rem); line-height: 1.2; }
  .cl .trl { font-weight: 800; font-size: clamp(.8rem, 1.6vw, 1.2rem); color: #0B5C56; }
  #ctl { flex: 0 0 auto; display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  #nc { font-size: clamp(1rem, 2.4vw, 1.7rem); }
  #nc:disabled { opacity: .45; cursor: default; }
  #fb { font-weight: 900; font-size: clamp(1rem, 2.2vw, 1.6rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; text-align: center; min-height: 1.3em; }
  #right { flex: 1 1 0; min-width: 0; min-height: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .tile { container-type: size; min-width: 0; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B2F2C; }
  .tile .e { font-size: 40cqmin; line-height: 1.1; }
  .tile .p { font-weight: 900; font-size: 13cqmin; line-height: 1.1; }
  .tile .t { font-weight: 800; font-size: 9.5cqmin; color: #0B5C56; }
  .tile.bad { background: #FFD6D6; border-color: #D62828; }
  .tile.good { background: #C8F7D4; border-color: #0A7A2F; border-width: 8px; }
  #nxt { display: none; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }
</style>
<style id="phone-fix">
@media (max-width:700px) and (max-aspect-ratio:1/1) { .tile .p { font-size: max(13cqmin, 9.5px); } .tile .t { font-size: max(9.5cqmin, 9px); } }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Who Am I?</h1>
  <p class="subtitle">Read the clues. Guess who or what I am!</p>
  <div class="preview">❓ 📚 🔬 💯</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Round: <span id="rn">1</span>/10</div>
  <div class="stat">Points: <span id="sc">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="left">
    <div id="card"><div id="qmark">?</div><div id="cls"></div></div>
    <div id="ctl"><button class="restart-btn" id="nc" onclick="moreClue()">Next clue</button><button class="big-btn" id="nxt" onclick="nextR()">Next</button></div>
    <div id="fb"></div>
  </div>
  <div id="right"></div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var R = [{"k": "library", "en": ["I am a quiet place in a school or a town.", "You can find many shelves in me.", "You read and study here.", "You borrow books from me."], "tr": ["Bir okulda ya da kasabada bulunan sessiz bir yerim.", "Bende birçok raf bulabilirsin.", "Burada okur ve çalışırsın.", "Benden kitap ödünç alırsın."], "opts": [["library", "📚", "library", "kütüphane"], ["museum", "🏛️", "museum", "müze"], ["lab", "🔬", "laboratory", "laboratuvar"], ["workshop", "🛠️", "workshop", "atölye"]]}, {"k": "museum", "en": ["I am a big building.", "I am full of old and interesting things.", "People visit me to learn about history.", "You can see old tools and statues in me."], "tr": ["Büyük bir binayım.", "Eski ve ilginç şeylerle doluyum.", "İnsanlar tarih öğrenmek için beni ziyaret eder.", "Bende eski aletler ve heykeller görebilirsin."], "opts": [["museum", "🏛️", "museum", "müze"], ["library", "📚", "library", "kütüphane"], ["planetarium", "🌌", "planetarium", "gökevi"], ["workshop", "🛠️", "workshop", "atölye"]]}, {"k": "lab", "en": ["I am a room at school.", "You must be careful in me.", "You wear special glasses in me.", "You do science experiments in me."], "tr": ["Okulda bir odayım.", "Bende dikkatli olmalısın.", "Bende özel gözlük takarsın.", "Bende bilim deneyleri yaparsın."], "opts": [["lab", "🔬", "laboratory", "laboratuvar"], ["library", "📚", "library", "kütüphane"], ["workshop", "🛠️", "workshop", "atölye"], ["planetarium", "🌌", "planetarium", "gökevi"]]}, {"k": "planetarium", "en": ["I have a big round ceiling.", "It is dark inside me.", "You can watch space shows in me.", "You see stars and planets in me."], "tr": ["Büyük yuvarlak bir tavanım var.", "İçim karanlıktır.", "Bende uzay gösterileri izleyebilirsin.", "Bende yıldızları ve gezegenleri görürsün."], "opts": [["planetarium", "🌌", "planetarium", "gökevi"], ["museum", "🏛️", "museum", "müze"], ["library", "📚", "library", "kütüphane"], ["workshop", "🛠️", "workshop", "atölye"]]}, {"k": "workshop", "en": ["I am a room with many tools.", "People make or repair things in me.", "You can use a hammer in me.", "Students make models in me."], "tr": ["Birçok aleti olan bir odayım.", "İnsanlar bende bir şeyler yapar ya da onarır.", "Bende çekiç kullanabilirsin.", "Öğrenciler bende maketler yapar."], "opts": [["workshop", "🛠️", "workshop", "atölye"], ["lab", "🔬", "laboratory", "laboratuvar"], ["library", "📚", "library", "kütüphane"], ["museum", "🏛️", "museum", "müze"]]}, {"k": "diary", "en": ["I am a small book.", "I sometimes have a lock.", "You write about your day in me.", "Your secrets are in me."], "tr": ["Küçük bir kitabım.", "Bazen bir kilidim olur.", "Bende gününle ilgili yazarsın.", "Sırların bende."], "opts": [["diary", "📔", "diary", "günlük"], ["notebook", "📓", "notebook", "defter"], ["dictionary", "📖", "dictionary", "sözlük"], ["calendar", "📅", "calendar", "takvim"]]}, {"k": "homework", "en": ["Students often do not like me.", "I am a kind of work.", "You do me at home.", "Your teacher gives me after the lesson."], "tr": ["Öğrenciler çoğunlukla beni sevmez.", "Bir tür çalışmayım.", "Beni evde yaparsın.", "Öğretmenin beni dersten sonra verir."], "opts": [["homework", "📒", "homework", "ödev"], ["notebook", "📓", "notebook", "defter"], ["dictionary", "📖", "dictionary", "sözlük"], ["calendar", "📅", "calendar", "takvim"]]}, {"k": "breakfast", "en": ["I am a meal.", "I come first in the day.", "You often have me with bread, cheese and tea.", "You eat me in the morning."], "tr": ["Bir öğünüm.", "Günün ilk öğünüyüm.", "Beni çoğunlukla ekmek, peynir ve çayla yersin.", "Beni sabahleyin yersin."], "opts": [["breakfast", "🍳", "breakfast", "kahvaltı"], ["lunch", "🥪", "lunch", "öğle yemeği"], ["dinner", "🍽️", "dinner", "akşam yemeği"], ["snack", "🍎", "snack", "ara öğün"]]}, {"k": "hundred", "en": ["I am a number.", "I am bigger than ninety-nine.", "I am smaller than two hundred.", "I have a one and two zeros."], "tr": ["Bir sayıyım.", "Doksan dokuzdan büyüğüm.", "İki yüzden küçüğüm.", "Bir tane 1 ve iki tane 0 ile yazılırım."], "opts": [["hundred", "💯", "one hundred", "yüz"], ["ten", "🔟", "ten", "on"], ["fifty", "🔢", "fifty", "elli"], ["three", "3️⃣", "three hundred", "üç yüz"]]}, {"k": "first", "en": ["I am an ordinal number.", "I am not a cardinal number.", "I come before “second”.", "I am number 1 in a race."], "tr": ["Bir sıra sayısıyım.", "Ana sayı değilim.", "“Second”dan önce gelirim.", "Bir yarışta 1 numarayım."], "opts": [["first", "🥇", "first", "birinci"], ["second", "🥈", "second", "ikinci"], ["third", "🥉", "third", "üçüncü"], ["twelfth", "🏅", "twelfth", "on ikinci"]]}, {"k": "always", "en": ["I am an adverb of frequency.", "I come before the main verb.", "I mean one hundred percent.", "I mean every time."], "tr": ["Bir sıklık zarfıyım.", "Ana fiilden önce gelirim.", "Yüzde yüz anlamına gelirim.", "Her zaman anlamına gelirim."], "opts": [["always", "♾️", "always", "her zaman"], ["never", "🚫", "never", "asla"], ["sometimes", "🌦️", "sometimes", "bazen"], ["usually", "📆", "usually", "genellikle"]]}, {"k": "never", "en": ["I am an adverb of frequency.", "I am the opposite of “always”.", "I mean zero percent.", "I mean not at any time."], "tr": ["Bir sıklık zarfıyım.", "“Always”in tersiyim.", "Yüzde sıfır anlamına gelirim.", "Hiçbir zaman anlamına gelirim."], "opts": [["never", "🚫", "never", "asla"], ["always", "♾️", "always", "her zaman"], ["often", "🔂", "often", "sık sık"], ["usually", "📆", "usually", "genellikle"]]}, {"k": "silently", "en": ["I tell you how to read.", "I am an adverb.", "You use me in a quiet library.", "I mean without any sound."], "tr": ["Nasıl okuyacağını söylerim.", "Bir zarfım.", "Beni sessiz bir kütüphanede kullanırsın.", "Hiç ses çıkarmadan anlamına gelirim."], "opts": [["silently", "🤫", "silently", "sessizce"], ["aloud", "📢", "aloud", "yüksek sesle"], ["together", "🤝", "together", "birlikte"], ["quickly", "💨", "quickly", "hızlıca"]]}, {"k": "presentation", "en": ["I am a talk.", "You stand in front of the class.", "You show slides or pictures in me.", "You talk about your project in me."], "tr": ["Bir konuşmayım.", "Sınıfın önünde durursun.", "Bende slayt ya da resim gösterirsin.", "Bende projenle ilgili konuşursun."], "opts": [["presentation", "🎤", "presentation", "sunum"], ["project", "📊", "project", "proje"], ["homework", "📒", "homework", "ödev"], ["research", "🔎", "research", "araştırma"]]}, {"k": "research", "en": ["I am a kind of study.", "You can do me on the Internet.", "You look for information in me.", "You do me before you write a project."], "tr": ["Bir çalışma türüyüm.", "Beni internette yapabilirsin.", "Bende bilgi ararsın.", "Beni bir proje yazmadan önce yaparsın."], "opts": [["research", "🔎", "research", "araştırma"], ["revise", "📝", "revise", "tekrar etmek"], ["practise", "🔁", "practise", "pratik yapmak"], ["remember", "💭", "remember", "hatırlamak"]]}], ROUNDS = 10;
  var order, qi, shown, wrong, score, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(R.slice()).slice(0, ROUNDS); qi = 0; score = 0;
    document.getElementById('sc').textContent = 0;
    showR();
  }
  function addClue() {
    var q = order[qi], i = shown;
    var d = document.createElement('div'); d.className = 'cl';
    d.innerHTML = '<div class="en">' + (i + 1) + '. ' + q.en[i] + '</div><div class="trl tr">' + q.tr[i] + '</div>';
    document.getElementById('cls').appendChild(d);
    shown++;
    document.getElementById('nc').disabled = (shown >= q.en.length);
    if (d.scrollIntoView) d.scrollIntoView({ block: 'nearest' });
  }
  function showR() {
    var q = order[qi]; shown = 0; wrong = 0; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('cls').innerHTML = ''; document.getElementById('qmark').textContent = '?';
    document.getElementById('fb').textContent = ''; document.getElementById('nxt').style.display = 'none';
    document.getElementById('nc').style.display = ''; document.getElementById('nc').disabled = false;
    addClue();
    var box = document.getElementById('right'); box.innerHTML = '';
    shuffle(q.opts.slice()).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = '<div class="e">' + o[1] + '</div><div class="p">' + o[2] + '</div><div class="t tr">' + o[3] + '</div>';
      b.addEventListener('click', function () { guess(b, o[0]); });
      box.appendChild(b);
    });
  }
  function moreClue() { if (locked) return; if (shown < order[qi].en.length) addClue(); }
  function guess(btn, k) {
    if (locked || btn.classList.contains('bad')) return;
    var q = order[qi];
    if (k === q.k) {
      locked = true;
      var pts = Math.max(0, (q.en.length - shown + 1) - wrong); score += pts;
      document.getElementById('sc').textContent = score;
      btn.classList.add('good');
      var o = q.opts[0]; document.getElementById('qmark').textContent = o[1];
      document.getElementById('fb').textContent = '✔ I am ' + (/^[aeiou]/.test(o[2]) ? 'an ' : 'a ') + o[2] + '!  +' + pts + (pts === 1 ? ' point' : ' points');
      document.getElementById('nc').style.display = 'none';
      var nx = document.getElementById('nxt'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      wrong++; btn.classList.add('bad', 'shake');
      document.getElementById('fb').textContent = 'Not this one. Try again!';
    }
  }
  function nextR() {
    qi++;
    if (qi >= order.length) {
      var max = ROUNDS * 4;
      document.getElementById('win-title').textContent = score >= 32 ? 'Super Detective!' : (score >= 22 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Points: ' + score + ' / ' + max;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showR();
  }
</script>

</div>
<script>

    var tabs = document.getElementById('ln-tabs'); tabs.innerHTML = '';

<style>

  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 4px 12px 12px; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #left { flex: 1.1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

  #fb { font-weight: 900; font-size: clamp(1rem, 2.2vw, 1.6rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; text-align: center; min-height: 1.3em; }
  #right { flex: 1 1 0; min-width: 0; min-height: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }

  .tile.good { background: #C8F7D4; border-color: #0A7A2F; border-width: 8px; }

</style>

<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var R = [{"k": "library", "en": ["I am a quiet place in a school or a town.", "You can find many shelves in me.", "You read and study here.", "You borrow books from me."], "tr": ["Bir okulda ya da kasabada bulunan sessiz bir yerim.", "Bende birçok raf bulabilirsin.", "Burada okur ve çalışırsın.", "Benden kitap ödünç alırsın."], "opts": [["library", "⟦library⟧", "library", "kütüphane"], ["museum", "⟦museum⟧", "museum", "müze"], ["lab", "⟦science_lab⟧", "laboratory", "laboratuvar"], ["workshop", "⟦workshop_tools⟧", "workshop", "atölye"]]}, {"k": "museum", "en": ["I am a big building.", "I am full of old and interesting things.", "People visit me to learn about history.", "You can see old tools and statues in me."], "tr": ["Büyük bir binayım.", "Eski ve ilginç şeylerle doluyum.", "İnsanlar tarih öğrenmek için beni ziyaret eder.", "Bende eski aletler ve heykeller görebilirsin."], "opts": [["museum", "⟦museum⟧", "museum", "müze"], ["library", "⟦library⟧", "library", "kütüphane"], ["planetarium", "⟦planetarium_stars⟧", "planetarium", "gökevi"], ["workshop", "⟦workshop_tools⟧", "workshop", "atölye"]]}, {"k": "lab", "en": ["I am a room at school.", "You must be careful in me.", "You wear special glasses in me.", "You do science experiments in me."], "tr": ["Okulda bir odayım.", "Bende dikkatli olmalısın.", "Bende özel gözlük takarsın.", "Bende bilim deneyleri yaparsın."], "opts": [["lab", "⟦science_lab⟧", "laboratory", "laboratuvar"], ["library", "⟦library⟧", "library", "kütüphane"], ["workshop", "⟦workshop_tools⟧", "workshop", "atölye"], ["planetarium", "⟦planetarium_stars⟧", "planetarium", "gökevi"]]}, {"k": "planetarium", "en": ["I have a big round ceiling.", "It is dark inside me.", "You can watch space shows in me.", "You see stars and planets in me."], "tr": ["Büyük yuvarlak bir tavanım var.", "İçim karanlıktır.", "Bende uzay gösterileri izleyebilirsin.", "Bende yıldızları ve gezegenleri görürsün."], "opts": [["planetarium", "⟦planetarium_stars⟧", "planetarium", "gökevi"], ["museum", "⟦museum⟧", "museum", "müze"], ["library", "⟦library⟧", "library", "kütüphane"], ["workshop", "⟦workshop_tools⟧", "workshop", "atölye"]]}, {"k": "workshop", "en": ["I am a room with many tools.", "People make or repair things in me.", "You can use a hammer in me.", "Students make models in me."], "tr": ["Birçok aleti olan bir odayım.", "İnsanlar bende bir şeyler yapar ya da onarır.", "Bende çekiç kullanabilirsin.", "Öğrenciler bende maketler yapar."], "opts": [["workshop", "⟦workshop_tools⟧", "workshop", "atölye"], ["lab", "⟦science_lab⟧", "laboratory", "laboratuvar"], ["library", "⟦library⟧", "library", "kütüphane"], ["museum", "⟦museum⟧", "museum", "müze"]]}, {"k": "diary", "en": ["I am a small book.", "I sometimes have a lock.", "You write about your day in me.", "Your secrets are in me."], "tr": ["Küçük bir kitabım.", "Bazen bir kilidim olur.", "Bende gününle ilgili yazarsın.", "Sırların bende."], "opts": [["diary", "⟦diary⟧", "diary", "günlük"], ["notebook", "⟦notebook⟧", "notebook", "defter"], ["dictionary", "⟦school_dictionary⟧", "dictionary", "sözlük"], ["calendar", "⟦calendar⟧", "calendar", "takvim"]]}, {"k": "homework", "en": ["Students often do not like me.", "I am a kind of work.", "You do me at home.", "Your teacher gives me after the lesson."], "tr": ["Öğrenciler çoğunlukla beni sevmez.", "Bir tür çalışmayım.", "Beni evde yaparsın.", "Öğretmenin beni dersten sonra verir."], "opts": [["homework", "⟦homework_desk_girl⟧", "homework", "ödev"], ["notebook", "⟦notebook⟧", "notebook", "defter"], ["dictionary", "⟦school_dictionary⟧", "dictionary", "sözlük"], ["calendar", "⟦calendar⟧", "calendar", "takvim"]]}, {"k": "breakfast", "en": ["I am a meal.", "I come first in the day.", "You often have me with bread, cheese and tea.", "You eat me in the morning."], "tr": ["Bir öğünüm.", "Günün ilk öğünüyüm.", "Beni çoğunlukla ekmek, peynir ve çayla yersin.", "Beni sabahleyin yersin."], "opts": [["breakfast", "⟦breakfast⟧", "breakfast", "kahvaltı"], ["lunch", "⟦sandwich⟧", "lunch", "öğle yemeği"], ["dinner", "⟦plate_cutlery⟧", "dinner", "akşam yemeği"], ["snack", "⟦apple⟧", "snack", "ara öğün"]]}, {"k": "hundred", "en": ["I am a number.", "I am bigger than ninety-nine.", "I am smaller than two hundred.", "I have a one and two zeros."], "tr": ["Bir sayıyım.", "Doksan dokuzdan büyüğüm.", "İki yüzden küçüğüm.", "Bir tane 1 ve iki tane 0 ile yazılırım."], "opts": [["hundred", "⟦n100⟧", "one hundred", "yüz"], ["ten", "⟦n10⟧", "ten", "on"], ["fifty", "⟦n50⟧", "fifty", "elli"], ["three", "⟦n300⟧", "three hundred", "üç yüz"]]}, {"k": "first", "en": ["I am an ordinal number.", "I am not a cardinal number.", "I come before “second”.", "I am number 1 in a race."], "tr": ["Bir sıra sayısıyım.", "Ana sayı değilim.", "“Second”dan önce gelirim.", "Bir yarışta 1 numarayım."], "opts": [["first", "⟦o1⟧", "first", "birinci"], ["second", "⟦o2⟧", "second", "ikinci"], ["third", "⟦o3⟧", "third", "üçüncü"], ["twelfth", "⟦o12⟧", "twelfth", "on ikinci"]]}, {"k": "always", "en": ["I am an adverb of frequency.", "I come before the main verb.", "I mean one hundred percent.", "I mean every time."], "tr": ["Bir sıklık zarfıyım.", "Ana fiilden önce gelirim.", "Yüzde yüz anlamına gelirim.", "Her zaman anlamına gelirim."], "opts": [["always", "⟦f7⟧", "always", "her zaman"], ["never", "⟦f0⟧", "never", "asla"], ["sometimes", "⟦f2⟧", "sometimes", "bazen"], ["usually", "⟦f5⟧", "usually", "genellikle"]]}, {"k": "never", "en": ["I am an adverb of frequency.", "I am the opposite of “always”.", "I mean zero percent.", "I mean not at any time."], "tr": ["Bir sıklık zarfıyım.", "“Always”in tersiyim.", "Yüzde sıfır anlamına gelirim.", "Hiçbir zaman anlamına gelirim."], "opts": [["never", "⟦f0⟧", "never", "asla"], ["always", "⟦f7⟧", "always", "her zaman"], ["often", "⟦f4⟧", "often", "sık sık"], ["usually", "⟦f5⟧", "usually", "genellikle"]]}, {"k": "silently", "en": ["I tell you how to read.", "I am an adverb.", "You use me in a quiet library.", "I mean without any sound."], "tr": ["Nasıl okuyacağını söylerim.", "Bir zarfım.", "Beni sessiz bir kütüphanede kullanırsın.", "Hiç ses çıkarmadan anlamına gelirim."], "opts": [["silently", "⟦quiet_shh⟧", "silently", "sessizce"], ["aloud", "⟦megaphone⟧", "aloud", "yüksek sesle"], ["together", "⟦we⟧", "together", "birlikte"], ["quickly", "⟦speed_lines⟧", "quickly", "hızlıca"]]}, {"k": "presentation", "en": ["I am a talk.", "You stand in front of the class.", "You show slides or pictures in me.", "You talk about your project in me."], "tr": ["Bir konuşmayım.", "Sınıfın önünde durursun.", "Bende slayt ya da resim gösterirsin.", "Bende projenle ilgili konuşursun."], "opts": [["presentation", "⟦microphone⟧", "presentation", "sunum"], ["project", "⟦project_board⟧", "project", "proje"], ["homework", "⟦homework_desk_girl⟧", "homework", "ödev"], ["research", "⟦world_map_magnifier⟧", "research", "araştırma"]]}, {"k": "research", "en": ["I am a kind of study.", "You can do me on the Internet.", "You look for information in me.", "You do me before you write a project."], "tr": ["Bir çalışma türüyüm.", "Beni internette yapabilirsin.", "Bende bilgi ararsın.", "Beni bir proje yazmadan önce yaparsın."], "opts": [["research", "⟦world_map_magnifier⟧", "research", "araştırma"], ["revise", "⟦notebook⟧", "revise", "tekrar etmek"], ["practise", "⟦speech_bubble⟧", "practise", "pratik yapmak"], ["remember", "⟦think⟧", "remember", "hatırlamak"]]}], ROUNDS = 10;
  var order, qi, shown, wrong, score, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(R.slice()).slice(0, ROUNDS); qi = 0; score = 0;
    document.getElementById('sc').textContent = 0;
    showR();
  }
  function addClue() {
    var q = order[qi], i = shown;
    var d = document.createElement('div'); d.className = 'cl';
    d.innerHTML = '<div class="en">' + (i + 1) + '. ' + q.en[i] + '</div><div class="trl tr">' + q.tr[i] + '</div>';
    document.getElementById('cls').appendChild(d);
    shown++;
    document.getElementById('nc').disabled = (shown >= q.en.length);
    if (d.scrollIntoView) d.scrollIntoView({ block: 'nearest' });
  }
  function showR() {
    var q = order[qi]; shown = 0; wrong = 0; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('cls').innerHTML = ''; document.getElementById('qmark').textContent = '?';
    document.getElementById('fb').textContent = ''; document.getElementById('nxt').style.display = 'none';
    document.getElementById('nc').style.display = ''; document.getElementById('nc').disabled = false;
    addClue();
    var box = document.getElementById('right'); box.innerHTML = '';
    shuffle(q.opts.slice()).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = '<div class="e">' + o[1] + '</div><div class="p">' + o[2] + '</div><div class="t tr">' + o[3] + '</div>';
      b.addEventListener('click', function () { guess(b, o[0]); });
      box.appendChild(b);
    });
  }
  function moreClue() { if (locked) return; if (shown < order[qi].en.length) addClue(); }
  function guess(btn, k) {
    if (locked || btn.classList.contains('bad')) return;
    var q = order[qi];
    if (k === q.k) {
      locked = true;
      var pts = Math.max(0, (q.en.length - shown + 1) - wrong); score += pts;
      document.getElementById('sc').textContent = score;
      btn.classList.add('good');
      var o = q.opts[0]; document.getElementById('qmark').textContent = o[1];
      document.getElementById('fb').textContent = '✔ I am ' + (/^[aeiou]/.test(o[2]) ? 'an ' : 'a ') + o[2] + '!  +' + pts + (pts === 1 ? ' point' : ' points');
      document.getElementById('nc').style.display = 'none';
      var nx = document.getElementById('nxt'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      wrong++; btn.classList.add('bad', 'shake');
      document.getElementById('fb').textContent = 'Not this one. Try again!';
    }
  }
  function nextR() {
    qi++;
    if (qi >= order.length) {
      var max = ROUNDS * 4;
      document.getElementById('win-title').textContent = score >= 32 ? 'Super Detective!' : (score >= 22 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Points: ' + score + ' / ' + max;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showR();
  }
</script>

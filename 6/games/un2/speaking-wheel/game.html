<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Wheel</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 8px 14px 12px; align-items: stretch; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #wheelbox { position: relative; flex: 0 0 46%; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  @media (orientation: portrait) { #wheelbox { flex: 0 0 50%; } }
  #wheelwrap { position: relative; flex: 1; min-height: 0; aspect-ratio: 1; max-width: 100%; }
  #wheel { position: absolute; inset: 0; pointer-events: none; transition: transform 4.2s cubic-bezier(.12, .7, .1, 1); }
  #wheel svg { width: 100%; height: 100%; display: block; }
  #pointer { position: absolute; left: 50%; top: -2%; width: 11%; transform: translateX(-50%); z-index: 3; }
  #pointer svg { width: 100%; display: block; }
  #spin { font-size: clamp(1.4rem, 3.4vw, 2.6rem); padding: .15em 1.2em; }
  #spin:disabled { background: #B8C2C1; color: #5B6B69; cursor: not-allowed; box-shadow: 0 6px 0 #5B6B69; }
  #card { flex: 1; min-width: 0; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 22px; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  #cat { align-self: flex-start; color: #fff; font-weight: 900; font-size: clamp(1.1rem, 2.6vw, 2rem); padding: 0 20px; border-radius: 999px; border: 4px solid #0B2F2C; }
  #q-en { font-weight: 900; font-size: clamp(1.5rem, 4vw, 3.4rem); line-height: 1.15; }
  #q-tr { font-weight: 800; font-size: clamp(1rem, 2.2vw, 1.7rem); color: #0B5C56; }
  #start { font-weight: 800; font-size: clamp(1.1rem, 2.6vw, 2rem); color: #0B2F2C; background: #FFF3B0; border: 4px solid #0B2F2C; border-radius: 14px; padding: 6px 14px; }
  #start b { color: #D62828; }
  #qbox { flex-direction: column; gap: clamp(10px, 2vh, 18px); }
  #q-en { margin: 2px 0 0; }
  #showans { align-self: flex-start; font-size: clamp(1rem, 2.4vw, 1.8rem); }
  #ans { display: none; background: #C8F7D4; border: 4px solid #0A7A2F; border-radius: 14px; padding: 8px 14px; }
  #ans b { color: #0A7A2F; }
  #a-en { font-weight: 900; font-size: clamp(1.2rem, 3vw, 2.4rem); line-height: 1.2; }
  #a-tr { font-weight: 800; font-size: clamp(.95rem, 2vw, 1.5rem); color: #0B5C56; }
  #idle { font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 3.6rem); text-align: center; line-height: 1.2; }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Speaking<br>Wheel</h1>
  <p class="subtitle">Spin, ask and answer in pairs!</p>
  <div class="preview">🎡 📝 🏛️</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Spins: <span id="sp">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="wheelbox">
    <div id="wheelwrap">
      <div id="wheel"></div>
      <div id="pointer"><svg viewBox="0 0 60 80"><path d="M6 6 H54 L30 74 Z" fill="#D62828" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/></svg></div>
    </div>
    <button class="big-btn" id="spin" onclick="spin()">SPIN</button>
  </div>
  <div id="card">
    <div id="idle">Spin the wheel!<div class="tr" style="font-size:.5em;color:#0B5C56;font-weight:800">Çarkı çevir!</div></div>
    <div id="qbox" style="display:none">
      <div id="cat"></div>
      <div id="q-en"></div>
      <div id="q-tr" class="tr"></div>
      <div id="start"></div>
      <button class="restart-btn" id="showans" onclick="toggleAns()">Show answer</button>
      <div id="ans"><b>Sample answer:</b><div id="a-en"></div><div id="a-tr" class="tr"></div></div>
    </div>
  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { var f = document.getElementById('fb'); if (f) f.textContent = fbParts ? fbParts[0] + (TR && fbParts[1] ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var WHEEL = [["🌅", "Daily Routines", "#D62828", [["What time do you wake up?", "Saat kaçta uyanırsın?", "I wake up at …", "I wake up at seven o’clock.", "Saat yedide uyanırım."], ["What do you have for breakfast?", "Kahvaltıda ne yersin?", "I have … for breakfast.", "I have bread, cheese and olives for breakfast.", "Kahvaltıda ekmek, peynir ve zeytin yerim."], ["How do you go to school?", "Okula nasıl gidersin?", "I go to school …", "I go to school by bus.", "Okula otobüsle giderim."], ["What do you do after school?", "Okuldan sonra ne yaparsın?", "After school, I …", "After school, I rest and then do my homework.", "Okuldan sonra dinlenirim, sonra ödevimi yaparım."], ["What time do you have dinner?", "Akşam yemeğini saat kaçta yersin?", "We have dinner at …", "We have dinner at half past six.", "Akşam yemeğini altı buçukta yeriz."], ["What time do you go to bed?", "Saat kaçta yatarsın?", "I go to bed at …", "I go to bed at ten o’clock.", "Saat onda yatarım."]]], ["📝", "Study Habits", "#1F5FBF", [["How often do you revise your lessons?", "Derslerini ne sıklıkla tekrar edersin?", "I revise them …", "I revise them every evening.", "Onları her akşam tekrar ederim."], ["Where do you usually do your homework?", "Ödevini genellikle nerede yaparsın?", "I usually do it …", "I usually do it at my desk.", "Onu genellikle çalışma masamda yaparım."], ["Do you study alone or with friends?", "Tek başına mı yoksa arkadaşlarınla mı çalışırsın?", "I study …", "I study with my friends on Saturdays.", "Cumartesi günleri arkadaşlarımla çalışırım."], ["What do you do to remember new words?", "Yeni kelimeleri hatırlamak için ne yaparsın?", "I …", "I write them in my notebook and read them aloud.", "Onları defterime yazar ve yüksek sesle okurum."], ["Do you read silently or aloud?", "Sessizce mi yoksa yüksek sesle mi okursun?", "I usually read …", "I usually read silently.", "Genellikle sessizce okurum."], ["Which learning method do you like?", "Hangi öğrenme yöntemini seversin?", "I like …", "I like practising with a partner.", "Bir arkadaşla pratik yapmayı severim."]]], ["⏱️", "Right Now", "#0A7A2F", [["What are you doing now?", "Şu an ne yapıyorsun?", "I am …", "I am speaking English.", "İngilizce konuşuyorum."], ["What is your teacher doing?", "Öğretmenin ne yapıyor?", "My teacher is …", "My teacher is listening to us.", "Öğretmenim bizi dinliyor."], ["What are your friends doing?", "Arkadaşların ne yapıyor?", "They are …", "They are looking at the wheel.", "Çarka bakıyorlar."], ["Are you sitting at your desk?", "Sıranda mı oturuyorsun?", "Yes, I am. / No, I am not.", "Yes, I am. I am sitting next to my friend.", "Evet. Arkadaşımın yanında oturuyorum."], ["Is it raining now?", "Şu an yağmur yağıyor mu?", "Yes, it is. / No, it isn’t.", "No, it isn’t. The sun is shining.", "Hayır, yağmuyor. Güneş parlıyor."], ["Who is writing on the board?", "Tahtaya kim yazıyor?", "… is writing on the board.", "Nehir is writing on the board.", "Nehir tahtaya yazıyor."]]], ["🔄", "Now or Usually?", "#E07B00", [["What do you usually do on Sundays?", "Pazar günleri genellikle ne yaparsın?", "On Sundays, I usually …", "On Sundays, I usually visit my grandparents.", "Pazar günleri genellikle büyükanne ve büyükbabamı ziyaret ederim."], ["What are you doing today?", "Bugün ne yapıyorsun?", "Today I am …", "Today I am practising English at school.", "Bugün okulda İngilizce pratik yapıyorum."], ["Do you normally read in the evening?", "Akşamları normalde kitap okur musun?", "Yes, I do. / No, I don’t.", "Yes, I do. I read for half an hour.", "Evet. Yarım saat okurum."], ["What does your best friend usually do after school?", "En yakın arkadaşın okuldan sonra genellikle ne yapar?", "My friend usually …", "My friend usually plays basketball.", "Arkadaşım genellikle basketbol oynar."], ["Do you always have breakfast?", "Her zaman kahvaltı yapar mısın?", "Yes, I do. / No, I don’t.", "No, I don’t. Sometimes I only drink milk.", "Hayır. Bazen sadece süt içerim."], ["What is different in your class today?", "Bugün sınıfında farklı olan ne?", "Today we are …", "Today we are playing a game in English.", "Bugün İngilizce bir oyun oynuyoruz."]]], ["👥", "Working Together", "#7B2CBF", [["Do you like working in pairs?", "İkili çalışmayı sever misin?", "Yes, I do. / No, I don’t.", "Yes, I do. We share our ideas.", "Evet. Fikirlerimizi paylaşırız."], ["How many students are there in a group?", "Bir grupta kaç öğrenci var?", "There are … students.", "There are four students in my group.", "Grubumda dört öğrenci var."], ["What do you share in a group task?", "Bir grup görevinde neyi paylaşırsın?", "We share …", "We share the tasks and the ideas.", "Görevleri ve fikirleri paylaşırız."], ["How do you help your friends?", "Arkadaşlarına nasıl yardım edersin?", "I …", "I explain new words to them.", "Onlara yeni kelimeleri açıklarım."], ["What do you say when your friend needs help?", "Arkadaşın yardıma ihtiyaç duyunca ne dersin?", "I can …", "I can help you with your homework.", "Ödevinde sana yardım edebilirim."], ["Why is working together effective?", "Birlikte çalışmak neden etkili?", "Because …", "Because we learn from each other.", "Çünkü birbirimizden öğreniriz."]]], ["🏛️", "Learning Places", "#0B7285", [["Which learning places do you know?", "Hangi öğrenme mekânlarını biliyorsun?", "I know …", "I know the library and the science centre.", "Kütüphaneyi ve bilim merkezini biliyorum."], ["What do you do in a library?", "Kütüphanede ne yaparsın?", "I …", "I borrow books and read silently.", "Kitap ödünç alır ve sessizce okurum."], ["What can you see in a museum?", "Bir müzede neler görebilirsin?", "I can see …", "I can see old and interesting things.", "Eski ve ilginç şeyler görebilirim."], ["What can you do in a science centre?", "Bir bilim merkezinde neler yapabilirsin?", "I can …", "I can do experiments.", "Deney yapabilirim."], ["How often do you go to a library?", "Ne sıklıkla kütüphaneye gidersin?", "I go …", "I go to the library once a week.", "Haftada bir kütüphaneye giderim."], ["Which place would you like to visit?", "Hangi yeri ziyaret etmek istersin?", "I would like to visit …", "I would like to visit a planetarium.", "Bir gökevini ziyaret etmek isterim."]]], ["🔢", "Numbers", "#B5179E", [["Say a number between 100 and 500.", "100 ile 500 arasında bir sayı söyle.", "It is …", "It is three hundred and fifty.", "Üç yüz elli."], ["What is double one hundred?", "Yüzün iki katı kaçtır?", "It is …", "It is two hundred.", "İki yüzdür."], ["How many students are there in your school?", "Okulunda kaç öğrenci var?", "There are about … students.", "There are about four hundred students.", "Yaklaşık dört yüz öğrenci var."], ["Which floor is your classroom on?", "Sınıfın kaçıncı katta?", "It is on the … floor.", "It is on the second floor.", "İkinci katta."], ["When is your birthday?", "Doğum günün ne zaman?", "It is on the … of …", "It is on the twelfth of May.", "On iki Mayıs’ta."], ["Which is the twelfth month of the year?", "Yılın on ikinci ayı hangisidir?", "The twelfth month is …", "The twelfth month is December.", "On ikinci ay Aralık’tır."]]], ["🏫", "Class Life", "#4D7C0F", [["What do you need help with?", "Hangi konuda yardıma ihtiyacın var?", "I need some help with …", "I need some help with vocabulary.", "Kelime çalışmasında biraz yardıma ihtiyacım var."], ["How do you feel when you get full marks?", "Tam puan aldığında nasıl hissedersin?", "I feel …", "I feel very happy and proud.", "Çok mutlu hissederim ve gurur duyarım."], ["What does your teacher always say?", "Öğretmenin hep ne söyler?", "My teacher always says …", "My teacher always says, “Please listen carefully.”", "Öğretmenim hep “Lütfen dikkatle dinleyin.” der."], ["Who is the most helpful in your class?", "Sınıfında en yardımsever kim?", "… is very helpful.", "Ela is very helpful.", "Ela çok yardımsever."], ["Do you have to do homework every day?", "Her gün ödev yapmak zorunda mısın?", "Yes, I do. / No, I don’t.", "No, I don’t. We have homework on weekdays.", "Hayır. Hafta içi ödevimiz var."], ["What is your favourite learning activity?", "En sevdiğin öğrenme etkinliği hangisi?", "My favourite activity is …", "My favourite activity is playing word games.", "En sevdiğim etkinlik kelime oyunları oynamak."]]]];

  /* Build the wheel. Labels run outward from the hub (r = TEXT_START) to just
     before the emoji (r = TEXT_END), so they never touch the centre circle or the emoji.
     Long names are split into two lines and the font size is fitted to the space. */
  (function buildWheel() {
    var R = 240, TEXT_START = 46, TEXT_END = 198, MID = 122, EMOJI_BASE = 210, EMOJI_SIZE = 26;
    var CHAR_W = 0.6;
    var n = WHEEL.length, step = 360 / n, FONT = "Segoe UI, Verdana, Arial, sans-serif";
    var GFS = 18; WHEEL.forEach(function (c) { var nm = c[1].replace(/^My /, ''), ls = [nm]; if (nm.indexOf(' ') > -1 && nm.length > 16) ls = nm.split(' '); var st = ls.length > 1 ? 56 : TEXT_START, av = TEXT_END - st, ml = Math.max.apply(null, ls.map(function (s) { return s.length; })); GFS = Math.min(GFS, av / (CHAR_W * ml)); });
    var out = '<svg viewBox="-250 -250 500 500" xmlns="http://www.w3.org/2000/svg">';
    for (var i = 0; i < n; i++) {
      var c = WHEEL[i], a0 = i * step * Math.PI / 180, a1 = (i + 1) * step * Math.PI / 180;
      var x0 = (R * Math.sin(a0)).toFixed(1), y0 = (-R * Math.cos(a0)).toFixed(1);
      var x1 = (R * Math.sin(a1)).toFixed(1), y1 = (-R * Math.cos(a1)).toFixed(1);
      out += '<path d="M0 0 L' + x0 + ' ' + y0 + ' A' + R + ' ' + R + ' 0 0 1 ' + x1 + ' ' + y1 + ' Z" fill="' + c[2] + '" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/>';
      var name = c[1].replace(/^My /, ''), lines = [name];
      if (name.indexOf(' ') > -1 && name.length > 16) lines = name.split(' ');
      var start = lines.length > 1 ? 56 : TEXT_START, avail = TEXT_END - start;
      var cAngle = i * step + step / 2, flip = cAngle > 180;
      var maxLen = Math.max.apply(null, lines.map(function (s) { return s.length; }));
      var fs = GFS;
      out += '<g transform="rotate(' + cAngle + ')">';
      var eCy = EMOJI_BASE + EMOJI_SIZE * 0.22;
      out += '<text x="0" y="-' + EMOJI_BASE + '"' + (flip ? ' transform="rotate(180 0 -' + eCy.toFixed(1) + ')"' : '') + ' text-anchor="middle" font-size="' + EMOJI_SIZE + '">' + c[0] + '</text>';
      for (var k = 0; k < lines.length; k++) {
        var off = (k - (lines.length - 1) / 2) * fs * 1.2;
        var tf = flip
          ? 'translate(' + (-off).toFixed(1) + ',-' + MID + ') rotate(90)'
          : 'translate(' + off.toFixed(1) + ',-' + MID + ') rotate(-90)';
        out += '<text transform="' + tf + '" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="' + fs + '" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="4" paint-order="stroke" stroke-linejoin="round" font-family="' + FONT + '">' + lines[k] + '</text>';
      }
      out += '</g>';
    }
    out += '<circle r="34" fill="#FFD23F" stroke="#0B2F2C" stroke-width="7"/></svg>';
    document.getElementById('wheel').innerHTML = out;
  })();

  var rot = 0, spinning = false, spins = 0, queues = [];
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    spins = 0; document.getElementById('sp').textContent = 0;
    queues = WHEEL.map(function () { return []; });
    document.getElementById('qbox').style.display = 'none';
    document.getElementById('idle').style.display = '';
  }
  function spin() {
    if (spinning) return; spinning = true;
    document.getElementById('spin').disabled = true;
    var n = WHEEL.length, step = 360 / n, idx = Math.floor(Math.random() * n);
    var target = ((360 - (idx * step + step / 2) + (Math.random() * 2 - 1) * step * 0.3) % 360 + 360) % 360;
    var cur = ((rot % 360) + 360) % 360;
    rot += 1800 + ((target - cur) + 360) % 360;
    var w = document.getElementById('wheel');
    w.style.transform = 'rotate(' + rot + 'deg)';
    var done = false;
    function finish() { if (done) return; done = true; w.removeEventListener('transitionend', finish); show(idx); }
    w.addEventListener('transitionend', finish);
    setTimeout(finish, 4600);
  }
  window.__testSpin = function (i) { var n = WHEEL.length, step = 360 / n; var w = document.getElementById('wheel'); var target = ((360 - (i * step + step / 2)) % 360 + 360) % 360; var cur = ((rot % 360) + 360) % 360; rot += 1800 + ((target - cur) + 360) % 360; w.style.transition = 'none'; w.style.transform = 'rotate(' + rot + 'deg)'; void w.offsetWidth; w.style.transition = ''; spinning = true; show(i); };
  function toggleAns() {
    var a = document.getElementById('ans'), open = a.style.display !== 'block';
    a.style.display = open ? 'block' : 'none';

  }
  function show(idx) {
    var c = WHEEL[idx];
    if (!queues[idx].length) queues[idx] = shuffle(c[3].slice());
    var q = queues[idx].pop();
    spins++; document.getElementById('sp').textContent = spins;
    document.getElementById('idle').style.display = 'none';
    document.getElementById('qbox').style.display = 'flex';
    var cat = document.getElementById('cat'); cat.textContent = c[0] + ' ' + c[1]; cat.style.background = c[2];
    document.getElementById('q-en').textContent = q[0];
    document.getElementById('q-tr').textContent = q[1];
    document.getElementById('start').innerHTML = '<b>Start:</b> ' + q[2].replace(/</g, '&lt;');
    document.getElementById('a-en').textContent = q[3]; document.getElementById('a-tr').textContent = q[4];
    document.getElementById('ans').style.display = 'none'; document.getElementById('showans').textContent = 'Show answer';
    spinning = false; document.getElementById('spin').disabled = false;
  }
</script>

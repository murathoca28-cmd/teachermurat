<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Rush</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }

  body.no-tr .tr { display: none; }
  #tabs { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 64px 4px 12px; flex-wrap: wrap; }
  .tab { font-size: clamp(1.1rem, 2.6vw, 1.9rem); font-weight: 900; padding: .1em 1.1em; border: 5px solid #0B2F2C; border-radius: 16px 16px 0 0; background: #B9E4E0; color: #0B2F2C; }
  .tab.act { background: #FFD23F; box-shadow: 0 5px 0 #FFD23F; position: relative; z-index: 2; }
  .mini { font-size: clamp(.85rem, 1.7vw, 1.3rem); }
  #panelwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #FFD23F; border-top: 5px solid #0B2F2C; }
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; gap: 8px; padding: 8px 12px 12px; background: #0E8F86; }
  .panel.on { display: flex; }

  /* ---- LEARN ---- */
  #chips, #setchips { flex: 0 0 auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chipb { font-size: clamp(.9rem, 2vw, 1.5rem); font-weight: 900; padding: .05em .8em; background: #fff; color: #0B2F2C; border: 4px solid #0B2F2C; border-radius: 999px; }
  .chipb.act { background: #FFD23F; box-shadow: 0 4px 0 #0B2F2C; }
  #note { flex: 0 0 auto; background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 14px; text-align: center; }
  #note .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.7rem); }
  #note .trl { font-weight: 800; font-size: clamp(.85rem, 1.7vw, 1.25rem); color: #0B5C56; }
  #lgroups { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .lg { flex: 0 0 auto; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; overflow: hidden; }
  .lg .gh { padding: 2px 14px; color: #fff; font-weight: 900; font-size: clamp(1.1rem, 2.6vw, 2rem); text-shadow: 2px 2px 0 #0B2F2C; border-bottom: 5px solid #0B2F2C; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .lg .gh small { font-size: .6em; font-weight: 800; }
  .lg .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 17vw, 190px), 1fr)); gap: 8px; padding: 8px; }
  .wc { border: 4px solid #0B2F2C; border-radius: 12px; padding: 2px 6px; text-align: center; background: #FFFBE6; }
  .wc .e { font-size: clamp(1.8rem, 5vh, 3rem); line-height: 1.15; }
  .wc .p { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.7rem); line-height: 1.15; }
  .wc .t { font-weight: 800; font-size: clamp(.8rem, 1.5vw, 1.15rem); color: #0B5C56; }
  #learnplay { flex: 0 0 auto; align-self: center; font-size: clamp(1rem, 2.4vw, 1.7rem); }

  /* ---- PLAY: SETUP ---- */
  #setup { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; }
  .row { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .row .lbl { font-weight: 900; font-size: clamp(1.1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #setup .big-btn { font-size: clamp(1.4rem, 3.4vw, 2.6rem); }

  /* ---- PLAY: STAGE ---- */
  #stage { flex: 1; min-height: 0; display: none; flex-direction: column; gap: 8px; }
  #sb { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .team { color: #fff; font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.6rem); padding: 0 14px; border: 4px solid #0B2F2C; border-radius: 12px; opacity: .72; }
  .team.cur { opacity: 1; outline: 5px solid #FFD23F; outline-offset: 2px; transform: scale(1.06); }
  .stat2 { background: #fff; border: 4px solid #0B2F2C; border-radius: 12px; padding: 0 12px; font-weight: 900; font-size: clamp(.9rem, 2vw, 1.5rem); }
  #field { position: relative; flex: 1; min-height: 0; background: #14A89E; border: 5px solid #0B2F2C; border-radius: 16px; overflow: hidden; }
  #field::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: repeating-linear-gradient(90deg, #0B2F2C 0 18px, #FFD23F 18px 36px); }
  #fb { flex: 0 0 auto; min-height: 1.35em; text-align: center; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  .fw { position: absolute; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 2px 14px; font-weight: 900; font-size: clamp(1.3rem, 3.6vw, 2.7rem); line-height: 1.1; white-space: nowrap; cursor: pointer; user-select: none; will-change: transform; }
  .fw .fe { font-size: 1.15em; line-height: 1.1; }
  .fw { touch-action: none; }
  .fw.drag-ghost { position: fixed; z-index: 60; pointer-events: none; transform: scale(1.1) rotate(-3deg); box-shadow: 0 10px 0 rgba(11,47,44,.55); background: #FFF3B0; border-color: #D62828; }
  .bin.over { outline: 8px solid #FFD23F; outline-offset: 2px; transform: scale(1.03); }
  .fw.sel { background: #FFF3B0; border-color: #D62828; border-width: 7px; }
  .fw.good { background: #C8F7D4; border-color: #0A7A2F; }
  .fw.bad { background: #FFD6D6; border-color: #D62828; }
  #bins { flex: 0 0 auto; display: flex; gap: 10px; }
  .bin { flex: 1; min-width: 0; min-height: clamp(84px, 20vh, 170px); border: 5px solid #0B2F2C; border-radius: 16px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 6px; text-shadow: 2px 2px 0 #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .bin:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .bin .be { font-size: clamp(1.6rem, 5vh, 3rem); line-height: 1.1; text-shadow: none; }
  .bin .bn { font-weight: 900; font-size: clamp(1rem, 2.6vw, 2rem); line-height: 1.1; }
  .bin .bt { font-weight: 800; font-size: clamp(.75rem, 1.5vw, 1.15rem); }
  .bin { position: relative; }
  .bin .mark { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; font-size: clamp(3.5rem, 16vh, 8rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; background: inherit; border-radius: 12px; z-index: 3; }
  .bin.ok, .bin.no { background: #0A7A2F !important; } .bin.no { background: #D62828 !important; }
  .bin.ok .mark, .bin.no .mark { display: flex; }
  .bin.hint { outline: 8px solid #FFD23F; outline-offset: 2px; }
  .bin.flash { outline: 8px solid #FFD23F; outline-offset: 2px; }
  .bin .key { font-size: .6em; opacity: .9; }

  #turn-screen { position: fixed; inset: 0; z-index: 45; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; background: rgba(11,47,44,.92); color: #fff; text-align: center; padding: 20px; }
  #turn-screen .tt { font-size: clamp(2.2rem, 8vw, 5.5rem); font-weight: 900; text-shadow: 3px 3px 0 #0B2F2C; }
  #turn-screen .ts { font-size: clamp(1.1rem, 3vw, 2rem); font-weight: 800; }
  .scorelist { display: flex; flex-direction: column; gap: 8px; }
  .scorelist .team { opacity: 1; font-size: clamp(1.2rem, 3.4vw, 2.4rem); }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Word Rush</h1>
  <p class="subtitle">Sort the falling words into the right box!</p>
  <div class="preview">🧢 🥛 🦁</div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
    <button class="big-btn" onclick="startGame('learn')">📚 Learn</button>
    <button class="big-btn" onclick="startGame('play')">🎮 Play</button>
  </div>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <div class="scorelist" id="win-list"></div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
    <button class="big-btn" onclick="beginRun()">Play Again</button>
    <button class="big-btn" style="background:#fff" onclick="document.getElementById('win-screen').style.display='none';showTab('play');showSetup()">Change Topic</button>
  </div>
</div>
<div id="turn-screen"><div class="tt" id="tt"></div><div class="ts" id="ts"></div><button class="big-btn" onclick="goTurn()">Go!</button></div>

<div id="tabs">
  <button class="tab act" id="tab-learn" onclick="showTab('learn')">📚 Learn</button>
  <button class="tab" id="tab-play" onclick="showTab('play')">🎮 Play</button>
  <button class="restart-btn mini" id="trbtn" onclick="toggleTR()">Turkish: On</button>
</div>
<div id="panelwrap">
  <div class="panel on" id="p-learn">
    <div id="chips"></div>
    <div id="note"><div class="en" id="note-en"></div><div class="trl tr" id="note-tr"></div></div>
    <div id="lgroups"></div>
    <button class="big-btn" id="learnplay" onclick="playThis()">🎮 Play this topic</button>
  </div>
  <div class="panel" id="p-play">
    <div id="setup">
      <div class="row"><div class="lbl">Topic <span class="tr" style="font-size:.7em">(Konu)</span></div><div class="opts" id="o-set"></div></div>
      <div class="row"><div class="lbl">Mode <span class="tr" style="font-size:.7em">(Mod)</span></div><div class="opts" id="o-mode"></div></div>
      <div class="row"><div class="lbl">Teams <span class="tr" style="font-size:.7em">(Takım)</span></div><div class="opts" id="o-teams"></div></div>
      <div class="row"><div class="lbl">Rounds <span class="tr" style="font-size:.7em">(Tur)</span></div><div class="opts" id="o-rounds"></div></div>
      <div class="row"><div class="lbl">Speed <span class="tr" style="font-size:.7em">(Hız)</span></div><div class="opts" id="o-speed"></div></div>
      <div class="row"><div class="lbl">Pictures <span class="tr" style="font-size:.7em">(Resim)</span></div><div class="opts" id="o-pics"></div></div>
      <button class="big-btn" onclick="beginRun()">Start!</button>
    </div>
    <div id="stage">
      <div id="sb"></div>
      <div id="fb"></div>
      <div id="field"></div>
      <div id="bins"></div>
    </div>
  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var SETS = [{"id": "clothes", "title": "Clothes", "tr": "Kıyafetler", "emoji": "👕", "pics": true, "note": "Where do we wear it? Sort the clothes and accessories by the part of the body.", "note_tr": "Nereye giyiyoruz? Kıyafetleri ve aksesuarları vücut bölümüne göre ayır.", "groups": [{"n": "Head & Face", "e": "🧢", "t": "Baş ve Yüz", "w": [{"en": "cap", "tr": "kasket", "e": "🧢"}, {"en": "hat", "tr": "şapka", "e": "👒"}, {"en": "sunglasses", "tr": "güneş gözlüğü", "e": "🕶️"}, {"en": "glasses", "tr": "gözlük", "e": "👓"}]}, {"n": "Hands & Neck", "e": "🧤", "t": "El ve Boyun", "w": [{"en": "gloves", "tr": "eldiven", "e": "🧤"}, {"en": "ring", "tr": "yüzük", "e": "💍"}, {"en": "scarf", "tr": "atkı", "e": "🧣"}, {"en": "necklace", "tr": "kolye", "e": "📿"}]}, {"n": "Feet", "e": "👟", "t": "Ayak", "w": [{"en": "boots", "tr": "bot", "e": "🥾"}, {"en": "sneakers", "tr": "spor ayakkabı", "e": "👟"}, {"en": "sandals", "tr": "sandalet", "e": "👡"}, {"en": "socks", "tr": "çorap", "e": "🧦"}]}]}, {"id": "food", "title": "Food and Drinks", "tr": "Yiyecek ve İçecekler", "emoji": "🍽️", "pics": true, "note": "We say a bowl of, a glass of and a slice of. Which one fits?", "note_tr": "a bowl of, a glass of ve a slice of deriz. Hangisi uyuyor?", "groups": [{"n": "a bowl of", "e": "🥣", "t": "bir kase", "w": [{"en": "soup", "tr": "çorba", "e": "🍲"}, {"en": "salad", "tr": "salata", "e": "🥗"}, {"en": "pasta", "tr": "makarna", "e": "🍝"}, {"en": "ice cream", "tr": "dondurma", "e": "🍦"}, {"en": "rice", "tr": "pilav", "e": "🍚"}]}, {"n": "a glass of", "e": "🥛", "t": "bir bardak", "w": [{"en": "milk", "tr": "süt", "e": "🥛"}, {"en": "juice", "tr": "meyve suyu", "e": "🍹"}, {"en": "water", "tr": "su", "e": "💧"}, {"en": "lemonade", "tr": "limonata", "e": "🍋"}, {"en": "cola", "tr": "kola", "e": "🥤"}]}, {"n": "a slice of", "e": "🍕", "t": "bir dilim", "w": [{"en": "pizza", "tr": "pizza", "e": "🍕"}, {"en": "cake", "tr": "kek", "e": "🍰"}, {"en": "bread", "tr": "ekmek", "e": "🍞"}, {"en": "cheese", "tr": "peynir", "e": "🧀"}, {"en": "watermelon", "tr": "karpuz", "e": "🍉"}]}]}, {"id": "animals", "title": "Wild Animals", "tr": "Yabani Hayvanlar", "emoji": "🦁", "pics": true, "note": "Where does the animal live? Sort the animals by their habitat.", "note_tr": "Hayvan nerede yaşıyor? Hayvanları yaşam alanlarına göre ayır.", "groups": [{"n": "Birds", "e": "🦜", "t": "Kuşlar", "w": [{"en": "parrot", "tr": "papağan", "e": "🦜"}, {"en": "owl", "tr": "baykuş", "e": "🦉"}, {"en": "eagle", "tr": "kartal", "e": "🦅"}, {"en": "penguin", "tr": "penguen", "e": "🐧"}, {"en": "duck", "tr": "ördek", "e": "🦆"}]}, {"n": "Sea animals", "e": "🐬", "t": "Deniz hayvanları", "w": [{"en": "whale", "tr": "balina", "e": "🐋"}, {"en": "dolphin", "tr": "yunus", "e": "🐬"}, {"en": "shark", "tr": "köpek balığı", "e": "🦈"}, {"en": "octopus", "tr": "ahtapot", "e": "🐙"}, {"en": "fish", "tr": "balık", "e": "🐟"}]}, {"n": "Land animals", "e": "🦁", "t": "Kara hayvanları", "w": [{"en": "elephant", "tr": "fil", "e": "🐘"}, {"en": "giraffe", "tr": "zürafa", "e": "🦒"}, {"en": "lion", "tr": "aslan", "e": "🦁"}, {"en": "zebra", "tr": "zebra", "e": "🦓"}, {"en": "monkey", "tr": "maymun", "e": "🐒"}]}]}, {"id": "holiday", "title": "Weather and Holiday", "tr": "Hava Durumu ve Tatil", "emoji": "🏖️", "pics": true, "note": "Sort the words: weather, places to stay and holiday activities.", "note_tr": "Kelimeleri ayır: hava durumu, kalınacak yerler ve tatil etkinlikleri.", "groups": [{"n": "Weather", "e": "☀️", "t": "Hava durumu", "w": [{"en": "sunny", "tr": "güneşli", "e": "☀️"}, {"en": "rainy", "tr": "yağmurlu", "e": "🌧️"}, {"en": "windy", "tr": "rüzgârlı", "e": "🌬️"}, {"en": "cloudy", "tr": "bulutlu", "e": "☁️"}, {"en": "snowy", "tr": "karlı", "e": "❄️"}]}, {"n": "Places to stay", "e": "🏨", "t": "Kalınacak yerler", "w": [{"en": "hotel", "tr": "otel", "e": "🏨"}, {"en": "tent", "tr": "çadır", "e": "⛺"}, {"en": "tiny house", "tr": "küçük ev", "e": "🏡"}, {"en": "campsite", "tr": "kamp alanı", "e": "🏕️"}, {"en": "apartment", "tr": "apartman dairesi", "e": "🏢"}]}, {"n": "Holiday activities", "e": "📸", "t": "Tatil etkinlikleri", "w": [{"en": "swim", "tr": "yüzmek", "e": "🏊"}, {"en": "take photos", "tr": "fotoğraf çekmek", "e": "📸"}, {"en": "build sandcastles", "tr": "kumdan kale yapmak", "e": "🏰"}, {"en": "go fishing", "tr": "balık tutmaya gitmek", "e": "🎣"}, {"en": "go hiking", "tr": "doğa yürüyüşüne çıkmak", "e": "🥾"}]}]}, {"id": "grammar", "title": "Comparatives and Superlatives", "tr": "Karşılaştırma ve Üstünlük", "emoji": "🏆", "pics": false, "note": "big, bigger than, the biggest: adjective, comparative or superlative?", "note_tr": "big, bigger than, the biggest: sıfat, karşılaştırma mı, üstünlük mü?", "groups": [{"n": "Adjective", "e": "🙂", "t": "Sıfat", "w": [{"en": "big", "tr": "büyük", "e": ""}, {"en": "tall", "tr": "uzun", "e": ""}, {"en": "fast", "tr": "hızlı", "e": ""}, {"en": "colourful", "tr": "renkli", "e": ""}, {"en": "dangerous", "tr": "tehlikeli", "e": ""}]}, {"n": "Comparative", "e": "⬆️", "t": "Karşılaştırma (daha ...)", "w": [{"en": "bigger", "tr": "daha büyük", "e": ""}, {"en": "taller", "tr": "daha uzun", "e": ""}, {"en": "faster", "tr": "daha hızlı", "e": ""}, {"en": "more colourful", "tr": "daha renkli", "e": ""}, {"en": "more dangerous", "tr": "daha tehlikeli", "e": ""}]}, {"n": "Superlative", "e": "🏆", "t": "Üstünlük (en ...)", "w": [{"en": "the biggest", "tr": "en büyük", "e": ""}, {"en": "the tallest", "tr": "en uzun", "e": ""}, {"en": "the fastest", "tr": "en hızlı", "e": ""}, {"en": "the most colourful", "tr": "en renkli", "e": ""}, {"en": "the most dangerous", "tr": "en tehlikeli", "e": ""}]}]}];
  var BIN_COLORS = ['#7B2CBF', '#C45A00', '#B0136B'], TEAM_COLORS = ['#D62828', '#1F5FBF', '#0A7A2F'], WORDS_PER_TURN = 8;
  var TR = true;
  var cfg = { set: 0, teams: 2, rounds: 2, speed: 1, pics: true, mode: 'tap' };
  var run = null, raf = 0, last = 0, learnSet = 0;

  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); }
  function startGame(tab) {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    showTab(tab || 'learn'); if (tab === 'play') showSetup();
  }
  function showTab(t) {
    ['learn', 'play'].forEach(function (k) { document.getElementById('p-' + k).classList.toggle('on', k === t); document.getElementById('tab-' + k).classList.toggle('act', k === t); });
    if (t === 'learn' && run && run.live) pauseRun(true);
  }

  /* ---------------- LEARN ---------------- */
  function buildChips(boxId, cur, fn) {
    var box = document.getElementById(boxId); box.innerHTML = '';
    SETS.forEach(function (s, i) {
      var b = document.createElement('button'); b.className = 'chipb' + (i === cur ? ' act' : ''); b.innerHTML = s.emoji + ' ' + s.title;
      b.addEventListener('click', function () { fn(i); }); box.appendChild(b);
    });
  }
  function showLearn(i) {
    learnSet = i; var s = SETS[i];
    buildChips('chips', i, showLearn);
    document.getElementById('note-en').textContent = s.note; document.getElementById('note-tr').textContent = s.note_tr;
    var box = document.getElementById('lgroups'); box.innerHTML = '';
    s.groups.forEach(function (g, gi) {
      var d = document.createElement('div'); d.className = 'lg';
      var h = '<div class="gh" style="background:' + BIN_COLORS[gi] + '">' + g.e + ' ' + g.n + ' <small class="tr">' + g.t + '</small></div><div class="cards">';
      g.w.forEach(function (w) {
        h += '<div class="wc">' + (s.pics && w.e ? '<div class="e">' + w.e + '</div>' : '') + '<div class="p">' + w.en + '</div><div class="t tr">' + w.tr + '</div></div>';
      });
      d.innerHTML = h + '</div>'; box.appendChild(d);
    });
    box.scrollTop = 0;
  }
  function playThis() { cfg.set = learnSet; cfg.pics = SETS[learnSet].pics; showTab('play'); showSetup(); }

  /* ---------------- SETUP ---------------- */
  function opts(boxId, items, cur, fn) {
    var box = document.getElementById(boxId); box.innerHTML = '';
    items.forEach(function (it, i) {
      var b = document.createElement('button'); b.className = 'chipb' + (it[1] === cur ? ' act' : ''); b.innerHTML = it[0];
      b.addEventListener('click', function () { fn(it[1]); showSetup(true); }); box.appendChild(b);
    });
  }
  function showSetup(keep) {
    if (!keep) stopRun();
    document.getElementById('setup').style.display = 'flex'; document.getElementById('stage').style.display = 'none';
    opts('o-set', SETS.map(function (s, i) { return [s.emoji + ' ' + s.title, i]; }), cfg.set, function (v) { cfg.set = v; cfg.pics = SETS[v].pics; });
    opts('o-mode', [['👆 Tap', 'tap'], ['✋ Drag', 'drag']], cfg.mode, function (v) { cfg.mode = v; });
    opts('o-teams', [['1 (Class)', 1], ['2 Teams', 2], ['3 Teams', 3]], cfg.teams, function (v) { cfg.teams = v; });
    opts('o-rounds', [['1', 1], ['2', 2], ['3', 3]], cfg.rounds, function (v) { cfg.rounds = v; });
    opts('o-speed', [['🐢 Slow', 0], ['🚶 Normal', 1], ['🚀 Fast', 2]], cfg.speed, function (v) { cfg.speed = v; });
    opts('o-pics', SETS[cfg.set].pics ? [['On', true], ['Off', false]] : [['No pictures for this topic', false]], cfg.pics, function (v) { cfg.pics = v; });
  }

  /* ---------------- RUN ---------------- */
  function stopRun() { if (run) run.live = false; cancelAnimationFrame(raf); raf = 0; var f = document.getElementById('field'); Array.prototype.forEach.call(f.querySelectorAll('.fw'), function (e) { e.remove(); }); }
  function makeDeck(s) { var a = []; s.groups.forEach(function (g, gi) { g.w.forEach(function (w) { a.push({ en: w.en, tr: w.tr, e: w.e, g: gi }); }); }); return shuffle(a); }
  function beginRun() {
    document.getElementById('win-screen').style.display = 'none';
    stopRun();
    var s = SETS[cfg.set];
    run = { s: s, deck: makeDeck(s), di: 0, scores: [], streak: 0, turn: 0, turns: cfg.teams * cfg.rounds, words: [], live: false, paused: false, spawned: 0, resolved: 0, t: 0, nextSpawn: 0, sel: null };
    for (var i = 0; i < cfg.teams; i++) run.scores.push(0);
    document.getElementById('setup').style.display = 'none'; document.getElementById('stage').style.display = 'flex';
    var bins = document.getElementById('bins'); bins.innerHTML = '';
    s.groups.forEach(function (g, gi) {
      var b = document.createElement('button'); b.className = 'bin'; b.id = 'bin' + gi; b.style.background = BIN_COLORS[gi];
      b.innerHTML = '<div class="be">' + g.e + '</div><div class="bn">' + g.n + '</div><div class="bt tr">' + g.t + '</div><div class="key">[' + (gi + 1) + ']</div><div class="mark"></div>';
      b.addEventListener('click', function () { tapBin(gi); }); bins.appendChild(b);
    });
    drawScore(); announce();
  }
  function drawScore() {
    var sb = document.getElementById('sb'); sb.innerHTML = '';
    var cur = run.turn % cfg.teams;
    run.scores.forEach(function (sc, i) {
      var d = document.createElement('div'); d.className = 'team' + (i === cur ? ' cur' : ''); d.style.background = TEAM_COLORS[i];
      d.textContent = (cfg.teams === 1 ? 'Score' : 'Team ' + (i + 1)) + ': ' + sc; sb.appendChild(d);
    });
    var t = document.createElement('div'); t.className = 'stat2'; t.textContent = 'Turn ' + (run.turn + 1) + '/' + run.turns; sb.appendChild(t);
    var p = document.createElement('button'); p.className = 'restart-btn mini'; p.id = 'pausebtn'; p.textContent = '⏸ Pause'; p.onclick = function () { pauseRun(!run.paused); }; sb.appendChild(p);
    var r = document.createElement('button'); r.className = 'restart-btn mini'; r.textContent = 'Restart'; r.onclick = function () { showSetup(); }; sb.appendChild(r);
  }
  function announce() {
    var cur = run.turn % cfg.teams, ts = document.getElementById('turn-screen');
    document.getElementById('tt').textContent = cfg.teams === 1 ? 'Round ' + (run.turn + 1) : 'Team ' + (cur + 1) + ', get ready!';
    document.getElementById('tt').style.color = cfg.teams === 1 ? '#FFD23F' : '#fff';
    document.getElementById('ts').textContent = cfg.mode === 'drag' ? 'Drag each word into the right box before it hits the floor!' : 'Tap the right box before the word hits the floor!';
    ts.style.display = 'flex'; run.live = false; cancelAnimationFrame(raf);
    ts.style.background = cfg.teams === 1 ? 'rgba(11,47,44,.92)' : 'rgba(11,47,44,.92)';
  }
  function goTurn() {
    document.getElementById('turn-screen').style.display = 'none';
    run.spawned = 0; run.resolved = 0; run.t = 0; run.nextSpawn = 0.4; run.streak = 0; run.live = true; run.paused = false; run.sel = null;
    drawScore(); last = performance.now(); raf = requestAnimationFrame(loop);
  }
  function pauseRun(p) {
    if (!run || !run.live) return; run.paused = p;
    var b = document.getElementById('pausebtn'); if (b) b.textContent = p ? '▶ Resume' : '⏸ Pause';
    if (!p) { last = performance.now(); raf = requestAnimationFrame(loop); }
  }
  function dur() { return [11, 8, 5.5][cfg.speed]; }
  function spawn() {
    var w = run.deck[run.di % run.deck.length]; run.di++;
    if (run.di % run.deck.length === 0) run.deck = shuffle(run.deck.slice());
    var el = document.createElement('div'); el.className = 'fw';
    el.innerHTML = (cfg.pics && w.e ? '<div class="fe">' + w.e + '</div>' : '') + '<div>' + w.en + '</div>';
    var o = { w: w, el: el, y: 0, x: 4 + Math.random() * 52, done: false };
    el.style.left = o.x + '%';
    el.addEventListener('click', function () { if (!o.done && cfg.mode !== 'drag') { select(o); } });
    el.addEventListener('pointerdown', function (e) { if (cfg.mode === 'drag') startDrag(o, e); });
    document.getElementById('field').appendChild(el);
    run.words.push(o); run.spawned++;
    if (!run.sel) autoSel();
  }
  function autoSel() {
    var best = null; run.words.forEach(function (o) { if (!o.done && (!best || o.y > best.y)) best = o; });
    run.sel = best; run.words.forEach(function (o) { o.el.classList.toggle('sel', o === best); });
  }
  function select(o) { run.sel = o; run.words.forEach(function (x) { x.el.classList.toggle('sel', x === o); }); }
  function loop(now) {
    if (!run || !run.live || run.paused) return;
    var dt = Math.min(.1, (now - last) / 1000); last = now; run.t += dt;
    var f = document.getElementById('field'), H = f.clientHeight - 10;
    if (run.spawned < WORDS_PER_TURN && run.t >= run.nextSpawn) { spawn(); run.nextSpawn = run.t + dur() * .34; }
    run.words.slice().forEach(function (o) {
      if (o.done) return;
      o.y += dt / dur();
      var maxY = H - o.el.offsetHeight;
      var py = Math.min(1, o.y) * maxY;
      o.el.style.transform = 'translateY(' + py + 'px)';
      if (o.y >= 1) resolve(o, -1);
    });
    if (run.live) raf = requestAnimationFrame(loop);
  }
  function binAt(x, y) {
    for (var i = 0; i < run.s.groups.length; i++) { var r = document.getElementById('bin' + i).getBoundingClientRect(); if (x >= r.left && x <= r.right && y >= r.top - 12 && y <= r.bottom) return i; }
    return -1;
  }
  function startDrag(o, e) {
    if (!run || !run.live || run.paused || o.done || o.drag) return;
    e.preventDefault();
    var r = o.el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top, pid = e.pointerId, over = -1;
    var ghost = o.el.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.style.transform = ''; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost); o.drag = true; o.el.style.visibility = 'hidden';
    function mv(ev) {
      if (ev.pointerId !== pid) return;
      ghost.style.left = (ev.clientX - dx) + 'px'; ghost.style.top = (ev.clientY - dy) + 'px';
      var b = binAt(ev.clientX, ev.clientY);
      if (b !== over) { if (over >= 0) document.getElementById('bin' + over).classList.remove('over'); if (b >= 0) document.getElementById('bin' + b).classList.add('over'); over = b; }
    }
    function cleanup() {
      document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      if (over >= 0) document.getElementById('bin' + over).classList.remove('over');
      ghost.remove(); o.drag = false; o.cancelDrag = null;
    }
    function up(ev) {
      if (ev.pointerId !== pid) return;
      var b = binAt(ev.clientX, ev.clientY);
      cleanup();
      if (o.done || !run || !run.live) return;
      if (b >= 0) { resolve(o, b); return; }
      o.el.style.visibility = '';
    }
    o.cancelDrag = cleanup;
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  }
  function setFb(t) { document.getElementById('fb').textContent = t; }
  function tapBin(gi) {
    if (!run || !run.live || run.paused || cfg.mode === 'drag') return;
    if (!run.sel) return;
    resolve(run.sel, gi);
  }
  function resolve(o, gi) {
    if (o.done) return; o.done = true;
    var w = o.w, cur = run.turn % cfg.teams, g = run.s.groups[w.g];
    var ok = (gi === w.g);
    if (ok) {
      run.streak++; var pts = 10 + (run.streak % 3 === 0 ? 5 : 0); run.scores[cur] += pts;
      o.el.classList.add('good'); setFb('✔ ' + w.en + ' → ' + g.n + '  +' + pts + (run.streak >= 3 ? '  🔥' + run.streak : ''));
    } else {
      run.streak = 0; o.el.classList.add('bad');
      setFb((gi < 0 ? '⏰ ' : '✘ ') + w.en + ' → ' + g.n + (TR ? '  (' + w.tr + ')' : ''));
    }
    if (o.cancelDrag) o.cancelDrag();
    o.el.remove(); run.words = run.words.filter(function (x) { return x !== o; });
    if (ok) markBin(gi, 'ok'); else { if (gi >= 0) markBin(gi, 'no'); markBin(w.g, 'hint'); }
    run.resolved++; drawScoreOnly();
    run.sel = null; autoSel();
    if (run.resolved >= WORDS_PER_TURN) endTurn();
  }
  function markBin(i, kind) {
    var b = document.getElementById('bin' + i); if (!b) return;
    clearTimeout(b._t); b.classList.remove('ok', 'no', 'hint'); b.classList.add(kind);
    b.querySelector('.mark').textContent = kind === 'ok' ? '✔' : '✘';
    b._t = setTimeout(function () { b.classList.remove(kind); }, 750);
  }
  function drawScoreOnly() {
    var cur = run.turn % cfg.teams, els = document.querySelectorAll('#sb .team');
    run.scores.forEach(function (sc, i) { if (els[i]) els[i].textContent = (cfg.teams === 1 ? 'Score' : 'Team ' + (i + 1)) + ': ' + sc; });
  }
  function endTurn() {
    run.live = false; cancelAnimationFrame(raf);
    setTimeout(function () {
      run.turn++;
      if (run.turn >= run.turns) { finish(); } else { setFb(''); announce(); drawScore(); }
    }, 900);
  }
  function finish() {
    var best = Math.max.apply(null, run.scores), win = [];
    run.scores.forEach(function (s, i) { if (s === best) win.push(i); });
    var t = cfg.teams === 1 ? (best >= WORDS_PER_TURN * cfg.rounds * 10 * .8 ? 'Word Master!' : (best >= WORDS_PER_TURN * cfg.rounds * 10 * .5 ? 'Well Done!' : 'Good Try!')) : (win.length > 1 ? "It's a Draw!" : 'Team ' + (win[0] + 1) + ' Wins!');
    document.getElementById('win-title').textContent = t;
    var l = document.getElementById('win-list'); l.innerHTML = '';
    run.scores.forEach(function (s, i) { var d = document.createElement('div'); d.className = 'team'; d.style.background = TEAM_COLORS[i]; d.textContent = (cfg.teams === 1 ? 'Score' : 'Team ' + (i + 1)) + ': ' + s; l.appendChild(d); });
    document.getElementById('win-screen').style.display = 'flex'; setFb('');
  }
  document.addEventListener('keydown', function (e) { if (/^[1-3]$/.test(e.key)) tapBin(+e.key - 1); });
  showLearn(0);
</script>
</body>
</html>

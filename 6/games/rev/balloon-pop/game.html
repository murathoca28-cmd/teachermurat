<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 6px 12px 12px; }
  #clue { background: #fff; border: 5px solid #0B2F2C; border-radius: 20px; padding: 8px 18px; text-align: center; }
  #c-en { font-weight: 900; font-size: clamp(1.3rem, 3.6vw, 2.8rem); line-height: 1.2; }
  #c-tr { font-weight: 800; font-size: clamp(1rem, 2.1vw, 1.6rem); color: #0B5C56; }
  #sky { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-evenly; gap: 10px; padding: 0 6px 10px; }
  .balloon { position: relative; width: clamp(110px, 20vw, 250px); aspect-ratio: .82; background: var(--c); border: 6px solid #0B2F2C; border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 6px;
    font-weight: 900; font-size: clamp(1.2rem, 3.4vw, 2.6rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; line-height: 1.05; animation: bob 2.4s ease-in-out infinite; }
  .balloon:nth-child(2) { animation-delay: -.6s; } .balloon:nth-child(3) { animation-delay: -1.2s; } .balloon:nth-child(4) { animation-delay: -1.8s; }
  .balloon::before { content: ''; position: absolute; left: 50%; top: 100%; width: 0; height: 0; transform: translateX(-50%);
    border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 16px solid #0B2F2C; margin-top: 2px; }
  .balloon::after { content: ''; position: absolute; left: 50%; top: calc(100% + 16px); width: 0; height: 60px; border-left: 5px solid #0B2F2C; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
  .balloon.pop { animation: pop .45s forwards; }
  @keyframes pop { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
  .balloon.wrong { filter: grayscale(1); opacity: .45; animation: none; }
  .balloon:disabled { cursor: default; }
  #fb { min-height: 1.3em; text-align: center; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  #next { display: none; align-self: center; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }

img.ei{height:1.12em;width:auto;vertical-align:-.2em;display:inline-block;object-fit:contain}
.eiw{display:inline-block;line-height:0;vertical-align:-.15em}
.eiw svg.ei{width:1em;height:1em;display:inline-block}
.preview svg.bl{height:1.7em;width:auto;vertical-align:middle;margin:0 .1em}#fb .eiw svg.ei path{stroke:#fff}</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Balloon<br>Pop</h1>
  <p class="subtitle">Read the clue and pop the right balloon!</p>
  <div class="preview"><svg class="bl" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 29c-1 1.5 1 2 0 3" fill="none" stroke="#0B3D41" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="12" cy="11" rx="8.6" ry="10" fill="#E5484D" stroke="#0B3D41" stroke-width="2"/><path d="M12 21l-2.2 3.4h4.4z" fill="#E5484D" stroke="#0B3D41" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.2 8c.6-2.2 2.2-3.4 4-3.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".8"/></svg> <svg class="bl" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 29c-1 1.5 1 2 0 3" fill="none" stroke="#0B3D41" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="12" cy="11" rx="8.6" ry="10" fill="#FFD23F" stroke="#0B3D41" stroke-width="2"/><path d="M12 21l-2.2 3.4h4.4z" fill="#FFD23F" stroke="#0B3D41" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.2 8c.6-2.2 2.2-3.4 4-3.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".8"/></svg> <svg class="bl" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 29c-1 1.5 1 2 0 3" fill="none" stroke="#0B3D41" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="12" cy="11" rx="8.6" ry="10" fill="#2F6FDE" stroke="#0B3D41" stroke-width="2"/><path d="M12 21l-2.2 3.4h4.4z" fill="#2F6FDE" stroke="#0B3D41" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.2 8c.6-2.2 2.2-3.4 4-3.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".8"/></svg></div>
  <button class="big-btn" onclick="startGame()">Start</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Clue: <span id="rn">1</span>/10</div>
  <div class="stat">Score: <span id="sc">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="clue"><div id="c-en"></div><div id="c-tr" class="tr"></div></div>
  <div id="sky"></div>
  <div id="fb"></div>
  <button class="big-btn" id="next" onclick="nextClue()">Next</button>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { var f = document.getElementById('fb'); if (f) f.textContent = fbParts ? fbParts[0] + (TR && fbParts[1] ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var CLUES = [["You wear them on your hands in winter.", "Kışın ellerine giyersin.", ["gloves", "boots", "cap", "scarf"], "gloves"], ["It protects your eyes from the sun.", "Gözlerini güneşten korur.", ["sunglasses", "umbrella", "gloves", "coat"], "sunglasses"], ["You open it on a rainy day.", "Yağmurlu bir günde açarsın.", ["umbrella", "sandals", "dress", "cap"], "umbrella"], ["It is the biggest animal in the national park.", "Milli parktaki en büyük hayvandır.", ["elephant", "deer", "owl", "bear"], "elephant"], ["It is a bird and it can copy words.", "Bir kuştur ve kelimeleri taklit edebilir.", ["parrot", "owl", "monkey", "tiger"], "parrot"], ["You can borrow books here.", "Burada kitap ödünç alabilirsin.", ["library", "bakery", "museum", "stadium"], "library"], ["You can buy bread here.", "Burada ekmek alabilirsin.", ["bakery", "library", "museum", "cinema"], "bakery"], ["You eat it with a spoon from a bowl. It is hot.", "Kaseden kaşıkla yersin. Sıcaktır.", ["soup", "pizza", "cake", "cheese"], "soup"], ["It is cold and sweet. It is made of milk.", "Soğuk ve tatlıdır. Sütten yapılır.", ["ice cream", "soup", "salad", "pasta"], "ice cream"], ["There are no clouds. The sun is shining.", "Bulut yok. Güneş parlıyor.", ["sunny", "rainy", "snowy", "cloudy"], "sunny"], ["It has a very long neck.", "Çok uzun bir boynu vardır.", ["giraffe", "lion", "bear", "deer"], "giraffe"], ["You can wear it to a party. It can be long or short.", "Partiye giyebilirsin. Uzun ya da kısa olabilir.", ["dress", "gloves", "boots", "scarf"], "dress"], ["It jumps and carries its baby in a pocket.", "Zıplar ve yavrusunu bir cebinde taşır.", ["kangaroo", "monkey", "rabbit", "deer"], "kangaroo"], ["You go to this place to have a meal. A waiter helps you.", "Yemek yemek için bu yere gidersin. Bir garson sana yardım eder.", ["restaurant", "library", "stadium", "museum"], "restaurant"]];
  var COLORS = ['#D62828', '#1F5FBF', '#0A7A2F', '#7B2CBF'], order, qi, score, tries, done;
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(CLUES.slice()).slice(0, 10); qi = 0; score = 0; document.getElementById('sc').textContent = 0; showClue();
  }
  function showClue() {
    var q = order[qi]; tries = 0; done = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('c-en').textContent = q[0]; document.getElementById('c-tr').textContent = q[1];
    fbParts = null; renderFb(); document.getElementById('next').style.display = 'none';
    var sky = document.getElementById('sky'); sky.innerHTML = '';
    shuffle(q[2].slice()).forEach(function (w, i) {
      var b = document.createElement('button'); b.className = 'balloon'; b.style.setProperty('--c', COLORS[i]); b.textContent = w;
      b.addEventListener('click', function () { popIt(b, w); });
      sky.appendChild(b);
    });
  }
  function popIt(b, w) {
    if (done || b.classList.contains('wrong')) return;
    var q = order[qi];
    if (w === q[3]) {
      done = true; b.classList.add('pop'); if (tries === 0) { score++; document.getElementById('sc').textContent = score; }
      setFb('✔ Pop! It is "' + q[3] + '".', 'Doğru!');
      Array.prototype.forEach.call(document.querySelectorAll('.balloon'), function (x) { if (x !== b) x.disabled = true; });
      var nx = document.getElementById('next'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      tries++; b.classList.add('wrong'); b.disabled = true; setFb('✘ Not this one. Try again!', 'Bu değil. Tekrar dene!');
    }
  }
  function nextClue() {
    qi++;
    if (qi >= order.length) {
      document.getElementById('win-title').textContent = score >= 9 ? 'Balloon Master!' : (score >= 6 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Score: ' + score + ' / ' + order.length;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showClue();
  }
</script>
<script>
(function(){
var IM={}, EM={"\u2714": "v_ok", "\u2718": "v_no"}, SV={"v_ok": "<svg class=\"ei\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12.5l5 5L20 6.5\" fill=\"none\" stroke=\"#1E9E5A\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "v_no": "<svg class=\"ei\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5.5 5.5l13 13M18.5 5.5l-13 13\" fill=\"none\" stroke=\"#E5484D\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"};
var RE=/(?:[⌐-⏿←-⇿①-⓿■-◿☀-➿⤀-⥿⬀-⯿]|[\uD83C-\uD83E][\uDC00-\uDFFF])️?(?:‍(?:[☀-➿]|[\uD83C-\uD83E][\uDC00-\uDFFF])️?)*|⟦[a-z0-9_]+⟧/g;
var SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,TITLE:1,OPTION:1};
function mk(key){
  if(SV[key]){var s=document.createElement('span');s.className='eiw';s.innerHTML=SV[key];return s;}
  if(IM[key]){var i=document.createElement('img');i.className='ei';i.alt='';i.setAttribute('draggable','false');i.src=IM[key];return i;}
  return null;
}
function fixText(t){
  var v=t.nodeValue; RE.lastIndex=0; if(!RE.test(v)){return;} RE.lastIndex=0;
  var p=t.parentNode; if(!p||SKIP[p.nodeName])return;
  var inSvg=(p.namespaceURI&&p.namespaceURI.indexOf('svg')>=0);
  var out=[],last=0,m;
  while((m=RE.exec(v))){
    out.push(v.slice(last,m.index)); last=m.index+m[0].length;
    if(inSvg)continue;
    var s=m[0], key;
    if(s.charAt(0)==='⟦') key='t_'+s.slice(1,-1);
    else key=EM[s.replace(/️/g,'').replace(/‍[\s\S]*$/,'')];
    var n=key&&mk(key); if(n)out.push(n);
  }
  out.push(v.slice(last));
  if(inSvg){t.nodeValue=out.join('').replace(/\s{2,}/g,' ').trim();return;}
  var f=document.createDocumentFragment();
  out.forEach(function(x){f.appendChild(typeof x==='string'?document.createTextNode(x):x);});
  p.replaceChild(f,t);
}
function fillImgs(root){
  var l=root.querySelectorAll?root.querySelectorAll('img[data-i]'):[];
  for(var i=0;i<l.length;i++){var e=l[i];if(!e.getAttribute('src')&&IM[e.getAttribute('data-i')])e.src=IM[e.getAttribute('data-i')];}
  if(root.tagName==='IMG'&&root.getAttribute('data-i')&&!root.getAttribute('src'))root.src=IM[root.getAttribute('data-i')];
}
function walk(n){
  if(n.nodeType===3){fixText(n);return;}
  if(n.nodeType!==1||SKIP[n.nodeName])return;
  fillImgs(n);
  var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),a=[],x;
  while((x=w.nextNode()))a.push(x);
  a.forEach(function(t){if(t.parentNode&&!SKIP[t.parentNode.nodeName])fixText(t);});
}
function start(){
  walk(document.body);
  new MutationObserver(function(ms){
    for(var i=0;i<ms.length;i++){var m=ms[i];
      if(m.type==='characterData')walk(m.target);
      else for(var j=0;j<m.addedNodes.length;j++)walk(m.addedNodes[j]);}
  }).observe(document.body,{childList:true,subtree:true,characterData:true});
}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
</script>
</body>
</html>

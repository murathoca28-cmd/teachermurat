<style>

  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;

  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 4px 12px 12px; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #left { flex: 1.1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #card { flex: 1; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 20px; padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  #qmark { text-align: center; font-weight: 900; font-size: clamp(2rem, 8vh, 4.5rem); line-height: 1; color: #D62828; }
  .cl { border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 12px; background: #FFF3B0; }
  .cl .en { font-weight: 900; font-size: clamp(1.1rem, 2.8vw, 2.1rem); line-height: 1.2; }
  .cl .trl { font-weight: 800; font-size: clamp(.8rem, 1.6vw, 1.2rem); color: #0B5C56; }
  #ctl { flex: 0 0 auto; display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  #nc { font-size: clamp(1rem, 2.4vw, 1.7rem); }
  #nc:disabled { opacity: .45; cursor: default; }
  #fb { font-weight: 900; font-size: clamp(1rem, 2.2vw, 1.6rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; text-align: center; min-height: 1.3em; }
  #right { flex: 1 1 0; min-width: 0; min-height: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .tile { container-type: size; min-width: 0; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B2F2C; }
  .tile .e { font-size: 40cqmin; line-height: 1.1; }
  .tile .p { font-weight: 900; font-size: 13cqmin; line-height: 1.1; }
  .tile .t { font-weight: 800; font-size: 9.5cqmin; color: #0B5C56; }
  .tile.bad { background: #FFD6D6; border-color: #D62828; }
  .tile.good { background: #C8F7D4; border-color: #0A7A2F; border-width: 8px; }
  #nxt { display: none; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }

</button>
<div id="start-screen">

<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var R = [{"k": "library", "en": ["I am a place at school.", "There are many shelves in me.", "You must be quiet in me.", "You borrow books from me."], "tr": ["Okulda bir yerim.", "İçimde çok raf var.", "Bende sessiz olmalısın.", "Kitapları benden ödünç alırsın."], "opts": [["library", "⟦library⟧", "library", "kütüphane"], ["lab", "⟦science_lab⟧", "science lab", "fen laboratuvarı"], ["field", "⟦sports_field⟧", "sports field", "spor sahası"], ["lunch", "⟦lunch_hall⟧", "lunch hall", "yemekhane"]]}, {"k": "lunch", "en": ["I am a place at school.", "I have many tables and chairs.", "Students come to me at noon.", "You eat in me."], "tr": ["Okulda bir yerim.", "Çok masam ve sandalyem var.", "Öğrenciler öğlen bana gelir.", "Bende yemek yersin."], "opts": [["lunch", "⟦lunch_hall⟧", "lunch hall", "yemekhane"], ["library", "⟦library⟧", "library", "kütüphane"], ["garden", "⟦school_garden⟧", "school garden", "okul bahçesi"], ["hall", "⟦conference_hall⟧", "conference hall", "konferans salonu"]]}, {"k": "lab", "en": ["I am a place at school.", "You can see tubes and a microscope in me.", "You wear a coat in me.", "You do experiments in me."], "tr": ["Okulda bir yerim.", "İçimde tüpler ve mikroskop görürsün.", "Bende önlük giyersin.", "Bende deney yaparsın."], "opts": [["lab", "⟦science_lab⟧", "science lab", "fen laboratuvarı"], ["art", "⟦painting_palette⟧", "art club", "resim kulübü"], ["library", "⟦library⟧", "library", "kütüphane"], ["field", "⟦sports_field⟧", "sports field", "spor sahası"]]}, {"k": "garden", "en": ["I am outside.", "I am green and colourful.", "You can see flowers and trees in me.", "Students water the plants in me."], "tr": ["Dışarıdayım.", "Yeşil ve rengârenkim.", "İçimde çiçekler ve ağaçlar görürsün.", "Öğrenciler bende bitkileri sular."], "opts": [["garden", "⟦school_garden⟧", "school garden", "okul bahçesi"], ["field", "⟦sports_field⟧", "sports field", "spor sahası"], ["lunch", "⟦lunch_hall⟧", "lunch hall", "yemekhane"], ["hall", "⟦conference_hall⟧", "conference hall", "konferans salonu"]]}, {"k": "head", "en": ["I work at school.", "I am the head of the school.", "I give a speech at a ceremony.", "My room is bigger than a classroom."], "tr": ["Okulda çalışırım.", "Okulun başıyım.", "Törende konuşma yaparım.", "Odam bir sınıftan daha büyüktür."], "opts": [["head", "⟦headmaster⟧", "headmaster", "okul müdürü"], ["coach", "⟦coach⟧", "coach", "antrenör"], ["cook", "⟦cook⟧", "cook", "aşçı"], ["sec", "⟦secretary⟧", "secretary", "sekreter"]]}, {"k": "cook", "en": ["I work at school.", "I wear an apron.", "I work in the kitchen.", "I make the lunch for the students."], "tr": ["Okulda çalışırım.", "Önlük takarım.", "Mutfakta çalışırım.", "Öğrenciler için öğle yemeğini yaparım."], "opts": [["cook", "⟦cook⟧", "cook", "aşçı"], ["head", "⟦headmaster⟧", "headmaster", "okul müdürü"], ["sec", "⟦secretary⟧", "secretary", "sekreter"], ["coach", "⟦coach⟧", "coach", "antrenör"]]}, {"k": "coach", "en": ["I work at school.", "I wear sports shoes.", "I blow a whistle.", "I train the football team."], "tr": ["Okulda çalışırım.", "Spor ayakkabısı giyerim.", "Düdük çalarım.", "Futbol takımını çalıştırırım."], "opts": [["coach", "⟦coach⟧", "coach", "antrenör"], ["cook", "⟦cook⟧", "cook", "aşçı"], ["head", "⟦headmaster⟧", "headmaster", "okul müdürü"], ["sec", "⟦secretary⟧", "secretary", "sekreter"]]}, {"k": "sec", "en": ["I work at school.", "I sit at a desk in the office.", "I answer the phone.", "I write letters for the school."], "tr": ["Okulda çalışırım.", "Ofiste bir masada otururum.", "Telefona cevap veririm.", "Okul için yazılar yazarım."], "opts": [["sec", "⟦secretary⟧", "secretary", "sekreter"], ["coach", "⟦coach⟧", "coach", "antrenör"], ["cook", "⟦cook⟧", "cook", "aşçı"], ["head", "⟦headmaster⟧", "headmaster", "okul müdürü"]]}, {"k": "flag", "en": ["I am on a national day.", "I am red and white.", "A student carries me.", "I am the symbol of the country."], "tr": ["Milli bir günde ortadayım.", "Kırmızı ve beyazım.", "Bir öğrenci beni taşır.", "Ülkenin sembolüyüm."], "opts": [["flag", "⟦flag⟧", "flag", "bayrak"], ["poem", "⟦poem⟧", "poem", "şiir"], ["choir", "⟦choir⟧", "choir", "koro"], ["speech", "⟦speech⟧", "speech", "konuşma"]]}, {"k": "choir", "en": ["I am a group.", "I have many students.", "We stand together on a stage.", "We sing songs."], "tr": ["Bir grubum.", "Çok öğrencim var.", "Sahnede birlikte dururuz.", "Şarkı söyleriz."], "opts": [["choir", "⟦choir⟧", "choir", "koro"], ["parade", "⟦parade⟧", "parade", "geçit töreni"], ["flag", "⟦flag⟧", "flag", "bayrak"], ["poem", "⟦poem⟧", "poem", "şiir"]]}, {"k": "parade", "en": ["I am an event.", "I am outside.", "People walk in me with flags.", "Drums play in me."], "tr": ["Bir etkinliğim.", "Dışarıdayım.", "İnsanlar bende bayraklarla yürür.", "Bende davullar çalar."], "opts": [["parade", "⟦parade⟧", "parade", "geçit töreni"], ["choir", "⟦choir⟧", "choir", "koro"], ["speech", "⟦speech⟧", "speech", "konuşma"], ["talent", "⟦talent_show⟧", "talent show", "yetenek gösterisi"]]}, {"k": "poem", "en": ["I am a text.", "I am short and beautiful.", "I have lines and rhymes.", "A student can read me aloud at a ceremony."], "tr": ["Bir metinim.", "Kısa ve güzelim.", "Dizelerim ve kafiyelerim var.", "Bir öğrenci beni törende yüksek sesle okuyabilir."], "opts": [["poem", "⟦poem⟧", "poem", "şiir"], ["flag", "⟦flag⟧", "flag", "bayrak"], ["anthem", "⟦sheet_music⟧", "national anthem", "milli marş"], ["speech", "⟦speech⟧", "speech", "konuşma"]]}, {"k": "anthem", "en": ["I am a song.", "I am for the whole country.", "Everyone stands up for me.", "We sing me at every ceremony."], "tr": ["Bir şarkıyım.", "Bütün ülke içinim.", "Benim için herkes ayağa kalkar.", "Beni her törende söyleriz."], "opts": [["anthem", "⟦sheet_music⟧", "national anthem", "milli marş"], ["choir", "⟦choir⟧", "choir", "koro"], ["poem", "⟦poem⟧", "poem", "şiir"], ["parade", "⟦parade⟧", "parade", "geçit töreni"]]}, {"k": "talent", "en": ["I am an event.", "I am on a stage.", "Students show their skills in me.", "They sing, dance and play music in me."], "tr": ["Bir etkinliğim.", "Sahnedeyim.", "Öğrenciler bende yeteneklerini gösterir.", "Bende şarkı söyler, dans eder ve müzik çalarlar."], "opts": [["talent", "⟦talent_show⟧", "talent show", "yetenek gösterisi"], ["assembly", "⟦assembly⟧", "assembly", "okul toplantısı"], ["parade", "⟦parade⟧", "parade", "geçit töreni"], ["ceremony", "⟦school_ceremony⟧", "school ceremony", "okul töreni"]]}], ROUNDS = 10;
  var order, qi, shown, wrong, score, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(R.slice()).slice(0, ROUNDS); qi = 0; score = 0;
    document.getElementById('sc').textContent = 0;
    showR();
  }
  function addClue() {
    var q = order[qi], i = shown;
    var d = document.createElement('div'); d.className = 'cl';
    d.innerHTML = '<div class="en">' + (i + 1) + '. ' + q.en[i] + '</div><div class="trl tr">' + q.tr[i] + '</div>';
    document.getElementById('cls').appendChild(d);
    shown++;
    document.getElementById('nc').disabled = (shown >= q.en.length);
    if (d.scrollIntoView) d.scrollIntoView({ block: 'nearest' });
  }
  function showR() {
    var q = order[qi]; shown = 0; wrong = 0; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('cls').innerHTML = ''; document.getElementById('qmark').textContent = '?';
    document.getElementById('fb').textContent = ''; document.getElementById('nxt').style.display = 'none';
    document.getElementById('nc').style.display = ''; document.getElementById('nc').disabled = false;
    addClue();
    var box = document.getElementById('right'); box.innerHTML = '';
    shuffle(q.opts.slice()).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = '<div class="e">' + o[1] + '</div><div class="p">' + o[2] + '</div><div class="t tr">' + o[3] + '</div>';
      b.addEventListener('click', function () { guess(b, o[0]); });
      box.appendChild(b);
    });
  }
  function moreClue() { if (locked) return; if (shown < order[qi].en.length) addClue(); }
  function guess(btn, k) {
    if (locked || btn.classList.contains('bad')) return;
    var q = order[qi];
    if (k === q.k) {
      locked = true;
      var pts = Math.max(0, (q.en.length - shown + 1) - wrong); score += pts;
      document.getElementById('sc').textContent = score;
      btn.classList.add('good');
      var o = q.opts[0]; document.getElementById('qmark').innerHTML = o[1];
      document.getElementById('fb').textContent = '✔ I am ' + (/^[aeiou]/.test(o[2]) ? 'an ' : 'a ') + o[2] + '!  +' + pts + (pts === 1 ? ' point' : ' points');
      document.getElementById('nc').style.display = 'none';
      var nx = document.getElementById('nxt'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      wrong++; btn.classList.add('bad', 'shake');
      document.getElementById('fb').textContent = 'Not this one. Try again!';
    }
  }
  function nextR() {
    qi++;
    if (qi >= order.length) {
      var max = ROUNDS * 4;
      document.getElementById('win-title').textContent = score >= 32 ? 'Super Detective!' : (score >= 22 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Points: ' + score + ' / ' + max;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showR();
  }
</script>

  }

  };

})();

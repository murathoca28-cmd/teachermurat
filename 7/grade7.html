<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 7 - Tests</title>
    <style>
        /* ----- GENEL AYARLAR ----- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle, #ffffff 0%, #f0f2f5 100%);
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            box-sizing: border-box;
        }

        /* BAŞLIK */
        .page-title {
            text-align: center;
            margin-bottom: 25px;
        }
        .page-title h1 {
            font-size: 38px;
            margin: 0;
            font-weight: 800;
            background: linear-gradient(to right, #FF6B6B, #FF8E53);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
            letter-spacing: -1px;
        }
        .page-title .sub-desc {
            font-size: 18px;
            color: #5d6d7e;
            margin-top: 5px;
            font-weight: 500;
            background: none;
            -webkit-text-fill-color: #5d6d7e;
        }

        /* ANA MENÜ (2 Büyük Buton) */
        .menu-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 600px;
        }

        /* ÜNİTE KONTEYNERİ (Başlangıçta Gizli) */
        .unit-container {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            margin-top: 10px;
            animation: fadeIn 0.4s ease;
        }

        /* Buton Kartları (Ortak) */
        .card {
            text-decoration: none;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            color: white;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
            font-family: inherit;
            text-align: center;
            padding: 15px;
        }
        .card:hover {
            transform: scale(1.05) translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        /* --- 2 ANA BUTON STİLLERİ --- */
        .menu-card {
            width: 220px;
            height: 180px;
        }
        .menu-card .icon { font-size: 48px; margin-bottom: 8px; }
        .menu-card .label { font-size: 20px; font-weight: 700; text-shadow: 1px 1px 3px rgba(0,0,0,0.2); }

        .mc-main { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .rev-main { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #1e3c32; }
        .rev-main .label { text-shadow: 1px 1px 2px rgba(255,255,255,0.4); }

        /* --- ÜNİTE BUTON STİLLERİ (Küçük kartlar - Scroll engellendi) --- */
        .unit-card {
            width: 110px;
            height: 95px; /* Küçültüldü */
            background: white;
            color: #2c3e50;
            border: 2px solid #4a6fa5;   /* koyu mavi çerçeve */
             box-shadow: 0 6px 15px rgba(0,0,0,0.15); /* daha belirgin gölge */
            border-radius: 20px;
        }
        .unit-card:hover {
            border-color: #4ca1af;
            background: #f8f9fa;
        }
        .unit-card .icon { font-size: 24px; margin-bottom: 2px; }
        .unit-card .label { font-size: 14px; font-weight: 600; color: #2c3e50; text-shadow: none; }

        /* Geri Butonu */
        .back-btn {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }
        .back-btn button {
            background: rgba(44, 62, 80, 0.1);
            border: 2px solid #2c3e50;
            color: #2c3e50;
            padding: 8px 30px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }
        .back-btn button:hover {
            background: #2c3e50;
            color: white;
            transform: scale(1.02);
        }

        /* Geçiş Animasyonu */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Grid aralığı */
        #unitGrid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px !important;
            width: 100%;
        }

        /* --- MOBİL UYUMLULUK --- */
        @media (max-width: 600px) {
            .page-title h1 { font-size: 28px; }
            .menu-card { width: 160px; height: 140px; }
            .menu-card .icon { font-size: 36px; }
            .menu-card .label { font-size: 16px; }
            .unit-card { 
                width: calc(50% - 15px); 
                max-width: 110px; 
                height: 85px; 
            }
            .unit-card .icon { font-size: 20px; }
            .unit-card .label { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

<!-- BAŞLIK -->
<div class="page-title">
    <h1>📘 GRADE 7</h1>
    <p class="sub-desc">Choose your activity below</p>
</div>

<!-- 1. AŞAMA: ANA MENÜ (2 BUTON) -->
<div id="menuContainer" class="menu-container">
    <button onclick="showUnits('mc')" class="card menu-card mc-main">
        <div class="icon">📝</div>
        <div class="label">Multiple Choice Tests</div>
    </button>
    <button onclick="showUnits('rev')" class="card menu-card rev-main">
        <div class="icon">🔄</div>
        <div class="label">Revision Activities</div>
    </button>
</div>

<!-- 2. AŞAMA: ÜNİTE LİSTESİ (Başlangıçta Gizli) -->
<div id="unitContainer" class="unit-container">
    <!-- Geri Butonu -->
    <div class="back-btn">
        <button onclick="goBack()">⬅ Geri Dön</button>
    </div>

    <!-- Üniteler buraya gelecek -->
    <div id="unitGrid"></div>
</div>

<script>
    // ============================================================
    // ✅ BURASI ÇOK ÖNEMLİ! İKİ AYRI LİSTE OLUŞTURDUM.
    // Şimdi "Multiple Choice" ve "Revision" linklerini AYRI AYRI girebilirsin.
    // ============================================================

    // 📌 1. MULTIPLE CHOICE TESTLER İÇİN LİSTELER (10 Ünite)
    const mcUnits = [
        { name: 'Revs ', icon: '📝', url: 'multop_buton.html' },
        { name: 'Unit 1', icon: '📝', url: '****** MC - UNITE 2 LİNKİ ******' },
        { name: 'Unit 2', icon: '📝', url: '****** MC - UNITE 3 LİNKİ ******' },
        { name: 'Unit 3', icon: '📝', url: '****** MC - UNITE 4 LİNKİ ******' },
        { name: 'Unit 4', icon: '📝', url: '****** MC - UNITE 5 LİNKİ ******' },
        { name: 'Unit 5', icon: '📝', url: '****** MC - UNITE 6 LİNKİ ******' },
        { name: 'Unit 6', icon: '📝', url: '****** MC - UNITE 7 LİNKİ ******' },
        { name: 'Unit 7', icon: '📝', url: '****** MC - UNITE 8 LİNKİ ******' },
        { name: 'Unit 8', icon: '📝', url: '****** MC - UNITE 9 LİNKİ ******' },
    ];

    // 📌 2. REVISION ACTIVITIES İÇİN LİSTELER (10 Ünite) - Tamamen bağımsız!
    const revUnits = [
        { name: 'Revs', icon: '🔄', url: 'rev_buton.html' },
        { name: 'Unit 1', icon: '🔄', url: '****** REV - UNITE 2 LİNKİ ******' },
        { name: 'Unit 2', icon: '🔄', url: '****** REV - UNITE 3 LİNKİ ******' },
        { name: 'Unit 3', icon: '🔄', url: '****** REV - UNITE 4 LİNKİ ******' },
        { name: 'Unit 4', icon: '🔄', url: '****** REV - UNITE 5 LİNKİ ******' },
        { name: 'Unit 5', icon: '🔄', url: '****** REV - UNITE 6 LİNKİ ******' },
        { name: 'Unit 6', icon: '🔄', url: '****** REV - UNITE 7 LİNKİ ******' },
        { name: 'Unit 7', icon: '🔄', url: '****** REV - UNITE 8 LİNKİ ******' },
        { name: 'Unit 8', icon: '🔄', url: '****** REV - UNITE 9 LİNKİ ******' },
    ];

    // ============================================================
    // 🔴 DEĞİŞTİRMEN GEREKEN YERLER BURASI BİTTI. 
    // Aşağıdaki kodlara dokunma, otomatik çalışıyor.
    // ============================================================

    // Üniteleri ekrana basan fonksiyon (Artık hangi liste geleceğini biliyor)
    function renderUnits(type) {
        const grid = document.getElementById('unitGrid');
        grid.innerHTML = ''; // Önceki içeriği temizle

        // Hangisini göstereceğimizi seçelim
        let data = [];
        let typeTitle = '';
        let titleColor = '';

        if (type === 'mc') {
            data = mcUnits;
            typeTitle = '📝 Multiple Choice Tests';
            titleColor = '#4facfe';
        } else {
            data = revUnits;
            typeTitle = '🔄 Revision Activities';
            titleColor = '#43e97b';
        }

        // Kategori başlığını ekle
        const titleDiv = document.createElement('div');
        titleDiv.style.width = '100%';
        titleDiv.style.textAlign = 'center';
        titleDiv.style.marginBottom = '8px';
        titleDiv.style.fontSize = '20px';
        titleDiv.style.fontWeight = 'bold';
        titleDiv.style.color = titleColor;
        titleDiv.innerText = typeTitle;
        grid.appendChild(titleDiv);

        // 10 üniteyi döngüyle oluştur (Artık doğru listeden geliyor)
        data.forEach(unit => {
            const link = document.createElement('a');
            link.href = unit.url;
            link.className = 'card unit-card';
            //link.target = '_blank'; // Yeni sekmede açmak için (istersen kaldır)
            
            link.innerHTML = `
                <div class="icon">${unit.icon}</div>
                <div class="label">${unit.name}</div>
            `;
            grid.appendChild(link);
        });
    }

    // Menüden bir butona tıklandığında çalışır
    function showUnits(type) {
        // Ana menüyü gizle
        document.getElementById('menuContainer').style.display = 'none';
        // Ünite konteynerini görünür yap
        const unitContainer = document.getElementById('unitContainer');
        unitContainer.style.display = 'flex';
        unitContainer.style.flexWrap = 'wrap';
        unitContainer.style.justifyContent = 'center';
        
        // Üniteleri render et (Hangi tür olduğunu gönder)
        renderUnits(type);
    }

    // Geri butonuna tıklandığında
    function goBack() {
        document.getElementById('menuContainer').style.display = 'flex';
        document.getElementById('unitContainer').style.display = 'none';
    }

    // Sayfa yüklendiğinde başlangıçta hiçbir ünite görünmesin
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('unitContainer').style.display = 'none';
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 7 Unit-1 Slides</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif;
            color: #1A1F23;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 20px 56px;
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 2.25rem;
            font-weight: 800;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 18px;
        }

        .card {
            background: #FFFFFF;
            border: 3px solid #334155;
            border-radius: 16px;
            box-shadow: 0 5px 0 #94A3B8;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-thumbnail {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;    /* taller image area; change to 16 / 9 for a flatter card */
            object-fit: cover;
            object-position: center;
            background: #E2E8F0;
            border-bottom: 3px solid #334155;
        }

        .card-body { padding: 10px 12px 14px; display: flex; flex-direction: column; flex: 1; }
        .card-body h3 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 800; color: #0B4F4A; }
        .card-body p { margin: 0 0 10px; font-size: 0.85rem; font-weight: 700; color: #3D4852; line-height: 1.3; }

        .btn {
            font-family: inherit;
            display: block;
            width: 100%;
            margin-top: auto;
            padding: 7px 12px;
            background: #C2410C;
            color: #FFFFFF;
            border: 3px solid #7C2D12;
            border-radius: 12px;
            box-shadow: 0 3px 0 #7C2D12;
            font-size: 1rem;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #7C2D12; }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7C2D12; }
        .btn:focus-visible { outline: 4px solid #F0A500; outline-offset: 3px; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            z-index: 100000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            width: 94%;
            max-width: 1100px;
            height: 90vh;
            background: #FFFFFF;
            border: 4px solid #334155;
            border-radius: 20px;
            box-shadow: 0 6px 0 #94A3B8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: #CCFBF1;
            border-bottom: 4px solid #334155;
        }

        .modal-header h2 { margin: 0; font-size: 1.5rem; font-weight: 800; color: #064E48; }

        .btn-close { width: auto; margin: 0; padding: 8px 20px; font-size: 1.1rem; flex-shrink: 0; }

        .modal-iframe-wrapper { flex: 1; background: #F8F9FA; }
        .modal-iframe-wrapper iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 700px) {
            h1 { font-size: 1.6rem; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
            .card-body h3 { font-size: 1.15rem; }
            .card-body p { font-size: 0.9rem; }
        }
    </style>
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
    <div id="navbar-placeholder" style="min-height: 64px;"></div>
    <script src="/navbar.js"></script>

    <div class="container">
        <h1>UNIT 1 SLIDES</h1>

        <div class="card-grid">
            <div class="card"
                 data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un1_slides/04-Grade7_Pre.pdf?v=2"
                 data-download="https://cdn.teachermurat.com/7/un1_slides/04-Grade7_Pre.pdf?v=2"
                 data-title="Slide 1">
                <img class="card-thumbnail" src="thumbnails/grade_7_un1_pre1.webp" alt="Slide 1" decoding="async">
                <div class="card-body">
                    <h3>Slide 1</h3>
                    <p>UNIT 1 SUMMARY</p>
                    <button class="btn open-modal">OPEN</button>
                </div>
            </div>

            <div class="card"
                 data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un1_slides/01-Grade7_Pre.pdf?v=1"
                 data-download="https://cdn.teachermurat.com/7/un1_slides/01-Grade7_Pre.pdf?v=1"
                 data-title="Slide 2">
                <img class="card-thumbnail" src="thumbnails/grade_7_un1_pre2.webp" alt="Slide 2" decoding="async">
                <div class="card-body">
                    <h3>Slide 2</h3>
                    <p>UNIT 1 SUMMARY</p>
                    <button class="btn open-modal">OPEN</button>
                </div>
            </div>

            <div class="card"
                 data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un1_slides/02-Grade7_Pre.pdf?v=1"
                 data-download="https://cdn.teachermurat.com/7/un1_slides/02-Grade7_Pre.pdf?v=1"
                 data-title="Slide 3">
                <img class="card-thumbnail" src="thumbnails/grade_7_un1_pre3.webp" alt="Slide 3" decoding="async">
                <div class="card-body">
                    <h3>Slide 3</h3>
                    <p>UNIT 1 SUMMARY</p>
                    <button class="btn open-modal">OPEN</button>
                </div>
            </div>

            <div class="card"
                 data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un1_slides/03-Grade7_Pre.pdf?v=1"
                 data-download="https://cdn.teachermurat.com/7/un1_slides/03-Grade7_Pre.pdf?v=1"
                 data-title="Slide 4">
                <img class="card-thumbnail" src="thumbnails/grade_7_un1_pre4.webp" alt="Slide 4" decoding="async">
                <div class="card-body">
                    <h3>Slide 4</h3>
                    <p>UNIT 1 ADJECTIVES</p>
                    <button class="btn open-modal">OPEN</button>
                </div>
            </div>

            <!-- ADD NEW CARDS HERE -->
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h2 id="modalTitle">Slide</h2>
                <button id="closeModalBtn" class="btn btn-close">Close ✕</button>
            </div>
            <div class="modal-iframe-wrapper">
                <iframe id="modalIframe" src="" title="Slide preview" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var overlay = document.getElementById('modalOverlay');
            var iframe = document.getElementById('modalIframe');
            var titleEl = document.getElementById('modalTitle');

            // Use a fresh iframe every time: changing the src of an existing iframe adds
            // an entry to the browser history (that is what made the Back button pile up).
            function loadFrame(url) {
                var fresh = iframe.cloneNode(false);
                fresh.removeAttribute('src');
                iframe.parentNode.replaceChild(fresh, iframe);
                iframe = fresh;
                if (url) fresh.src = url;
            }

            function closeModal() {
                loadFrame('');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            document.querySelectorAll('.open-modal').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var card = btn.closest('.card');
                    var embedUrl = (card.getAttribute('data-embed') || '').trim();
                    if (!embedUrl) return;
                    loadFrame(embedUrl);
                    titleEl.textContent = card.getAttribute('data-title') || 'Slide';
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });

            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) closeModal();
            });
        })();
    </script>
<script src="/back.js" data-href="/7/grade7.html#slides"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 7 Unit-1 Slides</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: radial-gradient(circle at top, #f0f9ff 0%, #d4eefe 40%, #b8e4fc 100%);
            padding: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }

        #navbar-placeholder {
            margin-bottom: 8px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            padding-top: 4px;
            margin-top: -8px;
        }
        h1 {
            color: #2c3e50;
            font-weight: 300;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* KART GRID - Küçültülmüş */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: #f6fbb2;
            border-radius: 18px;
            border: 2px solid black;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 28px rgba(0,0,0,0.12);
        }
        .card-thumbnail {
            display: block;
            width: 100%;
            height: 170px;
            object-fit: cover;
            object-position: center;
            background: #ecf0f1;
        }
        .card-body {
            padding: 12px 14px 14px;
        }
        .card-body h3 {
            margin-bottom: 4px;
            font-size: 0.95rem;
            color: #2c3e50;
        }
        .card-body p {
            margin-bottom: 12px;
            color: black;
            font-size: 0.78rem;
            line-height: 1.3;
        }
        .btn {
            display: inline-block;
            background: #3498db;
            color: white;
            border: 2px solid #1f618d;
            padding: 7px 14px;
            border-radius: 25px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2980b9;
            border-color: #154360;
        }

        /* MODAL (İlk Sayfadaki Tasarım) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 1000px;
            max-height: 85vh;
            padding: 20px 24px 24px;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .modal-header h2 {
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Narin, ikon şeklinde kapatma butonu */
        .modal-actions .btn-close {
            width: 34px;
            height: 34px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #f1f1f1;
            color: #666;
            font-size: 1rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        .modal-actions .btn-close:hover {
            background: #e74c3c;
            color: white;
        }

        .modal-iframe-wrapper {
            flex: 1;
            background: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }
        .modal-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            min-height: 550px;
            border: none;
        }

        @media (max-width: 700px) {
            .modal-box { padding: 16px; width: 95%; }
            .modal-header { flex-direction: column; align-items: stretch; gap: 12px; }
            .modal-iframe-wrapper iframe { min-height: 300px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
            .card-thumbnail { height: 150px; }
        }
    </style>
    <link rel="stylesheet" href="../../theme.css">
    <!-- FIX: thumbnail görselleri aynı origin'den değilse (CDN kullanıyorsanız)
         o domain için preconnect ekleyin, ör:
         <link rel="preconnect" href="https://cdn.teachermurat.com"> -->
</head>
<body>
    <div id="navbar-placeholder" style="min-height: 64px;"></div>
    <!-- FIX: defer eklendi. Önceden bu script senkron çalıştığı için tarayıcı
         navbar.js'i indirip çalıştırana kadar aşağıdaki kart görsellerinin
         HTML ayrıştırması / indirmeye başlaması gecikiyordu. -->
    <script src="../../navbar.js" defer></script>

    <div class="container">
        <h1>📚 UNIT 1 SLIDES</h1>

        <div class="card-grid">
            <!-- KART 1 -->
            <!-- FIX: loading="lazy" kaldırıldı — bu kart ilk ekranda (above the fold)
                 görünüyor, lazy-load tarayıcının onu görünürlük hesaplanana kadar
                 ertelemesine sebep oluyordu. fetchpriority="high" eklendi çünkü bu
                 muhtemelen sayfanın LCP (en büyük içerik boyama) elemanı. -->
            <div class="card" 
                 data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un1_slides/01-Grade7_Pre.pdf?v=1"
                 download="https://cdn.teachermurat.com/7/un1_slides/01-Grade7_Pre.pdf?v=1"
                 data-title="Slide 1">
                <img class="card-thumbnail" src="../thumbnails/grade_7_un1_pre1.webp" alt="Slide 1" fetchpriority="high" decoding="async">
                <div class="card-body">
                    <h3>Slide 1</h3>
                    <p>UNIT 1 SUMMARY</p>
                    <button class="btn open-modal">OPEN</button>
                </div>
            </div>

            <!-- KART 2 -->
            <!-- FIX: data-download düzeltildi — önceki kodda yanlışlıkla 1. slide'ın
                 pdf'ine işaret ediyordu (01-...pdf), şimdi 02-...pdf. -->
            <div class="card" 
                 data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un1_slides/02-Grade7_Pre.pdf?v=1"
                 download="https://cdn.teachermurat.com/7/un1_slides/02-Grade7_Pre.pdf?v=1"
                 data-title="Slide 1">
                <img class="card-thumbnail" src="../thumbnails/grade_7_un1_pre2.webp" alt="Slide 1" fetchpriority="high" decoding="async">
                <div class="card-body">
                    <h3>Slide 2</h3>
                    <p>UNIT 1 SUMMARY</p>
                    <button class="btn open-modal">OPEN</button>
                </div>
            </div>

            <!-- KART 3 -->
            <div class="card" 
                 data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un1_slides/03-Grade7_Pre.pdf?v=1"
                 download="https://cdn.teachermurat.com/7/un1_slides/03-Grade7_Pre.pdf"
                 data-title="Slide 1">
                <img class="card-thumbnail" src="../thumbnails/grade_7_un1_pre3.webp" alt="Slide 1" fetchpriority="high" decoding="async">
                <div class="card-body">
                    <h3>Slide 3</h3>
                    <p>UNIT 1 ADJECTIVES</p>
                    <button class="btn open-modal">OPEN</button>
                </div>
            </div>

            <!-- BURAYA YENİ KART EKLENEBİLİR -->
            <!-- NOT: Buradan sonra eklenecek kartlar (4. karttan itibaren), sayfa
                 yüklendiğinde ekran dışında kalacaksa loading="lazy" ile bırakılabilir.
                 Yalnızca İLK EKRANDA görünen kartlarda lazy-load kaldırılmalı. -->
        </div> <!-- ✅ GRID KAPATILDI -->
        
        <!-- MODAL (İlk Sayfadaki Yapı) -->
        <div id="modalOverlay" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header">
                    <h2 id="modalTitle">Sunum Başlığı</h2>
                    <div class="modal-actions">
                        <button id="closeModalBtn" class="btn btn-close" aria-label="Kapat">✕</button>
                    </div>
                </div>
                <div class="modal-iframe-wrapper">
                    <iframe id="modalIframe" src="" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- İlk Sayfadaki JavaScript Yapısı -->
    <script>
        (function() {
            const overlay = document.getElementById('modalOverlay');
            const iframe = document.getElementById('modalIframe');
            const titleEl = document.getElementById('modalTitle');
            const closeBtn = document.getElementById('closeModalBtn');

            document.querySelectorAll('.open-modal').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const card = this.closest('.card');
                    const embedUrl = card.getAttribute('data-embed');
                    const title = card.getAttribute('data-title') || 'Sunum';

                    if (!embedUrl) {
                        alert('Bu sunumun embed linki eksik.');
                        return;
                    }

                    iframe.src = embedUrl;
                    titleEl.textContent = title;

                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });

            function closeModal() {
                iframe.src = '';
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            closeBtn.addEventListener('click', closeModal);
            
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeModal();
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) closeModal();
            });
        })();
    </script>
    <!-- FIX: Aynı Cloudflare beacon script'i önceden iki kez ekliydi (kopya-yapıştır
         hatası). Aynı script'i iki kere çalıştırmak gereksiz JS yükü demek;
         tek kopya yeterli. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"701fb242892d47c08ed8ae1dcd5529b0","r":1}' crossorigin="anonymous"></script>
</body>
</html>

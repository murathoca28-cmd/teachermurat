<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İngilizce Testi</title>
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle, #ffffff 0%, #CDEFFF 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .quiz-card {
    background: #ffffff;
    max-width: 960px;
    margin: 0 auto;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 12px 16px;
    text-align: center;
    border: 3px solid lightgrey;
  }
  
  .img-wrapper {
    position: relative;
    display: inline-block;
    width: 100%;
    margin-bottom: 8px;
    cursor: zoom-in;
  }
  
  .quiz-img {
    width: 100%;
    max-height: 480px;
    object-fit: contain;
    border-radius: 8px;
    border: 1px solid #dee2e6;
    background-color: #f8f9fa;
    display: block;
    margin: 0 auto;
  }

  .zoom-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(33, 37, 41, 0.75);
    color: #ffffff;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    pointer-events: none;
    backdrop-filter: blur(2px);
  }

  .options-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  
  .btn-option {
    background-color: #f8f9fa;
    border: 2px solid #ced4da;
    color: #212529;
    padding: 6px 12px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
  }
  
  .btn-option:hover {
    background-color: #e9ecef;
    border-color: #adb5bd;
  }
  
  .btn-option.selected {
    background-color: #3b82f6;
    color: #ffffff;
    border-color: #2563eb;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
  }

  .footer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #f1f3f5;
    padding-top: 8px;
  }
  
  .step-counter {
    font-size: 13px;
    color: #6c757d;
    font-weight: 600;
  }
  
  .nav-btn-group {
    display: flex;
    gap: 8px;
  }
  
  .btn-nav {
    background-color: #10b981;
    color: white;
    border: none;
    padding: 7px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  
  .btn-nav-secondary {
    background-color: #9ca3af;
  }
  
  .btn-nav:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  
  .btn-nav:hover:not(:disabled) {
    opacity: 0.9;
  }

  .modal {
    display: none;
    position: fixed;
    z-index: 99999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(15, 23, 42, 0.9);
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .modal-content {
    display: block;
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    margin: auto;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .close-modal {
    position: absolute;
    top: 10px;
    right: 15px;
    color: #ffffff;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    background: rgba(0,0,0,0.4);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .result-screen {
    display: none;
    padding: 15px 10px;
  }
  
  .result-screen h2 {
    font-size: 1.5rem;
    margin: 8px 0;
  }

  .score-badge {
    font-size: 28px;
    color: #2563eb;
    font-weight: bold;
    margin: 8px 0;
  }

  #result-details {
    text-align: left;
    max-width: 450px;
    margin: 12px auto;
    background: #f8f9fa;
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.4;
  }

  #result-details div {
    padding: 3px 0;
    border-bottom: 1px solid #dee2e6;
    font-size: 13px;
  }
  #result-details div:last-child {
    border-bottom: none;
  }

  .result-buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .result-buttons .btn-nav {
    width: fit-content;
  }
</style>
 <link rel="stylesheet" href="../../../theme.css">
</head>
<body>
 <div id="navbar-placeholder" style="min-height: 20px;"></div>
 <script src="../../../navbar.js"></script>

<div class="quiz-card">
  <div id="quiz-view">
    <div class="img-wrapper" onclick="openModal()">
      <img id="question-img" class="quiz-img" src="" alt="Soru Görseli">
      <span class="zoom-badge">🔍 Büyütmek için tıklayın</span>
    </div>
    
    <div class="options-container">
      <button class="btn-option" onclick="selectAnswer('A')">A</button>
      <button class="btn-option" onclick="selectAnswer('B')">B</button>
      <button class="btn-option" onclick="selectAnswer('C')">C</button>
      <button class="btn-option" onclick="selectAnswer('D')">D</button>
    </div>

    <div class="footer-nav">
      <span class="step-counter" id="step-counter">Soru 1 / 10</span>
      <div class="nav-btn-group">
        <button class="btn-nav btn-nav-secondary" id="prev-btn" onclick="goPrev()" disabled>◀ Önceki</button>
        <button class="btn-nav" id="next-btn" onclick="goNext()">Sonraki ➔</button>
      </div>
    </div>
  </div>

  <div id="result-view" class="result-screen">
    <h2>Test Tamamlandı! 🎉</h2>
    <p style="margin:4px 0;">Toplam Doğru Sayınız:</p>
    <div class="score-badge" id="score-text">0 / 10</div>
    <div id="result-details"></div>
    
    <div class="result-buttons">
      <button class="btn-nav" onclick="resetQuiz()">Testi Tekrar Başlat</button>
    </div>
  </div>
</div>

<div id="image-modal" class="modal" onclick="closeModal()">
  <span class="close-modal">&times;</span>
  <img id="modal-img" class="modal-content" src="">
</div>

<script>
  // YENİ YOLLAR: 2 klasör yukarı çıkıp test_images klasörüne giriyoruz
  const questions = [
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_01.webp", answer: "B" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_02.webp", answer: "C" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_03.webp", answer: "A" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_04.webp", answer: "D" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_05.webp", answer: "B" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_06.webp", answer: "A" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_07.webp", answer: "C" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_08.webp", answer: "D" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_09.webp", answer: "A" },
    { image: "../../test_images/un_1/t_2/grade_7_un1_multest2_20.webp", answer: "B" }
  ];

  let currentIndex = 0;
  let userAnswers = new Array(questions.length).fill(null);

  function preloadImage(src) {
    const img = new Image();
    img.src = src;
  }

  function renderQuestion() {
    const q = questions[currentIndex];
    document.getElementById('question-img').src = q.image;
    document.getElementById('step-counter').innerText = `Soru ${currentIndex + 1} / ${questions.length}`;

    // Bir sonraki soruyu arka planda sessizce önceden yükle
    if (questions[currentIndex + 1]) {
      preloadImage(questions[currentIndex + 1].image);
    }

    const buttons = document.querySelectorAll('.btn-option');
    buttons.forEach(btn => {
      btn.classList.remove('selected');
      if (userAnswers[currentIndex] === btn.innerText) {
        btn.classList.add('selected');
      }
    });

    document.getElementById('prev-btn').disabled = (currentIndex === 0);
    document.getElementById('next-btn').disabled = false;

    if (currentIndex === questions.length - 1) {
      document.getElementById('next-btn').innerHTML = 'Sonuçları Gör ✨';
    } else {
      document.getElementById('next-btn').innerHTML = 'Sonraki ➔';
    }
  }

  function selectAnswer(option) {
    userAnswers[currentIndex] = option;
    const buttons = document.querySelectorAll('.btn-option');
    buttons.forEach(btn => {
      btn.classList.toggle('selected', btn.innerText === option);
    });
    document.getElementById('next-btn').disabled = false;
  }

  function goNext() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function goPrev() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  }

  function openModal() {
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    modalImg.src = questions[currentIndex].image;
    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('image-modal').style.display = 'none';
  }

  function showResults() {
    let score = 0;
    questions.forEach((q, idx) => {
      if (userAnswers[idx] === q.answer) {
        score++;
      }
    });

    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('result-view').style.display = 'block';
    document.getElementById('score-text').innerText = `${score} / ${questions.length}`;

    let detailsHtml = '';
    questions.forEach((q, idx) => {
      const userAns = userAnswers[idx] || 'Boş';
      const correct = q.answer;
      const isCorrect = userAns === correct;
      const icon = isCorrect ? '✅' : '❌';
      detailsHtml += `<div>
          <span><strong>Soru ${idx+1}</strong> ${icon}</span>
          <span>Sizin: <strong>${userAns}</strong> | Doğru: <strong>${correct}</strong></span>
      </div>`;
    });
    document.getElementById('result-details').innerHTML = detailsHtml;
  }

  function resetQuiz() {
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    document.getElementById('quiz-view').style.display = 'block';
    document.getElementById('result-view').style.display = 'none';
    renderQuestion();
  }

  renderQuestion();
</script>

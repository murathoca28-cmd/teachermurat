*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#74ebd5,#9face6);color:#1f2937;padding:10px 12px 10px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

.start{width:140px;height:140px;border:0;border-bottom:8px solid #0A2A33;border-radius:28px;background:#FFC21A;color:#1A1200;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.3);transition:transform .15s}

.wrap{width:100%;max-width:2200px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;font-size:var(--fs,18px)}
.top{flex:none;background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:18px;padding:6px 14px;box-shadow:0 8px 20px rgba(0,0,0,.12);display:flex;align-items:center;gap:12px;font-weight:900;color:#6b21a8;font-size:16px}

.zbtn{border:0;border-bottom:4px solid #6d28d9;border-radius:12px;background:#8b5cf6;color:#fff;font-weight:900;font-size:clamp(15px,1.7vmin,30px);padding:.3em .9em;white-space:nowrap}

}

@media (max-width:520px){.qmap{flex-wrap:nowrap;gap:3px}.qm{width:7vw;min-width:24px;height:7vw;min-height:24px;border-width:2px;border-radius:8px;font-size:13px}.qm.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px #b45309}.qback{height:7vw;min-height:24px;border-width:2px;border-radius:8px;padding:0 .5em;margin-right:.2em}.qback span{display:none}.nv1{padding:0 6px}.nv1 .btn{white-space:nowrap;padding:8px 14px;font-size:16px}}
.start2{margin-top:12px;border:0;border-bottom:4px solid #0369a1;border-radius:14px;background:#0ea5e9;color:#fff;font-weight:900;font-size:1.1rem;padding:10px 22px;cursor:pointer}

.tile{display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;gap:0;border:5px solid;border-radius:16px;background:#fff;font-weight:900;padding:0;overflow:hidden;min-height:0;line-height:1.1;font-size:1em;text-align:center;transition:transform .12s}

.tile .ra b.rt{color:#fff;background:#15803d;border-color:#15803d}
.tile .tok{font-size:1.5em;color:#14532d}
.tile .tgo{flex:none;background:#1e293b;color:#fff;font-size:.9em;padding:.25em .3em}
.tile.ok{border-color:#15803d}
.tile.ok .th{background:#15803d}
.tile.no{border-color:#dc2626}
.tile.no .th{background:#dc2626}
.tile.bl{border-color:#475569}
.tile.bl .th{background:#475569}
@media (max-aspect-ratio:1/1){.tile .th{padding:.05em .2em}.tile .tn{font-size:1.3em}.tile .tb{flex-direction:row;flex-wrap:wrap;align-content:center;justify-content:center;gap:.1em .5em;padding:.1em .2em}.tile .ra{gap:.25em}.tile .ra i{min-width:0;font-size:.85em}.tile .ra b{font-size:1.25em;min-width:1.3em;border-width:2px}.tile .tok{font-size:1.3em}.tile .tgo{font-size:.8em;padding:.15em .2em}}
.opt.right{background:#bbf7d0;border-color:#16a34a;color:#14532d}
.opt.wrong{background:#fecaca;border-color:#dc2626;color:#7f1d1d}
.opt.dim{opacity:.55}

.st{white-space:nowrap}
.st.okk{color:#15803d}
.st.nok{color:#b91c1c}
.xbtn{margin-top:.6em;align-self:flex-start;font-size:.8em}
.exp{margin-top:.5em;padding:.45em .7em;border:3px solid #f59e0b;background:#fffbeb;border-radius:14px;font-weight:700;font-size:.85em;line-height:1.3}
#splash .steps{text-align:left;display:inline-block;margin:14px 0 0;padding-left:1.4em;line-height:1.7;color:#fff;font-weight:700}

<body>
  <div id="navbar-placeholder" style="min-height: 64px;"></div>
  <script src="/navbar.js"></script>

  <div id="splash">
    <p>7th Class</p>
    <h1 lang="en">7th Class – Unit 3 Test 1</h1>
    <button class="start" onclick="begin()"><span>▶</span><span>BAŞLAT</span></button>
    <ol class="steps">
  <li>Soruları sırayla oku.</li>
  <li>Doğru şıkkı işaretle.</li>
  <li>Cevaplar en sonda açılır!</li>
  <li>BAŞLAT tam ekranda ve büyütülmüş açılır.</li>
</ol>
  </div>
  <main class="wrap hide" id="game"></main>
  <script>
    const Q = [{"t": "Elif wrote the important events in her grandmother's life in a table. Look at the table.", "c": "Elif'in büyükannesinin hayatındaki önemli olayların yıllarıyla verildiği tablo", "q": "According to the information above, which of the following is <u>NOT</u> correct?", "o": ["She moved to Ankara before she graduated from university.", "She got married four years after she graduated.", "She had a daughter three years after she got married.", "She won an award in the same year she had a daughter."], "a": 3, "w": "Tabloya göre ödül 1991'de, kızı 1987'de oldu; aynı yıl değil. Diğer şıklar doğru: 1974 < 1980 (A), 1984 − 1980 = 4 yıl (B), 1987 − 1984 = 3 yıl (C). Tuzak: yılları karşılaştırırken “same year” ifadesini kontrol etmek gerekir."}, {"t": "Four friends are talking about important years in their lives. Read the comments.", "c": "Dört arkadaşın hayatlarındaki önemli yıllar hakkındaki yorumları", "q": "According to the comments above, which two people talk about <u>their own</u> life events in the same year?", "o": ["Hasan and İrem", "Jale and Kerem", "Hasan and Kerem", "İrem and Jale"], "a": 0, "w": "Hasan ve İrem kendi hayatlarındaki olayları aynı yıl (2014) anlatıyor. Jale 2018'den söz eder ama bu olay kardeşinin mezuniyetidir, kendisinin değil; bu yüzden Jale ve Kerem doğru çift değildir. Diğer çiftlerde yıllar farklıdır."}, {"t": "Mr Çelik asked his students to write about a famous person. Each card must have three things: the year of birth, the place of birth and the job. Look at the students' cards.", "c": "Dört öğrencinin yazdığı, doğum yılı, doğum yeri ve meslek bilgilerinden bazılarını içeren kartlar", "q": "Which of the following students' cards includes all the information Mr Çelik asked for?", "o": ["Pelin's card", "Sinan's card", "Tuğçe's card", "Sude's card"], "a": 2, "w": "Üç bilgi gerekli: doğum yılı, doğum yeri, meslek. Pelin'in kartında yıl, Sinan'ın kartında meslek, Sude'nin kartında doğum yeri eksik. Yalnızca Tuğçe'nin kartında üçü de var (1950, Bursa, doctor)."}, {"t": "Four friends are talking about their family members on a school forum. Read the comments.", "c": "Dört arkadaşın aile üyeleri hakkındaki forum yorumları", "q": "According to the comments above, who is talking about a person who is no longer alive?", "o": ["Ali", "Bora", "Cem", "Dila"], "a": 1, "w": "Bora'nın büyük dedesi “died in 1990” (1990'da öldü). Ali'nin dedesi “is eighty years old now”, Cem'in amcası “is a young engineer now”, Dila'nın büyükannesi “still lives there”; yani üçü de hayatta."}, {"t": "Read the short biography of Hakan Tezel.", "c": "Hakan Tezel'in kısa biyografisi", "q": "Which of the following information is <u>NOT</u> in the text above?", "o": ["The place where he was born", "The year he started his own company", "What he did after high school", "The name of the person he married"], "a": 3, "w": "Metinde doğum yeri (Sinop), şirketini kurduğu yıl (2005) ve lise sonrası yaptıkları (İstanbul'a taşındı, fabrikada çalıştı) var. Evlendiği kişinin adı ise yazılmamış; “got married in 1990” yalnızca evlilik yılını verir."}, {"t": "Read the message Ms Karaca sent to her students.", "c": "Ms Karaca'nın öğrencilere Famous People Day için yazdığı mesaj", "q": "According to the message above, why did Ms Karaca write this message? To - - - -.", "o": ["invite students to a museum trip", "ask students about their favourite famous person", "tell students what to prepare for an event", "explain the life of a famous person"], "a": 2, "w": "“Please prepare a short biography… Write when and where he or she was born…” = öğrencilere etkinlik için ne hazırlayacaklarını söylüyor. Müze gezisi daveti (A) ya da favori kişi sorusu (B) yok; bir ünlünün hayatı da anlatılmıyor (D)."}, {"t": "Duru and Mert are talking about Duru's aunt. Read the conversation.", "c": "Duru'nun teyzesinin mesleği hakkında Duru ile Mert arasındaki konuşma", "q": "Which of the following completes the conversation above?", "o": ["When did she start working there?", "Why did she choose to work there?", "How long did she work there?", "Where did she study before she moved there?"], "a": 1, "w": "Cevap “Because she wanted to help…” nedeni bildirir, bu yüzden soru “Why …?” olmalıdır. A zaman, C süre, D yer sorar; hiçbiri “Because” ile başlayan bir cevaba uymaz."}, {"t": "Selin is calling her grandfather for her school project. The sentences in their phone conversation are mixed up.", "c": "Selin ile dedesinin okul projesi için yaptığı karışık telefon konuşması", "q": "Which of the following is the correct order of the sentences in the phone conversation above?", "o": ["III – II – V – I – IV", "III – V – II – I – IV", "III – II – I – V – IV", "III – II – V – IV – I"], "a": 0, "w": "Selam ve rica (III) → “Of course…” (II) → soru (V) → cevap (I) → teşekkür (IV). “In 1974.” cevabı “When did you graduate?” sorusundan, teşekkür ise cevaptan sonra gelir; “Of course” ancak yardım ricasına verilir."}, {"t": "Murat tells his life story: “I graduated from university first. Then I moved to another city, and finally I won an award.” The pictures below show three events in his life, but they are not in order.", "c": "Murat'ın hayatından üç olayı gösteren, karışık sıralanmış resimler (ödül, mezuniyet, taşınma)", "q": "According to Murat's words, which of the following is the correct order of the pictures above?", "o": ["I – II – III", "II – III – I", "III – II – I", "II – I – III"], "a": 1, "w": "Murat önce mezun oldu (II), sonra başka şehre taşındı (III), en son ödül kazandı (I). Doğru sıra II – III – I. Diğer sıralarda ödül ya da taşınma mezuniyetten önce gelir."}, {"t": "Defne can only go to the film club on Tuesdays and Thursdays after four o'clock. She wants to watch a film about an inventor. Look at the timetable.", "c": "Film kulübünün film adı, konu, gün ve saat bilgilerini gösteren tablo", "q": "According to the information above, which film should Defne watch?", "o": ["The Sky Maker", "The Sailor's Map", "The Light Maker", "The Little Genius"], "a": 2, "w": "Defne'nin üç şartı var: konu mucit (inventor), gün Salı ya da Perşembe, saat 4'ten sonra. The Sky Maker 3.30'da (çok erken), The Sailor's Map kâşif hakkında, The Little Genius Çarşamba günü. Yalnızca The Light Maker (inventor, Thursday, 4.30) uyar."}];
    const IMG = ["img/g7_un3_test_1_q01.webp", "img/g7_un3_test_1_q02.webp", "img/g7_un3_test_1_q03.webp", "img/g7_un3_test_1_q04.webp", "img/g7_un3_test_1_q05.webp", "img/g7_un3_test_1_q06.webp", "img/g7_un3_test_1_q07.webp", "img/g7_un3_test_1_q08.webp", "img/g7_un3_test_1_q09.webp", "img/g7_un3_test_1_q10.webp"];
    /* Tüm soru görsellerini sayfa açılır açılmaz arka planda indirir; "Sonraki" denince hazır bekler */
    const PRE = IMG.map(src => { const im = new Image(); im.decoding = "async"; im.src = src; return im });
    const LO = []; // sadece harf şıkkı olan sorular (şıklar görselin içinde)
    const L = "ABCD", $ = s => document.getElementById(s), strip = h => h.replace(/<[^>]+>/g, ""), alt = d => d.c.replace(/"/g, "&quot;");
    let i = 0, sel = [], zoom = false, rv = false;

    function begin() { if (!isFs()) { try { fullscr() } catch (e) { } } setZoom(true); $("splash").classList.add("hide"); restart() }
    function restart() { sel = Array(Q.length).fill(null); i = 0; $("game").classList.remove("hide"); render() }
    function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement) }
    function fullscr() { const d = document, e = d.documentElement; if (isFs()) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (e.requestFullscreen || e.webkitRequestFullscreen).call(e) }
    function setZoom(v) { zoom = v; document.body.classList.toggle("zoom", zoom) }
    function classMode() { if (isFs() && zoom) { setZoom(false); (document.exitFullscreen || document.webkitExitFullscreen).call(document) } else { if (!isFs()) fullscr(); setZoom(true) } const b = $("fb"); fsLabel(); const z = $("zb"); if (z) { z.classList.toggle("on", zoom); z.textContent = zoom ? "🔍 Küçült" : "🔍 Soruyu büyüt" } fit() }
    function toggleZoom() { zoom = !zoom; document.body.classList.toggle("zoom", zoom); const b = $("zb"); if (b) { b.classList.toggle("on", zoom); b.textContent = zoom ? "🔍 Küçült" : "🔍 Soruyu büyüt" } fit() }

    /* Yazıyı, mevcut ekrana kaydırma gerekmeden sığacak en büyük boyuta ayarlar */
    function fit() {
      const w = $("game"); if (!w || w.classList.contains("hide")) return; if (w.classList.contains("resmode")) return fitRes();
      const txt = w.querySelector(".txt"), card = w.querySelector(".card"); if (!txt) return;
      const vmin = Math.min(innerWidth, innerHeight);
      const max = Math.max(16, Math.min(zoom ? vmin * 0.075 : vmin * 0.04, zoom ? 90 : 40)), min = 10;
      let fs = max;
      const pic = w.querySelector('.picbox'), stacked = matchMedia('(max-aspect-ratio: 1/1)').matches;
      const over = () => (stacked && pic.clientHeight < card.clientHeight * 0.5) || txt.scrollHeight > txt.clientHeight + 1 || txt.scrollWidth > txt.clientWidth + 1 || w.scrollHeight > w.clientHeight + 1 || card.scrollHeight > card.clientHeight + 1 || document.documentElement.scrollHeight > innerHeight + 1;
      w.style.setProperty("--fs", fs + "px");
      while (fs > min && over()) { fs -= 0.5; w.style.setProperty("--fs", fs + "px") }
    }

    function render() {
      const d = Q[i], lo = LO.includes(i), last = i == Q.length - 1; rv = false;
      const w = $("game"); w.classList.remove("resmode");
      w.innerHTML = `<div class="top"><span>Soru ${i + 1} / ${Q.length}</span><span style="flex:1"></span><button id="fb" class="zbtn fbtn${isFs() ? " on" : ""}" onclick="classMode()">${isFs() ? "⛶ Tam Ekrandan Çık" : "⛶ Tam Ekran"}</button></div>
  <div class="qmap" id="qmap">${mapHtml()}</div>
  <div class="card"><p class="intro"><span class="n">${i + 1}</span>${d.t}</p><div class="cols"><div class="picbox"><img class="pic" src="${IMG[i]}" alt="${alt(d)}"></div>
  <div class="txt"><p class="qt">${d.q}</p><div class="opts${lo ? " lo" : ""}">${d.o.map((t, j) => `<button class="opt${sel[i] === j ? " sel" : ""}" aria-label="${L[j]}) ${strip(t)}" onclick="pick(${j})"><b>${L[j]})</b>${lo ? "" : " " + t}</button>`).join("")}</div></div></div></div>
  <div class="nav nv1"><button class="btn" onclick="go(-1)" ${i ? "" : "disabled"}>◀ Önceki</button><button class="btn${last ? " g" : ""}" onclick="go(1)">${last ? "Bitir ✔" : "Sonraki ▶"}</button></div>`;
      window.scrollTo(0, 0);
      fit();
    }
    const MENU = location.pathname.replace(/_test_\d+\.html$/, "_tests.html").split("/").pop();
    function mapHtml() { return `<a class="qback" href="${MENU}" onclick="return leave()" title="Testler listesine dön">↩<span> Testler</span></a>` + Q.map((d, k) => `<button class="qm${k === i ? " cur" : sel[k] !== null ? " done" : ""}" onclick="jump(${k})" aria-label="Soru ${k + 1}${sel[k] !== null ? " (cevaplandı)" : ""}">${k + 1}</button>`).join("") }
    function jump(k) { i = k; render() }
    function leave() { return sel.every(s => s === null) || confirm("Testten çıkarsan cevapların silinir. Çıkmak istiyor musun?") }
    function pick(j) { sel[i] = sel[i] === j ? null : j; document.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("sel", k === sel[i])); const m = $("qmap"); if (m) m.innerHTML = mapHtml() }
    function go(n) { if (i + n >= Q.length) finish(); else { i += n; render() } }
    function bad() { return Q.map((d, k) => k).filter(k => sel[k] !== Q[k].a) }
    function wrongNav(k) {
      const B = bad(); if (!B.length || (B.length === 1 && B[0] === k)) return null;
      if (B.includes(k)) { const x = B.indexOf(k); return [B[(x - 1 + B.length) % B.length], B[(x + 1) % B.length]] }
      const nx = B.find(v => v > k), pv = [...B].reverse().find(v => v < k);
      return [pv === undefined ? B[B.length - 1] : pv, nx === undefined ? B[0] : nx];
    }
    function finish() {
      rv = false;
      const ok = Q.filter((d, k) => sel[k] === d.a).length, b = sel.filter(s => s === null).length, nb = bad().length;
      const w = $("game"); w.classList.add("resmode");
      w.innerHTML = `<div class="card res"><div class="rhead"><h2>🏆 Test bitti!</h2><div class="big">${ok} / ${Q.length}</div><p class="cnt"><b>${ok}</b> doğru • <b>${Q.length - ok - b}</b> yanlış • <b>${b}</b> boş</p><div class="rbtns"><button class="btn g" onclick="restart()">🔄 Yeniden Başlat</button><a class="btn" href="https://cdn.teachermurat.com/7/un3_lgstests/g7_un3_test_1.pdf?v=1" download>📄 Testi indir (PDF)</a></div></div>
  <p class="hint">${nb ? "👆 Yanlış ve boş soruların üzerine tıkla: soruya dön, doğru cevabı ve açıklamayı gör." : "🎉 Hepsi doğru, tebrikler! İstersen herhangi bir soruya tıklayıp tekrar bakabilirsin."}</p>
  <div class="rgrid">${Q.map((d, k) => { const s = sel[k], c = s === d.a; return `<button class="tile ${s === null ? "bl" : c ? "ok" : "no"}" onclick="review(${k})" aria-label="Soru ${k + 1}"><span class="th"><span class="tn">${k + 1}</span><span class="ti">${c ? "✅" : s === null ? "➖" : "❌"}</span></span><span class="tb">${c ? "<span class=\"tok\">Doğru</span>" : "<span class=\"ra\"><i>Senin</i><b class=\"mine\">" + (s === null ? "–" : L[s]) + "</b></span><span class=\"ra\"><i>Doğru</i><b class=\"rt\">" + L[d.a] + "</b></span>"}</span>${c ? "" : "<span class=\"tgo\">🔍 Soruya dön</span>"}</button>` }).join("")}</div></div>`;
      window.scrollTo(0, 0); fitRes();
    }
    function fitRes() {
      const w = $("game"), card = w.querySelector(".card"); if (!card) return;
      const vmin = Math.min(innerWidth, innerHeight); let fs = Math.max(14, Math.min(vmin * 0.04, 36));
      const over = () => card.scrollHeight > card.clientHeight + 1 || document.documentElement.scrollHeight > innerHeight + 1 || [...w.querySelectorAll(".tile, .tile .tb")].some(t => t.scrollHeight > t.clientHeight + 1 || t.scrollWidth > t.clientWidth + 1);
      w.style.setProperty("--fs", fs + "px");
      while (fs > 9 && over()) { fs -= 0.5; w.style.setProperty("--fs", fs + "px") }
    }
    function review(k) {
      rv = true; i = k;
      const d = Q[k], lo = LO.includes(k), s = sel[k], c = s === d.a, w = $("game"), nv = wrongNav(k);
      w.classList.remove("resmode");
      const st = c ? "✅ Doğru cevapladın" : s === null ? "⬜ Bu soruyu boş bıraktın" : "❌ Senin cevabın: " + L[s];
      const cls = j => j === d.a ? "right" : j === s ? "wrong" : "dim";
      const dis = nv ? "" : "disabled";
      w.innerHTML = `<div class="top"><span>Soru ${k + 1} / ${Q.length}</span><span class="st ${c ? "okk" : "nok"}">${st}</span><span style="flex:1"></span><button id="fb" class="zbtn fbtn${isFs() ? " on" : ""}" onclick="classMode()">${isFs() ? "⛶ Tam Ekrandan Çık" : "⛶ Tam Ekran"}</button></div>
  <div class="card"><p class="intro"><span class="n">${k + 1}</span>${d.t}</p><div class="cols"><div class="picbox"><img class="pic" src="${IMG[k]}" alt="${alt(d)}"></div>
  <div class="txt"><p class="qt">${d.q}</p><div class="opts${lo ? " lo" : ""}">${d.o.map((t, j) => `<button class="opt ${cls(j)}" disabled aria-label="${L[j]}) ${strip(t)}"><b>${L[j]})</b>${lo ? "" : " " + t}</button>`).join("")}</div>
  <button id="xb" class="zbtn xbtn" onclick="toggleExp()">💡 Açıklamayı göster</button><div id="exp" class="exp hide">${d.w}</div></div></div></div>
  <div class="nav"><button class="btn" onclick="review(${nv ? nv[0] : k})" ${dis}>◀ Önceki yanlış</button><button class="btn g" onclick="finish()">📋 Sonuçlara dön</button><button class="btn" onclick="review(${nv ? nv[1] : k})" ${dis}>Sonraki yanlış ▶</button></div>`;
      window.scrollTo(0, 0); fit();
    }
    function toggleExp() { const e = $("exp"); e.classList.toggle("hide"); $("xb").textContent = e.classList.contains("hide") ? "💡 Açıklamayı göster" : "🙈 Açıklamayı gizle"; fit() }

    function fsLabel() { const b = $("fb"); if (b) { b.classList.toggle("on", isFs()); b.textContent = isFs() ? "⛶ Tam Ekrandan Çık" : "⛶ Tam Ekran" } }
    /* tam ekran / yeniden boyutlama / yazı tipi yüklenmesi sonrası yeniden sığdir */
    document.addEventListener("fullscreenchange", () => { document.body.classList.toggle("fsmode", isFs()); if (!isFs() && zoom) setZoom(false); fsLabel(); setTimeout(fit, 60) });
    document.addEventListener("webkitfullscreenchange", () => { document.body.classList.toggle("fsmode", isFs()); if (!isFs() && zoom) setZoom(false); fsLabel(); setTimeout(fit, 60) });
    addEventListener("resize", () => requestAnimationFrame(fit));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit());

    /* klavye kısayolları: ← → gezinme, A-D şık, Z büyüt, F tam ekran */
    addEventListener("keydown", e => {
      if ($("game").classList.contains("hide") || $("game").classList.contains("resmode")) return;
      const k = e.key.toLowerCase();
      if (rv) { if (k === "escape" || k === "backspace") finish(); else if (k === "e") toggleExp(); else if (k === "arrowright" || k === "arrowleft") { const nv = wrongNav(i); if (nv) review(k === "arrowright" ? nv[1] : nv[0]) } return }
      if (k === "arrowright") go(1); else if (k === "arrowleft") { if (i) go(-1) }
      else if ("abcd".includes(k) && k.length === 1) { if (Q[i].o[L.toLowerCase().indexOf(k)] !== undefined) pick(L.toLowerCase().indexOf(k)) }
      else if (k === "z") toggleZoom(); else if (k === "f") fullscr();
    });
  </script>
<script src="/pdf-download.js"></script>
<script src="/back.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worksheets & Activities</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1A1F23;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px 56px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: #FFFFFF;
            border: 4px solid #334155;
            border-radius: 24px;
            box-shadow: 0 6px 0 #94A3B8;
            padding: 34px 32px 38px;
        }

        .main-title {
            font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif;
            font-size: 2.25rem;
            font-weight: 800;
            text-align: center;
            color: #1A1F23;
            margin: 0 0 24px;
        }

        .main-title span { color: #0F766E; }

        /* TABS */
        .tab-menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .tab-btn {
            font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 10px 24px;
            color: #1A1F23;
            background: #FFFFFF;
            border: 3px solid #334155;
            border-radius: 14px;
            box-shadow: 0 4px 0 #94A3B8;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .tab-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #94A3B8; }
        .tab-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #94A3B8; }

        .tab-btn.active {
            background: #0F766E;
            border-color: #064E48;
            color: #FFFFFF;
            box-shadow: 0 4px 0 #064E48;
        }

        .tab-btn:focus-visible, .card-btn:focus-visible, .close-btn:focus-visible {
            outline: 4px solid #F0A500;
            outline-offset: 3px;
        }

        /* PANELS */
        .tab-panel { display: none; }

        .tab-panel.active {
            display: grid;
            grid-template-columns: repeat(3, 190px);
            gap: 18px;
            justify-content: center;
        }

        #worksheets.tab-panel.active { grid-template-columns: repeat(4, 150px); }

        .card-btn {
            font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 84px;
            padding: 14px 10px;
            background: #CCFBF1;
            color: #064E48;
            border: 3px solid #0F766E;
            border-radius: 18px;
            box-shadow: 0 5px 0 #0F766E;
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .card-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #0F766E; }
        .card-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0F766E; }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            width: 94%;
            max-width: 1100px;
            height: 92vh;
            background: #FFFFFF;
            border: 4px solid #334155;
            border-radius: 20px;
            box-shadow: 0 6px 0 #94A3B8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-bottom: 4px solid #334155;
            background: #CCFBF1;
        }

        .modal-title {
            font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #064E48;
        }

        .close-btn {
            font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 8px 20px;
            background: #C2410C;
            color: #FFFFFF;
            border: 3px solid #7C2D12;
            border-radius: 12px;
            box-shadow: 0 4px 0 #7C2D12;
            cursor: pointer;
        }

        .close-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7C2D12; }

        .pdf-frame { flex: 1; width: 100%; border: none; }

        @media (max-width: 760px) {
            .tab-panel.active { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            #worksheets.tab-panel.active { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 550px) {
            .container { padding: 22px 14px 26px; }
            .main-title { font-size: 1.6rem; }
            .tab-btn { font-size: 1rem; padding: 8px 14px; }
            .card-btn { font-size: 1.1rem; min-height: 72px; }
        }
    </style>
    <link rel="stylesheet" href="/theme.css">
</head>

<body>

    <div id="navbar-placeholder" style="min-height: 64px;"></div>
    <script src="/navbar.js"></script>

    <main class="main-content">
        <div class="container">
            <h1 class="main-title">Worksheets <span>&amp;</span> Activities</h1>

            <div class="tab-menu" role="tablist">
                <button class="tab-btn active" data-tab="worksheets" role="tab">Worksheets</button>
                <button class="tab-btn" data-tab="activities" role="tab">Activities</button>
                <button class="tab-btn" data-tab="reading" role="tab">Reading</button>
                <button class="tab-btn" data-tab="listening" role="tab">Listening</button>
            </div>

            <!-- 1. WORKSHEETS -->
            <div class="tab-panel active" id="worksheets">
                <button class="card-btn worksheet-btn"
                    data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un2_worksheets/Grade_7_un2_work_1.pdf?v=2"
                    data-title="Summary">Summary</button>
                <button class="card-btn worksheet-btn"
                    data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un2_worksheets/Grade_7_un2_work_2.pdf?v=2"
                    data-title="Vocabulary">Vocabulary</button>
                <button class="card-btn worksheet-btn"
                    data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un2_worksheets/Grade_7_un2_work_3.pdf?v=2"
                    data-title="Sheet 1">Sheet 1</button>
                <button class="card-btn worksheet-btn"
                    data-embed="https://teachermurat.com/pdfjs/web/viewer.html?file=https://cdn.teachermurat.com/7/un2_worksheets/Grade_7_un2_work_4.pdf?v=2"
                    data-title="Sheet 2">Sheet 2</button>
            </div>

            <!-- 2. ACTIVITIES -->
            <div class="tab-panel" id="activities">
                <a href="../../activities/un2/g7_un2_act_1.html" class="card-btn">Activity 1</a>
                <a href="../../activities/un2/g7_un2_act_2.html" class="card-btn">Activity 2</a>
                <a href="../../activities/un2/g7_un2_act_3.html" class="card-btn">Activity 3</a>
            </div>

            <!-- 3. READING -->
            <div class="tab-panel" id="reading">
                <a href="../../reading/un2/g7_un2_read_1.html" class="card-btn">Reading 1</a>
                <a href="../../reading/un2/g7_un2_read_2.html" class="card-btn">Reading 2</a>
                <a href="../../reading/un2/g7_un2_read_3.html" class="card-btn">Reading 3</a>
            </div>

            <!-- 4. LISTENING -->
            <div class="tab-panel" id="listening">
                <a href="../../listening/un2/g7_un2_listen_1.html" class="card-btn">Listening 1</a>
                <a href="../../listening/un2/g7_un2_listen_2.html" class="card-btn">Listening 2</a>
                <a href="../../listening/un2/g7_un2_listen_3.html" class="card-btn">Listening 3</a>
            </div>
        </div>
    </main>

    <!-- PDF MODAL -->
    <div class="modal-overlay" id="pdfModal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Worksheet</span>
                <button class="close-btn" id="closeModal">Close ✕</button>
            </div>
            <iframe class="pdf-frame" id="pdfFrame" src="" title="PDF preview"></iframe>
        </div>
    </div>

    <script>
    (function () {
        var tabBtns = document.querySelectorAll('.tab-btn');
        var tabPanels = document.querySelectorAll('.tab-panel');

        tabBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                tabBtns.forEach(function (b) { b.classList.remove('active'); });
                tabPanels.forEach(function (p) { p.classList.remove('active'); });
                btn.classList.add('active');
                var target = document.getElementById(btn.dataset.tab);
                if (target) target.classList.add('active');
            });
        });

        var overlay = document.getElementById('pdfModal');
        var iframe = document.getElementById('pdfFrame');
        var titleEl = document.getElementById('modalTitle');

        // Use a fresh iframe every time: changing the src of an existing iframe adds
        // an entry to the browser history (that is what made the Back button pile up).
        function loadFrame(url) {
            var fresh = iframe.cloneNode(false);
            fresh.removeAttribute('src');
            iframe.parentNode.replaceChild(fresh, iframe);
            iframe = fresh;
            if (url) fresh.src = url;
        }

        function closeModal() {
            loadFrame('');
            overlay.classList.remove('active');
        }

        document.querySelectorAll('.worksheet-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                loadFrame(btn.dataset.embed);
                titleEl.textContent = btn.dataset.title || 'Worksheet';
                overlay.classList.add('active');
            });
        });

        document.getElementById('closeModal').addEventListener('click', closeModal);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    })();
    </script>
<script src="/back.js" data-href="/7/grade7.html#activities"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Wheel</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 8px 14px 12px; align-items: stretch; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #wheelbox { position: relative; flex: 0 0 46%; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  @media (orientation: portrait) { #wheelbox { flex: 0 0 50%; } }
  #wheelwrap { position: relative; flex: 1; min-height: 0; aspect-ratio: 1; max-width: 100%; }
  #wheel { position: absolute; inset: 0; pointer-events: none; transition: transform 4.2s cubic-bezier(.12, .7, .1, 1); }
  #wheel svg { width: 100%; height: 100%; display: block; }
  #pointer { position: absolute; left: 50%; top: -2%; width: 11%; transform: translateX(-50%); z-index: 3; }
  #pointer svg { width: 100%; display: block; }
  #spin { font-size: clamp(1.4rem, 3.4vw, 2.6rem); padding: .15em 1.2em; }
  #spin:disabled { background: #B8C2C1; color: #5B6B69; cursor: not-allowed; box-shadow: 0 6px 0 #5B6B69; }
  #card { flex: 1; min-width: 0; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 22px; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  #cat { align-self: flex-start; color: #fff; font-weight: 900; font-size: clamp(1.1rem, 2.6vw, 2rem); padding: 0 20px; border-radius: 999px; border: 4px solid #0B2F2C; }
  #q-en { font-weight: 900; font-size: clamp(1.5rem, 4vw, 3.4rem); line-height: 1.15; }
  #q-tr { font-weight: 800; font-size: clamp(1rem, 2.2vw, 1.7rem); color: #0B5C56; }
  #start { font-weight: 800; font-size: clamp(1.1rem, 2.6vw, 2rem); color: #0B2F2C; background: #FFF3B0; border: 4px solid #0B2F2C; border-radius: 14px; padding: 6px 14px; }
  #start b { color: #D62828; }
  #qbox { flex-direction: column; gap: clamp(10px, 2vh, 18px); }
  #q-en { margin: 2px 0 0; }
  #showans { align-self: flex-start; font-size: clamp(1rem, 2.4vw, 1.8rem); }
  #ans { display: none; background: #C8F7D4; border: 4px solid #0A7A2F; border-radius: 14px; padding: 8px 14px; }
  #ans b { color: #0A7A2F; }
  #a-en { font-weight: 900; font-size: clamp(1.2rem, 3vw, 2.4rem); line-height: 1.2; }
  #a-tr { font-weight: 800; font-size: clamp(.95rem, 2vw, 1.5rem); color: #0B5C56; }
  #idle { font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 3.6rem); text-align: center; line-height: 1.2; }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Speaking<br>Wheel</h1>
  <p class="subtitle">Spin, ask and answer in pairs!</p>
  <div class="preview">🎡 🗣️ 💬</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Spins: <span id="sp">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="wheelbox">
    <div id="wheelwrap">
      <div id="wheel"><svg viewBox="-250 -250 500 500" xmlns="http://www.w3.org/2000/svg"><path d="M0 0 L0.0 -240.0 A240 240 0 0 1 169.7 -169.7 Z" fill="#D62828" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(22.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🏃</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Sport</text></g><path d="M0 0 L169.7 -169.7 A240 240 0 0 1 240.0 -0.0 Z" fill="#1F5FBF" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(67.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">⏰</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Routine</text></g><path d="M0 0 L240.0 -0.0 A240 240 0 0 1 169.7 169.7 Z" fill="#0A7A2F" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(112.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🥗</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Healthy</text></g><path d="M0 0 L169.7 169.7 A240 240 0 0 1 0.0 240.0 Z" fill="#E8710A" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(157.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🏅</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Stars</text></g><path d="M0 0 L0.0 240.0 A240 240 0 0 1 -169.7 169.7 Z" fill="#7B2CBF" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(202.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🏟️</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Match</text></g><path d="M0 0 L-169.7 169.7 A240 240 0 0 1 -240.0 0.0 Z" fill="#0B7285" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(247.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🎒</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Gear</text></g><path d="M0 0 L-240.0 0.0 A240 240 0 0 1 -169.7 -169.7 Z" fill="#B5179E" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(292.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🤔</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Why?</text></g><path d="M0 0 L-169.7 -169.7 A240 240 0 0 1 -0.0 -240.0 Z" fill="#C2410C" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(337.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🌳</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">In/Out</text></g><circle r="34" fill="#FFD23F" stroke="#0B2F2C" stroke-width="7"/></svg></div>
      <div id="pointer"><svg viewBox="0 0 60 80"><path d="M6 6 H54 L30 74 Z" fill="#D62828" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/></svg></div>
    </div>
    <button class="big-btn" id="spin" onclick="spin()">SPIN</button>
  </div>
  <div id="card">
    <div id="idle">Spin the wheel!<div class="tr" style="font-size:.5em;color:#0B5C56;font-weight:800">Çarkı çevir!</div></div>
    <div id="qbox" style="display:none">
      <div id="cat"></div>
      <div id="q-en"></div>
      <div id="q-tr" class="tr"></div>
      <div id="start"></div>
      <button class="restart-btn" id="showans" onclick="toggleAns()">Show answer</button>
      <div id="ans"><b>Sample answer:</b><div id="a-en"></div><div id="a-tr" class="tr"></div></div>
    </div>
  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { var f = document.getElementById('fb'); if (f) f.textContent = fbParts ? fbParts[0] + (TR && fbParts[1] ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var WHEEL = [["🏃", "My Sport", "#D62828", [["Which sport do you do?", "Hangi sporu yaparsın?", "I play … / I do … / I go …", "I play basketball.", "Basketbol oynarım."], ["How often do you do this sport?", "Bu sporu ne sıklıkla yaparsın?", "I … a week.", "I play twice a week.", "Haftada iki kez oynarım."], ["Where do you do it?", "Bunu nerede yaparsın?", "I do it in / at …", "I play at the school garden.", "Okul bahçesinde oynarım."], ["Who do you do sports with?", "Kiminle spor yaparsın?", "I do it with …", "I play with my friends.", "Arkadaşlarımla oynarım."], ["When did you start this sport?", "Bu spora ne zaman başladın?", "I started when …", "I started when I was nine.", "Dokuz yaşındayken başladım."], ["Do you want to join a sports club?", "Bir spor kulübüne katılmak ister misin?", "Yes, I … / No, I …", "Yes, I do. I want to join the swimming club.", "Evet, isterim. Yüzme kulübüne katılmak istiyorum."]]], ["⏰", "My Routine", "#1F5FBF", [["What time do you wake up on weekdays?", "Hafta içi saat kaçta uyanırsın?", "I wake up at …", "I wake up at seven o’clock.", "Saat yedide uyanırım."], ["Do you get up late on Sundays?", "Pazar günleri geç kalkar mısın?", "Yes, I … / No, I …", "Yes, I usually get up late.", "Evet, genellikle geç kalkarım."], ["What do you do in the afternoons?", "Öğleden sonraları ne yaparsın?", "I usually …", "I usually do my homework.", "Genellikle ödevlerimi yaparım."], ["How do you spend your evenings?", "Akşamlarını nasıl geçirirsin?", "I often …", "I often watch TV and rest.", "Sık sık televizyon izler ve dinlenirim."], ["How often do you go to bed early?", "Ne sıklıkla erken yatarsın?", "I … go to bed early.", "I always go to bed early.", "Her zaman erken yatarım."], ["What do you do at the weekend?", "Hafta sonu ne yaparsın?", "At the weekend, I …", "At the weekend, I sometimes ride my bike.", "Hafta sonu bazen bisiklete binerim."]]], ["🥗", "Healthy Life", "#0A7A2F", [["What do you eat for breakfast?", "Kahvaltıda ne yersin?", "I usually eat …", "I usually eat eggs and bread.", "Genellikle yumurta ve ekmek yerim."], ["How often do you eat fast food?", "Ne sıklıkla fast food yersin?", "I … eat fast food.", "I seldom eat fast food.", "Nadiren fast food yerim."], ["Do you drink enough water?", "Yeterince su içer misin?", "Yes, I … / No, I …", "Yes, I drink eight glasses a day.", "Evet, günde sekiz bardak içerim."], ["What healthy food do you like?", "Hangi sağlıklı yiyeceği seversin?", "I like …", "I like fruit and vegetables.", "Meyve ve sebzeyi severim."], ["Why is sleep important for sportspeople?", "Uyku sporcular için neden önemlidir?", "Because …", "Because their body needs rest.", "Çünkü vücutlarının dinlenmeye ihtiyacı vardır."], ["Do you think a special diet is necessary?", "Özel bir diyetin gerekli olduğunu düşünür müsün?", "I think … because …", "I think it is necessary because athletes need energy.", "Gerekli olduğunu düşünüyorum çünkü sporcuların enerjiye ihtiyacı var."]]], ["🏅", "Sports Stars", "#E8710A", [["Who is your favourite sportsperson?", "En sevdiğin sporcu kim?", "My favourite … is …", "My favourite sportsperson is a famous Turkish weightlifter.", "En sevdiğim sporcu ünlü bir Türk halterci."], ["What sport does he or she do?", "O hangi sporu yapıyor?", "He or she …", "He lifted weights.", "Halter kaldırdı."], ["Why do you like this person?", "Bu kişiyi neden seviyorsun?", "I like … because …", "I like him because he worked very hard.", "Onu seviyorum çünkü çok çalıştı."], ["What does a champion need?", "Bir şampiyonun neye ihtiyacı vardır?", "A champion needs …", "A champion needs a good coach.", "Bir şampiyonun iyi bir antrenöre ihtiyacı vardır."], ["Do you want to be a professional athlete?", "Profesyonel bir sporcu olmak ister misin?", "Yes, I … / No, I …", "No, I don’t. I want to be a doctor.", "Hayır, istemem. Doktor olmak istiyorum."], ["What is a great achievement in sports?", "Sporda büyük bir başarı nedir?", "It is …", "Winning an Olympic gold medal is a great achievement.", "Olimpiyat altın madalyası kazanmak büyük bir başarıdır."]]], ["🏟️", "Matches", "#7B2CBF", [["Do you go to matches?", "Maçlara gider misin?", "Yes, I … / No, I …", "Yes, I go to a match once a month.", "Evet, ayda bir kez maça giderim."], ["What is your favourite team?", "En sevdiğin takım hangisi?", "My favourite team is …", "My favourite team is our school team.", "En sevdiğim takım okul takımımız."], ["What do spectators do at a match?", "Seyirciler maçta ne yapar?", "They …", "They cheer for their team.", "Takımlarını destekler ve tezahürat yaparlar."], ["Who usually wins in your games?", "Oyunlarınızda genellikle kim kazanır?", "… usually wins.", "My team usually wins.", "Genellikle benim takımım kazanır."], ["What do you do when your team loses?", "Takımın kaybedince ne yaparsın?", "I …", "I stay calm and try again.", "Sakin kalır ve tekrar denerim."], ["What was the score of the last match you watched?", "İzlediğin son maçın skoru neydi?", "The score was …", "The score was two to one.", "Skor ikiye birdi."]]], ["🎒", "Equipment", "#0B7285", [["What equipment do you need for football?", "Futbol için hangi ekipmana ihtiyacın var?", "You need …", "You need a ball and boots.", "Top ve krampon gerekir."], ["What do you need for swimming?", "Yüzme için neye ihtiyacın var?", "You need …", "You need a swimsuit and goggles.", "Mayo ve gözlük gerekir."], ["What do skiers wear?", "Kayakçılar ne giyer?", "They wear …", "They wear warm clothes and a helmet.", "Sıcak kıyafetler ve kask giyerler."], ["Which equipment do you use at the gym?", "Spor salonunda hangi ekipmanı kullanırsın?", "I use …", "I use weights and a running machine.", "Ağırlıklar ve koşu bandı kullanırım."], ["Why do sportspeople wear a helmet?", "Sporcular neden kask takar?", "Because …", "Because it protects their head.", "Çünkü başlarını korur."], ["Is sports equipment expensive?", "Spor ekipmanı pahalı mıdır?", "I think …", "I think it is expensive in some sports.", "Bence bazı sporlarda pahal   var rot = 0, spinning = false, spins = 0, queues = [];
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    spins = 0; document.getElementById('sp').textContent = 0;
    queues = WHEEL.map(function () { return []; });
    document.getElementById('qbox').style.display = 'none';
    document.getElementById('idle').style.display = '';
  }
  function spin() {
    if (spinning) return; spinning = true;
    document.getElementById('spin').disabled = true;
    var n = WHEEL.length, step = 360 / n, idx = Math.floor(Math.random() * n);
    var target = ((360 - (idx * step + step / 2) + (Math.random() * 2 - 1) * step * 0.3) % 360 + 360) % 360;
    var cur = ((rot % 360) + 360) % 360;
    rot += 1800 + ((target - cur) + 360) % 360;
    var w = document.getElementById('wheel');
    w.style.transform = 'rotate(' + rot + 'deg)';
    var done = false;
    function finish() { if (done) return; done = true; w.removeEventListener('transitionend', finish); show(idx); }
    w.addEventListener('transitionend', finish);
    setTimeout(finish, 4600);
  }
  function toggleAns() {
    var a = document.getElementById('ans'), open = a.style.display !== 'block';
    a.style.display = open ? 'block' : 'none';
    document.getElementById('showans').textContent = open ? 'Hide answer' : 'Show answer';
  }
  function show(idx) {
    var c = WHEEL[idx];
    if (!queues[idx].length) queues[idx] = shuffle(c[3].slice());
    var q = queues[idx].pop();
    spins++; document.getElementById('sp').textContent = spins;
    document.getElementById('idle').style.display = 'none';
    document.getElementById('qbox').style.display = 'flex';
    var cat = document.getElementById('cat'); cat.textContent = c[0] + ' ' + c[1]; cat.style.background = c[2];
    document.getElementById('q-en').textContent = q[0];
    document.getElementById('q-tr').textContent = q[1];
    document.getElementById('start').innerHTML = '<b>Start:</b> ' + q[2].replace(/</g, '&lt;');
    document.getElementById('a-en').textContent = q[3]; document.getElementById('a-tr').textContent = q[4];
    document.getElementById('ans').style.display = 'none'; document.getElementById('showans').textContent = 'Show answer';
    spinning = false; document.getElementById('spin').disabled = false;
  }

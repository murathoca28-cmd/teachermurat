<!DOCTYPE html>
<html lang="tr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 7 - Unit 2 Jeopardy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
        }
        
        .game-btn {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            border-bottom: 4px solid #0284c7;
            border-radius: 1rem;
            transition: all 0.2s ease-in-out;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        @media (min-width: 640px) {
            .game-btn {
                border-bottom-width: 6px;
                border-radius: 1.5rem;
            }
        }
        
        .game-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 12px -3px rgba(0, 0, 0, 0.25);
        }
        
        .game-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        
        .game-btn:disabled {
            background: #cbd5e1;
            border-bottom: 4px solid #94a3b8;
            color: #f1f5f9;
            cursor: not-allowed;
            text-shadow: none;
            transform: none;
        }
        
        .active-group {
            background: #fde047 !important;
            border: 3px solid #f59e0b !important;
            transform: scale(1.03);
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4);
        }

        .modal-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-gray-800 p-2 sm:p-4 relative min-h-screen flex flex-col justify-start items-center">

    <!-- Karşılama Ekranı -->
    <div id="splash" class="fixed inset-0 z-40 flex flex-col items-center justify-center gap-4 sm:gap-6 p-6 text-center text-white bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600">
        <p class="text-lg sm:text-2xl font-bold opacity-90">Kelime Yarışması</p>
        <h1 class="text-3xl sm:text-6xl font-black drop-shadow-lg">Grade 7 - Unit 2 Jeopardy</h1>

        </button>

        <p class="max-w-md text-sm sm:text-xl font-bold opacity-90">

    </div>

    <!-- Tam Ekran Butonu (sağ alt) -->

            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
    </button>

    <!-- Menü Butonu (oyun başlayınca görünür) -->
    <button id="menu-btn" onclick="openMenu()" title="Menü" class="hidden fixed bottom-2 left-2 sm:bottom-4 sm:left-4 z-[60] bg-neutral-900/90 text-white w-10 h-10 sm:w-12 sm:h-12 rounded-full shadow-lg border-2 border-neutral-600 hover:bg-neutral-800 hover:scale-105 transition-all text-xl cursor-pointer">
        ☰

    <!-- Menü Paneli -->

            <p class="text-xs sm:text-sm font-bold tracking-widest text-neutral-400 pb-2 mb-2 border-b-2 border-black">JEOPARDY</p>
            <button onclick="restartGame()" class="w-full text-left text-base sm:text-xl font-extrabold px-3 py-2 rounded-lg hover:bg-neutral-700 cursor-pointer">Yeniden başlat</button>
            <button onclick="closeMenu()" class="w-full text-left text-base sm:text-xl font-extrabold px-3 py-2 rounded-lg hover:bg-neutral-700 cursor-pointer">Sürdür</button>
        </div>
    </div>

    <!-- Kurulum Üst Bar -->
    <div id="setup-bar" class="w-full max-w-5xl bg-white/90 backdrop-blur-md shadow-xl p-4 sm:p-6 flex flex-col sm:flex-row flex-wrap items-center justify-center gap-3 sm:gap-5 rounded-2xl sm:rounded-3xl border-2 sm:border-4 border-white mt-8 sm:mt-2">
        <h1 class="text-xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500 text-center drop-shadow-sm">🎮 Grade 7 - Unit 2 Jeopardy</h1>

                <option value="set2">Yarışma & Spor Fiilleri</option>
                <option value="set3">Günlük Rutin, Sıklık & Dil Bilgisi</option>
                <option value="set4">Beslenme, Biyografi & Kalıplar</option>
                <option value="all" selected>TÜMÜ</option>
            </select>
        </div>

            <div class="flex items-center gap-1.5 bg-blue-50 px-3 py-1.5 rounded-xl border-2 border-blue-200 flex-1 sm:flex-none justify-center">
                <label for="group-count" class="font-bold text-xs sm:text-sm text-blue-800">Grup:</label>

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <!-- Süre Ayarı -->

                <label for="timer-setting" class="font-bold text-xs sm:text-sm text-orange-800">Süre (sn):</label>

            </div>

        </div>

    <!-- Soru Modalı -->

                    word
                </h1>

                </div>

                <!-- Cevabı Göster Butonu -->

                    Cevabı Göster 🎯
                </button>

                <div id="answer-area" class="hidden flex-col items-center w-full">
                    <div id="turkish-word" class="bg-blue-800 text-white text-lg sm:text-3xl font-extrabold py-3 px-4 sm:py-4 sm:px-8 rounded-xl sm:rounded-2xl mb-5 sm:mb-8 shadow-inner border-2 sm:border-4 border-blue-900 text-center max-w-full break-words">
                        cevap
                    </div>

                            ❌ YANLIŞ
                        </button>

                {"en": "I'm planning to race at six Olympics.", "tr": "Altı Olimpiyatta yarışmayı planlıyorum."},
                {"en": "I'm planning to be the first woman swimmer with six gold medals.", "tr": "Altı altın madalyalı ilk kadın yüzücü olmayı planlıyorum."},
                {"en": "Good luck!", "tr": "İyi şanslar!"},
                {"en": "I'm sure you can do it.", "tr": "Yapabileceğinden eminim."},
                {"en": "Of course, I do.", "tr": "Tabii ki yapıyorum."},
                {"en": "I see.", "tr": "Anlıyorum."},
                {"en": "It's good for my health.", "tr": "Sağlığım için iyi."},
                {"en": "Let me ask my questions.", "tr": "Sorularımı sorayım."}
            ]
        };

        let activeWordList = [];
        let numGroups = 1;
        let scores = [];
        let currentGroup = 0;
        let gameDuration = 10;
        let answeredQuestionsCount = 0;
        
        let currentPoints = 0;
        let currentCellBtn = null;
        let timerInterval;
        let timeLeft = 0;
        let isAnswerShown = false;
        let menuPausedTimer = false;
        
        const pointValues = [50, 100, 150, 200, 250, 300]; 

        // ---------- Karşılama ekranı ----------
        function closeSplash() {
            document.getElementById('splash').style.display = 'none';
        }

        // ---------- Menü (Yeniden başlat / Sürdür) ----------
        function openMenu() {
            menuPausedTimer = false;
            const questionOpen = !document.getElementById('question-modal').classList.contains('hidden');
            // Soru açıkken ve cevap henüz gösterilmediyse süreyi duraklat
            if (questionOpen && !isAnswerShown && timeLeft > 0) {
                clearInterval(timerInterval);
                menuPausedTimer = true;
            }
            document.getElementById('game-menu').classList.remove('hidden');
        }

        function closeMenu() {
            document.getElementById('game-menu').classList.add('hidden');
            if (menuPausedTimer) {
                menuPausedTimer = false;
                resumeTimer();
            }
        }

        function resumeTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function restartGame() {
            menuPausedTimer = false;
            clearInterval(timerInterval);
            document.getElementById('game-menu').classList.add('hidden');
            document.getElementById('question-modal').classList.add('hidden');
            document.getElementById('end-modal').classList.add('hidden');
            document.getElementById('end-modal').classList.remove('flex');
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('game-area').classList.remove('flex');
            document.getElementById('menu-btn').classList.add('hidden');
            document.getElementById('setup-bar').classList.remove('hidden');   // ayar ekranına dön
        }

        // ---------- Tam ekran ----------
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            const selectedSetKey = document.getElementById('category-select').value;
            numGroups = parseInt(document.getElementById('group-count').value);
            gameDuration = parseInt(document.getElementById('timer-setting').value);
            
            if(isNaN(gameDuration) || gameDuration < 5) gameDuration = 10;

            let pool = [];
            if (selectedSetKey === 'all') {
                pool = Object.values(wordSets).flat();
            } else {
                pool = [...wordSets[selectedSetKey]];
            }

            if (pool.length < 30) {
                const extraPool = Object.values(wordSets).flat().filter(item => !pool.includes(item));
                shuffle(extraPool);
                while (pool.length < 30 && extraPool.length > 0) {
                    pool.push(extraPool.pop());
                }
            }

            shuffle(pool);
            activeWordList = pool.slice(0, 30);

            document.getElementById('setup-bar').classList.add('hidden');
            document.getElementById('menu-btn').classList.remove('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('game-area').classList.add('flex');
            
            scores = Array(numGroups).fill(0);
            currentGroup = 0;
            answeredQuestionsCount = 0;
            
            renderScoreboard();
            renderGrid();
        }

        function renderScoreboard() {
            const board = document.getElementById('scoreboard');
            board.innerHTML = '';
            for (let i = 0; i < numGroups; i++) {
                const groupDiv = document.createElement('div');
                groupDiv.id = `group-score-${i}`;
                groupDiv.className = `px-2 py-1.5 sm:px-6 sm:py-3 rounded-lg sm:rounded-2xl border-2 sm:border-4 border-white bg-white/80 font-extrabold text-xs sm:text-xl shadow-md transition-all duration-300 text-blue-900 text-center flex-1 min-w-[70px] ${i === currentGroup ? 'active-group' : ''}`;
                groupDiv.innerHTML = `<span class="opacity-80 block sm:inline">${i + 1}. Grup</span> <span id="score-val-${i}" class="text-sm sm:text-2xl text-purple-700 block sm:inline sm:ml-2">${scores[i]}</span>`;
                board.appendChild(groupDiv);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('jeopardy-grid');
            grid.innerHTML = '';
            let wordIndex = 0;

            pointValues.forEach(points => {
                for (let col = 0; col < 5; col++) {
                    const btn = document.createElement('button');
                    const wordData = activeWordList[wordIndex];
                    
                    btn.className = "game-btn text-white font-extrabold py-3 sm:py-5 md:py-4 px-1 sm:px-4 shadow-md text-base sm:text-2xl md:text-3xl tracking-wider cursor-pointer";
                    btn.innerText = points;
                    btn.onclick = () => openQuestion(btn, points, wordData);
                    
                    grid.appendChild(btn);
                    wordIndex++;
                }
            });
        }

        function openQuestion(btn, points, wordData) {
            currentCellBtn = btn;
            currentPoints = points;
            isAnswerShown = false;
            
            // Modal elemanlarının durumunu sıfırla
            document.getElementById('modal-title').innerText = `${currentGroup + 1}. Grup • ${points} Puan`;
            document.getElementById('english-word').innerText = wordData.en;
            document.getElementById('turkish-word').innerText = wordData.tr;
            
            document.getElementById('timeout-notice').classList.add('hidden');
            
            const correctBtn = document.getElementById('correct-btn');
            correctBtn.disabled = false;
            correctBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'pointer-events-none');

            document.getElementById('show-answer-btn').classList.remove('hidden');
            document.getElementById('answer-area').classList.add('hidden');
            document.getElementById('answer-area').classList.remove('flex');
            document.getElementById('question-modal').classList.remove('hidden');
            
            startTimer();
        }

        function startTimer() {
            timeLeft = gameDuration;
            updateTimerUI();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            // Otomatik cevabı göster
            showAnswer();
            
            // Süre doldu uyarısını göster
            document.getElementById('timeout-notice').classList.remove('hidden');
            
            // "DOĞRU" butonunu pasifleştir (sadece YANLIŞ butonuna basılabilsin)
            const correctBtn = document.getElementById('correct-btn');
            correctBtn.disabled = true;
            correctBtn.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('timer');
            timerEl.innerText = Math.max(0, timeLeft);
            
            if (timeLeft <= 3) {
                timerEl.classList.remove('text-blue-600');
                timerEl.classList.add('text-red-600', 'animate-pulse');
            } else {
                timerEl.classList.add('text-blue-600');
                timerEl.classList.remove('text-red-600', 'animate-pulse');
            }
        }

        function showAnswer() {
            isAnswerShown = true;
            clearInterval(timerInterval);
            document.getElementById('show-answer-btn').classList.add('hidden');
            document.getElementById('answer-area').classList.remove('hidden');
            document.getElementById('answer-area').classList.add('flex');
        }

        function handleResult(isCorrect) {
            clearInterval(timerInterval);
            
            if (isCorrect) {
                scores[currentGroup] += currentPoints;
            } else {
                scores[currentGroup] -= currentPoints;
            }
            
            document.getElementById(`score-val-${currentGroup}`).innerText = scores[currentGroup];
            
            currentCellBtn.disabled = true;
            currentCellBtn.innerText = '✔';
            currentCellBtn.classList.add('text-xl', 'sm:text-3xl', 'opacity-50');
            
            currentGroup = (currentGroup + 1) % numGroups;
            document.getElementById('question-modal').classList.add('hidden');
            updateScoreboardUI();
            
            answeredQuestionsCount++;
            if(answeredQuestionsCount === 30) {
                setTimeout(showEndGameScreen, 400);
            }
        }

        function updateScoreboardUI() {
            for (let i = 0; i < numGroups; i++) {
                const groupDiv = document.getElementById(`group-score-${i}`);
                if (i === currentGroup) {
                    groupDiv.classList.add('active-group');
                } else {
                    groupDiv.classList.remove('active-group');
                }
            }
        }

        function showEndGameScreen() {
            const maxScore = Math.max(...scores);
            const winners = [];
            
            for(let i = 0; i < scores.length; i++) {
                if(scores[i] === maxScore) {
                    winners.push(`${i + 1}. Grup`);
                }
            }
            
            let winnerMessage = "";
            if(winners.length === 1) {
                winnerMessage = `🎉 Harika! Kazanan: ${winners[0]} (${maxScore} Puan) 🎉`;
            } else {
                winnerMessage = `🤝 Beraberlik! ${winners.join(' ve ')} kazandı! (${maxScore} Puan) 🤝`;
            }
            
            document.getElementById('winner-text').innerText = winnerMessage;
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('end-modal').classList.remove('hidden');
            document.getElementById('end-modal').classList.add('flex');
        }
    </script>
</body>
</html>

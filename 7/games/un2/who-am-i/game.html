<style>

  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;

  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 4px 12px 12px; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #left { flex: 1.1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

  .cl .trl { font-weight: 800; font-size: clamp(.8rem, 1.6vw, 1.2rem); color: #0B5C56; }

  #fb { font-weight: 900; font-size: clamp(1rem, 2.2vw, 1.6rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; text-align: center; min-height: 1.3em; }
  #right { flex: 1 1 0; min-width: 0; min-height: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .tile { container-type: size; min-width: 0; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B2F2C; }
  .tile .e { font-size: 40cqmin; line-height: 1.1; }
  .tile .p { font-weight: 900; font-size: 13cqmin; line-height: 1.1; }
  .tile .t { font-weight: 800; font-size: 9.5cqmin; color: #0B5C56; }
  .tile.bad { background: #FFD6D6; border-color: #D62828; }
  .tile.good { background: #C8F7D4; border-color: #0A7A2F; border-width: 8px; }
  #nxt { display: none; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }

<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {

  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var R = [{"k": "medal", "en": ["I am a prize.", "I am round and made of metal.", "I hang on a ribbon.", "A winner wears me around the neck."], "tr": ["Bir ödülüm.", "Yuvarlağım ve metalden yapılmışım.", "Bir kurdelede asılı dururum.", "Kazanan beni boynuna takar."], "opts": [["medal", "⟦gold_medal⟧", "medal", "madalya"], ["trophy", "⟦trophy⟧", "trophy", "kupa"], ["stopwatch", "⟦stopwatch⟧", "stopwatch", "kronometre"], ["goggles", "⟦goggles⟧", "goggles", "yüzücü gözlüğü"]]}, {"k": "trophy", "en": ["I am a prize, too.", "I am big and shiny.", "I look like a golden cup.", "The winning team holds me up."], "tr": ["Ben de bir ödülüm.", "Büyük ve parlağım.", "Altın bir kupaya benzerim.", "Kazanan takım beni havaya kaldırır."], "opts": [["trophy", "⟦trophy⟧", "trophy", "kupa"], ["medal", "⟦gold_medal⟧", "medal", "madalya"], ["racket", "⟦badminton⟧", "racket", "raket"], ["goal", "⟦goal⟧", "goal", "kale"]]}, {"k": "stopwatch", "en": ["I am a small tool.", "I have a button on the top.", "I count seconds.", "A coach uses me to measure your running time."], "tr": ["Küçük bir araç.", "Üstümde bir düğme var.", "Saniyeleri sayarım.", "Bir antrenör koşu süreni ölçmek için beni kullanır."], "opts": [["stopwatch", "⟦stopwatch⟧", "stopwatch", "kronometre"], ["medal", "⟦gold_medal⟧", "medal", "madalya"], ["skates", "⟦ice_skates⟧", "ice skates", "buz pateni ayakkabıları"], ["bowling", "⟦bowling⟧", "bowling pins", "bowling lobutları"]]}, {"k": "stadium", "en": ["I am a place.", "I am very big and open.", "I have thousands of seats.", "Fans come to me to watch football matches."], "tr": ["Bir yerim.", "Çok büyük ve açığım.", "Binlerce koltuğum var.", "Taraftarlar futbol maçı izlemek için bana gelir."], "opts": [["stadium", "⟦stadium⟧", "stadium", "stadyum"], ["gym", "⟦dumbbells⟧", "gym", "spor salonu"], ["goal", "⟦goal⟧", "goal", "kale"], ["bike", "⟦bicycle⟧", "bicycle", "bisiklet"]]}, {"k": "gym", "en": ["I am a room.", "I have machines and weights.", "People sweat in me.", "You work out in me."], "tr": ["Bir odayım.", "Makinelerim ve ağırlıklarım var.", "İnsanlar içimde terler.", "Bende antrenman yaparsın."], "opts": [["gym", "⟦dumbbells⟧", "gym", "spor salonu"], ["stadium", "⟦stadium⟧", "stadium", "stadyum"], ["bowling", "⟦bowling⟧", "bowling pins", "bowling lobutları"], ["goggles", "⟦goggles⟧", "goggles", "yüzücü gözlüğü"]]}, {"k": "skates", "en": ["You wear me on your feet.", "I have a thin metal blade.", "I can only move on a special floor.", "You need me for ice skating."], "tr": ["Beni ayaklarına giyersin.", "İnce metal bir bıçağım var.", "Yalnızca özel bir zeminde hareket edebilirim.", "Buz pateni için bana ihtiyacın var."], "opts": [["skates", "⟦ice_skates⟧", "ice skates", "buz pateni ayakkabıları"], ["skis", "⟦skis⟧", "skis", "kayak takımı"], ["trainers", "⟦trainers⟧", "trainers", "spor ayakkabı"], ["goggles", "⟦goggles⟧", "goggles", "yüzücü gözlüğü"]]}, {"k": "goggles", "en": ["You wear me on your face.", "I am made of plastic and rubber.", "I keep water out.", "Swimmers wear me to protect their eyes."], "tr": ["Beni yüzüne takarsın.", "Plastik ve kauçuktan yapılmışım.", "Suyu dışarıda tutarım.", "Yüzücüler gözlerini korumak için beni takar."], "opts": [["goggles", "⟦goggles⟧", "goggles", "yüzücü gözlüğü"], ["racket", "⟦badminton⟧", "racket", "raket"], ["medal", "⟦gold_medal⟧", "medal", "madalya"], ["skates", "⟦ice_skates⟧", "ice skates", "buz pateni ayakkabıları"]]}, {"k": "football", "en": ["I am round.", "I have black and white parts.", "Players kick me.", "I go into the goal."], "tr": ["Yuvarlağım.", "Siyah ve beyaz parçalarım var.", "Oyuncular bana vurur.", "Kaleye girerim."], "opts": [["football", "⟦football⟧", "football", "futbol topu"], ["tennis", "⟦tennis_ball⟧", "tennis ball", "tenis topu"], ["basketball", "⟦basketball⟧", "basketball", "basketbol topu"], ["bowling", "⟦bowling⟧", "bowling pins", "bowling lobutları"]]}, {"k": "basketball", "en": ["I am big and round.", "I am orange.", "Players bounce me on the floor.", "They throw me into a high basket."], "tr": ["Büyük ve yuvarlağım.", "Turuncuyum.", "Oyuncular beni yere sektirir.", "Beni yüksekteki bir potaya atarlar."], "opts": [["basketball", "⟦basketball⟧", "basketball", "basketbol topu"], ["football", "⟦football⟧", "football", "futbol topu"], ["tennis", "⟦tennis_ball⟧", "tennis ball", "tenis topu"], ["goal", "⟦goal⟧", "goal", "kale"]]}, {"k": "tennis", "en": ["I am small and round.", "I am yellow and soft outside.", "I fly over a net.", "A player hits me with a racket."], "tr": ["Küçük ve yuvarlağım.", "Dışım sarı ve yumuşak.", "Bir ağın üzerinden uçarım.", "Bir oyuncu bana raketle vurur."], "opts": [["tennis", "⟦tennis_ball⟧", "tennis ball", "tenis topu"], ["basketball", "⟦basketball⟧", "basketball", "basketbol topu"], ["football", "⟦football⟧", "football", "futbol topu"], ["bowling", "⟦bowling⟧", "bowling pins", "bowling lobutları"]]}, {"k": "boxing", "en": ["I come in a pair.", "I am red and very big.", "You wear me on your hands.", "I protect a fighter in the ring."], "tr": ["İkili gelirim.", "Kırmızı ve çok büyüğüm.", "Beni ellerine takarsın.", "Ringde dövüşçüyü korurum."], "opts": [["boxing", "⟦boxing_gloves⟧", "boxing gloves", "boks eldivenleri"], ["goggles", "⟦goggles⟧", "goggles", "yüzücü gözlüğü"], ["trainers", "⟦trainers⟧", "trainers", "spor ayakkabı"], ["racket", "⟦badminton⟧", "racket", "raket"]]}, {"k": "skis", "en": ["I am long and thin.", "I come in a pair.", "I slide on white ground.", "You use me in the mountains in winter."], "tr": ["Uzun ve inceyim.", "İkili gelirim.", "Beyaz zeminde kayarım.", "Beni kışın dağlarda kullanırsın."], "opts": [["skis", "⟦skis⟧", "skis", "kayak takımı"], ["skates", "⟦ice_skates⟧", "ice skates", "buz pateni ayakkabıları"], ["bike", "⟦bicycle⟧", "bicycle", "bisiklet"], ["racket", "⟦badminton⟧", "racket", "raket"]]}, {"k": "bike", "en": ["I have two wheels.", "I have pedals.", "I do not need petrol.", "You ride me in cycling."], "tr": ["İki tekerleğim var.", "Pedallarım var.", "Benzine ihtiyacım yok.", "Bisiklet sporunda bana binersin."], "opts": [["bike", "⟦bicycle⟧", "bicycle", "bisiklet"], ["skis", "⟦skis⟧", "skis", "kayak takımı"], ["skates", "⟦ice_skates⟧", "ice skates", "buz pateni ayakkabıları"], ["stadium", "⟦stadium⟧", "stadium", "stadyum"]]}, {"k": "bowling", "en": ["I am a group of ten.", "I am white with red lines.", "I stand in a triangle.", "A heavy ball knocks me down."], "tr": ["On tanelik bir grubum.", "Beyazım, kırmızı çizgilerim var.", "Üçgen şeklinde dururum.", "Ağır bir top beni devirir."], "opts": [["bowling", "⟦bowling⟧", "bowling pins", "bowling lobutları"], ["goal", "⟦goal⟧", "goal", "kale"], ["medal", "⟦gold_medal⟧", "medal", "madalya"], ["football", "⟦football⟧", "football", "futbol topu"]]}], ROUNDS = 10;
  var order, qi, shown, wrong, score, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(R.slice()).slice(0, ROUNDS); qi = 0; score = 0;
    document.getElementById('sc').textContent = 0;
    showR();
  }
  function addClue() {
    var q = order[qi], i = shown;
    var d = document.createElement('div'); d.className = 'cl';
    d.innerHTML = '<div class="en">' + (i + 1) + '. ' + q.en[i] + '</div><div class="trl tr">' + q.tr[i] + '</div>';
    document.getElementById('cls').appendChild(d);
    shown++;
    document.getElementById('nc').disabled = (shown >= q.en.length);
    if (d.scrollIntoView) d.scrollIntoView({ block: 'nearest' });
  }
  function showR() {
    var q = order[qi]; shown = 0; wrong = 0; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('cls').innerHTML = ''; document.getElementById('qmark').textContent = '?';
    document.getElementById('fb').textContent = ''; document.getElementById('nxt').style.display = 'none';
    document.getElementById('nc').style.display = ''; document.getElementById('nc').disabled = false;
    addClue();
    var box = document.getElementById('right'); box.innerHTML = '';
    shuffle(q.opts.slice()).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = '<div class="e">' + o[1] + '</div><div class="p">' + o[2] + '</div><div class="t tr">' + o[3] + '</div>';
      b.addEventListener('click', function () { guess(b, o[0]); });
      box.appendChild(b);
    });
  }
  function moreClue() { if (locked) return; if (shown < order[qi].en.length) addClue(); }
  function guess(btn, k) {
    if (locked || btn.classList.contains('bad')) return;
    var q = order[qi];
    if (k === q.k) {
      locked = true;
      var pts = Math.max(0, (q.en.length - shown + 1) - wrong); score += pts;
      document.getElementById('sc').textContent = score;
      btn.classList.add('good');
      var o = q.opts[0]; document.getElementById('qmark').innerHTML = o[1];
      document.getElementById('fb').textContent = '✔ I am ' + (/^(ice skates|skis|trainers|goggles|bowling pins|boxing gloves)$/.test(o[2]) ? '' : (/^[aeiou]/.test(o[2]) ? 'an ' : 'a ')) + o[2] + '!  +' + pts + (pts === 1 ? ' point' : ' points');
      document.getElementById('nc').style.display = 'none';

  while((m=RE.exec(v))){
    out.push(v.slice(last,m.index)); last=m.index+m[0].length;
    if(inSvg)continue;
    var s=m[0], key;
    if(s.charAt(0)==='⟦') key='t_'+s.slice(1,-1);
    else key=EM[s.replace(/️/g,'').replace(/‍[\s\S]*$/,'')];
    var n=key&&mk(key); if(n)out.push(n);
  }
  out.push(v.slice(last));
  if(inSvg){t.nodeValue=out.join('').replace(/\s{2,}/g,' ').trim();return;}
  var f=document.createDocumentFragment();
  out.forEach(function(x){f.appendChild(typeof x==='string'?document.createTextNode(x):x);});
  p.replaceChild(f,t);
}
function fillImgs(root){
  var l=root.querySelectorAll?root.querySelectorAll('img[data-i]'):[];
  for(var i=0;i<l.length;i++){var e=l[i];if(!e.getAttribute('src')&&IM[e.getAttribute('data-i')])e.src=IM[e.getAttribute('data-i')];}
  if(root.tagName==='IMG'&&root.getAttribute('data-i')&&!root.getAttribute('src'))root.src=IM[root.getAttribute('data-i')];
}
function walk(n){
  if(n.nodeType===3){fixText(n);return;}
  if(n.nodeType!==1||SKIP[n.nodeName])return;
  fillImgs(n);
  var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),a=[],x;
  while((x=w.nextNode()))a.push(x);
  a.forEach(function(t){if(t.parentNode&&!SKIP[t.parentNode.nodeName])fixText(t);});
}
function start(){
  walk(document.body);
  new MutationObserver(function(ms){
    for(var i=0;i<ms.length;i++){var m=ms[i];
      if(m.type==='characterData')walk(m.target);
      else for(var j=0;j<m.addedNodes.length;j++)walk(m.addedNodes[j]);}
  }).observe(document.body,{childList:true,subtree:true,characterData:true});
}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
</script>

<style>

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {

  }

  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }

  var R = [{"k": "medal", "en": ["I am a prize.", "I am round and made of metal.", "I hang on a ribbon.", "A winner wears me around the neck."], "tr": ["Bir ödülüm.", "Yuvarlağım ve metalden yapılmışım.", "Bir kurdelede asılı dururum.", "Kazanan beni boynuna takar."], "opts": [["medal", "🏅", "medal", "madalya"], ["trophy", "🏆", "trophy", "kupa"], ["stopwatch", "⏱️", "stopwatch", "kronometre"], ["goggles", "🥽", "goggles", "yüzücü gözlüğü"]]}, {"k": "trophy", "en": ["I am a prize, too.", "I am big and shiny.", "I look like a golden cup.", "The winning team holds me up."], "tr": ["Ben de bir ödülüm.", "Büyük ve parlağım.", "Altın bir kupaya benzerim.", "Kazanan takım beni havaya kaldırır."], "opts": [["trophy", "🏆", "trophy", "kupa"], ["medal", "🏅", "medal", "madalya"], ["racket", "🏸", "racket", "raket"], ["goal", "🥅", "goal", "kale"]]}, {"k": "stopwatch", "en": ["I am a small tool.", "I have a button on the top.", "I count seconds.", "A coach uses me to measure your running time."], "tr": ["Küçük bir araç.", "Üstümde bir düğme var.", "Saniyeleri sayarım.", "Bir antrenör koşu süreni ölçmek için beni kullanır."], "opts": [["stopwatch", "⏱️", "stopwatch", "kronometre"], ["medal", "🏅", "medal", "madalya"], ["skates", "⛸️", "ice skates", "buz pateni ayakkabıları"], ["bowling", "🎳", "bowling pins", "bowling lobutları"]]}, {"k": "stadium", "en": ["I am a place.", "I am very big and open.", "I have thousands of seats.", "Fans come to me to watch football matches."], "tr": ["Bir yerim.", "Çok büyük ve açığım.", "Binlerce koltuğum var.", "Taraftarlar futbol maçı izlemek için bana gelir."], "opts": [["stadium", "🏟️", "stadium", "stadyum"], ["gym", "🏋️", "gym", "spor salonu"], ["goal", "🥅", "goal", "kale"], ["bike", "🚲", "bicycle", "bisiklet"]]}, {"k": "gym", "en": ["I am a room.", "I have machines and weights.", "People sweat in me.", "You work out in me."], "tr": ["Bir odayım.", "Makinelerim ve ağırlıklarım var.", "İnsanlar içimde terler.", "Bende antrenman yaparsın."], "opts": [["gym", "🏋️", "gym", "spor salonu"], ["stadium", "🏟️", "stadium", "stadyum"], ["bowling", "🎳", "bowling pins", "bowling lobutları"], ["goggles", "🥽", "goggles", "yüzücü gözlüğü"]]}, {"k": "skates", "en": ["You wear me on your feet.", "I have a thin metal blade.", "I can only move on a special floor.", "You need me for ice skating."], "tr": ["Beni ayaklarına giyersin.", "İnce metal bir bıçağım var.", "Yalnızca özel bir zeminde hareket edebilirim.", "Buz pateni için bana ihtiyacın var."], "opts": [["skates", "⛸️", "ice skates", "buz pateni ayakkabıları"], ["skis", "🎿", "skis", "kayak takımı"], ["trainers", "👟", "trainers", "spor ayakkabı"], ["goggles", "🥽", "goggles", "yüzücü gözlüğü"]]}, {"k": "goggles", "en": ["You wear me on your face.", "I am made of plastic and rubber.", "I keep water out.", "Swimmers wear me to protect their eyes."], "tr": ["Beni yüzüne takarsın.", "Plastik ve kauçuktan yapılmışım.", "Suyu dışarıda tutarım.", "Yüzücüler gözlerini korumak için beni takar."], "opts": [["goggles", "🥽", "goggles", "yüzücü gözlüğü"], ["racket", "🏸", "racket", "raket"], ["medal", "🏅", "medal", "madalya"], ["skates", "⛸️", "ice skates", "buz pateni ayakkabıları"]]}, {"k": "football", "en": ["I am round.", "I have black and white parts.", "Players kick me.", "I go into the goal."], "tr": ["Yuvarlağım.", "Siyah ve beyaz parçalarım var.", "Oyuncular bana vurur.", "Kaleye girerim."], "opts": [["football", "⚽", "football", "futbol topu"], ["tennis", "🎾", "tennis ball", "tenis topu"], ["basketball", "🏀", "basketball", "basketbol topu"], ["bowling", "🎳", "bowling pins", "bowling lobutları"]]}, {"k": "basketball", "en": ["I am big and round.", "I am orange.", "Players bounce me on the floor.", "They throw me into a high basket."], "tr": ["Büyük ve yuvarlağım.", "Turuncuyum.", "Oyuncular beni yere sektirir.", "Beni yüksekteki bir potaya atarlar."], "opts": [["basketball", "🏀", "basketball", "basketbol topu"], ["football", "⚽", "football", "futbol topu"], ["tennis", "🎾", "tennis ball", "tenis topu"], ["goal", "🥅", "goal", "kale"]]}, {"k": "tennis", "en": ["I am small and round.", "I am yellow and soft outside.", "I fly over a net.", "A player hits me with a racket."], "tr": ["Küçük ve yuvarlağım.", "Dışım sarı ve yumuşak.", "Bir ağın üzerinden uçarım.", "Bir oyuncu bana raketle vurur."], "opts": [["tennis", "🎾", "tennis ball", "tenis topu"], ["basketball", "🏀", "basketball", "basketbol topu"], ["football", "⚽", "football", "futbol topu"], ["bowling", "🎳", "bowling pins", "bowling lobutları"]]}, {"k": "boxing", "en": ["I come in a pair.", "I am red and very big.", "You wear me on your hands.", "I protect a fighter in the ring."], "tr": ["İkili gelirim.", "Kırmızı ve çok büyüğüm.", "Beni ellerine takarsın.", "Ringde dövüşçüyü korurum."], "opts": [["boxing", "🥊", "boxing gloves", "boks eldivenleri"], ["goggles", "🥽", "goggles", "yüzücü gözlüğü"], ["trainers", "👟", "trainers", "spor ayakkabı"], ["racket", "🏸", "racket", "raket"]]}, {"k": "skis", "en": ["I am long and thin.", "I come in a pair.", "I slide on white ground.", "You use me in the mountains in winter."], "tr": ["Uzun ve inceyim.", "İkili gelirim.", "Beyaz zeminde kayarım.", "Beni kışın dağlarda kullanırsın."], "opts": [["skis", "🎿", "skis", "kayak takımı"], ["skates", "⛸️", "ice skates", "buz pateni ayakkabıları"], ["bike", "🚲", "bicycle", "bisiklet"], ["racket", "🏸", "racket", "raket"]]}, {"k": "bike", "en": ["I have two wheels.", "I have pedals.", "I do not need petrol.", "You ride me in cycling."], "tr": ["İki tekerleğim var.", "Pedallarım var.", "Benzine ihtiyacım yok.", "Bisiklet sporunda bana binersin."], "opts": [["bike", "🚲", "bicycle", "bisiklet"], ["skis", "🎿", "skis", "kayak takımı"], ["skates", "⛸️", "ice skates", "buz pateni ayakkabıları"], ["stadium", "🏟️", "stadium", "stadyum"]]}, {"k": "bowling", "en": ["I am a group of ten.", "I am white with red lines.", "I stand in a triangle.", "A heavy ball knocks me down."], "tr": ["On tanelik bir grubum.", "Beyazım, kırmızı çizgilerim var.", "Üçgen şeklinde dururum.", "Ağır bir top beni devirir."], "opts": [["bowling", "🎳", "bowling pins", "bowling lobutları"], ["goal", "🥅", "goal", "kale"], ["medal", "🏅", "medal", "madalya"], ["football", "⚽", "football", "futbol topu"]]}], ROUNDS = 10;
  var order, qi, shown, wrong, score, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(R.slice()).slice(0, ROUNDS); qi = 0; score = 0;
    document.getElementById('sc').textContent = 0;
    showR();
  }
  function addClue() {
    var q = order[qi], i = shown;
    var d = document.createElement('div'); d.className = 'cl';
    d.innerHTML = '<div class="en">' + (i + 1) + '. ' + q.en[i] + '</div><div class="trl tr">' + q.tr[i] + '</div>';
    document.getElementById('cls').appendChild(d);
    shown++;
    document.getElementById('nc').disabled = (shown >= q.en.length);
    if (d.scrollIntoView) d.scrollIntoView({ block: 'nearest' });
  }
  function showR() {
    var q = order[qi]; shown = 0; wrong = 0; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('cls').innerHTML = ''; document.getElementById('qmark').textContent = '?';
    document.getElementById('fb').textContent = ''; document.getElementById('nxt').style.display = 'none';
    document.getElementById('nc').style.display = ''; document.getElementById('nc').disabled = false;
    addClue();
    var box = document.getElementById('right'); box.innerHTML = '';
    shuffle(q.opts.slice()).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = '<div class="e">' + o[1] + '</div><div class="p">' + o[2] + '</div><div class="t tr">' + o[3] + '</div>';
      b.addEventListener('click', function () { guess(b, o[0]); });
      box.appendChild(b);
    });
  }
  function moreClue() { if (locked) return; if (shown < order[qi].en.length) addClue(); }
  function guess(btn, k) {
    if (locked || btn.classList.contains('bad')) return;
    var q = order[qi];
    if (k === q.k) {
      locked = true;
      var pts = Math.max(0, (q.en.length - shown + 1) - wrong); score += pts;
      document.getElementById('sc').textContent = score;
      btn.classList.add('good');
      var o = q.opts[0]; document.getElementById('qmark').innerHTML = o[1];
      document.getElementById('fb').textContent = '✔ I am ' + (/^[aeiou]/.test(o[2]) ? 'an ' : 'a ') + o[2] + '!  +' + pts + (pts === 1 ? ' point' : ' points');
      document.getElementById('nc').style.display = 'none';
      var nx = document.getElementById('nxt'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      wrong++; btn.classList.add('bad', 'shake');
      document.getElementById('fb').textContent = 'Not this one. Try again!';
    }
  }
  function nextR() {
    qi++;
    if (qi >= order.length) {
      var max = ROUNDS * 4;
      document.getElementById('win-title').textContent = score >= 32 ? 'Super Detective!' : (score >= 22 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Points: ' + score + ' / ' + max;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showR();
  }
</script>

    document.getElementById('ln-grid').innerHTML = LN[i][2].map(function (it) {
      var wide = it[1].length > 26 && it[0].indexOf('<svg') < 0;
      return '<div class="ln-card' + (wide ? ' wide' : '') + '"><div class="le">' + it[0] + '</div><div class="en">' + it[1] + '</div><div class="trl">' + it[2] + '</div></div>';
    }).join('');
    document.getElementById('ln-grid').scrollTop = 0;
  }
  window.lnOpen = function () {
    var tabs = document.getElementById('ln-tabs'); tabs.innerHTML = '';
    LN.forEach(function (s, i) { var b = document.createElement('button'); b.className = 'ln-tab'; b.textContent = s[0]; b.onclick = function () { lnShow(i); }; tabs.appendChild(b); });
    document.getElementById('ln-screen').style.display = 'flex'; lnShow(0);
  };
  window.lnClose = function () { document.getElementById('ln-screen').style.display = 'none'; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.lnClose(); });
})();
</script>
</body>
</html>

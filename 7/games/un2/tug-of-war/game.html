<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tug of War</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2.2vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.2rem, 3.4vw, 2.4rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  body.no-tr .tr { display: none; }

  #score { flex: 0 0 auto; display: flex; gap: 10px; justify-content: center; padding: 2px 12px; }
  .tm { color: #fff; font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.6rem); padding: 0 18px; border-radius: 12px; border: 4px solid #0B2F2C; opacity: .9; }
  .tm.now { opacity: 1; box-shadow: 0 0 0 5px #FFD23F; transform: scale(1.06); }
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 6px 12px 12px; }
  #scene { flex: 0 0 22%; min-height: 0; position: relative; background: #fff; border: 5px solid #0B2F2C; border-radius: 18px; overflow: hidden;
    background-image: linear-gradient(90deg, #FFD6D6 0 18%, #fff 18% 82%, #D6E4FF 82% 100%); }
  #rope { position: absolute; left: 0; right: 0; top: 64%; height: 14px; transform: translateY(-50%); background: repeating-linear-gradient(90deg, #8A5A2B 0 14px, #B07A3F 14px 28px); border-top: 3px solid #0B2F2C; border-bottom: 3px solid #0B2F2C; }
  #mid { position: absolute; left: 50%; top: 30%; bottom: 6%; border-left: 6px dashed #0B2F2C; }
  .zone { position: absolute; top: 0; bottom: 0; width: 18%; display: flex; align-items: flex-start; justify-content: center; padding-top: 3px; font-weight: 900; color: #fff; font-size: clamp(.9rem, 2.2vw, 1.6rem); }
  #mark { position: absolute; top: 64%; font-size: clamp(2.2rem, 9vh, 4.5rem); line-height: 1; transform: translate(-50%, -62%); transition: left .6s ease; z-index: 3; }
  #card { position: relative; flex: 1 1 auto; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 6px 14px; text-align: center; }
  #who { color: #fff; font-weight: 900; font-size: clamp(1rem, 2.6vw, 1.9rem); padding: 0 22px; border-radius: 999px; border: 4px solid #0B2F2C; }
  #pic { font-size: clamp(3rem, 15vh, 7rem); line-height: 1; }
  #hint { font-weight: 800; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #0B5C56; min-height: 1.1em; }
  #opts { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .opt { font-size: clamp(1.1rem, 2.8vw, 2.1rem); font-weight: 900; padding: .2em .9em; background: #fff; color: #0B2F2C; border: 5px solid #0B2F2C; border-radius: 16px; box-shadow: 0 5px 0 #0B2F2C; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 #0B2F2C; }
  .opt.good { background: #C8F7D4; border-color: #0A7A2F; } .opt.bad { background: #FFD6D6; border-color: #D62828; }
  #fb { min-height: 1.4em; font-size: clamp(1rem, 2.6vw, 1.9rem); font-weight: 800; color: #0B5C56; }
  #next { display: none; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  @media (max-width: 700px) and (max-aspect-ratio: 1/1) {
    #main { gap: 6px; padding: 4px 8px 8px; } #scene { flex-basis: 17%; border-width: 4px; } .opt { font-size: clamp(1rem, 4.4vw, 1.4rem); border-width: 4px; }
    #fb { font-size: 1rem; } #topbar { padding: 4px 56px 2px 6px; gap: 6px; }
  }
  @media (max-height: 480px) {
    #scene { flex-basis: 20%; border-width: 4px; } #card { padding: 2px 10px; border-width: 4px; } #pic { font-size: 3rem; } #hint { font-size: .9rem; }
    .opt { font-size: 1rem; padding: .05em .7em; border-width: 3px; box-shadow: 0 3px 0 #0B2F2C; } #fb { font-size: .85rem; line-height: 1.1; min-height: 1.1em; }
    #next { font-size: 1rem !important; padding: .05em .9em; border-width: 3px; box-shadow: 0 3px 0 #0B2F2C; } #who { font-size: .9rem; border-width: 3px; }
    #score { padding: 0 8px; } .tm { font-size: .85rem; border-width: 3px; }
  }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
<style id="phone-short">
@media (max-height: 480px) {
  #start-screen, #win-screen { gap: 1.2vh; padding: 6px 10px; }
  .title { font-size: 2rem; } .title br { display: none; } .subtitle { font-size: 1rem; } .preview { font-size: 1.6rem; }
  .big-btn { font-size: 1.25rem; padding: .12em 1em; border-width: 4px; box-shadow: 0 3px 0 #0B2F2C; }
  .win-title { font-size: 2rem; } .win-stats { font-size: 1.05rem; }
  .og, .ob { font-size: 1rem; } .ob { border-width: 3px; padding: 0 .6em; }
  #topbar { padding-top: 4px; padding-bottom: 2px; gap: 8px; }
  .stat, .restart-btn { font-size: .95rem; border-width: 3px; padding: 0 12px; }
}
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Tug of War</h1>
  <p class="subtitle">Answer correctly and pull the flag to your side!</p>
  <div class="preview">🔴 🚩 🔵</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Question: <span id="qn">1</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="score"></div>
<div id="main">
  <div id="scene">
    <div class="zone" style="left:0;background:#D62828">Team 1</div>
    <div class="zone" style="right:0;background:#1F5FBF">Team 2</div>
    <div id="mid"></div><div id="rope"></div><div id="mark">🚩</div>
  </div>
  <div id="card">
    <div id="who"></div>
    <div id="pic"></div>
    <div id="hint" class="tr"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <button class="big-btn" id="next" onclick="nextQ()">Next</button>
  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }
  function toggleTR() { var off = document.body.classList.toggle('no-tr'); document.getElementById('trbtn').textContent = 'Turkish: ' + (off ? 'Off' : 'On'); }
  function $(id) { return document.getElementById(id); }

  var Q = [["⚽", "futbol", ["football", "always", "trophy"]], ["🏀", "basketbol", ["basketball", "equipment", "sometimes"]], ["🎾", "tenis", ["tennis", "goal", "never"]], ["🏐", "voleybol", ["volleyball", "spectator", "medal"]], ["🥊", "boks", ["boxing", "equipment", "usually"]], ["🥋", "judo", ["judo", "always", "spectator"]], ["🎿", "kayak", ["skiing", "coach", "equipment"]], ["🚲", "bisiklet sürme", ["cycling", "medal", "coach"]], ["🏊", "yüzme", ["swimming", "always", "injury"]], ["👟", "hafif tempolu koşu", ["jogging", "spectator", "sometimes"]], ["🥾", "doğa yürüyüşü", ["hiking", "sometimes", "score"]], ["🎳", "bowling", ["bowling", "trophy", "sometimes"]], ["🏸", "badminton", ["badminton", "usually", "always"]], ["🏅", "madalya", ["medal", "skiing", "bowling"]], ["🏆", "kupa", ["trophy", "usually", "football"]], ["🏟️", "stadyum", ["stadium", "usually", "football"]], ["📋", "antrenör", ["coach", "sometimes", "volleyball"]], ["🥅", "gol, kale", ["goal", "swimming", "usually"]], ["🔢", "skor, sayı", ["score", "jogging", "tennis"]], ["🚑", "sakatlık", ["injury", "bowling", "football"]], ["👏", "seyirci", ["spectator", "tennis", "swimming"]], ["🎒", "ekipman", ["equipment", "always", "cycling"]], ["💯", "her zaman", ["always", "swimming", "boxing"]], ["🚫", "asla", ["never", "boxing", "hiking"]], ["🔼", "genellikle", ["usually", "coach", "injury"]], ["🔄", "bazen", ["sometimes", "equipment", "tennis"]]];
  var GOAL = 5, COLORS = ['#D62828', '#1F5FBF'], order, qi, turn, pos, pulls, locked;
  function startGame() {
    $('start-screen').style.display = 'none'; $('win-screen').style.display = 'none';
    order = shuffle(Q.slice()); qi = 0; turn = 0; pos = 0; pulls = [0, 0]; place(); showQ();
  }
  function place() { $('mark').style.left = (50 + pos * 8.4) + '%'; }
  function drawScore() {
    var box = $('score'); box.innerHTML = '';
    for (var i = 0; i < 2; i++) {
      var d = document.createElement('div'); d.className = 'tm' + (i === turn ? ' now' : '');
      d.style.background = COLORS[i]; d.textContent = 'Team ' + (i + 1) + ': ' + pulls[i]; box.appendChild(d);
    }
  }
  function showQ() {
    var q = order[qi]; locked = false; drawScore(); $('qn').textContent = qi + 1;
    var w = $('who'); w.textContent = 'Team ' + (turn + 1) + ' - your turn!'; w.style.background = COLORS[turn];
    $('pic').innerHTML = q[0]; $('hint').textContent = q[1]; $('fb').textContent = ''; $('next').style.display = 'none';
    var box = $('opts'); box.innerHTML = '';
    shuffle(q[2].map(function (t, i) { return { t: t, i: i }; })).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'opt'; b.textContent = o.t;
      b.addEventListener('click', function () { answer(b, o.i); }); box.appendChild(b);
    });
  }
  function answer(btn, i) {
    if (locked) return; locked = true;
    var q = order[qi], ok = (i === 0);
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) { if (b.textContent === q[2][0]) b.classList.add('good'); });
    if (ok) { pulls[turn]++; pos += (turn === 0 ? -1 : 1); place(); $('fb').textContent = '✔ Great! Team ' + (turn + 1) + ' pulls the flag!'; }
    else { btn.classList.add('bad', 'shake'); $('fb').textContent = '✘ Not this time. It is “' + q[2][0] + '”.'; }
    drawScore();
    if (Math.abs(pos) >= GOAL) { setTimeout(finish, 1500); return; }
    var nx = $('next'); nx.style.display = 'inline-block';
  }
  function nextQ() {
    qi++; turn = 1 - turn;
    if (qi >= order.length) { finish(); return; }
    showQ();
  }
  function finish() {
    var t = pos < 0 ? 'Team 1 Wins!' : (pos > 0 ? 'Team 2 Wins!' : "It's a Draw!");
    $('win-title').textContent = t;
    $('win-stats').textContent = 'Team 1: ' + pulls[0] + '  |  Team 2: ' + pulls[1];
    $('win-screen').style.display = 'flex';
  }
</script>
<div id="ln-screen">
  <div id="ln-top"><div id="ln-title">📖 Learn</div><div id="ln-tabs"></div><button id="ln-close" onclick="lnClose()">Close ✕</button></div>
  <div id="ln-grid"></div>
</div>
<script>
(function () {
  var LN = [["Sports", "Sporlar", [["⚽", "football", "futbol"], ["🏀", "basketball", "basketbol"], ["🎾", "tennis", "tenis"], ["🏐", "volleyball", "voleybol"], ["🥊", "boxing", "boks"], ["🥋", "judo", "judo"], ["🎿", "skiing", "kayak"], ["🚲", "cycling", "bisiklet sürme"], ["🏊", "swimming", "yüzme"], ["👟", "jogging", "hafif tempolu koşu"], ["🥾", "hiking", "doğa yürüyüşü"], ["🎳", "bowling", "bowling"], ["🏸", "badminton", "badminton"]]], ["Sports Words", "Spor Kelimeleri", [["🏅", "medal", "madalya"], ["🏆", "trophy", "kupa"], ["🏟️", "stadium", "stadyum"], ["📋", "coach", "antrenör"], ["🥅", "goal", "gol, kale"], ["🔢", "score", "skor, sayı"], ["🚑", "injury", "sakatlık"], ["👏", "spectator", "seyirci"], ["🎒", "equipment", "ekipman"]]], ["How Often", "Sıklık Zarfları", [["💯", "always", "her zaman"], ["🚫", "never", "asla"], ["🔼", "usually", "genellikle"], ["🔄", "sometimes", "bazen"]]]];
  function lnShow(i) {
    Array.prototype.forEach.call(document.querySelectorAll('.ln-tab'), function (b, k) { b.classList.toggle('act', k === i); });
    document.getElementById('ln-grid').innerHTML = LN[i][2].map(function (it) {
      var wide = it[1].length > 26 && it[0].indexOf('<svg') < 0;
      return '<div class="ln-card' + (wide ? ' wide' : '') + '"><div class="le">' + it[0] + '</div><div class="en">' + it[1] + '</div><div class="trl">' + it[2] + '</div></div>';
    }).join('');
    document.getElementById('ln-grid').scrollTop = 0;
  }
  window.lnOpen = function () {
    var tabs = document.getElementById('ln-tabs'); tabs.innerHTML = '';
    LN.forEach(function (s, i) { var b = document.createElement('button'); b.className = 'ln-tab'; b.textContent = s[0]; b.onclick = function () { lnShow(i); }; tabs.appendChild(b); });
    document.getElementById('ln-screen').style.display = 'flex'; lnShow(0);
  };
  window.lnClose = function () { document.getElementById('ln-screen').style.display = 'none'; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.lnClose(); });
})();
</script>
</body>
</html>

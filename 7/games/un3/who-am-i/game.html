amily and friends come to me and wear nice clothes.", "There is often music and dancing in me.", "Two people get married in me."], "tr": ["Ben özel bir günüm.", "Aile ve arkadaşlar bana gelir ve güzel kıyafetler giyer.", "Bende sık sık müzik ve dans vardır.", "İki kişi bende evlenir."], "opts": [["wedding", "⟦wedding_chapel⟧", "wedding", "düğün"], ["birthday", "⟦birthday_cake⟧", "birthday", "doğum günü"], ["graduation", "⟦graduation_cap⟧", "graduation", "mezuniyet"], ["concert", "⟦microphone⟧", "concert", "konser"]]}, {"k": "graduation", "en": ["I am a ceremony.", "Students wear special hats and gowns in me.", "Teachers and families clap in me.", "You get your diploma in me when you finish your studies."], "tr": ["Ben bir törenim.", "Öğrenciler bende özel şapkalar ve cüppeler giyer.", "Öğretmenler ve aileler bende alkışlar.", "Öğrenimini bitirdiğinde diplomanı bende alırsın."], "opts": [["graduation", "⟦graduation_cap⟧", "graduation", "mezuniyet"], ["wedding", "⟦wedding_chapel⟧", "wedding", "düğün"], ["concert", "⟦microphone⟧", "concert", "konser"], ["race", "⟦checkered_flag⟧", "race", "yarış"]]}, {"k": "midnight", "en": ["I am a time of the day.", "Most people are asleep in me.", "It is very dark in me.", "I am twelve o’clock at night."], "tr": ["Ben günün bir vaktiyim.", "İnsanların çoğu bende uykudadır.", "Bende hava çok karanlıktır.", "Ben gecenin saat on ikisiyim."], "opts": [["midnight", "⟦moon⟧", "midnight", "gece yarısı"], ["noon", "⟦sun⟧", "noon", "öğle"], ["sunrise", "⟦sunrise⟧", "sunrise", "gün doğumu"], ["sunset", "⟦sunset⟧", "sunset", "gün batımı"]]}, {"k": "calendar", "en": ["I am a thing with many numbers.", "I have twelve parts, one for each month.", "You look at me to find the day and the date.", "I show days, weeks and months."], "tr": ["Birçok sayısı olan bir şeyim.", "On iki bölümüm var, her ay için bir tane.", "Günü ve tarihi bulmak için bana bakarsın.", "Günleri, haftaları ve ayları gösteririm."], "opts": [["calendar", "⟦calendar⟧", "calendar",   function showR() {
    var q = order[qi]; shown = 0; wrong = 0; locked = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('cls').innerHTML = ''; document.getElementById('qmark').textContent = '?';
    document.getElementById('fb').textContent = ''; document.getElementById('nxt').style.display = 'none';
    document.getElementById('nc').style.display = ''; document.getElementById('nc').disabled = false;
    addClue();
    var box = document.getElementById('right'); box.innerHTML = '';
    shuffle(q.opts.slice()).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = '<div class="e">' + o[1] + '</div><div class="p">' + o[2] + '</div><div class="t tr">' + o[3] + '</div>';
      b.addEventListener('click', function () { guess(b, o[0]); });
      box.appendChild(b);
    });
  }
  function moreClue() { if (locked) return; if (shown < order[qi].en.length) addClue(); }
  function guess(btn, k) {
    if (locked || btn.classList.contains('bad')) return;
    var q = order[qi];
    if (k === q.k) {
      locked = true;
      var pts = Math.max(0, (q.en.length - shown + 1) - wrong); score += pts;
      document.getElementById('sc').textContent = score;
      btn.classList.add('good');
      var o = q.opts[0]; document.getElementById('qmark').textContent = o[1];
      document.getElementById('fb').textContent = '✔ I am ' + (/^(midnight|noon)$/.test(o[2]) ? '' : (/^[aeiou]/.test(o[2]) && !/^uni/.test(o[2]) ? 'an ' : 'a ')) + o[2] + '!  +' + pts + (pts === 1 ? ' point' : ' points');
      document.getElementById('nc').style.display = 'none';
      var nx = document.getElementById('nxt'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
    } else {
      wrong++; btn.classList.add('bad', 'shake');
      document.getElementById('fb').textContent = 'Not this one. Try again!';
    }
  }
  function nextR() {
    qi++;
    if (qi >= order.length) {
      var max = ROUNDS * 4;
      document.getElementById('win-title').textContent = score >= 32 ? 'Super Detective!' : (score >= 22 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Points: ' + score + ' / ' + max;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showR();
  }
</script>

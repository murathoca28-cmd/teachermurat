<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#06b6d4 0%,#3b82f6 100%);min-height:100vh}
.game-btn{background:linear-gradient(to bottom,#0891b2 0%,#0e7490 100%);border-bottom:6px solid #155e75;border-radius:1.5rem;transition:all .2s ease-in-out;text-shadow:1px 1px 2px rgba(0,0,0,.3)}

@keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

</head>
<body class="text-gray-800 p-2 md:p-4 relative">

<!-- Karşılama Ekranı -->
<div id="splash" class="fixed inset-0 z-40 flex flex-col items-center justify-center gap-4 sm:gap-6 p-6 text-center text-white bg-gradient-to-br from-cyan-700 via-blue-700 to-blue-800">
    <p class="text-lg sm:text-2xl font-bold opacity-90">7. Sınıf • 1. Ünite</p>
    <h1 class="text-3xl sm:text-6xl font-black drop-shadow-lg">Appearance &amp; Personality – Jeopardy</h1>
    <button onclick="closeSplash()" class="mt-2 sm:mt-4 bg-sky-400 hover:bg-sky-500 border-b-8 border-sky-600 rounded-3xl w-32 h-32 sm:w-40 sm:h-40 flex flex-col items-center justify-center shadow-2xl transition-transform hover:scale-105 active:scale-95 cursor-pointer">
        <span class="text-5xl sm:text-6xl leading-none">▶</span>
        <span class="text-lg sm:text-2xl font-extrabold mt-1">BAŞLAT</span>
    </button>
    <p class="max-w-md text-sm sm:text-xl font-bold opacity-90">Puan kutularını aç, kelimenin anlamını bul. <br class="hidden sm:block">Doğru bilirsen puan kazanırsın!</p>
</div>

<!-- Tam Ekran Butonu -->
<button onclick="toggleFullScreen()" class="fixed bottom-2 right-2 sm:bottom-4 sm:right-4 z-50 bg-white/90 text-cyan-900 p-2 sm:p-3 rounded-full shadow-lg hover:bg-white hover:scale-105 transition-all border-2 border-cyan-200 flex items-center justify-center cursor-pointer" title="Tam Ekran / Çıkış">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
</button>

<!-- Menü Butonu -->
<button id="menu-btn" onclick="openMenu()" title="Menü" class="hidden fixed bottom-2 left-2 sm:bottom-4 sm:left-4 z-[60] bg-neutral-900/90 text-white w-10 h-10 sm:w-12 sm:h-12 rounded-full shadow-lg border-2 border-neutral-600 hover:bg-neutral-800 hover:scale-105 transition-all text-xl cursor-pointer">☰</button>

<!-- Menü Paneli -->
<div id="game-menu" class="hidden fixed inset-0 z-[60]" onclick="closeMenu()">
    <div onclick="event.stopPropagation()" class="absolute bottom-14 left-2 sm:bottom-20 sm:left-4 w-56 sm:w-64 bg-neutral-900 text-white rounded-xl border-2 border-neutral-600 shadow-2xl p-3">
        <p class="text-xs sm:text-sm font-bold tracking-widest text-neutral-400 pb-2 mb-2 border-b-2 border-black">JEOPARDY</p>
        <button onclick="restartGame()" class="w-full text-left text-base sm:text-xl font-extrabold px-3 py-2 rounded-lg hover:bg-neutral-700 cursor-pointer">Yeniden başlat</button>
        <button onclick="closeMenu()" class="w-full text-left text-base sm:text-xl font-extrabold px-3 py-2 rounded-lg hover:bg-neutral-700 cursor-pointer">Sürdür</button>
    </div>
</div>

<!-- Kurulum Üst Bar -->
<div id="setup-bar" class="bg-white/95 backdrop-blur-md shadow-2xl p-4 md:p-6 flex flex-col md:flex-row flex-wrap items-center justify-center gap-4 md:gap-6 rounded-[2rem] mx-auto w-full max-w-5xl relative z-10 border-4 border-white">
    <h1 class="text-xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-blue-600 drop-shadow-sm text-center">👤 7. Sınıf 1. Ünite: APPEARANCE &amp; PERSONALITY</h1>
    <div class="flex items-center gap-2 bg-cyan-50 px-3 py-2 md:px-4 rounded-2xl border-2 border-cyan-200 w-full md:w-auto justify-center">
        <label for="category-select" class="font-bold text-cyan-800 text-sm md:text-base">Kategori / Konu:</label>
        <select id="category-select" class="bg-white border-2 border-cyan-300 rounded-xl p-1 font-bold text-cyan-900 focus:outline-none focus:border-cyan-500 text-sm md:text-base">
            <option value="all" selected>1. Ünite: TÜMÜ (Karma 30 Kelime/Soru)</option>
            <option value="physical_appearance">1. Ünite: Soru Kalıpları &amp; Fiziksel Görünüm (Part 1)</option>
            <option value="personality_traits">1. Ünite: Kişilik Özellikleri (Part 2)</option>
        </select>
    </div>
    <div class="flex gap-4 w-full md:w-auto justify-center">
        <div class="flex items-center gap-2 bg-blue-50 px-3 py-2 rounded-2xl border-2 border-blue-200">
            <label for="group-count" class="font-bold text-blue-800 text-sm md:text-base">Grup Sayısı:</label>
            <select id="group-count" class="bg-white border-2 border-blue-300 rounded-xl p-1 font-bold text-blue-900 focus:outline-none focus:border-blue-500 text-center text-sm md:text-base">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
            </select>
        </div>
        <div class="flex items-center gap-2 bg-orange-50 px-3 py-2 rounded-2xl border-2 border-orange-200">
            <label for="timer-setting" class="font-bold text-orange-800 text-sm md:text-base">Süre (sn):</label>
            <input type="number" id="timer-setting" value="10" min="5" max="60" class="bg-white border-2 border-orange-300 rounded-xl p-1 w-12 md:w-16 font-bold text-orange-900 focus:outline-none focus:border-orange-500 text-center text-sm md:text-base">
        </div>
    </div>
    <button id="start-btn" onclick="startGame()" class="bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white font-extrabold py-3 px-8 rounded-full shadow-lg border-b-4 border-green-800 hover:translate-y-1 active:border-b-0 transition-all text-lg md:text-xl w-full md:w-auto cursor-pointer">🚀 Başla!</button>
</div>

<!-- Oyun Alanı -->
<div id="game-area" class="hidden flex-col items-center mt-6 md:mt-8 w-full">
    <div id="scoreboard" class="flex flex-wrap justify-center gap-3 md:gap-6 mb-6 md:mb-10 w-full max-w-5xl px-2"></div>
    <div class="bg-white/40 p-3 md:p-6 rounded-2xl md:rounded-[2.5rem] shadow-2xl backdrop-blur-md border-2 md:border-4 border-white/50 w-full max-w-4xl mx-auto">
        <div id="jeopardy-grid" class="grid grid-cols-5 gap-2 md:gap-5"></div>
    </div>
</div>

<!-- Soru Modalı -->
<div id="question-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-[1.5rem] md:rounded-[2rem] shadow-2xl flex flex-col border-4 md:border-8 border-cyan-500 modal-pop">
        <div class="p-3 md:p-5 border-b-2 md:border-b-4 border-gray-100 flex justify-between items-center bg-cyan-50 rounded-t-[1rem] md:rounded-t-[1.5rem]">
            <h2 id="modal-title" class="text-base md:text-2xl font-extrabold text-cyan-900">1. Grup 100 Puan</h2>
            <div class="text-sm md:text-xl font-extrabold bg-white px-3 py-1 md:px-4 md:py-2 rounded-full shadow-inner border-2 border-gray-200">⏳ Süre: <span id="timer" class="text-cyan-600 text-lg md:text-2xl">10</span></div>
        </div>
        <div class="p-6 md:p-10 flex flex-col items-center min-h-[250px] md:min-h-[300px] justify-center relative bg-gradient-to-b from-white to-cyan-50 rounded-b-[1rem] md:rounded-b-[1.5rem]">
            <h1 id="english-word" class="text-3xl md:text-5xl font-extrabold text-blue-800 mb-6 md:mb-10 text-center drop-shadow-sm px-2 md:px-4 break-words w-full">word</h1>
            <button id="show-answer-btn" onclick="showAnswer()" class="bg-gradient-to-r from-yellow-400 to-orange-400 hover:from-yellow-500 hover:to-orange-500 text-white font-extrabold py-3 px-6 md:py-4 md:px-10 rounded-full shadow-xl border-b-4 border-orange-600 text-lg md:text-2xl transition-transform hover:scale-105 active:scale-95 active:border-b-0 w-full md:w-auto cursor-pointer">Cevabı Göster 🎯</button>
            <div id="answer-area" class="hidden flex-col items-center w-full">
                <div id="turkish-word" class="bg-cyan-900 text-white text-xl md:text-3xl font-extrabold py-3 px-4 md:py-4 md:px-12 rounded-2xl mb-6 md:mb-8 shadow-inner border-2 md:border-4 border-cyan-950 text-center w-full">cevap</div>
                <div class="flex flex-col sm:flex-row gap-3 md:gap-6 w-full justify-center">
                    <button id="correct-btn" onclick="handleResult(true)" class="bg-gradient-to-r from-green-400 to-green-600 border-b-4 border-green-800 hover:from-green-500 hover:to-green-700 text-white font-extrabold py-3 px-6 md:py-4 md:px-10 rounded-2xl flex-1 shadow-lg transition-transform hover:-translate-y-1 active:translate-y-1 active:border-b-0 text-xl md:text-2xl cursor-pointer">✅ DOĞRU</button>
                    <button onclick="handleResult(false)" class="bg-gradient-to-r from-red-400 to-red-600 border-b-4 border-red-800 hover:from-red-500 hover:to-red-700 text-white font-extrabold py-3 px-6 md:py-4 md:px-10 rounded-2xl flex-1 shadow-lg transition-transform hover:-translate-y-1 active:translate-y-1 active:border-b-0 text-xl md:text-2xl cursor-pointer">❌ YANLIŞ</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Oyun Sonu Modalı -->
<div id="end-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] md:rounded-[3rem] p-6 md:p-12 text-center shadow-2xl border-4 md:border-8 border-yellow-400 modal-pop max-w-3xl w-full relative overflow-hidden">
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
        <div class="absolute top-0 -right-4 w-32 h-32 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
        <div class="absolute -bottom-8 left-20 w-32 h-32 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
        <div class="relative z-10">
            <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-pink-500 mb-4 md:mb-6 drop-shadow-md leading-tight">🏆 TEBRİKLER ŞAMPİYON! 🏆</h1>
            <p id="winner-text" class="text-xl md:text-4xl font-bold text-cyan-900 mb-8 md:mb-10 bg-cyan-50 py-3 px-4 md:py-4 md:px-8 rounded-2xl md:rounded-3xl border-2 border-cyan-200 inline-block shadow-sm">Kazanan: 1. Grup</p>
            <br>
            <button onclick="restartGame()" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-extrabold py-3 px-8 md:py-4 md:px-12 rounded-full shadow-2xl border-b-4 border-blue-900 text-lg md:text-2xl transition-transform hover:scale-105 active:scale-95 active:border-b-0 cursor-pointer">🔄 Yeniden Oyna</button>
        </div>
    </div>
</div>

<script>
const unit1WordSets = {
    physical_appearance: [
        { en: "What does he/she look like?", tr: "Dış görünüşü nasıldır? (Fiziksel Özellik)" },
        { en: "What is he/she like?", tr: "Nasıl birisidir / huyu nasıldır? (Kişilik Özelliği)" },
        { en: "What does he/she like doing?", tr: "Ne yapmayı sever? (Hobiler & İlgi Alanları)" },
        { en: "straight hair", tr: "düz saç" },
        { en: "wavy hair", tr: "dalgalı saç" },
        { en: "curly hair", tr: "kıvırcık saç" },
        { en: "blonde / blond", tr: "sarı / sarışın" },
        { en: "dark hair", tr: "koyu renk / siyah saç" },
        { en: "fair hair", tr: "açık kumral saç" },
        { en: "long hair / short hair", tr: "uzun saç / kısa saç" },
        { en: "bald", tr: "kel (saçsız)" },
        { en: "tall / short", tr: "uzun boylu / kısa boylu" },
        { en: "of medium height", tr: "orta boylu" },
        { en: "slim / thin", tr: "zayıf, ince, narin" },
        { en: "plump", tr: "balık etli, topluca" },
        { en: "fat / overweight", tr: "şişman, kilolu" },
        { en: "well-built", tr: "kaslı, kalıplı, yapılı" },
        { en: "of medium weight", tr: "orta kilolu" },
        { en: "young / old", tr: "genç / yaşlı" },
        { en: "middle-aged", tr: "orta yaşlı" },
        { en: "handsome", tr: "yakışıklı (erkek)" },
        { en: "beautiful", tr: "güzel (kadın)" },
        { en: "cute / attractive", tr: "sevimli / çekici, alımlı" },
        { en: "hazel eyes", tr: "ela gözler" },
        { en: "blue / green / brown eyes", tr: "mavi / yeşil / kahverengi gözler" },
        { en: "beard & moustache", tr: "sakal & bıyık" },
        { en: "glasses", tr: "gözlük" },
        { en: "headscarf", tr: "başörtüsü" },
        { en: "freckles", tr: "çiller" }
    ],
    personality_traits: [
        { en: "honest (+)", tr: "dürüst (yalan söylemeyen)" },
        { en: "generous (+)", tr: "cömert (paylaşmayı seven)" },
        { en: "hardworking (+)", tr: "çalışkan" },
        { en: "helpful (+)", tr: "yardımsever" },
        { en: "friendly (+)", tr: "samimi, arkadaş canlısı" },
        { en: "easy-going (+)", tr: "uyumlu, geçimli, rahat" },
        { en: "polite / courteous (+)", tr: "kibar, nazik" },
        { en: "punctual (+)", tr: "dakik (zamanında gelen)" },
        { en: "smart / intelligent (+)", tr: "zeki, akıllı" },
        { en: "thoughtful (+)", tr: "düşünceli, ince fikirli" },
        { en: "cheerful (+)", tr: "neşeli, güler yüzlü" },
        { en: "patient (+)", tr: "sabırlı" },
        { en: "selfish (-)", tr: "bencil (kendini düşünen)" },
        { en: "stubborn (-)", tr: "inatçı (fikrini değiştirmeyen)" },
        { en: "lazy (-)", tr: "tembel" },
        { en: "clumsy (-)", tr: "sakar (düşüren / kıran)" },
        { en: "rude (-)", tr: "kaba, nezaketsiz" },
        { en: "forgetful (-)", tr: "unutkan" },
        { en: "stingy (-)", tr: "cimri (para harcamayan)" },
        { en: "shy (-)", tr: "utangaç, çekingen" },
        { en: "talkative (-)", tr: "geveze, çok konuşan" },
        { en: "dishonest (-)", tr: "yalancı, dürüst olmayan" },
        { en: "impatient (-)", tr: "sabırsız" },
        { en: "jealous (-)", tr: "kıskanç" }
    ]
};

let activeWordList = [], numGroups = 1, scores = [], currentGroup = 0, gameDuration = 10,
    answeredQuestionsCount = 0, currentPoints = 0, currentCellBtn = null, timerInterval,
    timeLeft = 0, isAnswerShown = false, menuPausedTimer = false;
const pointValues = [50, 100, 150, 200, 250, 300];
const $ = id => document.getElementById(id);

function closeSplash() { $('splash').style.display = 'none'; }

function openMenu() {
    menuPausedTimer = false;
    const questionOpen = !$('question-modal').classList.contains('hidden');
    if (questionOpen && !isAnswerShown && timeLeft > 0) {
        clearInterval(timerInterval);
        menuPausedTimer = true;
    }
    $('game-menu').classList.remove('hidden');
}

function closeMenu() {
    $('game-menu').classList.add('hidden');
    if (menuPausedTimer) { menuPausedTimer = false; runTimer(); }
}

function restartGame() {
    menuPausedTimer = false;
    clearInterval(timerInterval);
    $('game-menu').classList.add('hidden');
    $('question-modal').classList.add('hidden');
    $('end-modal').classList.add('hidden');
    $('end-modal').classList.remove('flex');
    $('game-area').classList.add('hidden');
    $('game-area').classList.remove('flex');
    $('menu-btn').classList.add('hidden');
    $('setup-bar').classList.remove('hidden');
}

function toggleFullScreen() {
    const d = document, e = d.documentElement;
    if (!d.fullscreenElement && !d.webkitFullscreenElement && !d.msFullscreenElement) {
        if (e.requestFullscreen) e.requestFullscreen();
        else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen();
        else if (e.msRequestFullscreen) e.msRequestFullscreen();
    } else {
        if (d.exitFullscreen) d.exitFullscreen();
        else if (d.webkitExitFullscreen) d.webkitExitFullscreen();
        else if (d.msExitFullscreen) d.msExitFullscreen();
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function startGame() {
    const key = $('category-select').value;
    numGroups = parseInt($('group-count').value);
    gameDuration = parseInt($('timer-setting').value);
    if (isNaN(gameDuration) || gameDuration < 5) gameDuration = 10;

    const allPool = [...unit1WordSets.physical_appearance, ...unit1WordSets.personality_traits];
    let pool = key === 'all' ? [...allPool] : [...unit1WordSets[key]];

    if (pool.length < 30) {
        const extraPool = allPool.filter(item => !pool.includes(item));
        shuffle(extraPool);
        while (pool.length < 30 && extraPool.length > 0) pool.push(extraPool.pop());
    }

    shuffle(pool);
    activeWordList = pool.slice(0, 30);

    $('setup-bar').classList.add('hidden');
    $('menu-btn').classList.remove('hidden');
    $('game-area').classList.remove('hidden');
    $('game-area').classList.add('flex');

    scores = Array(numGroups).fill(0);
    currentGroup = 0;
    answeredQuestionsCount = 0;
    renderScoreboard();
    renderGrid();
}

function renderScoreboard() {
    const board = $('scoreboard');
    board.innerHTML = '';
    for (let i = 0; i < numGroups; i++) {
        const g = document.createElement('div');
        g.id = `group-score-${i}`;
        g.className = `px-3 py-2 md:px-8 md:py-4 rounded-xl md:rounded-3xl border-2 md:border-4 border-white bg-white/80 font-extrabold text-sm md:text-2xl shadow-lg transition-all duration-300 text-cyan-900 ${i === currentGroup ? 'active-group' : ''}`;
        g.innerHTML = `<span class="opacity-70">${i + 1}. Grup:</span> <span id="score-val-${i}" class="text-lg md:text-3xl text-blue-700">${scores[i]}</span>`;
        board.appendChild(g);
    }
}

function renderGrid() {
    const grid = $('jeopardy-grid');
    grid.innerHTML = '';
    let wordIndex = 0;
    pointValues.forEach(points => {
        for (let col = 0; col < 5; col++) {
            const btn = document.createElement('button');
            const wordData = activeWordList[wordIndex];
            btn.className = "game-btn text-white font-extrabold py-4 md:py-6 shadow-sm md:shadow-lg text-lg md:text-3xl tracking-wider w-full flex items-center justify-center cursor-pointer";
            btn.innerText = points;
            btn.onclick = () => openQuestion(btn, points, wordData);
            grid.appendChild(btn);
            wordIndex++;
        }
    });
}

function openQuestion(btn, points, wordData) {
    currentCellBtn = btn;
    currentPoints = points;
    isAnswerShown = false;
    $('modal-title').innerText = `${currentGroup + 1}. Grup • ${points} Puan`;
    $('english-word').innerText = wordData.en;
    $('turkish-word').innerText = wordData.tr;
    $('correct-btn').style.display = 'block';
    $('show-answer-btn').classList.remove('hidden');
    $('answer-area').classList.add('hidden');
    $('answer-area').classList.remove('flex');
    $('question-modal').classList.remove('hidden');
    startTimer();
}

function startTimer() {
    timeLeft = gameDuration;
    updateTimerUI();
    runTimer();
}

function runTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (!isAnswerShown) {
                showAnswer();
                $('correct-btn').style.display = 'none';
            }
        }
    }, 1000);
}

function updateTimerUI() {
    const el = $('timer');
    el.innerText = Math.max(0, timeLeft);
    if (timeLeft <= 3) {
        el.classList.remove('text-cyan-600');
        el.classList.add('text-red-600', 'animate-pulse');
    } else {
        el.classList.add('text-cyan-600');
        el.classList.remove('text-red-600', 'animate-pulse');
    }
}

function showAnswer() {
    isAnswerShown = true;
    clearInterval(timerInterval);
    $('show-answer-btn').classList.add('hidden');
    $('answer-area').classList.remove('hidden');
    $('answer-area').classList.add('flex');
}

function handleResult(isCorrect) {
    clearInterval(timerInterval);
    scores[currentGroup] += isCorrect ? currentPoints : -currentPoints;
    $(`score-val-${currentGroup}`).innerText = scores[currentGroup];

    currentCellBtn.disabled = true;
    currentCellBtn.innerText = '✔';
    currentCellBtn.classList.add('text-2xl', 'md:text-4xl', 'opacity-50');

    currentGroup = (currentGroup + 1) % numGroups;
    $('question-modal').classList.add('hidden');
    updateScoreboardUI();

    answeredQuestionsCount++;
    if (answeredQuestionsCount === 30) setTimeout(showEndGameScreen, 500);
}

function updateScoreboardUI() {
    for (let i = 0; i < numGroups; i++) {
        $(`group-score-${i}`).classList.toggle('active-group', i === currentGroup);
    }
}

function showEndGameScreen() {
    const maxScore = Math.max(...scores);
    const winners = [];
    scores.forEach((s, i) => { if (s === maxScore) winners.push(`${i + 1}. Grup`); });

    const msg = winners.length === 1
        ? `🎉 Harika! Kazanan: ${winners[0]} (${maxScore} Puan) 🎉`
        : `🤝 Beraberlik! ${winners.join(' ve ')} kazandı! (${maxScore} Puan) 🤝`;

    $('winner-text').innerText = msg;
    $('game-area').classList.add('hidden');
    $('end-modal').classList.remove('hidden');
    $('end-modal').classList.add('flex');
}
</script>

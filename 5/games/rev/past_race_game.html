<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Race</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }

  #game { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px 12px 12px; }
  #lanes { flex: 0 0 40%; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .lane { position: relative; flex: 1; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; overflow: hidden; }
  .lane .tag { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); z-index: 2; color: #fff; font-weight: 900;
    font-size: clamp(.9rem, 2.2vw, 1.6rem); padding: 0 14px; border-radius: 10px; border: 3px solid #0B2F2C; }
  .lane .road { position: absolute; left: 14%; right: 14%; top: 50%; border-top: 6px dashed #9AA5A4; }
  .lane .flag { position: absolute; right: 8%; top: 50%; transform: translateY(-50%); font-size: clamp(1.6rem, 6vh, 3.4rem); }
  .runner { position: absolute; top: 50%; transform: translateY(-50%) scaleX(-1); font-size: clamp(1.6rem, 6.5vh, 4rem); transition: left .9s ease; z-index: 3; }
  #r2 { transform: translateY(-50%); }
  #panel { position: relative; flex: 1; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 18px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-evenly; padding: 6px 12px; text-align: center; }
  #turn { color: #fff; font-weight: 900; font-size: clamp(1rem, 2.6vw, 1.9rem); padding: 0 22px; border-radius: 999px; border: 4px solid #0B2F2C; }
  #animals { font-size: clamp(2rem, 7vh, 4rem); line-height: 1; letter-spacing: .12em; }
  #sentence { font-weight: 900; font-size: clamp(1.3rem, 3.6vw, 2.8rem); line-height: 1.15; }
  .blank { display: inline-block; min-width: 3.5em; border-bottom: 6px solid #0B2F2C; color: #0A7A2F; }
  .blank.bad { color: #D62828; }
  #opts { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .opt { font-size: clamp(1.1rem, 2.8vw, 2.1rem); font-weight: 900; padding: .2em .9em; background: #fff; color: #0B2F2C;
    border: 5px solid #0B2F2C; border-radius: 16px; box-shadow: 0 5px 0 #0B2F2C; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 #0B2F2C; }
  .opt.good { background: #C8F7D4; border-color: #0A7A2F; }
  .opt.bad { background: #FFD6D6; border-color: #D62828; }
  #fb { min-height: 1.4em; font-size: clamp(1rem, 2.6vw, 1.9rem); font-weight: 800; color: #0B5C56; }
  #next { display: none; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Past Race</h1>
  <p class="subtitle">Was, were, had, could and more!</p>
  <div class="preview">🐆 🐇 🐎 🏁</div>
  <button class="big-btn" onclick="startGame()">Start</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="game">
  <div id="lanes">
    <div class="lane"><div class="tag" style="background:#D62828">Team 1</div><div class="road"></div><div class="flag">🏁</div><div class="runner" id="r0">🐆</div></div>
    <div class="lane"><div class="tag" style="background:#1F5FBF">Team 2</div><div class="road"></div><div class="flag">🏁</div><div class="runner" id="r1">🐇</div></div>
    <div class="lane"><div class="tag" style="background:#0A7A2F">Team 3</div><div class="road"></div><div class="flag">🏁</div><div class="runner" id="r2">🐎</div></div>
  </div>
  <div id="panel">
    <button class="restart-btn" id="trbtn" onclick="toggleTR()" style="position:absolute;top:8px;left:10px;font-size:clamp(.8rem,1.8vw,1.3rem)">Turkish: On</button>
    <div id="turn"></div>
    <div id="animals"></div>
    <div id="sentence"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <button class="big-btn" id="next" onclick="nextQ()" style="font-size:clamp(1.1rem,2.6vw,1.7rem)">Next</button>
  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { document.getElementById('fb').textContent = fbParts ? fbParts[0] + (TR ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var Q = [
    { a: '❄️ 🧥', s: 'Last winter, the weather ___ cold and snowy.', o: ['was', 'were', 'is'], c: 0, tr: 'Geçen kış hava soğuk ve karlıydı.' },
    { a: '☀️ 👗', s: 'In the photo, I ___ a pink dress.', o: ['had', 'was', 'could'], c: 0, tr: 'Fotoğrafta pembe bir elbisem vardı.' },
    { a: '⛄', s: 'I ___ make a snowman when I was four.', o: ['could', 'were', 'had'], c: 0, tr: 'Dört yaşındayken kardan adam yapabiliyordum.' },
    { a: '🎂 🎈', s: 'We ___ at the birthday party yesterday.', o: ['was', 'were', 'is'], c: 1, tr: 'Dün doğum günü partisindeydik.' },
    { a: '🌧️', s: 'It ___ rainy yesterday.', o: ['was', 'were', 'are'], c: 0, tr: 'Dün hava yağmurluydu.' },
    { a: '🧤 🥾', s: 'Sarah ___ a coat, boots and gloves in winter.', o: ['had', 'was', 'could'], c: 0, tr: 'Sarah\'ın kışın bir montu, botları ve eldivenleri vardı.' },
    { a: '🏖️ 🏠', s: 'Last summer, we ___ in a small beach house.', o: ['stayed', 'stay', 'stays'], c: 0, tr: 'Geçen yaz küçük bir plaj evinde kaldık.' },
    { a: '🐬 🌊', s: 'Linda ___ a dolphin jump out of the water.', o: ['saw', 'see', 'sees'], c: 0, tr: 'Linda bir yunusun sudan zıpladığını gördü.' },
    { a: '🛍️ 🌊', s: 'There ___ some plastic bags in the water.', o: ['was', 'were', 'is'], c: 1, tr: 'Suda bazı plastik poşetler vardı.' },
    { a: '🥖 🍞', s: 'I went to the bakery and ___ fresh bread.', o: ['bought', 'buy', 'buys'], c: 0, tr: 'Fırına gittim ve taze ekmek aldım.' },
    { a: '🐱 💨', s: 'My cat ___ away yesterday.', o: ['ran', 'run', 'runs'], c: 0, tr: 'Kedim dün kaçtı.' },
    { a: '🏫 🎭', s: 'I ___ in the school play last year.', o: ['was', 'were', 'am'], c: 0, tr: 'Geçen yıl okul oyunundaydım.' },
    { a: '🏊 🌊', s: 'My brother ___ swim when he was five.', o: ['could', 'can', 'were'], c: 0, tr: 'Erkek kardeşim beş yaşındayken yüzebiliyordu.' },
    { a: '👟 ⚽', s: 'They ___ trainers in the sports lesson.', o: ['wore', 'wear', 'wears'], c: 0, tr: 'Spor dersinde spor ayakkabı giydiler.' },
    { a: '🍔 🍟', s: 'I ___ a hamburger for lunch yesterday.', o: ['had', 'have', 'has'], c: 0, tr: 'Dün öğle yemeğinde hamburger yedim.' },
    { a: '🎬 🍿', s: 'We ___ to the cinema last Saturday.', o: ['went', 'go', 'goes'], c: 0, tr: 'Geçen cumartesi sinemaya gittik.' },
    { a: '🦀 🌊', s: 'The crab ___ on the rocks.', o: ['crawled', 'crawl', 'crawls'], c: 0, tr: 'Yengeç kayaların üstünde yürüdü.' },
    { a: '☀️ 🏖️', s: 'It ___ hot and sunny in summer last year.', o: ['was', 'were', 'is'], c: 0, tr: 'Geçen yıl yazın hava sıcak ve güneşliydi.' },
    { a: '🧣 🧤', s: 'My scarf and gloves ___ on the table.', o: ['was', 'were', 'is'], c: 1, tr: 'Atkım ve eldivenlerim masanın üstündeydi.' },
    { a: '🎒 ⏰', s: 'I ___ not late for school yesterday.', o: ['was', 'were', 'am'], c: 0, tr: 'Dün okula geç kalmadım.' },
    { a: '📚 🕒', s: 'You ___ in the library an hour ago.', o: ['was', 'were', 'are'], c: 1, tr: 'Bir saat önce kütüphanedeydin.' },
    { a: '🐕 💨', s: 'My dog ___ run fast when it was young.', o: ['could', 'can', 'were'], c: 0, tr: 'Köpeğim gençken hızlı koşabiliyordu.' },
    { a: '🌊 🛍️', s: 'Dad ___ the jellyfish and we took the bags out.', o: ['helped', 'help', 'helps'], c: 0, tr: 'Babam denizanasına yardım etti ve poşetleri sudan çıkardık.' },
    { a: '🍇 🐟', s: 'We ___ grapes and grilled fish for lunch.', o: ['ate', 'eat', 'eats'], c: 0, tr: 'Öğle yemeğinde üzüm ve ızgara balık yedik.' }
  ];
  var GOAL = 5, TEAMS = ['Team 1', 'Team 2', 'Team 3'], COLORS = ['#D62828', '#1F5FBF', '#0A7A2F'];
  var order, qi, turn, steps, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(Q.slice()); qi = 0; turn = 0; steps = [0, 0, 0]; locked = false;
    place(); showQ();
  }
  function place() {
    for (var t = 0; t < 3; t++) document.getElementById('r' + t).style.left = (14 + steps[t] / GOAL * 68) + '%';
  }
  function showQ() {
    var q = order[qi];
    locked = false;
    var tn = document.getElementById('turn');
    tn.textContent = TEAMS[turn] + ' - your turn!'; tn.style.background = COLORS[turn];
    document.getElementById('animals').textContent = q.a;
    document.getElementById('sentence').innerHTML = q.s.replace('___', '<span class="blank" id="blank">&nbsp;</span>');
    fbParts = null; renderFb();
    document.getElementById('next').style.display = 'none';
    var box = document.getElementById('opts'); box.innerHTML = '';
    shuffle(q.o.map(function (t, i) { return { t: t, i: i }; })).forEach(function (o) {
      var b = document.createElement('button'); b.className = 'opt'; b.textContent = o.t;
      b.addEventListener('click', function () { answer(b, o.i); });
      box.appendChild(b);
    });
  }
  function answer(btn, i) {
    if (locked) return; locked = true;
    var q = order[qi], ok = (i === q.c);
    var blank = document.getElementById('blank'); blank.textContent = q.o[q.c];
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) { if (b.textContent === q.o[q.c]) b.classList.add('good'); });
    if (ok) { steps[turn]++; place(); setFb('✔ Great!', q.tr); }
    else { btn.classList.add('bad', 'shake'); setFb('✘ Not this time.', q.tr); }
    var nx = document.getElementById('next');
    if (steps[turn] >= GOAL) { var w = turn; setTimeout(function () { finish(w); }, 1800); return; }
    nx.textContent = 'Next'; nx.style.display = 'inline-block';
  }
  function nextQ() {
    qi++; turn = (turn + 1) % 3;
    if (qi >= order.length) {
      var mx = Math.max.apply(null, steps), lead = [];
      steps.forEach(function (v, i) { if (v === mx) lead.push(i); });
      finish(lead.length === 1 ? lead[0] : -1); return;
    }
    showQ();
  }
  function finish(w) {
    document.getElementById('win-title').textContent = w < 0 ? "It's a Draw!" : TEAMS[w] + ' Wins!';
    document.getElementById('win-stats').textContent = 'Team 1: ' + steps[0] + '  |  Team 2: ' + steps[1] + '  |  Team 3: ' + steps[2];
    document.getElementById('win-screen').style.display = 'flex';
  }
</script>
</body>
</html>

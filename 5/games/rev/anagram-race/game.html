<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagram Race</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #game { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px 12px 12px; }
  #lanes { flex: 0 0 34%; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .lane { position: relative; flex: 1; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; overflow: hidden; }
  .lane .tag { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); z-index: 2; color: #fff; font-weight: 900;
    font-size: clamp(.9rem, 2.2vw, 1.6rem); padding: 0 14px; border-radius: 10px; border: 3px solid #0B2F2C; }
  .lane .road { position: absolute; left: 14%; right: 14%; top: 50%; border-top: 6px dashed #9AA5A4; }
  .lane .flag { position: absolute; right: 8%; top: 50%; transform: translateY(-50%); font-size: clamp(1.6rem, 6vh, 3.4rem); }
  .runner { position: absolute; top: 50%; transform: translateY(-50%) scaleX(-1); font-size: clamp(1.6rem, 6.5vh, 3.8rem); transition: left .9s ease; z-index: 3; }
  #panel { position: relative; flex: 1; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 18px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-evenly; padding: 6px 12px; text-align: center; }
  #turn { color: #fff; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); padding: 0 22px; border-radius: 999px; border: 4px solid #0B2F2C; }
  #hint { display: flex; align-items: center; gap: 14px; justify-content: center; }
  #pic { font-size: clamp(3rem, 15vh, 7rem); line-height: 1; }
  #pic svg { width: clamp(3.4rem, 15vh, 7rem); height: clamp(3.4rem, 15vh, 7rem); display: block; }
  #mean { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.6rem); color: #0B5C56; text-align: left; line-height: 1.15; }
  #catpill { display: inline-block; font-size: clamp(.8rem, 1.7vw, 1.2rem); background: #FFD23F; border: 3px solid #0B2F2C; border-radius: 999px; padding: 0 12px; color: #0B2F2C; }
  #slots, #tiles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .sl { width: clamp(38px, 7vw, 74px); height: clamp(44px, 8.4vh, 78px); border: 4px solid #0B2F2C; border-bottom-width: 8px; border-radius: 10px; background: #F4F8F8;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: clamp(1.4rem, 4vw, 2.8rem); }
  .sl.ok { background: #C8F7D4; border-color: #0A7A2F; } .sl.no { background: #FFD6D6; border-color: #D62828; }
  .lt { width: clamp(42px, 8vw, 82px); height: clamp(48px, 9.6vh, 88px); font-weight: 900; font-size: clamp(1.5rem, 4.4vw, 3.1rem); background: #FFD23F; color: #0B2F2C;
    border: 5px solid #0B2F2C; border-radius: 14px; box-shadow: 0 5px 0 #0B2F2C; padding: 0; }
  .lt:active { transform: translateY(3px); box-shadow: 0 2px 0 #0B2F2C; }
  .lt.used { visibility: hidden; }
  #fb { min-height: 1.4em; font-size: clamp(1rem, 2.5vw, 1.8rem); font-weight: 800; color: #0B5C56; }
  #next { display: none; }
  .tools { position: absolute; top: 8px; right: 10px; display: flex; gap: 8px; }
  .tools .restart-btn { font-size: clamp(.8rem, 1.8vw, 1.3rem); }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Anagram<br>Race</h1>
  <p class="subtitle">Unscramble the word to move ahead!</p>
  <div class="preview">🚗 🔤 🏁</div>
  <button class="big-btn" onclick="startGame()">Start</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="game">
  <div id="lanes">
    <div class="lane"><div class="tag" style="background:#D62828">Team 1</div><div class="road"></div><div class="flag">🏁</div><div class="runner" id="r0">🚗</div></div>
    <div class="lane"><div class="tag" style="background:#1F5FBF">Team 2</div><div class="road"></div><div class="flag">🏁</div><div class="runner" id="r1">🚕</div></div>
    <div class="lane"><div class="tag" style="background:#0A7A2F">Team 3</div><div class="road"></div><div class="flag">🏁</div><div class="runner" id="r2">🚌</div></div>
  </div>
  <div id="panel">
    <button class="restart-btn" id="trbtn" onclick="toggleTR()" style="position:absolute;top:8px;left:10px;font-size:clamp(.8rem,1.8vw,1.3rem)">Turkish: On</button>
    <div class="tools"><button class="restart-btn" id="undo" onclick="undo()">⌫ Back</button></div>
    <div id="turn"></div>
    <div id="hint"><div id="pic"></div><div id="mean"><span id="catpill"></span><div id="tr-mean" class="tr"></div></div></div>
    <div id="slots"></div>
    <div id="tiles"></div>
    <div id="fb"></div>
    <button class="big-btn" id="next" onclick="nextW()" style="font-size:clamp(1.1rem,2.6vw,1.7rem)">Next</button>
  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { var f = document.getElementById('fb'); if (f) f.textContent = fbParts ? fbParts[0] + (TR && fbParts[1] ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var W = [["folder", "📁", "dosya", "School"], ["printer", "🖨️", "yazıcı", "School"], ["speaker", "🔊", "hoparlör", "School"], ["projector", "📽️", "projeksiyon", "School"], ["headphones", "🎧", "kulaklık", "School"], ["dress", "👗", "elbise", "Clothes"], ["boots", "🥾", "bot", "Clothes"], ["scarf", "🧣", "atkı", "Clothes"], ["gloves", "🧤", "eldiven", "Clothes"], ["raincoat", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"raincoat\"><path d=\"M30 32 L7 72 L21 79 L37 50 Z\" fill=\"#FFC400\" stroke=\"#0B2F2C\" stroke-width=\"3.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M70 32 L93 72 L79 79 L63 50 Z\" fill=\"#FFC400\" stroke=\"#0B2F2C\" stroke-width=\"3.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M30 28 Q50 38 70 28 L75 94 L25 94 Z\" fill=\"#FFC400\" stroke=\"#0B2F2C\" stroke-width=\"3.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M31 30 Q50 2 69 30 Q50 42 31 30 Z\" fill=\"#F29900\" stroke=\"#0B2F2C\" stroke-width=\"3.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M50 38 V94\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"43\" cy=\"54\" r=\"3\" fill=\"#0B2F2C\"/><circle cx=\"43\" cy=\"68\" r=\"3\" fill=\"#0B2F2C\"/><circle cx=\"43\" cy=\"82\" r=\"3\" fill=\"#0B2F2C\"/><rect x=\"55\" y=\"70\" width=\"14\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>", "yağmurluk", "Clothes"], ["sandals", "👡", "sandalet", "Clothes"], ["trainers", "👟", "spor ayakkabı", "Clothes"], ["farmer", "🚜", "çiftçi", "Jobs"], ["singer", "🎤", "şarkıcı", "Jobs"], ["dentist", "🦷", "diş hekimi", "Jobs"], ["bakery", "🥖", "fırın", "Places"], ["museum", "🏛️", "müze", "Places"], ["cinema", "🎬", "sinema", "Places"], ["park", "🌳", "park", "Places"], ["dolphin", "🐬", "yunus", "Sea"], ["turtle", "🐢", "kaplumbağa", "Sea"], ["octopus", "🐙", "ahtapot", "Sea"], ["crab", "🦀", "yengeç", "Sea"], ["broccoli", "🥦", "brokoli", "Food"], ["noodles", "🍜", "erişte", "Food"], ["chocolate", "🍫", "çikolata", "Food"]];
  var GOAL = 5, TEAMS = ['Team 1', 'Team 2', 'Team 3'], COLORS = ['#D62828', '#1F5FBF', '#0A7A2F'];
  var order, qi, turn, steps, locked, cur, ans, tilesArr;
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(W.slice()); qi = 0; turn = 0; steps = [0, 0, 0];
    place(); showW();
  }
  function place() { for (var t = 0; t < 3; t++) document.getElementById('r' + t).style.left = (14 + steps[t] / GOAL * 68) + '%'; }
  function scramble(w) {
    var a = w.split(''), s, k = 0;
    do { s = shuffle(a.slice()); k++; } while (s.join('') === w && k < 30);
    return s;
  }
  function showW() {
    cur = order[qi]; locked = false; ans = [];
    var tn = document.getElementById('turn'); tn.textContent = TEAMS[turn] + ' - your turn!'; tn.style.background = COLORS[turn];
    document.getElementById('pic').innerHTML = cur[1];
    document.getElementById('catpill').textContent = cur[3];
    document.getElementById('tr-mean').textContent = cur[2];
    tilesArr = scramble(cur[0]);
    var tb = document.getElementById('tiles'); tb.innerHTML = '';
    tilesArr.forEach(function (ch, i) {
      var b = document.createElement('button'); b.className = 'lt'; b.textContent = ch.toUpperCase();
      b.addEventListener('click', function () { pick(i, b); });
      tb.appendChild(b);
    });
    fbParts = null; renderFb();
    document.getElementById('next').style.display = 'none';
    document.getElementById('undo').style.display = '';
    renderSlots();
  }
  function renderSlots() {
    var sb = document.getElementById('slots'); sb.innerHTML = '';
    for (var i = 0; i < cur[0].length; i++) {
      var d = document.createElement('div'); d.className = 'sl'; d.textContent = ans[i] ? ans[i].ch.toUpperCase() : ''; sb.appendChild(d);
    }
  }
  function pick(i, b) {
    if (locked || b.classList.contains('used')) return;
    b.classList.add('used'); ans.push({ ch: tilesArr[i], el: b }); renderSlots();
    if (ans.length === cur[0].length) check();
  }
  function undo() {
    if (locked || !ans.length) return;
    var a = ans.pop(); a.el.classList.remove('used'); renderSlots();
  }
  function check() {
    locked = true;
    var word = ans.map(function (a) { return a.ch; }).join(''), ok = (word === cur[0]);
    Array.prototype.forEach.call(document.querySelectorAll('.sl'), function (s) { s.classList.add(ok ? 'ok' : 'no'); if (!ok) s.classList.add('shake'); });
    if (ok) { steps[turn]++; place(); setFb('✔ Great! ' + cur[0] + ' = ' + cur[2], ''); }
    else { setFb('✘ The word is "' + cur[0] + '" (' + cur[2] + ').', ''); }
    document.getElementById('undo').style.display = 'none';
    if (steps[turn] >= GOAL) { var w = turn; setTimeout(function () { finish(w); }, 1800); return; }
    var nx = document.getElementById('next'); nx.textContent = 'Next'; nx.style.display = 'inline-block';
  }
  function nextW() {
    qi++; turn = (turn + 1) % 3;
    if (qi >= order.length) {
      var mx = Math.max.apply(null, steps), lead = [];
      steps.forEach(function (v, i) { if (v === mx) lead.push(i); });
      finish(lead.length === 1 ? lead[0] : -1); return;
    }
    showW();
  }
  function finish(w) {
    document.getElementById('win-title').textContent = w < 0 ? "It's a Draw!" : TEAMS[w] + ' Wins!';
    document.getElementById('win-stats').textContent = 'Team 1: ' + steps[0] + '  |  Team 2: ' + steps[1] + '  |  Team 3: ' + steps[2];
    document.getElementById('win-screen').style.display = 'flex';
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Wheel</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 8px 14px 12px; align-items: stretch; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #wheelbox { position: relative; flex: 0 0 46%; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  @media (orientation: portrait) { #wheelbox { flex: 0 0 50%; } }
  #wheelwrap { position: relative; flex: 1; min-height: 0; aspect-ratio: 1; max-width: 100%; }
  #wheel { position: absolute; inset: 0; pointer-events: none; transition: transform 4.2s cubic-bezier(.12, .7, .1, 1); }
  #wheel svg { width: 100%; height: 100%; display: block; }
  #pointer { position: absolute; left: 50%; top: -2%; width: 11%; transform: translateX(-50%); z-index: 3; }
  #pointer svg { width: 100%; display: block; }
  #spin { font-size: clamp(1.4rem, 3.4vw, 2.6rem); padding: .15em 1.2em; }
  #spin:disabled { background: #B8C2C1; color: #5B6B69; cursor: not-allowed; box-shadow: 0 6px 0 #5B6B69; }
  #card { flex: 1; min-width: 0; min-height: 0; background: #fff; border: 5px solid #0B2F2C; border-radius: 22px; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  #cat { align-self: flex-start; color: #fff; font-weight: 900; font-size: clamp(1.1rem, 2.6vw, 2rem); padding: 0 20px; border-radius: 999px; border: 4px solid #0B2F2C; }
  #q-en { font-weight: 900; font-size: clamp(1.5rem, 4vw, 3.4rem); line-height: 1.15; }
  #q-tr { font-weight: 800; font-size: clamp(1rem, 2.2vw, 1.7rem); color: #0B5C56; }
  #start { font-weight: 800; font-size: clamp(1.1rem, 2.6vw, 2rem); color: #0B2F2C; background: #FFF3B0; border: 4px solid #0B2F2C; border-radius: 14px; padding: 6px 14px; }
  #start b { color: #D62828; }
  #qbox { flex-direction: column; gap: clamp(10px, 2vh, 18px); }
  #q-en { margin: 2px 0 0; }
  #showans { align-self: flex-start; font-size: clamp(1rem, 2.4vw, 1.8rem); }
  #ans { display: none; background: #C8F7D4; border: 4px solid #0A7A2F; border-radius: 14px; padding: 8px 14px; }
  #ans b { color: #0A7A2F; }
  #a-en { font-weight: 900; font-size: clamp(1.2rem, 3vw, 2.4rem); line-height: 1.2; }
  #a-tr { font-weight: 800; font-size: clamp(.95rem, 2vw, 1.5rem); color: #0B5C56; }
  #idle { font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 3.6rem); text-align: center; line-height: 1.2; }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Speaking<br>Wheel</h1>
  <p class="subtitle">Spin, ask and answer in pairs!</p>
  <div class="preview">🎡 🗣️ 💬</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Spins: <span id="sp">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="wheelbox">
    <div id="wheelwrap">
      <div id="wheel"><svg viewBox="-250 -250 500 500" xmlns="http://www.w3.org/2000/svg"><path d="M0 0 L0.0 -240.0 A240 240 0 0 1 169.7 -169.7 Z" fill="#D62828" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(22.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🏫</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">School</text></g><path d="M0 0 L169.7 -169.7 A240 240 0 0 1 240.0 -0.0 Z" fill="#1F5FBF" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(67.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🎒</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Classroom</text></g><path d="M0 0 L240.0 -0.0 A240 240 0 0 1 169.7 169.7 Z" fill="#0A7A2F" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(112.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🙂</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Appearance</text></g><path d="M0 0 L169.7 169.7 A240 240 0 0 1 0.0 240.0 Z" fill="#E8710A" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(157.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">👕</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Clothes</text></g><path d="M0 0 L0.0 240.0 A240 240 0 0 1 -169.7 169.7 Z" fill="#7B2CBF" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(202.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">💼</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Jobs</text></g><path d="M0 0 L-169.7 169.7 A240 240 0 0 1 -240.0 0.0 Z" fill="#0B7285" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(247.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🏙️</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">My Neighbourhood</text></g><path d="M0 0 L-240.0 0.0 A240 240 0 0 1 -169.7 -169.7 Z" fill="#B5179E" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(292.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🐬</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Seaside</text></g><path d="M0 0 L-169.7 -169.7 A240 240 0 0 1 -0.0 -240.0 Z" fill="#C2410C" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/><g transform="rotate(337.5)"><text x="0" y="-198" text-anchor="middle" font-size="46">🥗</text><text transform="translate(9,-100) rotate(-90)" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" stroke="#0B2F2C" stroke-width="5" paint-order="stroke" font-family="Segoe UI, Verdana, Arial, sans-serif">Healthy Food</text></g><circle r="34" fill="#FFD23F" stroke="#0B2F2C" stroke-width="7"/></svg></div>
      <div id="pointer"><svg viewBox="0 0 60 80"><path d="M6 6 H54 L30 74 Z" fill="#D62828" stroke="#0B2F2C" stroke-width="7" stroke-linejoin="round"/></svg></div>
    </div>
    <button class="big-btn" id="spin" onclick="spin()">SPIN</button>
  </div>
  <div id="card">
    <div id="idle">Spin the wheel!<div class="tr" style="font-size:.5em;color:#0B5C56;font-weight:800">Çarkı çevir!</div></div>
    <div id="qbox" style="display:none">
      <div id="cat"></div>
      <div id="q-en"></div>

  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { var f = document.getElementById('fb'); if (f) f.textContent = fbParts ? fbParts[0] + (TR && fbParts[1] ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var WHEEL = [["👥", "People at School", "#D62828", [["Who are the people at your school?", "Okulunda kimler var?", "There are …", "There are teachers, a headmaster, a coach and a cook.", "Öğretmenler, bir müdür, bir antrenör ve bir aşçı var."], ["Who is your English teacher?", "İngilizce öğretmenin kim?", "… is my English teacher.", "Ms Clark is my English teacher.", "Ms Clark benim İngilizce öğretmenim."], ["Who makes the food at school?", "Okulda yemekleri kim yapar?", "The … makes the food.", "The cook makes the food.", "Yemekleri aşçı yapar."], ["Who helps you when you are ill?", "Hasta olduğunda sana kim yardım eder?", "The … helps me.", "The doctor helps me.", "Doktor bana yardım eder."], ["Who is your coach?", "Antrenörün kim?", "My coach is …", "My coach is Mr Evans.", "Antrenörüm Bay Evans."], ["Who is the school secretary?", "Okul sekreteri kim?", "The secretary is …", "The secretary is Ms Brown.", "Sekreter Bayan Brown."]]], ["🏫", "Places at School", "#1F5FBF", [["Where is the library?", "Kütüphane nerede?", "It is …", "It is on the first floor.", "Birinci kattadır."], ["Where do you eat lunch?", "Öğle yemeğini nerede yersin?", "I eat lunch in the …", "I eat lunch in the canteen.", "Öğle yemeğini kantinde yerim."], ["Where do you do experiments?", "Deneyleri nerede yaparsın?", "I do experiments in the …", "I do experiments in the science lab.", "Deneyleri fen laboratuvarında yaparım."], ["Where do you play football?", "Futbolu nerede oynarsın?", "I play football on the …", "I play football on the sports field.", "Futbolu spor sahasında oynarım."], ["Where is the headmaster?", "Müdür nerede?", "He is in the …", "He is in the conference hall.", "O konferans salonunda."], ["What is your favourite place at school?", "Okuldaki en sevdiğin yer neresi?", "My favourite place is the …", "My favourite place is the library.", "En sevdiğim yer kütüphane."]]], ["🎵", "School Clubs", "#0A7A2F", [["What is your favourite school club?", "En sevdiğin okul kulübü hangisi?", "My favourite school club is …", "My favourite school club is music club.", "En sevdiğim okul kulübü müzik kulübü."], ["Which school clubs do you know?", "Hangi okul kulüplerini biliyorsun?", "I know …", "I know art club, drama club and chess club.", "Resim kulübünü, drama kulübünü ve satranç kulübünü biliyorum."], ["What do you do in the art club?", "Resim kulübünde ne yaparsın?", "I … in the art club.", "I draw and colour pictures in the art club.", "Resim kulübünde resim çizer ve boyarım."], ["Are you in a school club?", "Bir okul kulübünde misin?", "Yes, I am in … / No, I am not.", "Yes, I am in science club.", "Evet, fen bilimleri kulübündeyim."], ["What do you do in the science club?", "Fen bilimleri kulübünde ne yaparsın?", "I do … in the science club.", "I do experiments in the science club.", "Fen bilimleri kulübünde deney yaparım."], ["Which club do you want to join?", "Hangi kulübe katılmak istersin?", "I want to join …", "I want to join drama club.", "Drama kulübüne katılmak istiyorum."]]], ["🎸", "Activities", "#E8710A", [["Do you like playing the guitar?", "Gitar çalmayı sever misin?", "Yes, I do. / No, I don’t.", "Yes, I do. I like playing the guitar.", "Evet, severim. Gitar çalmayı severim."], ["What do you like doing at school?", "Okulda ne yapmayı seversin?", "I like …", "I like drawing pictures and singing songs.", "Resim çizmeyi ve şarkı söylemeyi severim."], ["Can you play the piano?", "Piyano çalabilir misin?", "Yes, I can. / No, I can’t.", "No, I can’t, but I can play the guitar.", "Hayır çalamam ama gitar çalabilirim."], ["What do you love doing in your free time?", "Boş zamanında ne yapmayı seversin?", "I love …", "I love reading books.", "Kitap okumayı severim."], ["Do you enjoy solving problems?", "Problem çözmekten hoşlanır mısın?", "Yes, I do. / No, I don’t.", "Yes, I do. I like maths.", "Evet, hoşlanırım. Matematiği severim."], ["Can you dance?", "Dans edebilir misin?", "Yes, I can. / No, I can’t.", "Yes, I can. I can dance folk dances.", "Evet, edebilirim. Halk oyunları oynayabilirim."]]], ["🌍", "Countries", "#7B2CBF", [["Where are you from?", "Nerelisin?", "I am from …", "I am from Türkiye.", "Türkiye’denim."], ["Where is your best friend from?", "En iyi arkadaşın nereli?", "He / She is from …", "She is from Spain.", "O İspanya’lı."], ["Is Japan in Asia or in Europe?", "Japonya Asya’da mı, Avrupa’da mı?", "It is in …", "It is in Asia.", "Asya’da."], ["Which countries do you know?", "Hangi ülkeleri biliyorsun?", "I know …", "I know Türkiye, Italy, France and Canada.", "Türkiye’yi, İtalya’yı, Fransa’yı ve Kanada’yı biliyorum."], ["Where is Canada?", "Kanada nerede?", "It is in …", "It is in North America.", "Kuzey Amerika’da."], ["Which country do you want to visit?", "Hangi ülkeyi ziyaret etmek istersin?", "I want to visit …", "I want to visit Japan.", "Japonya’yı ziyaret etmek istiyorum."]]], ["🎉", "National Days", "#0B7285", [["When is Republic Day?", "Cumhuriyet Bayramı ne zaman?", "It is on …", "It is on 29 October.", "29 Ekim’de."], ["When is National Sovereignty and Children’s Day?", "Ulusal Egemenlik ve Çocuk Bayramı ne zaman?", "It is on …", "It is on 23 April.", "23 Nisan’da."], ["When is Victory Day?", "Zafer Bayramı ne zaman?", "It is on …", "It is on 30 August.", "30 Ağustos’ta."], ["When is Youth and Sports Day?", "Gençlik ve Spor Bayramı ne zaman?", "It is on …", "It is on 19 May.", "19 Mayıs’ta."], ["How do you celebrate national days?", "Ulusal bayramları nasıl kutlarsın?", "We …", "We wave flags and sing songs.", "Bayrak sallar ve şarkı söyleriz."], ["Which religious days do you know?", "Hangi dini bayramları biliyorsun?", "I know …", "I know Eid-al-Fitr and Eid-al-Adha.", "Ramazan Bayramı’nı ve Kurban Bayramı’nı biliyorum."]]], ["📏", "School Rules", "#B5179E", [["Can you run in the classroom?", "Sınıfta koşabilir misin?", "No, I … / Yes, I …", "No, I can’t. I mustn’t run in the classroom.", "Hayır, koşamam. Sınıfta koşmamalıyım."], ["What must you do in the library?", "Kütüphan   var rot = 0, spinning = false, spins = 0, queues = [];
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    spins = 0; document.getElementById('sp').textContent = 0;
    queues = WHEEL.map(function () { return []; });
    document.getElementById('qbox').style.display = 'none';
    document.getElementById('idle').style.display = '';
  }
  function spin() {
    if (spinning) return; spinning = true;
    document.getElementById('spin').disabled = true;
    var n = WHEEL.length, step = 360 / n, idx = Math.floor(Math.random() * n);
    var target = ((360 - (idx * step + step / 2) + (Math.random() * 2 - 1) * step * 0.3) % 360 + 360) % 360;
    var cur = ((rot % 360) + 360) % 360;
    rot += 1800 + ((target - cur) + 360) % 360;
    var w = document.getElementById('wheel');
    w.style.transform = 'rotate(' + rot + 'deg)';
    var done = false;
    function finish() { if (done) return; done = true; w.removeEventListener('transitionend', finish); show(idx); }
    w.addEventListener('transitionend', finish);
    setTimeout(finish, 4600);
  }
  function toggleAns() {
    var a = document.getElementById('ans'), open = a.style.display !== 'block';
    a.style.display = open ? 'block' : 'none';
    document.getElementById('showans').textContent = open ? 'Hide answer' : 'Show answer';
  }
  function show(idx) {
    var c = WHEEL[idx];
    if (!queues[idx].length) queues[idx] = shuffle(c[3].slice());
    var q = queues[idx].pop();
    spins++; document.getElementById('sp').textContent = spins;
    document.getElementById('idle').style.display = 'none';
    document.getElementById('qbox').style.display = 'flex';
    var cat = document.getElementById('cat'); cat.textContent = c[0] + ' ' + c[1]; cat.style.background = c[2];
    document.getElementById('q-en').textContent = q[0];
    document.getElementById('q-tr').textContent = q[1];
    document.getElementById('start').innerHTML = '<b>Start:</b> ' + q[2].replace(/</g, '&lt;');
    document.getElementById('a-en').textContent = q[3]; document.getElementById('a-tr').textContent = q[4];
    document.getElementById('ans').style.display = 'none'; document.getElementById('showans').textContent = 'Show answer';
    spinning = false; document.getElementById('spin').disabled = false;
  }
</script>

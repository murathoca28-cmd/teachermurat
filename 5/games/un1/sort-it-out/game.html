<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort It Out</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  body.no-tr .tr { display: none; }

  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 6px 12px 12px; }
  #head { text-align: center; background: #fff; border: 5px solid #0B2F2C; border-radius: 18px; padding: 2px 14px; }
  #h-en { font-weight: 900; font-size: clamp(1.2rem, 3vw, 2.2rem); }
  #h-tr { font-weight: 800; font-size: clamp(.9rem, 1.8vw, 1.3rem); color: #0B5C56; }
  #pool { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center; min-height: 28%; }
  .word { background: #fff; border: 5px solid #0B2F2C; border-radius: 14px; padding: 2px 12px; display: flex; flex-direction: column; align-items: center; min-width: clamp(84px, 11vw, 150px); }
  .word .e { font-size: clamp(1.6rem, 6vh, 3rem); line-height: 1.1; }
  .word .e svg { width: clamp(1.8rem, 6.5vh, 3.2rem); height: clamp(1.8rem, 6.5vh, 3.2rem); display: block; }
  .word .p { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.6rem); line-height: 1.1; }
  .word .t { font-weight: 800; font-size: clamp(.7rem, 1.4vw, 1rem); color: #0B5C56; }
  .word.sel { background: #FFF3B0; border-color: #D62828; border-width: 7px; }
  .word.gone { display: none; }
  #bins { flex: 1; min-height: 0; display: flex; gap: 12px; }
  @media (orientation: portrait) { #bins { flex-direction: column; } }
  .bin { flex: 1; min-width: 0; min-height: 0; background: #fff; border: 6px solid #0B2F2C; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; }
  .bin .bh { color: #fff; text-align: center; padding: 4px 8px; border-bottom: 6px solid #0B2F2C; }
  .bin .bh .be { font-size: clamp(1.6rem, 5vh, 2.8rem); line-height: 1.1; }
  .bin .bh .bn { font-weight: 900; font-size: clamp(1.1rem, 2.8vw, 2.2rem); line-height: 1.1; text-shadow: 2px 2px 0 #0B2F2C; }
  .bin .bh .bt { font-weight: 800; font-size: clamp(.8rem, 1.6vw, 1.2rem); }
  .bin .chips { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 8px; }
  .chip { background: #C8F7D4; border: 4px solid #0A7A2F; border-radius: 12px; padding: 0 10px; font-weight: 900; font-size: clamp(.9rem, 2vw, 1.5rem); display: flex; align-items: center; gap: 6px; }
  .chip svg { width: 1.4em; height: 1.4em; }
  #fb { min-height: 1.3em; text-align: center; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
  #next { display: none; align-self: center; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }
</style>

<style id="mx-css">
#mtabs { display: none; flex: 0 0 auto; gap: 8px; padding: 6px 64px 0 10px; flex-wrap: wrap; justify-content: center; }
.mt { font-weight: 900; font-size: clamp(.85rem, 1.9vw, 1.3rem); padding: 0 .9em; border: 5px solid #0B2F2C; border-radius: 14px 14px 0 0; background: #B9E4E0; color: #0B2F2C; }
.mt.act { background: #FFD23F; }
.modes { display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; }
.modes .big-btn { font-size: clamp(1.1rem, 2.8vw, 2.2rem); }
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
.mxs { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 6px; padding: 4px 8px 8px; }
.mx-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.mx-sub { font-weight: 900; font-size: clamp(.8rem, 1.7vw, 1.25rem); padding: 0 .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; }
.mx-sub.act { background: #FFD23F; border-color: #D62828; }
.mx-head .restart-btn { font-size: clamp(.75rem, 1.5vw, 1.1rem); padding: 0 10px; border-width: 3px; }
.mx-head .stat { font-size: clamp(.8rem, 1.6vw, 1.15rem); padding: 0 10px; border-width: 3px; }
.mx-fb { flex: 0 0 auto; min-height: 1.3em; text-align: center; font-weight: 900; font-size: clamp(.9rem, 1.9vw, 1.35rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }
.mx-q { flex: 0 0 auto; display: none; align-items: center; justify-content: center; gap: 12px; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 2px 14px; font-weight: 900; font-size: clamp(1.1rem, 3vw, 2.2rem); text-align: center; }
.mx-q svg { width: 2.4em; height: 2.4em; }
.mx-q small { display: block; font-size: .5em; color: #0B5C56; }
.mx-body { position: relative; flex: 1; min-height: 0; display: grid; gap: 10px; grid-template-columns: minmax(0, 23%) minmax(0, 1fr) minmax(0, 23%); }
.mx-col { display: flex; flex-direction: column; justify-content: space-evenly; gap: 6px; min-height: 0; }
.mx-chip { position: relative; flex: 1; min-height: 0; max-height: 19%; border: 5px solid #0B2F2C; border-radius: 16px; padding: 2px 10px; display: flex; align-items: center; gap: 8px; text-align: left; font-weight: 900; color: #0B2F2C; font-size: clamp(.85rem, 2vw, 1.5rem); line-height: 1.1; }
.mx-chip .cf { flex: 0 0 auto; width: 2.4em; height: 2.4em; display: flex; align-items: center; }
.mx-chip .cf svg { width: 100%; height: 100%; }
.mx-chip .ct { display: flex; flex-direction: column; min-width: 0; }
.mx-chip small { font-size: .6em; font-weight: 800; color: #1f3d3a; }
.mx-chip .cdot { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 4px solid #0B2F2C; top: 50%; margin-top: -9px; }
.mx-col.L .cdot { right: -16px; } .mx-col.R .cdot { left: -16px; }
.mx-chip.sel { border-color: #D62828; border-width: 7px; box-shadow: 0 0 0 4px #fff; }
.mx-chip.done { opacity: .78; }
.mx-chip.done .ct b::after { content: ' ✔'; }
.mx-chip.pulse { animation: mxp .5s 3; }
@keyframes mxp { 50% { transform: scale(1.06); } }
#lc-mapwrap { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; background: #E6FAF8; border: 5px solid #0B2F2C; border-radius: 16px; overflow: hidden; }
#lc-map { width: 100%; height: 100%; display: block; touch-action: manipulation; }
.lc-dg { cursor: pointer; }
.lc-dg .dot.pulse { animation: lcp .45s 4; }
@keyframes lcp { 50% { fill: #D62828; } }
.lc-poly { cursor: pointer; }
#lc-info, #nd-info { display: none; position: absolute; left: 8px; right: 8px; bottom: 8px; background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 4px 12px; align-items: center; gap: 12px; z-index: 6; }
#lc-info .f svg { width: clamp(3rem, 8vw, 5rem); height: clamp(3rem, 8vw, 5rem); }
#lc-info .t { font-weight: 800; font-size: clamp(.9rem, 2.1vw, 1.5rem); }
#lc-info .t b { font-size: 1.25em; }
#lc-info .t small, #nd-info small { display: block; color: #0B5C56; font-weight: 800; font-size: .8em; }
#lc-lines, #nd-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.mx-body.q { grid-template-columns: minmax(0, 1fr); }
.mx-body.q .mx-col { display: none; }
@media (orientation: portrait) {
  .mx-body { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); }
  #lc-mapwrap { grid-column: 1 / 3; grid-row: 1; }
  #lc-left { grid-column: 1; grid-row: 2; } #lc-right { grid-column: 2; grid-row: 2; }
  .mx-col.L .cdot, .mx-col.R .cdot { right: auto; left: 50%; margin-left: -9px; top: -16px; margin-top: 0; }
  .mx-chip { max-height: none; padding: 0 6px; font-size: clamp(.75rem, 3.2vw, 1.2rem); }
  .mx-body.q { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
  #lc-lines { z-index: 5; }
  #nd-body { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1.5fr) minmax(0, 1fr); }
  #nd-grid { grid-column: 1 / 3; grid-row: 1; }
  #nd-left { grid-column: 1; grid-row: 2; } #nd-right { grid-column: 2; grid-row: 2; }
  .mx-chip.day { font-size: clamp(.65rem, 2.6vw, 1rem); }
}
/* National days */
#nd-body { grid-template-columns: minmax(0, 27%) minmax(0, 1fr) minmax(0, 27%); }
.mx-chip.day { font-size: clamp(.72rem, 1.55vw, 1.15rem); }
.mx-chip .nm { font-weight: 800; font-size: .85em; }
.nd-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 12px; min-height: 0; }
.nd-pic { position: relative; border: 5px solid #0B2F2C; border-radius: 12px; background: #fff; min-height: 0; display: flex; flex-direction: column; overflow: visible; }
.nd-pic .pimg { flex: 1; min-height: 0; overflow: hidden; border-radius: 6px; }
.nd-pic .pimg svg { width: 100%; height: 100%; display: block; }
.nd-pic .pdot { position: absolute; top: -15px; left: 50%; margin-left: -9px; width: 18px; height: 18px; border-radius: 50%; border: 4px solid #0B2F2C; background: #fff; z-index: 3; }
.nd-pic .plab { display: none; text-align: center; font-weight: 900; font-size: clamp(.7rem, 1.6vw, 1.1rem); background: #FFF3B0; border-top: 3px solid #0B2F2C; }
.nd-help .nd-pic .plab { display: block; }
.nd-pic.done { box-shadow: 0 0 0 5px #0A7A2F; }
.nd-pic.shake { animation: shake .4s; }
#nd-learn { display: none; flex: 1; min-height: 0; overflow: auto; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 4px; align-content: start; }
@media (orientation: portrait) { #nd-learn { grid-template-columns: 1fr 1fr; } }
.nd-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
.nd-card .pimg { aspect-ratio: 4 / 3; border-bottom: 5px solid #0B2F2C; }
.nd-card .pimg svg { width: 100%; height: 100%; display: block; }
.nd-card .cb { padding: 6px 10px 8px; font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.2rem); }
.nd-card .cb b { display: block; font-size: 1.25em; color: #D62828; }
.nd-card .cb small { display: block; color: #0B5C56; font-size: .85em; }
#nd-quiz { display: none; flex: 1; min-height: 0; flex-direction: column; align-items: center; gap: 8px; }
#nd-quiz .qpic { flex: 0 1 auto; min-height: 0; width: min(100%, calc((100vh - 280px) * 1.333)); aspect-ratio: 4 / 3; border: 5px solid #0B2F2C; border-radius: 16px; overflow: hidden; background: #fff; }
#nd-quiz .qpic svg { width: 100%; height: 100%; display: block; }
#nd-opts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
#nd-opts .mx-chip { flex: 1 1 28%; max-height: none; justify-content: center; text-align: center; padding: 6px 10px; min-height: 3.2em; }
#nd-opts .mx-chip.ok { background: #7DDC9A !important; } #nd-opts .mx-chip.bad { background: #FFB4B4 !important; text-decoration: line-through; }
#nd-info { position: static; display: none; }
#mx-win { position: fixed; inset: 0; z-index: 45; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: rgba(11,47,44,.92); color: #fff; }
.mx-next { align-self: center; font-size: clamp(1.1rem, 2.6vw, 1.7rem); display: none; }
</style>

<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Sort<br>It Out</h1>
  <p class="subtitle">Sort the words, find the countries and match the days!</p>
  <div class="preview">👥 📚 🗺️ 🎉</div>
  <div class="modes"><button class="big-btn" onclick="startGame()">🗂️ Sort It Out</button><button class="big-btn" onclick="lcOpen()">🗺️ Locate Countries</button><button class="big-btn" onclick="ndOpen()">🎉 National Days</button></div>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>

<div id="mtabs">
  <button class="mt act" id="mt-sort" onclick="mxGo('sort')">🗂️ Sort It Out</button>
  <button class="mt" id="mt-lc" onclick="mxGo('lc')">🗺️ Locate Countries</button>
  <button class="mt" id="mt-nd" onclick="mxGo('nd')">🎉 National Days</button>
</div>
<div id="topbar">
  <div class="stat">Round: <span id="rn">1</span>/4</div>
  <div class="stat">Mistakes: <span id="mi">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="head"><div id="h-en"></div><div id="h-tr" class="tr"></div></div>
  <div id="pool"></div>
  <div id="bins"></div>
  <div id="fb"></div>
  <button class="big-btn" id="next" onclick="nextRound()">Next</button>
</div>

<div id="lc-screen" class="mxs">
  <div class="mx-head">
    <button class="mx-sub act" id="lct-learn" onclick="lcTab('learn')">📖 Learn</button>
    <button class="mx-sub" id="lct-match" onclick="lcTab('match')">🔗 Match</button>
    <button class="mx-sub" id="lct-quiz" onclick="lcTab('quiz')">❓ Quiz</button>
    <span class="stat" id="lc-s1"></span><span class="stat" id="lc-s2"></span>
    <button class="restart-btn" id="lc-help" onclick="lcHelp()">Help: Off</button>
    <button class="restart-btn" id="lc-zoom" onclick="lcZoom()">🔍 Europe</button>
    <button class="restart-btn mx-tr" onclick="mxTR()">Turkish: On</button>
    <button class="restart-btn" onclick="lcRestart()">Restart</button>
  </div>
  <div class="mx-q" id="lc-q"></div>
  <div class="mx-body" id="lc-body">
    <div class="mx-col L" id="lc-left"></div>
    <div id="lc-mapwrap"><svg id="lc-map" xmlns="http://www.w3.org/2000/svg"></svg><div id="lc-info"></div></div>
    <div class="mx-col R" id="lc-right"></div>
    <svg id="lc-lines"></svg>
  </div>
  <div class="mx-fb" id="lc-fb"></div>
  <button class="big-btn mx-next" id="lc-next" onclick="lcNext()">Next</button>
</div>
<div id="nd-screen" class="mxs">
  <div class="mx-head">
    <button class="mx-sub act" id="ndt-learn" onclick="ndTab('learn')">📖 Learn</button>
    <button class="mx-sub" id="ndt-match" onclick="ndTab('match')">🔗 Match</button>
    <button class="mx-sub" id="ndt-quiz" onclick="ndTab('quiz')">❓ Quiz</button>
    <span class="stat" id="nd-s1"></span><span class="stat" id="nd-s2"></span>
    <button class="restart-btn" id="nd-help" onclick="ndHelp()">Help: Off</button>
    <button class="restart-btn mx-tr" onclick="mxTR()">Turkish: On</button>
    <button class="restart-btn" onclick="ndRestart()">Restart</button>
  </div>
  <div id="nd-learn"></div>
  <div class="mx-body" id="nd-body">
    <div class="mx-col L" id="nd-left"></div>
    <div class="nd-grid" id="nd-grid"></div>
    <div class="mx-col R" id="nd-right"></div>
    <svg id="nd-lines"></svg>
  </div>
  <div id="nd-quiz"><div class="qpic" id="nd-qpic"></div><div id="nd-opts"></div></div>
  <div class="mx-fb" id="nd-fb"></div>
  <button class="big-btn mx-next" id="nd-next" onclick="ndNext()">Next</button>
</div>
<div id="mx-win">
  <h2 class="win-title" id="mx-wt">Well done!</h2>
  <p class="win-stats" id="mx-ws"></p>
  <div class="modes"><button class="big-btn" id="mx-again">Play Again</button><button class="big-btn" onclick="mxMenu()">Menu</button></div>
</div>

<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {

  function startGame() {

    ri = 0; mistakes = 0; document.getElementById('mi').textContent = 0; showRound();
  }
  function showRound() {
    var r = ROUNDS[ri]; sel = null; left = r[3].length;
    document.getElementById('rn').textContent = ri + 1;
    document.getElementById('h-en').textContent = r[0]; document.getElementById('h-tr').textContent = r[1];
    fbParts = null; renderFb(); document.getElementById('next').style.display = 'none';
    var bins = document.getElementById('bins'); bins.innerHTML = '';

      var d = document.createElement('div'); d.className = 'bin'; d.dataset.id = b[0];
      d.innerHTML = '<div class="bh" style="background:' + b[4] + '"><div class="be">' + b[3] + '</div><div class="bn">' + b[1] + '</div><div class="bt tr">' + b[2] + '</div></div><div class="chips"></div>';

      bins.appendChild(d);

    var pool = document.getElementById('pool'); pool.innerHTML = '';

      var b = document.createElement('button'); b.className = 'word'; b.dataset.bin = w[0];
      b.innerHTML = '<div class="e">' + w[1] + '</div><div class="p">' + w[2] + '</div><div class="t tr">' + w[3] + '</div>';
      b.addEventListener('click', function () { if (sel) sel.classList.remove('sel'); sel = (sel === b) ? null : b; if (sel) sel.classList.add('sel'); });
      b._w = w; pool.appendChild(b);
    });
  }
  function dropIn(bin) {
    if (!sel) { setFb('👆 Tap a word first.', 'Önce bir kelimeye dokun.'); return; }
    var w = sel._w;
    if (sel.dataset.bin === bin.dataset.id) {
      var c = document.createElement('span'); c.className = 'chip'; c.innerHTML = w[1] + ' ' + w[2];
      bin.querySelector('.chips').appendChild(c);
      sel.classList.add('gone'); sel = null; left--; fbParts = null; renderFb();
      if (left === 0) {
        setFb('✔ All sorted!', 'Hepsi doğru yerde!');
        var nx = document.getElementById('next'); nx.textContent = (ri === ROUNDS.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
      }
    } else {
      mistakes++; document.getElementById('mi').textContent = mistakes;
      sel.classList.add('shake'); var s = sel; setTimeout(function () { s.classList.remove('shake'); }, 450);
      setFb('✘ Not this box. Try again!', 'Bu kutu değil. Tekrar dene!');
    }
  }
  function nextRound() {
    ri++;

      document.getElementById('win-stats').textContent = 'Mistakes: ' + mistakes;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showRound();
  }
</script>

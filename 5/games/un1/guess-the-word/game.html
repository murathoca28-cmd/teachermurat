  #mean { text-align: left; font-weight: 900; font-size: clamp(1.2rem, 3.2vw, 2.4rem); color: #0B5C56; line-height: 1.15; }
  #catpill { display: inline-block; font-size: clamp(.8rem, 1.7vw, 1.2rem); background: #FFD23F; border: 3px solid #0B2F2C; border-radius: 999px; padding: 0 12px; color: #0B2F2C; }
  #slots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .sl { width: clamp(30px, 6.4vw, 64px); height: clamp(40px, 8.4vh, 72px); border-bottom: 8px solid #0B2F2C; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: clamp(1.4rem, 4vw, 2.8rem); }
  .sl.miss { color: #D62828; }
  #keys { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .k { width: clamp(38px, 7vw, 78px); height: clamp(40px, 8vh, 70px); font-weight: 900; font-size: clamp(1.1rem, 3vw, 2.2rem); background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 12px; box-shadow: 0 4px 0 #0B2F2C; color: #0B2F2C; padding: 0; }
  .k:active { transform: translateY(3px); box-shadow: 0 1px 0 #0B2F2C; }
  .k.ok { background: #7DDC9A; border-color: #0A7A2F; box-shadow: none; } .k.no { background: #FFD6D6; border-color: #D62828; box-shadow: none; color: #9A9A9A; }
  .k:disabled { cursor: default; }
  #fb { min-height: 1.3em; text-align: center; font-weight: 900; font-size: clamp(1rem, 2.4vw, 1.8rem); color: #fff; text-shadow: 2px 2px 0 #0B2F2C; }

  <div class="preview"><svg viewBox="0 0 24 22" style="width:1.15em;height:1.05em;margin:0 .06em;vertical-align:middle"><path d="M12 20C-5 9 3 -1 12 6c9-7 17 3 0 14z" fill="#E63946" stroke="#0B2E2B" stroke-width="2.4" stroke-linejoin="round"/></svg><svg viewBox="0 0 24 22" style="width:1.15em;height:1.05em;margin:0 .06em;vertical-align:middle"><path d="M12 20C-5 9 3 -1 12 6c9-7 17 3 0 14z" fill="#E63946" stroke="#0B2E2B" stroke-width="2.4" stroke-linejoin="round"/></svg><svg viewBox="0 0 24 22" style="width:1.15em;height:1.05em;margin:0 .06em;vertical-align:middle"><path d="M12 20C-5 9 3 -1 12 6c9-7 17 3 0 14z" fill="#E63946" stroke="#0B2E2B" stroke-width="2.4" stroke-linejoin="round"/></svg></div>

<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { var f = document.getElementById('fb'); if (f) f.textContent = fbParts ? fbParts[0] + (TR && fbParts[1] ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.body.classList.toggle('no-tr', !TR); document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var W = [["music", "⟦music_club⟧", "müzik", "Club"], ["drama", "⟦drama_masks⟧", "drama", "Club"], ["chess", "⟦chess_board⟧", "satranç", "Club"], ["science", "⟦science_club⟧", "fen bilimleri", "Club"], ["maths", "⟦maths_club⟧", "matematik", "Club"], ["technology", "⟦technology_laptop⟧", "teknoloji", "Club"], ["library", "⟦library⟧", "kütüphane", "Place"], ["canteen", "⟦canteen⟧", "kantin", "Place"], ["doctor", "⟦doctor⟧", "doktor", "Person"], ["coach", "⟦coach⟧", "antrenör", "Person"], ["cook", "⟦cook⟧", "aşçı", "Person"], ["headmaster", "⟦headmaster⟧", "okul müdürü", "Person"], ["secretary", "⟦secretary⟧", "sekreter", "Person"], ["student", "⟦student⟧", "öğrenci", "Person"], ["teacher", "⟦teacher⟧", "öğretmen", "Person"], ["spain", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Spain\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"88\" height=\"56\" fill=\"#AA151B\"/><rect y=\"14\" width=\"88\" height=\"28\" fill=\"#F1BF00\"/><rect x=\"22\" y=\"22\" width=\"10\" height=\"13\" rx=\"2\" fill=\"#AA151B\" stroke=\"#7A4B12\" stroke-width=\"1.5\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "İspanya", "Country"], ["italy", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Italy\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"56\" fill=\"#009246\"/><rect x=\"29\" width=\"30\" height=\"56\" fill=\"#fff\"/><rect x=\"58\" width=\"30\" height=\"56\" fill=\"#CE2B37\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "İtalya", "Country"], ["france", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"France\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"56\" fill=\"#0055A4\"/><rect x=\"29\" width=\"30\" height=\"56\" fill=\"#fff\"/><rect x=\"58\" width=\"30\" height=\"56\" fill=\"#EF4135\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "Fransa", "Country"], ["japan", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Japan\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"88\" height=\"56\" fill=\"#fff\"/><circle cx=\"44\" cy=\"28\" r=\"16\" fill=\"#BC002D\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "Japonya", "Country"], ["mexico", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Mexico\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"56\" fill=\"#006847\"/><rect x=\"29\" width=\"30\" height=\"56\" fill=\"#fff\"/><rect x=\"58\" width=\"30\" height=\"56\" fill=\"#CE1126\"/><circle cx=\"44\" cy=\"28\" r=\"8\" fill=\"#8C5A2B\"/><circle cx=\"44\" cy=\"28\" r=\"4.5\" fill=\"#3E8E41\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "Meksika", "Country"], ["canada", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Canada\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"88\" height=\"56\" fill=\"#fff\"/><rect width=\"22\" height=\"56\" fill=\"#D80621\"/><rect x=\"66\" width=\"22\" height=\"56\" fill=\"#D80621\"/><path d=\"M44 10 L48 20 L55 17 L53 29 L60 25 L57 33 L61 35 L45 40 L45 48 L43 48 L43 40 L27 35 L31 33 L28 25 L35 29 L33 17 L40 20 Z\" fill=\"#D80621\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "Kanada", "Country"], ["russia", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Russia\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"88\" height=\"19\" fill=\"#fff\"/><rect y=\"19\" width=\"88\" height=\"18\" fill=\"#0039A6\"/><rect y=\"37\" width=\"88\" height=\"19\" fill=\"#D52B1E\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "Rusya", "Country"], ["germany", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Germany\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"88\" height=\"19\" fill=\"#000\"/><rect y=\"19\" width=\"88\" height=\"18\" fill=\"#DD0000\"/><rect y=\"37\" width=\"88\" height=\"19\" fill=\"#FFCE00\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "Almanya", "Country"], ["azerbaijan", "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Azerbaijan\"><g transform=\"translate(6 22)\"><svg width=\"88\" height=\"56\" viewBox=\"0 0 88 56\" preserveAspectRatio=\"none\"><rect width=\"88\" height=\"19\" fill=\"#00B5E2\"/><rect y=\"19\" width=\"88\" height=\"18\" fill=\"#EF3340\"/><rect y=\"37\" width=\"88\" height=\"19\" fill=\"#509E2F\"/><circle cx=\"43\" cy=\"28\" r=\"7\" fill=\"#fff\"/><circle cx=\"45\" cy=\"28\" r=\"5.6\" fill=\"#EF3340\"/><polygon points=\"52.0,24.4 52.8,26.8 55.4,26.9 53.4,28.4 54.1,30.9 52.0,29.4 49.9,30.9 50.6,28.4 48.6,26.9 51.2,26.8\" fill=\"#fff\"/></svg><rect x=\"0\" y=\"0\" width=\"88\" height=\"56\" fill=\"none\" stroke=\"#0B2F2C\" stroke-width=\"3.5\"/></g></svg>", "Azerbaycan", "Country"]];
  var order, qi, score, lives, cur, guessed, over;
  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(W.slice()).slice(0, 8); qi = 0; score = 0; document.getElementById('sc').textContent = 0; showWord();
  }
  function hearts() { var s = ''; for (var i = 0; i < 6; i++) s += (i < lives ? HON : HOFF); document.getElementById('hearts').innerHTML = s; }
  var HON = "<svg viewBox=\"0 0 24 22\" style=\"width:1.15em;height:1.05em;margin:0 .06em;vertical-align:middle\"><path d=\"M12 20C-5 9 3 -1 12 6c9-7 17 3 0 14z\" fill=\"#E63946\" stroke=\"#0B2E2B\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/></svg>", HOFF = "<svg viewBox=\"0 0 24 22\" style=\"width:1.15em;height:1.05em;margin:0 .06em;vertical-align:middle\"><path d=\"M12 20C-5 9 3 -1 12 6c9-7 17 3 0 14z\" fill=\"#FFFFFF\" stroke=\"#0B2E2B\" stroke-dasharray=\"3 2.4\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/></svg>";
  function showWord() {
    cur = order[qi]; lives = 6; guessed = {}; over = false;
    document.getElementById('rn').textContent = qi + 1;
    document.getElementById('pic').innerHTML = cur[1]; document.getElementById('catpill').textContent = cur[3]; document.getElementById('tr-mean').textContent = cur[2];
    fbParts = null; renderFb(); document.getElementById('next').style.display = 'none'; hearts();
    var kb = document.getElementById('keys'); kb.innerHTML = '';
    'abcdefghijklmnopqrstuvwxyz'.split('').forEach(function (ch) {
      var b = document.createElement('button'); b.className = 'k'; b.textContent = ch.toUpperCase(); b.id = 'k-' + ch;
      b.addEventListener('click', function () { pick(ch); }); kb.appendChild(b);
    });
    renderSlots(false);
  }
  function renderSlots(reveal) {
    var sb = document.getElementById('slots'); sb.innerHTML = '';
    cur[0].split('').forEach(function (ch) {
      var d = document.createElement('div'); d.className = 'sl';
      if (guessed[ch]) d.textContent = ch.toUpperCase(); else if (reveal) { d.textContent = ch.toUpperCase(); d.classList.add('miss'); }
      sb.appendChild(d);
    });
  }
  function pick(ch) {
    if (over || guessed[ch] !== undefined) return;
    var hit = cur[0].indexOf(ch) >= 0; guessed[ch] = hit;
    var k = document.getElementById('k-' + ch); k.classList.add(hit ? 'ok' : 'no'); k.disabled = true;
    if (!hit) { lives--; hearts(); }
    renderSlots(false);
    var all = cur[0].split('').every(function (c) { return guessed[c]; });
    if (all) { over = true; score++; document.getElementById('sc').textContent = score; setFb('✔ ' + cur[0] + ' = ' + cur[2], ''); showNext(); }
    else if (lives <= 0) { over = true; renderSlots(true); setFb('✘ The word is "' + cur[0] + '".', cur[2]); showNext(); }
  }
  function showNext() { var nx = document.getElementById('next'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block'; }
  document.addEventListener('keydown', function (e) { if (/^[a-z]$/i.test(e.key) && document.getElementById('start-screen').style.display === 'none') pick(e.key.toLowerCase()); });
  function nextWord() {
    qi++;
    if (qi >= order.length) {
      document.getElementById('win-title').textContent = score >= 7 ? 'Word Master!' : (score >= 5 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Score: ' + score + ' / ' + order.length;
      document.getElementById('win-screen').style.display = 'flex'; return;
    }
    showWord();
  }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Must or Mustn't Rules Game</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; background: #0E8F86; color: #0B2F2C; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid #0B2F2C; background: #fff; color: #0B2F2C; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #start-screen, #win-screen { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 20px; background: #0E8F86; }
  #win-screen { display: none; background: rgba(11,47,44,.9); color: #fff; }
  .title { margin: 0; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0B2F2C; line-height: 1.1; }
  .subtitle { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 800; color: #fff; }
  .big-btn { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 900; padding: .35em 1.4em; border: 5px solid #0B2F2C;
    border-radius: 999px; background: #FFD23F; color: #0B2F2C; box-shadow: 0 6px 0 #0B2F2C; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0B2F2C; }
  .preview { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .15em; }
  .win-title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; margin: 0; color: #FFD23F; }
  .win-stats { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 800; margin: 0; }
  .stat { background: #fff; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; white-space: nowrap; }
  #topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 70px 4px 12px; flex-wrap: wrap; }
  .restart-btn { background: #FFD23F; border: 4px solid #0B2F2C; border-radius: 14px; padding: 2px 16px;
    font-size: clamp(1rem, 2.4vw, 1.7rem); font-weight: 900; color: #0B2F2C; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }

  #main { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 8px 12px 12px; align-items: stretch; }
  @media (orientation: portrait) { #main { flex-direction: column; } }
  #card { flex: 0 0 36%; position: relative; container-type: size; background: #fff; border: 6px solid #0B2F2C; border-radius: 22px;
    display: flex; align-items: center; justify-content: center; min-height: 0; }
  @media (orientation: portrait) { #card { flex: 0 0 34%; } }
  #pic { font-size: 55cqmin; line-height: 1; }
  #slash { display: none; position: absolute; left: 8%; right: 8%; top: 50%; height: 7cqmin; background: #D62828; border: 3px solid #0B2F2C; border-radius: 8px; transform: rotate(-35deg); }
  #stamp { display: none; position: absolute; left: 50%; bottom: 3cqmin; transform: translateX(-50%); color: #fff; font-weight: 900; font-size: 10cqmin;
    padding: 0 5cqmin; border: 5px solid #0B2F2C; border-radius: 12px; white-space: nowrap; }
  #qside { flex: 1; min-width: 0; min-height: 0; background: #fff; border: 6px solid #0B2F2C; border-radius: 22px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-evenly; text-align: center; padding: 8px 14px; }
  #sentence { font-weight: 900; font-size: clamp(1.5rem, 4.4vw, 3.4rem); line-height: 1.2; }
  .blank { display: inline-block; min-width: 3.2em; border-bottom: 6px solid #0B2F2C; }
  #opts { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .opt { font-size: clamp(1.3rem, 3.6vw, 2.6rem); font-weight: 900; padding: .25em .8em; color: #fff; border: 5px solid #0B2F2C; border-radius: 16px; box-shadow: 0 5px 0 #0B2F2C; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 #0B2F2C; }
  .opt:disabled { opacity: .45; cursor: default; }
  .opt.pick { opacity: 1; outline: 6px solid #FFD23F; }
  #fb { min-height: 1.5em; font-size: clamp(1rem, 2.6vw, 1.9rem); font-weight: 800; color: #0B5C56; }
  #next { display: none; }
</style>
<style id="ln-css">
.ln-btn { background: #fff !important; font-size: clamp(1.1rem, 2.6vw, 1.9rem) !important; }
:where(.tile .e, .cell .e, .wc .e, .fe, .ct, #qmark, .w .e, .word .e, #pic) svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
#ln-screen { display: none; position: fixed; inset: 0; z-index: 70; background: #0E8F86; flex-direction: column; gap: 8px; padding: 8px 10px 10px; font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; color: #0B2F2C; }
#ln-top { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#ln-title { font-weight: 900; font-size: clamp(1.3rem, 3.4vw, 2.4rem); color: #fff; text-shadow: 3px 3px 0 #0B2F2C; margin-right: 6px; }
#ln-tabs { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.ln-tab { font-weight: 900; font-size: clamp(.9rem, 2.1vw, 1.5rem); padding: .05em .8em; border: 4px solid #0B2F2C; border-radius: 12px; background: #fff; color: #0B2F2C; cursor: pointer; font-family: inherit; }
.ln-tab.act { background: #FFD23F; border-color: #D62828; }
#ln-close { font-weight: 900; font-size: clamp(.95rem, 2.2vw, 1.5rem); padding: .05em .9em; border: 4px solid #0B2F2C; border-radius: 12px; background: #D62828; color: #fff; cursor: pointer; font-family: inherit; }
#ln-grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 17vw, 240px), 1fr)); gap: 10px; align-content: start; padding: 2px; }
.ln-card { background: #fff; border: 5px solid #0B2F2C; border-radius: 16px; padding: 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ln-card.wide { grid-column: span 2; }
.ln-card .le { font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1.1; }
.ln-card .le svg { width: clamp(2.4rem, 8vh, 4rem); height: clamp(2.4rem, 8vh, 4rem); display: block; }
.ln-card .en { font-weight: 900; font-size: clamp(1rem, 2.3vw, 1.6rem); line-height: 1.15; }
.ln-card .trl { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1.15rem); color: #0B5C56; }
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen / Exit" aria-label="Fullscreen / Exit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="start-screen">
  <h1 class="title">Must or Mustn't<br>Rules Game</h1>
  <p class="subtitle">Choose the right rule!</p>
  <div class="preview">🤫 🏃 🥼 📚</div>
  <button class="big-btn" onclick="startGame()">Start</button>
  <button class="big-btn ln-btn" onclick="lnOpen()">📖 Learn</button>
</div>
<div id="win-screen">
  <h2 class="win-title" id="win-title">You Win!</h2>
  <p class="win-stats" id="win-stats"></p>
  <button class="big-btn" onclick="startGame()">Play Again</button>
</div>
<div id="topbar">
  <div class="stat">Question: <span id="no">1</span>/12</div>
  <div class="stat">Score: <span id="score">0</span></div>
  <button class="restart-btn" id="trbtn" onclick="toggleTR()">Turkish: On</button>
  <button class="restart-btn" onclick="startGame()">Restart</button>
</div>
<div id="main">
  <div id="card"><div id="pic"></div><div id="slash"></div><div id="stamp"></div></div>
  <div id="qside">
    <div id="sentence"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <button class="big-btn" id="next" onclick="nextQ()" style="font-size:clamp(1.2rem,3vw,2rem)">Next</button>
  </div>
</div>
<script>
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else { (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); }
  }

  var TR = true, fbParts = null;
  function setFb(p, tr) { fbParts = [p, tr]; renderFb(); }
  function renderFb() { document.getElementById('fb').textContent = fbParts ? fbParts[0] + (TR ? ' ' + fbParts[1] : '') : ''; }
  function toggleTR() { TR = !TR; document.getElementById('trbtn').textContent = 'Turkish: ' + (TR ? 'On' : 'Off'); renderFb(); }
  var Q = [
    { p: "🏃", s: "You ___ run in the classroom.", a: "mustn't", tr: "Sınıfta koşmamalısın." },
    { p: "🤫", s: "You ___ be quiet in the library.", a: "must", tr: "Kütüphanede sessiz olmalısın." },
    { p: "🥼", s: "You ___ wear a lab coat in the science lab.", a: "must", tr: "Fen laboratuvarında laboratuvar önlüğü giymelisin." },
    { p: "🥪", s: "You ___ eat your lunch in the canteen.", a: "can", tr: "Öğle yemeğini kantinde yiyebilirsin." },
    { p: "📚", s: "You ___ borrow books from the library.", a: "can", tr: "Kütüphaneden kitap ödünç alabilirsin." },
    { p: "📱", s: "You ___ use your phone in the exam.", a: "mustn't", tr: "Sınavda telefonunu kullanmamalısın." },
    { p: "⚗️", s: "You ___ taste things in the science lab.", a: "mustn't", tr: "Fen laboratuvarında bir şeyleri tatmamalısın." },
    { p: "📏", s: "You ___ follow the school rules.", a: "must", tr: "Okul kurallarına uymalısın." },
    { p: "⚽", s: "You ___ play football on the sports field.", a: "can", tr: "Spor sahasında futbol oynayabilirsin." },
    { p: "🗣️", s: "You ___ shout in the corridor.", a: "mustn't", tr: "Koridorda bağırmamalısın." },
    { p: "👂", s: "You ___ listen to your teacher.", a: "must", tr: "Öğretmenini dinlemelisin." },
    { p: "🗑️", s: "You ___ throw rubbish on the floor.", a: "mustn't", tr: "Yere çöp atmamalısın." },
    { p: "🎵", s: "You ___ join the music club if you like singing.", a: "can", tr: "Şarkı söylemeyi seviyorsan müzik kulübüne katılabilirsin." },
    { p: "🚪", s: "You ___ push your friends at the door.", a: "mustn't", tr: "Kapıda arkadaşlarını itmemelisin." }
  ];
  var COL = { 'must': '#1F5FBF', "mustn't": '#D62828', 'can': '#0A7A2F' };
  var order, qi, score, locked;

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    order = shuffle(Q.slice()); qi = 0; score = 0; document.getElementById('score').textContent = 0;
    showQ();
  }
  function showQ() {
    var q = order[qi]; locked = false;
    document.getElementById('no').textContent = qi + 1;
    document.getElementById('pic').textContent = q.p;
    document.getElementById('slash').style.display = 'none';
    document.getElementById('stamp').style.display = 'none';
    document.getElementById('sentence').innerHTML = q.s.replace('___', '<span class="blank" id="blank">&nbsp;</span>');
    fbParts = null; renderFb();
    document.getElementById('next').style.display = 'none';
    var box = document.getElementById('opts'); box.innerHTML = '';
    ['must', "mustn't", 'can'].forEach(function (w) {
      var b = document.createElement('button'); b.className = 'opt'; b.textContent = w; b.style.background = COL[w]; b.dataset.w = w;
      b.addEventListener('click', function () { answer(b, w); });
      box.appendChild(b);
    });
  }
  function answer(btn, w) {
    if (locked) return; locked = true;
    var q = order[qi], ok = (w === q.a);
    var blank = document.getElementById('blank'); blank.textContent = q.a; blank.style.color = COL[q.a];
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) { if (b.dataset.w !== w) b.disabled = true; });
    btn.classList.add('pick');
    var st = document.getElementById('stamp'); st.textContent = q.a.toUpperCase(); st.style.background = COL[q.a]; st.style.display = 'block';
    if (q.a === "mustn't") document.getElementById('slash').style.display = 'block';
    if (ok) { score++; document.getElementById('score').textContent = score; setFb('✔ Correct!', q.tr); }
    else { btn.classList.add('shake'); setFb('✘ The answer is "' + q.a + '".', q.tr); }
    var nx = document.getElementById('next'); nx.textContent = (qi === order.length - 1) ? 'Finish' : 'Next'; nx.style.display = 'inline-block';
  }
  function nextQ() {
    qi++;
    if (qi >= order.length) {
      document.getElementById('win-title').textContent = score >= 10 ? 'Rule Master!' : (score >= 7 ? 'Well Done!' : 'Good Try!');
      document.getElementById('win-stats').textContent = 'Score: ' + score + ' / ' + order.length;
      document.getElementById('win-screen').style.display = 'flex';
      return;
    }
    showQ();
  }
</script>
<div id="ln-screen">
  <div id="ln-top"><div id="ln-title">📖 Learn</div><div id="ln-tabs"></div><button id="ln-close" onclick="lnClose()">Close ✕</button></div>
  <div id="ln-grid"></div>
</div>
<script>
(function () {
  var LN = [["School Rules", "Okul Kuralları", [["🚫", "You mustn’t run in the classroom.", "Sınıfta koşmamalısın."], ["🤫", "You must be quiet in the library.", "Kütüphanede sessiz olmalısın."], ["🚫", "You can’t shout in the library.", "Kütüphanede bağıramazsın."], ["🥼", "You must wear a lab coat in the science lab.", "Fen laboratuvarında laboratuvar önlüğü giymelisin."], ["🚶", "Line up, nice and straight!", "Düzgünce sıraya girin!"], ["✅", "Follow the rules and play safe!", "Kurallara uyun ve güvenli oynayın!"]]], ["Useful Sentences", "Kullanışlı Cümleler", [["❓", "Where are you from?", "Nerelisin?"], ["🌍", "I am from Türkiye.", "Türkiye’denim."], ["❓", "Where is she from?", "O nereli?"], ["🌍", "She is from Spain.", "O İspanya’lı."], ["❓", "What is your favourite school club?", "En sevdiğin okul kulübü hangisi?"], ["🎵", "My favourite school club is music club.", "En sevdiğim okul kulübü müzik kulübü."], ["❓", "Do you like playing the guitar?", "Gitar çalmayı sever misin?"], ["👍", "Yes, I do. / No, I don’t.", "Evet, severim. / Hayır, sevmem."], ["❓", "Who is she?", "O kim?"], ["👩‍🏫", "She is the English teacher.", "O İngilizce öğretmeni."], ["❓", "Where is the coach?", "Antrenör nerede?"], ["⚽", "He is on the sports field.", "O spor sahasında."]]]];
  function lnShow(i) {
    Array.prototype.forEach.call(document.querySelectorAll('.ln-tab'), function (b, k) { b.classList.toggle('act', k === i); });
    document.getElementById('ln-grid').innerHTML = LN[i][2].map(function (it) {
      var wide = it[1].length > 26 && it[0].indexOf('<svg') < 0;
      return '<div class="ln-card' + (wide ? ' wide' : '') + '"><div class="le">' + it[0] + '</div><div class="en">' + it[1] + '</div><div class="trl">' + it[2] + '</div></div>';
    }).join('');
    document.getElementById('ln-grid').scrollTop = 0;
  }
  window.lnOpen = function () {
    var tabs = document.getElementById('ln-tabs'); tabs.innerHTML = '';
    LN.forEach(function (s, i) { var b = document.createElement('button'); b.className = 'ln-tab'; b.textContent = s[0]; b.onclick = function () { lnShow(i); }; tabs.appendChild(b); });
    document.getElementById('ln-screen').style.display = 'flex'; lnShow(0);
  };
  window.lnClose = function () { document.getElementById('ln-screen').style.display = 'none'; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.lnClose(); });
})();
</script>
</body>
</html>

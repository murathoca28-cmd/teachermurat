<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="6" y="6" width="788" height="508" rx="26" fill="#fff" stroke="#0B2F2C" stroke-width="10"/><rect x="6" y="6" width="788" height="84" rx="26" fill="#FFD23F" stroke="#0B2F2C" stroke-width="10"/><text x="400" y="64" text-anchor="middle" font-size="40" font-weight="900" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">A note from Mia</text><text x="60" y="190" font-size="35" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">Hi! I’m Mia. I’m from Canada.</text><text x="60" y="290" font-size="35" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">I love cameras.</text><text x="60" y="390" font-size="35" font-weight="800" fill="#0B2F2C" font-family="'DejaVu Sans', Verdana, Arial, sans-serif">At my club, I make short movies.</text></svg>
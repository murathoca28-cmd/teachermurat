<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen &amp; Pick</title>
<style>
  :root { --ink: #0B2F2C; --u: min(2.1vw, 3.9vh); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; display: flex; flex-direction: column; background: #0E8F86; color: var(--ink);
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; cursor: pointer; }
  #fs-btn { position: fixed; top: 8px; right: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid var(--ink); background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
  #fs-btn svg { width: 26px; height: 26px; }
  #home-btn { position: fixed; top: 8px; left: 8px; z-index: 50; width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid var(--ink); background: #FFC93C; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 4px 0 var(--ink); }
  #home-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  #home-btn svg { width: 26px; height: 26px; }
  #confirm { position: fixed; inset: 0; z-index: 70; background: rgba(11,47,44,.88); display: none; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  #confirm.on { display: flex; }
  #confirm .card { background: #fff; border: 6px solid var(--ink); border-radius: 22px; padding: 20px 24px; box-shadow: 0 6px 0 var(--ink); max-width: 520px; width: 100%; }
  #confirm h2 { margin: 0 0 6px; font-size: clamp(24px, calc(var(--u) * 1.4), 44px); font-weight: 900; }
  #confirm p { margin: 0 0 6px; font-size: clamp(16px, calc(var(--u) * 0.9), 28px); font-weight: 800; }
  #confirm p small { display: block; font-size: .8em; color: #0B5C56; margin-top: 3px; }
  #confirm .big-btn { margin-top: 10px; }
  html.notr .tr { display: none !important; }
  #tr-btn { flex: 0 0 auto; border: 4px solid var(--ink); background: #fff; color: var(--ink); border-radius: 12px; font-weight: 900; font-size: max(13px, calc(var(--u) * .8)); padding: 8px 10px; box-shadow: 0 3px 0 var(--ink); }
  #tr-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  #tr-btn .short { display: none; }
  #fbtxt .trl { display: block; font-size: .78em; color: #0B5C56; margin-top: 2px; font-weight: 800; }

  #hud { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 66px 6px 66px; flex-wrap: wrap; }
  .box { background: #fff; border: 4px solid var(--ink); border-radius: 14px; padding: 2px 14px; min-width: 84px; text-align: center; line-height: 1.1; }
  .box small { display: block; font-size: max(11px, calc(var(--u) * .55)); font-weight: 800; color: #0B5C56; letter-spacing: .06em; }
  .box b { display: block; font-size: max(18px, calc(var(--u) * 1.15)); font-weight: 900; font-variant-numeric: tabular-nums; }
  body.solo .team-only { display: none !important; }
  body.team .solo-only { display: none !important; }
  #h-teams { display: flex; gap: 8px; }
  .tbox { color: #fff; border: 4px solid var(--ink); border-radius: 14px; padding: 2px 12px; min-width: 84px; text-align: center; line-height: 1.1; opacity: .85; transition: transform .15s; }
  .tbox small { display: block; font-size: max(10px, calc(var(--u) * .5)); font-weight: 800; letter-spacing: .06em; }
  .tbox b { display: block; font-size: max(18px, calc(var(--u) * 1.15)); font-weight: 900; font-variant-numeric: tabular-nums; }
  .tbox.cur { opacity: 1; outline: 5px solid #FFD23F; outline-offset: 2px; transform: scale(1.06); }
  #hint.tm { background: var(--tc, #333); color: #fff; border: 4px solid var(--ink); border-radius: 14px; padding: 6px 12px; text-shadow: none; max-width: 52vw; }
  .opt:disabled { cursor: default; }
  #start { position: fixed; inset: 0; z-index: 60; background: #0E8F86; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  #start .card, #end .card { background: #fff; border: 6px solid var(--ink); border-radius: 22px; padding: 22px 26px; box-shadow: 0 6px 0 var(--ink); max-width: 560px; width: 100%; }
  #start h1 { margin: 0 0 4px; font-size: max(30px, calc(var(--u) * 2.6)); font-weight: 900; }
  #start p { margin: 0 0 14px; font-size: max(15px, calc(var(--u) * 1.1)); font-weight: 800; color: #0B5C56; }
  .big-btn { display: block; width: 100%; margin: 10px 0 0; border: 5px solid var(--ink); background: #FFC93C; color: var(--ink); border-radius: 16px; font-weight: 900; font-size: clamp(22px, calc(var(--u) * 1.2), 40px); padding: 14px 10px; box-shadow: 0 5px 0 var(--ink); }
  .big-btn small { display: block; font-size: .5em; font-weight: 800; color: #0B5C56; margin-top: 2px; }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .big-btn.alt { background: #fff; }
  #e-team { display: none; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
  .estat { color: #fff; border: 4px solid var(--ink); border-radius: 14px; padding: 6px 14px; min-width: 96px; line-height: 1.1; }
  .estat small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .06em; }
  .estat b { display: block; font-size: 30px; font-weight: 900; }
  .estat.win { outline: 5px solid #FFD23F; outline-offset: 2px; }
  #end .card .big-btn { margin-top: 10px; }
  #bar { flex: 0 0 auto; height: 12px; margin: 0 14px 6px; background: #fff; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #FFC93C; transition: width .3s; }

  #game { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 0 12px 10px; gap: 8px; }
  #hear { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 14px; }
  #spk { width: clamp(70px, 14vh, 110px); height: clamp(70px, 14vh, 110px); border-radius: 50%; border: 5px solid var(--ink);
    background: #FFC93C; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 5px 0 var(--ink); }
  #spk:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  #spk svg { width: 58%; height: 58%; }
  #slow { width: clamp(56px, 11vh, 86px); height: clamp(56px, 11vh, 86px); border-radius: 50%; border: 5px solid var(--ink);
    background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 5px 0 var(--ink); }
  #slow:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  #slow svg { width: 68%; height: 68%; }
  #slow.playing { background: #FFC93C; }
  #spk.playing { background: #fff; }
  #spk.playing .w { animation: pulse .7s infinite alternate; }
  .w2 { animation-delay: .25s !important; }
  @keyframes pulse { from { opacity: .15; } to { opacity: 1; } }
  #hint { font-size: max(16px, calc(var(--u) * 1.15)); font-weight: 900; color: #fff; text-shadow: 0 2px 0 var(--ink); max-width: 46vw; line-height: 1.15; }

  #grid { flex: 1 1 auto; min-height: 0; width: min(100%, 135vh); display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 10px; }
  .opt { position: relative; min-height: 0; min-width: 0; background: #fff; border: 6px solid var(--ink); border-radius: 18px; padding: 6px;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 var(--ink); }
  .opt img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; pointer-events: none; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .opt.three:last-child { grid-column: 1 / -1; justify-self: center; width: calc(50% - 5px); }
  .opt .mark { position: absolute; top: 6px; right: 6px; width: 15%; min-width: 30px; max-width: 54px; aspect-ratio: 1; display: none; }
  .opt .let { position: absolute; top: 6px; left: 6px; z-index: 2; width: 15%; min-width: 30px; max-width: 54px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: #FFC93C; color: var(--ink); border: 4px solid var(--ink); border-radius: 50%; font-weight: 900; font-size: clamp(16px, calc(var(--u) * 1.5), 34px); line-height: 1; pointer-events: none; }

.opt.ok { background: #D6F5D6; border-color: #0A7A2F; border-width: 9px; }
  .opt.no { background: #FFE0E0; border-color: #C21F1F; border-width: 9px; }
  .opt.ok .mark.good, .opt.no .mark.bad { display: block; }
  #grid.locked .opt { cursor: default; }
  #grid.locked .opt:not(.ok):not(.no) { opacity: .8; }

  #fb { flex: 0 0 auto; width: min(100%, 135vh); min-height: 64px; display: flex; align-items: center; gap: 10px; background: #fff; border: 5px solid var(--ink); border-radius: 16px; padding: 6px 8px 6px 14px; }
  #fbtxt { flex: 1; font-size: max(16px, calc(var(--u) * 1.15)); font-weight: 900; line-height: 1.15; }
  #fbtxt small { display: block; font-size: .72em; color: #0B5C56; margin-top: 2px; }
  #next { flex: 0 0 auto; border: 4px solid var(--ink); background: #FFC93C; color: var(--ink); border-radius: 12px; font-weight: 900; font-size: max(16px, calc(var(--u) * 1.1)); padding: 10px 18px; box-shadow: 0 4px 0 var(--ink); display: none; }
  #next:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

  #end { display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 16px; text-align: center; }
  #end h1 { margin: 0 0 8px; font-size: clamp(26px, calc(var(--u) * 1.4), 56px); font-weight: 900; }
  #end .big { font-size: clamp(48px, calc(var(--u) * 2.8), 110px); font-weight: 900; line-height: 1; margin: 6px 0; white-space: nowrap; }
  #end p { margin: 4px 0; font-size: clamp(16px, calc(var(--u) * 0.9), 30px); font-weight: 800; }
  #again { margin-top: 12px; border: 5px solid var(--ink); background: #FFC93C; color: var(--ink); border-radius: 14px; font-weight: 900; font-size: max(20px, calc(var(--u) * 1.4)); padding: 12px 30px; box-shadow: 0 5px 0 var(--ink); }
  body.over #game, body.over #bar { display: none; }
  body.over #end { display: flex; }

  @media (max-width: 480px) { #tr-btn .long { display: none; } #tr-btn .short { display: inline; } #tr-btn { padding: 8px 8px; } #hint { max-width: 40vw; } #hint.tm { max-width: 44vw; } #fb { min-height: 58px; } .box { min-width: 56px; padding: 2px 6px; } .tbox { min-width: 52px; padding: 2px 5px; } #hud { padding: 8px 58px 6px 58px; gap: 5px; } #home-btn, #fs-btn { width: 44px; height: 44px; } }
@media (max-height: 480px) {
  #confirm .card, #start .card, #end .card { padding: 10px 16px; border-width: 4px; }
  .big-btn { padding: 6px 8px; margin-top: 6px; font-size: 20px; border-width: 4px; }
  .big-btn small { font-size: .55em; margin-top: 0; }
  #confirm h2 { font-size: 20px; margin: 0 0 2px; }
  #confirm p { display: none; }
  #end h1 { font-size: 24px; margin: 0 0 2px; }
  #end .big { font-size: 44px; margin: 2px 0; }
  #end p { font-size: 14px; margin: 2px 0; }
  #end { gap: 6px; padding: 8px; }
}
</style>
</head>
<body>
<button id="fs-btn" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>

<button id="home-btn" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
<div id="confirm"><div class="card">
  <h2>Game menu</h2>
  <p>What would you like to do?<small class="tr">Ne yapmak istersin?</small></p>
  <button class="big-btn" id="cf-restart">Restart<small class="tr">Yeniden başlat (puanlar sıfırlanır)</small></button>
  <button class="big-btn alt" id="cf-menu">Back to the menu<small class="tr">Ana menüye dön (oyun sona erer)</small></button>
  <button class="big-btn alt" id="cf-stay">Stay in the game<small class="tr">Oyuna devam</small></button>
</div></div>
<div id="hud">
  <div class="box"><small>QUESTION</small><b id="h-q">1 / 20</b></div>
  <div class="box solo-only"><small>SCORE</small><b id="h-s">0</b></div>
  <div class="box solo-only"><small>BEST</small><b id="h-b">0</b></div>
  <div id="h-teams" class="team-only"></div>
</div>
<div id="bar"><i id="bar-i"></i></div>

<div id="game">
  <div id="hear">
    <button id="spk" aria-label="Listen"><svg viewBox="0 0 48 48" fill="none" stroke="#0B2F2C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h8l10-8v28l-10-8H6z" fill="#0B2F2C"/><path class="w" d="M30 17c3 4 3 10 0 14"/><path class="w w2" d="M36 11c6 8 6 18 0 26"/></svg></button>
    <button id="slow" aria-label="Listen slowly" title="Slow"><svg viewBox="0 0 64 48" fill="none" stroke="#0B2F2C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34c0-12 10-20 24-20s22 8 22 20z" fill="#7BD88F"/><path d="M20 34c0-8 5-14 12-14M32 34c0-8 4-14 10-14"/><path d="M54 34c3 0 8-1 8-6 0-4-3-6-6-5" fill="#7BD88F"/><circle cx="58" cy="26" r="1.2" fill="#0B2F2C"/><path d="M14 34v6M24 34v6M40 34v6M50 34v6"/></svg></button>
  <div id="hint">Listen and pick the picture.</div>
  </div>
  <div id="grid"></div>
  <div id="fb"><div id="fbtxt">Tap the speaker to listen.<small class="tr">Dinlemek için hoparlöre dokun.</small></div><button id="tr-btn" aria-label="Turkish"><span class="long">Turkish: </span><span class="short">TR: </span><span id="tr-state">On</span></button><button id="next">Next</button></div>
</div>

<div id="end"><div class="card">
  <h1 id="e-title">Well done!</h1>
  <div class="big" id="e-score">0 / 20</div>
  <p id="e-best"></p>
  <div id="e-team"></div>
  <button id="again" class="big-btn">Play again</button>
  <button id="menu" class="big-btn alt">Menu</button>
</div></div>

<div id="start"><div class="card">
  <h1>Listen &amp; Pick</h1>
  <p id="st-title"></p>
  <button class="big-btn" onclick="startGame('solo')">Solo<small id="st-solo"></small></button>
  <button class="big-btn" onclick="startGame('team')">3 Teams<small id="st-team"></small></button>
</div></div>

var Q = [{"s": "We solve problems in the Maths lesson.", "a": "maths", "o": ["maths", "science", "art", "music"], "t": "Matematik dersinde problem çözeriz."}, {"s": "Tessa cuts paper with scissors.", "a": "scissors", "o": ["scissors", "pen", "rubber", "dictionary"], "t": "Tessa kâğıdı makasla keser."}, {"s": "We do experiments in the Science lesson.", "a": "science", "o": ["science", "social_studies", "pe", "music"], "t": "Fen Bilimleri dersinde deney yaparız."}, {"s": "Carl looks up new words in the dictionary.", "a": "dictionary", "o": ["dictionary", "computer", "poster", "seat"], "t": "Carl yeni kelimelere sözlükten bakar."}, {"s": "We sing songs in the Music lesson.", "a": "music", "o": ["music", "art", "pe", "drama_masks"], "t": "Müzik dersinde şarkı söyleriz."}, {"s": "The teacher shows a video on the smart board.", "a": "smart_board", "o": ["smart_board", "poster", "door", "bookshelf"], "t": "Öğretmen akıllı tahtada bir video gösterir."}, {"s": "Please put your rubbish in the bin.", "a": "rubbish_bin", "o": ["rubbish_bin", "school_bag", "seat", "pencil_case"], "t": "Lütfen çöpünü çöp kutusuna at."}, {"s": "We paint pictures in the Art lesson.", "a": "art", "o": ["art", "maths", "music", "social_studies"], "t": "Resim dersinde resim yaparız."}, {"s": "Ron keeps his pens and pencils in a pencil case.", "a": "pencil_case", "o": ["pencil_case", "globe", "door", "bookshelf"], "t": "Ron kalemlerini kalem kutusunda tutar."}, {"s": "We run and play games in the P.E. lesson.", "a": "pe", "o": ["pe", "science", "maths", "drama_masks"], "t": "Beden Eğitimi dersinde koşar ve oyun oynarız."}, {"s": "Don't shout at your friends.", "a": "shouting", "o": ["shouting", "raise_hand", "keep_class_clean", "running_classroom"], "t": "Arkadaşlarına bağırma."}, {"s": "Holly measures her desk with a ruler.", "a": "ruler", "o": ["ruler", "scissors", "rubbish_bin", "door"], "t": "Holly sırasını cetvelle ölçer."}, {"s": "We learn about countries and maps in the Social Studies lesson.", "a": "social_studies", "o": ["social_studies", "art", "pe", "music"], "t": "Sosyal Bilgiler dersinde ülkeleri ve haritaları öğreniriz."}, {"s": "Listen to your teacher carefully.", "a": "listening_teacher", "o": ["listening_teacher", "phone_use", "running_classroom", "shouting"], "t": "Öğretmenini dikkatle dinle."}, {"s": "We act in short plays in the Drama lesson.", "a": "drama_masks", "o": ["drama_masks", "maths", "science", "art"], "t": "Drama dersinde kısa oyunlar oynarız."}, {"s": "Please keep the class clean.", "a": "keep_class_clean", "o": ["keep_class_clean", "raise_hand", "be_kind", "phone_use"], "t": "Lütfen sınıfı temiz tut."}, {"s": "The bell rings at the end of the lesson.", "a": "lesson_bell", "o": ["lesson_bell", "door", "seat", "poster"], "t": "Ders sonunda zil çalar."}, {"s": "We check the timetable to see our lessons.", "a": "timetable", "o": ["timetable", "poster", "door", "bookshelf"], "t": "Derslerimizi görmek için ders programına bakarız."}, {"s": "There are no lessons on Saturday and Sunday.", "a": "weekend", "o": ["weekend", "morning", "homework", "door"], "t": "Cumartesi ve pazar günü ders yoktur."}, {"s": "Please don't skip the lesson.", "a": "skip_the_lesson", "o": ["skip_the_lesson", "raise_hand", "be_kind", "phone_use"], "t": "Lütfen dersi asma."}];

/* ============ TEAM MODE SETTINGS (easy to change) ============ */
var TEAM_QUESTIONS = 18;   /* 18 = 6 questions per team */
var POINTS_OWN = 2;        /* correct on own turn */
var POINTS_STEAL = 1;      /* next team steals after a wrong answer */
var TEAMS = [
  { name: 'Red Team', short: 'RED', color: '#D62828' },
  { name: 'Blue Team', short: 'BLUE', color: '#1F5FBF' },
  { name: 'Green Team', short: 'GREEN', color: '#0A7A2F' }
];
var mode = 'solo', QS = Q, TOTAL = Q.length, idx = 0, score = 0, locked = false, order = [], audio = null, played = false;
var tscore = [0, 0, 0], cur = 0, phase = 'own', stealTeam = 0;
var $ = function (id) { return document.getElementById(id); };
function best() { try { return parseInt(localStorage.getItem(STORE_KEY) || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(STORE_KEY, String(v)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function qno(n) { return (n < 10 ? '0' : '') + n; }
function audioUrl(i) { return AUDIO_BASE + AUDIO_PREFIX + 'q' + qno(i + 1) + '.mp3?v=' + AUDIO_VER; }

var MARK_OK = '<svg class="mark good" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#0A7A2F" stroke="#0B2F2C" stroke-width="3"/><path d="M11 21l6 6 12-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var MARK_NO = '<svg class="mark bad" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#C21F1F" stroke="#0B2F2C" stroke-width="3"/><path d="M13 13l14 14M27 13L13 27" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>';

function hud() {
  $('h-q').textContent = Math.min(idx + 1, TOTAL) + ' / ' + TOTAL; $('bar-i').style.width = (idx / TOTAL * 100) + '%';
  if (mode === 'team') {
    var active = phase === 'steal' ? stealTeam : cur;
    TEAMS.forEach(function (t, i) { $('tb' + i + 's').textContent = tscore[i]; $('tb' + i).className = 'tbox' + (i === active && !locked ? ' cur' : ''); });
  } else { $('h-s').textContent = score; $('h-b').textContent = best(); }
}
function setHint() {
  var h = $('hint');
  if (mode === 'team') {
    var ti = phase === 'steal' ? stealTeam : cur;
    h.className = 'tm'; h.style.setProperty('--tc', TEAMS[ti].color);
    h.textContent = phase === 'steal' ? TEAMS[ti].name + ': steal!' : TEAMS[ti].name + "'s turn";
  } else { h.className = ''; h.textContent = 'Listen and pick the picture.'; }
}

function trl(q) { return q.t ? '<span class="tr trl">' + q.t + '</span>' : ''; }
var trOn = true;
try { trOn = localStorage.getItem(STORE_KEY + '_tr') !== 'off'; } catch (e) {}
function applyTr() { document.documentElement.classList.toggle('notr', !trOn); $('tr-state').textContent = trOn ? 'On' : 'Off'; }
function stopAudio() { if (audio) { try { audio.pause(); } catch (e) {} } $('spk').classList.remove('playing'); $('slow').classList.remove('playing'); }
function play(rate) {
  stopAudio();
  rate = (typeof rate === 'number') ? rate : 1;
  audio = new Audio(audioUrl(idx));
  audio.defaultPlaybackRate = rate; audio.playbackRate = rate;
  audio.preservesPitch = true; audio.webkitPreservesPitch = true;
  var btn = $(rate < 1 ? 'slow' : 'spk');
  audio.onended = function () { btn.classList.remove('playing'); };
  audio.onerror = function () { btn.classList.remove('playing'); $('fbtxt').innerHTML = 'Sound file not found.<small class="tr">Ses dosyası bulunamadı.</small>'; };
  btn.classList.add('playing');
  var p = audio.play();
  if (p && p.catch) p.catch(function () { btn.classList.remove('playing'); });
  played = true;
}

function show() {
  var q = QS[idx]; locked = false; played = false; phase = 'own'; cur = idx % 3;
  hud(); setHint();
  var g = $('grid'); g.className = ''; g.innerHTML = '';
  order = shuffle(q.o);
  order.forEach(function (k, n) {
    var b = document.createElement('button');
    b.className = 'opt' + (order.length === 3 ? ' three' : '');
    b.dataset.k = k;
    b.setAttribute('aria-label', 'picture');
    b.innerHTML = '<span class="let">' + 'ABCD'.charAt(n) + '</span><img alt="" src="' + IMG[k] + '">' + MARK_OK + MARK_NO;
    b.onclick = function () { pick(b); };
    g.appendChild(b);
  });
  $('next').style.display = 'none';
  $('fbtxt').innerHTML = 'Tap the speaker to listen.<small class="tr">Dinlemek için hoparlöre dokun.</small>';
  setTimeout(function () { play(1); }, 350);
}

function revealCorrect(q) { var all = $('grid').children; for (var i = 0; i < all.length; i++) if (all[i].dataset.k === q.a) all[i].classList.add('ok'); }
function endQuestion() {
  locked = true; $('grid').className = 'locked'; hud();
  $('next').textContent = idx === TOTAL - 1 ? 'Finish' : 'Next';
  $('next').style.display = 'block';
}
function pick(b) {
  if (locked || b.disabled) return;
  var q = QS[idx];
  if (!played) { play(1); return; }
  var ok = b.dataset.k === q.a;
  if (mode === 'solo') {
    if (ok) { score++; b.classList.add('ok'); } else { b.classList.add('no'); revealCorrect(q); }
    $('fbtxt').innerHTML = (ok ? 'Correct!' : 'Not quite.') + '<small>' + q.s + trl(q) + '</small>';
    endQuestion(); return;
  }
  if (phase === 'own') {
    if (ok) {
      tscore[cur] += POINTS_OWN; b.classList.add('ok');
      $('fbtxt').innerHTML = 'Correct! +' + POINTS_OWN + ' for ' + TEAMS[cur].name + '<small>' + q.s + trl(q) + '</small>';
      endQuestion();
    } else {
      b.classList.add('no'); b.disabled = true;
      phase = 'steal'; stealTeam = (cur + 1) % 3;
      $('fbtxt').innerHTML = 'Not quite.<small>' + TEAMS[stealTeam].name + ' can steal for ' + POINTS_STEAL + ' point. Pick again!</small>';
      setHint(); hud();
    }
  } else {
    if (ok) {
      tscore[stealTeam] += POINTS_STEAL; b.classList.add('ok');
      $('fbtxt').innerHTML = 'Steal! +' + POINTS_STEAL + ' for ' + TEAMS[stealTeam].name + '<small>' + q.s + trl(q) + '</small>';
    } else {
      b.classList.add('no'); revealCorrect(q);
      $('fbtxt').innerHTML = 'No point this time.<small>' + q.s + trl(q) + '</small>';
    }
    endQuestion();
  }
}

function finish() {
  stopAudio();
  if (mode === 'team') {
    var max = Math.max.apply(null, tscore), winners = [];
    tscore.forEach(function (s, i) { if (s === max) winners.push(i); });
    $('e-title').textContent = winners.length > 1 ? "It's a Tie!" : TEAMS[winners[0]].name + ' Wins!';
    $('e-score').style.display = 'none'; $('e-best').style.display = 'none';
    $('e-team').innerHTML = TEAMS.map(function (t, i) {
      return '<div class="estat' + (tscore[i] === max ? ' win' : '') + '" style="background:' + t.color + '"><small>' + t.short + '</small><b>' + tscore[i] + '</b></div>';
    }).join('');
    $('e-team').style.display = 'flex';
  } else {
    var b = best(); if (score > b) { saveBest(score); b = score; } hud();
    $('e-title').textContent = score >= TOTAL * 0.9 ? 'Super listening!' : score >= TOTAL * 0.6 ? 'Well done!' : 'Good try!';
    $('e-score').textContent = score + ' / ' + TOTAL; $('e-best').textContent = 'Best: ' + b + ' / ' + TOTAL;
    $('e-score').style.display = ''; $('e-best').style.display = ''; $('e-team').style.display = 'none';
  }
  document.body.classList.add('over');
}
function startGame(m) {
  mode = m; QS = (m === 'team') ? Q.slice(0, TEAM_QUESTIONS) : Q; TOTAL = QS.length;
  idx = 0; score = 0; tscore = [0, 0, 0];
  document.body.className = m === 'team' ? 'team' : 'solo';
  var box = $('h-teams'); box.innerHTML = '';
  TEAMS.forEach(function (t, i) {
    var d = document.createElement('div'); d.className = 'tbox'; d.id = 'tb' + i; d.style.background = t.color;
    d.innerHTML = '<small>' + t.short + '</small><b id="tb' + i + 's">0</b>'; box.appendChild(d);
  });
  $('start').style.display = 'none';
  show();
}
function restart() { startGame(mode); }
function toMenu() { stopAudio(); document.body.classList.remove('over'); $('start').style.display = 'flex'; }

$('spk').onclick = function () { play(1); };
$('slow').onclick = function () { play(0.75); };
$('next').onclick = function () { idx++; if (idx >= TOTAL) finish(); else show(); };
$('again').onclick = restart;
$('menu').onclick = toMenu;
$('home-btn').onclick = function () { $('confirm').classList.add('on'); };
$('cf-stay').onclick = function () { $('confirm').classList.remove('on'); };
$('cf-menu').onclick = function () { $('confirm').classList.remove('on'); toMenu(); };
$('cf-restart').onclick = function () { $('confirm').classList.remove('on'); stopAudio(); startGame(mode); };
$('tr-btn').onclick = function () { trOn = !trOn; try { localStorage.setItem(STORE_KEY + '_tr', trOn ? 'on' : 'off'); } catch (e) {} applyTr(); };
$('fs-btn').onclick = function () {
  var d = document, el = d.documentElement;
  if (d.fullscreenElement) d.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen();
};
$('st-title').textContent = UNIT_TITLE;
$('st-solo').textContent = Q.length + ' questions';
$('st-team').textContent = Math.min(TEAM_QUESTIONS, Q.length) + ' questions \u00b7 6 each \u00b7 steal rule';
document.body.className = 'solo';
applyTr();
</script>
</body>

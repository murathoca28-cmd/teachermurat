<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 5 - Games (Revs)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #f0f9ff 0%, #d4eefe 40%, #b8e4fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
        }

        .page-header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53, #FFC371);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255,255,255,0.7);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            border: 1px solid rgba(44,62,80,0.2);
        }

        .back-link:hover {
            background: #2c3e50;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Oyun Kartları Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Kart stili */
        .game-card {
            background: white;
            border-radius: 20px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 2px solid #e9f0f5;
            min-height: 130px;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-color: #f5576c;
            background: #fff5f7;
        }

        .game-card .icon {
            font-size: 40px;
        }

        .game-card .game-name {
            font-weight: 700;
            font-size: 16px;
            color: #2c3e50;
            word-break: break-word;
        }

        .game-card .play-hint {
            font-size: 12px;
            color: #7f8c8d;
            opacity: 0;
            transform: translateY(5px);
            transition: 0.3s;
        }

        .game-card:hover .play-hint {
            opacity: 1;
            transform: translateY(0);
        }

        /* Modal arka plan */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        /* Modal kutusu */
        .modal-content {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            animation: scaleIn 0.3s ease;
        }

        .modal-header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #ff9a56, #ff6a88);
            color: white;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: white;
            cursor: pointer;
            line-height: 1;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.2);
        }

        /* iframe konteyneri, oran korumalı */
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #f0f0f0;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Animasyonlar */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Mobil uyumluluk */
        @media (max-width: 600px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .game-card {
                padding: 15px 8px;
            }
            .game-card .icon {
                font-size: 32px;
            }
            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>🎲 Grade 5 – Games (Revs)</h1>
        <a href="javascript:history.back()" class="back-link">⬅ Back</a>
    </div>

    <!-- Oyun kartlarının listesi dinamik olarak buraya eklenecek -->
    <div class="games-grid" id="gamesGrid"></div>

    <!-- Modal yapısı (başlangıçta gizli) -->
    <div id="gameModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Oyun Adı</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="iframe-container">
                <!-- iframe buraya eklenecek -->
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // OYUN VERİLERİ – Her oyun için bir isim ve Wordwall embed URL'si
        // "embedUrl" değerini kendi Wordwall iframe linklerinizle değiştirin.
        // Örnek: https://wordwall.net/embed/xxxxxxxx
        // ============================================================
        const games = [
            { name: 'Colors', icon: '🎨', embedUrl: 'https://wordwall.net/embed/example1' },
            { name: 'Numbers', icon: '🔢', embedUrl: 'https://wordwall.net/embed/example2' },
            { name: 'Animals', icon: '🐶', embedUrl: 'https://wordwall.net/embed/example3' },
            { name: 'Food & Drinks', icon: '🍔', embedUrl: 'https://wordwall.net/embed/example4' },
            { name: 'Classroom Objects', icon: '📚', embedUrl: 'https://wordwall.net/embed/example5' },
            { name: 'Family Members', icon: '👨‍👩‍👧‍👦', embedUrl: 'https://wordwall.net/embed/example6' },
            { name: 'Body Parts', icon: '🦵', embedUrl: 'https://wordwall.net/embed/example7' },
            { name: 'Weather', icon: '☀️', embedUrl: 'https://wordwall.net/embed/example8' },
            { name: 'Clothes', icon: '👗', embedUrl: 'https://wordwall.net/embed/example9' },
            { name: 'Action Verbs', icon: '🏃', embedUrl: 'https://wordwall.net/embed/example10' }
        ];

        const gamesGrid = document.getElementById('gamesGrid');
        const modal = document.getElementById('gameModal');
        const modalTitle = document.getElementById('modalTitle');
        const iframeContainer = document.querySelector('.iframe-container');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Kartları oluştur
        function renderGames() {
            gamesGrid.innerHTML = '';
            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('data-index', index);
                card.innerHTML = `
                    <span class="icon">${game.icon}</span>
                    <span class="game-name">${game.name}</span>
                    <span class="play-hint">Click to play</span>
                `;
                card.addEventListener('click', () => openGameModal(game));
                gamesGrid.appendChild(card);
            });
        }

        // Modal aç ve iframe'i oluştur
        function openGameModal(game) {
            modalTitle.textContent = game.name;
            // Eski iframe varsa temizle
            iframeContainer.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = game.embedUrl;
            iframe.allow = 'autoplay; fullscreen';
            iframe.allowFullscreen = true;
            iframeContainer.appendChild(iframe);
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // arka planı kaydırmayı engelle
        }

        // Modal kapat
        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = '';
            // Kapatırken iframe'i durdurmak için src'yi sıfırlayabiliriz (performans)
            iframeContainer.innerHTML = '';
        }

        // Kapatma olayları
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            // Arka plana tıklanınca kapat
            if (e.target === modal) {
                closeModal();
            }
        });

        // Escape tuşu ile kapat
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });

        // Sayfa yüklendiğinde kartları göster
        renderGames();
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 5 - Games (Revs)</title>
    <style>
    
            :root {
            --theme-coral: #ff6a88;
            --theme-soft: #ffe8e0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #f0f9ff 0%, #d4eefe 40%, #b8e4fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 70px;
            width: 100%;
            max-width: 900px;
        }

        .page-header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53, #FFC371);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255,255,255,0.7);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            border: 1px solid rgba(44,62,80,0.2);
        }

        .back-link:hover {
            background: #2c3e50;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Oyun Kartları Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 40px auto 0 auto; /* üstte 40px boşluk, yatayda ortala */
        }

        /* Kart stili */
        .game-card {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--theme-soft);
     }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
             border-color: var(--theme-coral);
        }

        /* Thumbnail konteyneri */
        .card-thumb {
            width: 100%;
            aspect-ratio: 4/3; /* Wordwall küçük resim oranına yakın */
            background: linear-gradient(135deg, #fdf6ec, #ffe8e0);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Resim yoksa yedek simge */
        .card-thumb .fallback-icon {
            font-size: 48px;
            position: absolute;
            opacity: 0.3;
            color: var(--theme-coral);
        }

        .card-info {
            padding: 12px 10px;
            text-align: center;
            background: var(--theme-soft);
        }

        .game-name {
            font-weight: 700;
            font-size: 16px;
            color: #2c3e50;
            word-break: break-word;
        }

        .play-hint {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            color: #7f8c8d;
            opacity: 0;
            transform: translateY(5px);
            transition: 0.3s;
        }

        .game-card:hover .play-hint {
            opacity: 1;
            transform: translateY(0);
        }

        /* Modal arka plan */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        /* Modal kutusu */
        .modal-content {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            animation: scaleIn 0.3s ease;
        }

        .modal-header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #ff9a56, #ff6a88);
            color: white;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: white;
            cursor: pointer;
            line-height: 1;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.2);
        }

        /* iframe konteyneri, oran korumalı */
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #f0f0f0;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Animasyonlar */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Mobil uyumluluk */
        @media (max-width: 600px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .modal-content {
                width: 95%;
            }
        }
    </style>
    <link rel="stylesheet" href="../../../theme.css">
</head>
<body>
    
    <div id="navbar-placeholder" style="min-height: 64px;"></div>
    <script src="../../../navbar.js"></script
    
    <div class="page-header">
        <h1>🎲 Grade 5 – REV 1/2 Games</h1>
        <a href="javascript:history.back()" class="back-link">⬅ Back</a>
    </div>

    <!-- Oyun kartlarının listesi dinamik olarak buraya eklenecek -->
    <div class="games-grid" id="gamesGrid"></div>

    <!-- Modal yapısı -->
    <div id="gameModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Oyun Adı</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="iframe-container">
                <!-- iframe buraya eklenecek -->
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // OYUN VERİLERİ – Kendi Wordwall bilgilerinizle doldurun
        // thumbnailUrl: Wordwall'un verdiği <img src="..."> kısmı
        // embedUrl:     Wordwall'un verdiği <iframe src="..."> kısmı (tam URL)
        // ============================================================
        const games = [
            {
                name: 'Find Objects',
                thumbnailUrl: 'https://screens.cdn.wordwall.net/400/052e1f399e1a4f539800ae458ca072d5_2',
                embedUrl: 'https://wordwall.net/tr/embed/052e1f399e1a4f539800ae458ca072d5?themeId=2&templateId=10&fontStackId=0'
            },
            {
                name: 'Matching',
                thumbnailUrl: 'https://screens.cdn.wordwall.net/400/3606ddd7b2394c9b8f5ad305c063f0c1_1',  // kendi linkiniz
                embedUrl: 'https://wordwall.net/tr/embed/3606ddd7b2394c9b8f5ad305c063f0c1?themeId=1&templateId=3&fontStackId=0'
            },
            {
                name: 'Numbers',
                thumbnailUrl: 'https://screens.cdn.wordwall.net/200/xxxxxxxxxxxxxx',
                embedUrl: 'https://wordwall.net/tr/embed/xxxxxxxxxxxxxxxx'
            },
            // ... diğer 7 oyunu aynı şekilde ekleyin (toplam 10)
        ];

        const gamesGrid = document.getElementById('gamesGrid');
        const modal = document.getElementById('gameModal');
        const modalTitle = document.getElementById('modalTitle');
        const iframeContainer = document.querySelector('.iframe-container');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Kartları oluştur
        function renderGames() {
            gamesGrid.innerHTML = '';
            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('data-index', index);

                // Thumbnail kısmı
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'card-thumb';

                const img = document.createElement('img');
                img.src = game.thumbnailUrl;
                img.alt = game.name;
                img.loading = 'lazy';
                // Resim yüklenemezse fallback göster
                img.onerror = function() {
                    // Resim kırılırsa yedek bir simge koy
                    thumbDiv.innerHTML = '<span class="fallback-icon">🎲</span>';
                };

                thumbDiv.appendChild(img);

                // Bilgi kısmı
                const infoDiv = document.createElement('div');
                infoDiv.className = 'card-info';
                infoDiv.innerHTML = `
                    <div class="game-name">${game.name}</div>
                    <div class="play-hint">Click to play</div>
                `;

                card.appendChild(thumbDiv);
                card.appendChild(infoDiv);

                card.addEventListener('click', () => openGameModal(game));
                gamesGrid.appendChild(card);
            });
        }

        // Modal aç ve iframe'i oluştur
        function openGameModal(game) {
            modalTitle.textContent = game.name;
            // Eski iframe varsa temizle
            iframeContainer.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = game.embedUrl;
            iframe.allow = 'autoplay; fullscreen';
            iframe.allowFullscreen = true;
            iframeContainer.appendChild(iframe);
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // Modal kapat
        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = '';
            iframeContainer.innerHTML = ''; // iframe'i durdur
        }

        // Kapatma olayları
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Escape tuşu ile kapat
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });

        // Sayfa yüklendiğinde kartları göster
        renderGames();
    </script>
</body>
</html>

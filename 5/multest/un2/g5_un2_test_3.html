  <style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#74ebd5,#9face6);color:#1f2937;padding:10px 12px 10px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
body.zoom,body.zoom.fsmode{padding:6px 8px}
body.zoom #navbar-placeholder,body.fsmode #navbar-placeholder{display:none}
#navbar-placeholder{flex:none}
button{font:inherit;cursor:pointer}
.hide{display:none !important}
#splash{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#fff;background:linear-gradient(135deg,#075C69,#0E8A9B 55%,#14A89A)}
#splash h1{text-transform:uppercase;font-size:clamp(28px,6vw,56px);font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.25)}
#splash p{text-transform:uppercase;font-weight:700;max-width:460px;font-size:clamp(14px,2.4vw,20px);opacity:.92}
.start{width:140px;height:140px;border:0;border-bottom:8px solid #0A2A33;border-radius:28px;background:#FFC21A;color:#1A1200;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.3);transition:transform .15s}
.start:hover{transform:scale(1.05)}
.start:active{transform:scale(.96)}
.start span:first-child{font-size:52px;line-height:1}
.start span:last-child{font-size:20px;font-weight:900;margin-top:4px}
.fab{position:fixed;bottom:10px;width:42px;height:42px;border-radius:50%;border:2px solid #bfdbfe;background:rgba(255,255,255,.92);color:#1e3a8a;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#menuBtn{left:10px;z-index:60;background:#171717;border-color:#525252;color:#fff;font-size:20px}
#menu{position:fixed;inset:0;z-index:70}
#menu div{position:absolute;bottom:60px;left:10px;width:240px;background:#171717;color:#fff;border-radius:12px;border:2px solid #525252;padding:10px}
#menu small{display:block;color:#a3a3a3;font-weight:900;letter-spacing:.1em;padding-bottom:6px;margin-bottom:6px;border-bottom:2px solid #000}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;font-weight:900;font-size:17px;padding:8px 10px;border-radius:8px}
#menu button:hover{background:#404040}
.wrap{width:100%;max-width:2200px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;font-size:var(--fs,18px)}
.top{flex:none;background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:18px;padding:6px 14px;box-shadow:0 8px 20px rgba(0,0,0,.12);display:flex;align-items:center;gap:12px;font-weight:900;color:#6b21a8;font-size:16px}
.bar{flex:1;height:12px;background:#e9d5ff;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#a855f7,#ec4899);transition:width .3s}
.zbtn{border:0;border-bottom:4px solid #6d28d9;border-radius:12px;background:#8b5cf6;color:#fff;font-weight:900;font-size:clamp(15px,1.7vmin,30px);padding:.3em .9em;white-space:nowrap}
.fbtn{background:#0ea5e9;border-bottom-color:#0369a1}
.fbtn.on{background:#f59e0b;border-bottom-color:#b45309}
.top .zbtn{margin-left:6px}
.top span{white-space:nowrap}
.top .bar{min-width:24px}
@media (max-width:520px){.top .zbtn{font-size:12.5px;padding:5px 8px;margin-left:4px}
.top{gap:6px}
}
.start2{margin-top:12px;border:0;border-bottom:4px solid #0369a1;border-radius:14px;background:#0ea5e9;color:#fff;font-weight:900;font-size:1.1rem;padding:10px 22px;cursor:pointer}
.zbtn.on{background:#f59e0b;border-color:#b45309}
.card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:6px solid #60a5fa;border-radius:24px;padding:.7em .9em;box-shadow:0 12px 30px rgba(0,0,0,.2);overflow:hidden}
body.zoom .intro{font-size:.75em}
body.zoom .card{border-width:4px;border-radius:18px;padding:.5em .7em}
.intro{flex:none;font-weight:900;color:#1e40af;font-size:1em;margin-bottom:.5em;line-height:1.25}
.n{display:inline-block;background:#7e22ce;color:#fff;border-radius:.5em;padding:0 .5em;margin-right:.4em}
.cols{flex:1;min-height:0;display:grid;gap:.8em;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
body.zoom .cols{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media (max-aspect-ratio:1/1){.cols,body.zoom .cols{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
}
.picbox{position:relative;min-height:0;min-width:0;background:#eff6ff;border:2px solid #bfdbfe;border-radius:14px;overflow:hidden}
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px}
.txt{min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.qt{font-weight:900;font-size:1.15em;margin-bottom:.6em;line-height:1.25}
.opts{display:grid;gap:.45em}
.opt{text-align:left;padding:.45em .75em;border:3px solid #93c5fd;border-bottom-width:6px;border-radius:16px;background:#fff;font-weight:800;font-size:1em;line-height:1.2;color:#1e3a8a;transition:transform .12s}
.opt:hover{transform:translateY(-2px)}
.opt.sel{background:#fde047;border-color:#f59e0b}
.opts.lo{grid-template-columns:repeat(2,1fr)}
.lo .opt{text-align:center;font-size:1.5em}
.nav{flex:none;padding:0 54px 0 54px;display:flex;justify-content:space-between;gap:10px}
.btn{border:0;border-bottom:5px solid #0284c7;border-radius:16px;background:linear-gradient(#4facfe,#00f2fe);color:#fff;font-weight:900;font-size:18px;padding:8px 22px;text-shadow:1px 1px 2px rgba(0,0,0,.3)}
a.btn{display:inline-block;text-decoration:none}
.btn.g{background:linear-gradient(#4ade80,#16a34a);border-color:#166534}
.btn:disabled{background:#cbd5e1;border-color:#94a3b8;cursor:default}
.wrap.resmode{overflow:hidden}
.res{text-align:center;gap:.45em}
.rhead{flex:none;display:flex;align-items:center;justify-content:center;gap:.3em 1em;flex-wrap:wrap}
.res h2{font-size:1.7em;font-weight:900;color:#7e22ce;line-height:1.1}
.big{font-size:2.3em;font-weight:900;color:#1e3a8a;line-height:1}
.cnt{font-weight:800}
.rbtns{display:flex;gap:.6em}
.res .btn{font-size:.85em;padding:.3em .9em}
.hint{flex:none;font-weight:800;color:#475569;font-size:.9em}
.rgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:.5em}
@media (max-aspect-ratio:1/1){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;gap:0;border:5px solid;border-radius:16px;background:#fff;font-weight:900;padding:0;overflow:hidden;min-height:0;line-height:1.1;font-size:1em;text-align:center;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .th{flex:none;display:flex;align-items:center;justify-content:center;gap:.45em;padding:.12em .3em;color:#fff}
.tile .tn{font-size:1.6em;font-weight:900;line-height:1}
.tile .ti{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:#fff;font-size:1.1em;line-height:1}
.tile .tb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.15em;padding:.15em .3em;color:#0f172a}
.tile .ra{display:flex;align-items:center;justify-content:center;gap:.4em}
.tile .ra i{font-style:normal;font-size:1em;font-weight:800;min-width:3.2em;text-align:right}
.tile .ra b{font-size:1.7em;line-height:1;min-width:1.4em;border:3px solid;border-radius:.3em;padding:.02em .1em;background:#fff}
.tile .ra b.mine{color:#b91c1c;border-color:#b91c1c}
.tile .ra b.rt{color:#fff;background:#15803d;border-color:#15803d}
.tile .tok{font-size:1.5em;color:#14532d}
.tile .tgo{flex:none;background:#1e293b;color:#fff;font-size:.9em;padding:.25em .3em}
.tile.ok{border-color:#15803d}
.tile.ok .th{background:#15803d}
.tile.no{border-color:#dc2626}
.tile.no .th{background:#dc2626}
.tile.bl{border-color:#475569}
.tile.bl .th{background:#475569}
@media (max-aspect-ratio:1/1){.tile .th{padding:.05em .2em}.tile .tn{font-size:1.3em}.tile .ra b{font-size:1.35em;border-width:2px}.tile .ra i{min-width:2.6em}.tile .tb{gap:.05em;padding:.05em .2em}.tile .tgo{font-size:.8em;padding:.15em .2em}}
.opt.right{background:#bbf7d0;border-color:#16a34a;color:#14532d}
.opt.wrong{background:#fecaca;border-color:#dc2626;color:#7f1d1d}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.opt:disabled:hover{transform:none}
.st{white-space:nowrap}
.st.okk{color:#15803d}
.st.nok{color:#b91c1c}
.xbtn{margin-top:.6em;align-self:flex-start;font-size:.8em}
.exp{margin-top:.5em;padding:.45em .7em;border:3px solid #f59e0b;background:#fffbeb;border-radius:14px;font-weight:700;font-size:.85em;line-height:1.3}
#splash .steps{text-align:left;display:inline-block;margin:14px 0 0;padding-left:1.4em;line-height:1.7;color:#fff;font-weight:700}
  </style>

<body>
  <div id="navbar-placeholder" style="min-height: 64px;"></div>
  <script src="/navbar.js"></script>

  <div id="splash">
    <p>5th Class</p>
    <h1 lang="en">5th Class – Unit 2 Test 3</h1>
    <button class="start" onclick="begin()"><span>▶</span><span>BAŞLAT</span></button>
    <ol class="steps">
  <li>Soruları sırayla oku.</li>
  <li>Doğru şıkkı işaretle.</li>
  <li>Cevaplar en sonda açılır!</li>
  <li>BAŞLAT tam ekranda ve büyütülmüş açılır.</li>
</ol>
  </div>
  <button class="fab hide" id="menuBtn" onclick="menu(1)" title="Menü">☰</button>
  <div id="menu" class="hide" onclick="menu(0)">
    <div onclick="event.stopPropagation()"><small>UNIT 2 TEST 3</small><button onclick="restart()">Yeniden başlat</button></div>
  </div>
  <main class="wrap hide" id="game"></main>
  <script>
    const Q = [{"t": "Look at the timetable of Class 5-F on Thursday.", "c": "5-F sınıfının perşembe ders programı: saat ve ders", "q": "According to the timetable above, which lesson starts at twenty-five past one?", "o": ["Music", "Science", "Art", "P.E."], "a": 2, "w": "13:25 = “twenty-five past one” (Art). Tuzak: 14:15 “quarter past two” (P.E.) ve 13:35 “twenty-five to two” ile karıştırma; “past” saatin üzerinden geçen dakikayı gösterir."}, {"t": "Read the plan of Sinan's school day.", "c": "Sinan'ın okul gününün saatli planı", "q": "According to the plan above, how many lessons does Sinan have before break time?", "o": ["one lesson", "two lessons", "three lessons", "four lessons"], "a": 1, "w": "Teneffüsten (10:10) önce Maths (08:30) ve English (09:20) var = iki ders. Art teneffüsten sonra; 08:15 ders değil, okula varış saati."}, {"t": "Read the message Ms Aksoy sent to her class.", "c": "Ms Aksoy'un sanat dersinin yerini ve saatini bildiren mesajı", "q": "Which of the following information is <u>NOT</u> in the message above?", "o": ["the time of the lesson", "the place of the lesson", "the things to bring", "the topic of the drawing"], "a": 3, "w": "Mesajda saat (quarter to eleven), yer (school garden) ve getirilecekler (coloured pencils, paper) var; resmin konusu verilmemiş."}, {"t": "Read Tuğba's text about her school day.", "c": "Tuğba'nın okul günü hakkındaki yazısı", "q": "Which of the following questions can <u>NOT</u> be answered by using Tuğba's text?", "o": ["What time does school finish?", "When do they have lunch?", "Who is their Maths teacher?", "Which lessons do they have after lunch?"], "a": 2, "w": "Metin okulun bitiş saatini, öğle yemeği saatini ve öğleden sonraki dersleri veriyor; Maths öğretmeninin adı yok."}, {"t": "Tarık has put these things in his bag for Wednesday. Look at the pictures.", "c": "Matematik takımı, bilim malzemeleri ve dünya küresi görselleri", "q": "According to the pictures above, which lessons does Tarık have on Wednesday?", "o": ["Maths, Science and Social Studies", "Maths, Art and Science", "Music, Science and Social Studies", "Maths, P.E. and Social Studies"], "a": 0, "w": "Cetvel-pergel-hesap makinesi = Maths, mikroskop ve deney şişesi = Science, küre = Social Studies. Diğer şıklarda Art, Music ya da P.E. var; resimlerde bunlara ait eşya yok."}, {"t": "Class 5-F has a duty plan. Look at the table.", "c": "5-F sınıfının tahta silme ve pencere açma nöbet çizelgesi", "q": "It is Wednesday. The board is dirty and the windows are closed. Which two students should help the teacher?", "o": ["Cenk and Fidan", "Halil and Kübra", "Gizem and Hakan", "Gizem and Fidan"], "a": 2, "w": "Çarşamba (Wed): tahtayı silen Gizem, pencereyi açan Hakan. Cenk–Fidan pazartesi, Halil–Kübra cuma görevlisi; Gizem–Fidan iki farklı günün karışımı."}, {"t": "Eren is making word groups.", "c": "Eren'in defterine ders adı yazdığı bilgi", "q": "Which of the following words does <u>NOT</u> belong to Eren's list?", "o": ["English", "Tuesday", "Science", "P.E."], "a": 1, "w": "Maths, Art, Music, English, Science ve P.E. ders adıdır; Tuesday bir gündür, derse ait değildir."}, {"t": "Read about Poyraz.", "c": "Poyraz'ın ders saatinde okul bahçesinde olduğunu anlatan bilgi", "q": "Which of the following should the teacher say to Poyraz?", "o": ["Raise your hand to speak, please.", "Don't run in the classroom, please.", "Don't shout at your friends, please.", "Don't skip the lesson, please."], "a": 3, "w": "Poyraz ders saatinde sınıfta değil, bahçede → dersi asmamalı: “Don't skip the lesson.” Diğer kurallar (el kaldır, koşma, bağırma) bu durumla ilgili değil."}, {"t": "Irmak talks to Levent in the classroom. Read the conversation.", "c": "Irmak'ın kendini iyi hissetmediğini söylediği konuşma", "q": "Which of the following completes the conversation above?", "o": ["Oh dear! Let's tell the teacher.", "Great! I'm happy for you.", "Sure. I can lend you my pen.", "It starts at half past nine."], "a": 0, "w": "“I don't feel all right” = kendimi iyi hissetmiyorum. Uygun tepki üzülmek ve yardım etmek: “Oh dear! Let's tell the teacher.” Diğer şıklar duruma uymuyor."}, {"t": "Duru is talking about her English lesson.", "c": "Duru'nun İngilizce dersinin saatini söylediği cümle", "q": "Which of the following shows the time of Duru's English lesson?", "o": ["09:35", "08:35", "08:25", "09:25"], "a": 1, "w": "“Twenty-five to nine” = dokuza 25 var = 08:35. Tuzaklar: 08:25 (twenty-five past eight) ve 09:35 (to/past ve saat karışıklığı)."}];
    const IMG = ["img/g5_un2_test_3_q01.webp", "img/g5_un2_test_3_q02.webp", "img/g5_un2_test_3_q03.webp", "img/g5_un2_test_3_q04.webp", "img/g5_un2_test_3_q05.webp", "img/g5_un2_test_3_q06.webp", "img/g5_un2_test_3_q07.webp", "img/g5_un2_test_3_q08.webp", "img/g5_un2_test_3_q09.webp", "img/g5_un2_test_3_q10.webp"];
    /* Tüm soru görsellerini sayfa açılır açılmaz arka planda indirir; "Sonraki" denince hazır bekler */
    const PRE = IMG.map(src => { const im = new Image(); im.decoding = "async"; im.src = src; return im });
    const LO = []; // sadece harf şıkkı olan sorular (şıklar görselin içinde)
    const L = "ABCD", $ = s => document.getElementById(s), strip = h => h.replace(/<[^>]+>/g, ""), alt = d => d.c.replace(/"/g, "&quot;");
    let i = 0, sel = [], zoom = false, rv = false;

    function begin() { if (!isFs()) { try { fullscr() } catch (e) { } } setZoom(true); $("splash").classList.add("hide"); $("menuBtn").classList.remove("hide"); restart() }
    function restart() { sel = Array(Q.length).fill(null); i = 0; menu(0); $("game").classList.remove("hide"); render() }
    function menu(f) { $("menu").classList.toggle("hide", !f) }
    function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement) }
    function fullscr() { const d = document, e = d.documentElement; if (isFs()) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (e.requestFullscreen || e.webkitRequestFullscreen).call(e) }
    function setZoom(v) { zoom = v; document.body.classList.toggle("zoom", zoom) }
    function classMode() { if (isFs() && zoom) { setZoom(false); (document.exitFullscreen || document.webkitExitFullscreen).call(document) } else { if (!isFs()) fullscr(); setZoom(true) } const b = $("fb"); fsLabel(); const z = $("zb"); if (z) { z.classList.toggle("on", zoom); z.textContent = zoom ? "🔍 Küçült" : "🔍 Soruyu büyüt" } fit() }
    function toggleZoom() { zoom = !zoom; document.body.classList.toggle("zoom", zoom); const b = $("zb"); if (b) { b.classList.toggle("on", zoom); b.textContent = zoom ? "🔍 Küçült" : "🔍 Soruyu büyüt" } fit() }

    /* Yazıyı, mevcut ekrana kaydırma gerekmeden sığacak en büyük boyuta ayarlar */
    function fit() {
      const w = $("game"); if (!w || w.classList.contains("hide")) return; if (w.classList.contains("resmode")) return fitRes();
      const txt = w.querySelector(".txt"), card = w.querySelector(".card"); if (!txt) return;
      const vmin = Math.min(innerWidth, innerHeight);
      const max = Math.max(16, Math.min(zoom ? vmin * 0.075 : vmin * 0.04, zoom ? 90 : 40)), min = 10;
      let fs = max;
      const pic = w.querySelector('.picbox'), stacked = matchMedia('(max-aspect-ratio: 1/1)').matches;
      const over = () => (stacked && pic.clientHeight < card.clientHeight * 0.5) || txt.scrollHeight > txt.clientHeight + 1 || txt.scrollWidth > txt.clientWidth + 1 || w.scrollHeight > w.clientHeight + 1 || card.scrollHeight > card.clientHeight + 1 || document.documentElement.scrollHeight > innerHeight + 1;
      w.style.setProperty("--fs", fs + "px");
      while (fs > min && over()) { fs -= 0.5; w.style.setProperty("--fs", fs + "px") }
    }

    function render() {
      const d = Q[i], lo = LO.includes(i), last = i == Q.length - 1; rv = false;
      const w = $("game"); w.classList.remove("resmode");
      w.innerHTML = `<div class="top"><span>Soru ${i + 1} / ${Q.length}</span><div class="bar"><i style="width:${(i + 1) / Q.length * 100}%"></i></div><button id="fb" class="zbtn fbtn${isFs() ? " on" : ""}" onclick="classMode()">${isFs() ? "⛶ Tam Ekrandan Çık" : "⛶ Tam Ekran"}</button></div>
  <div class="card"><p class="intro"><span class="n">${i + 1}</span>${d.t}</p><div class="cols"><div class="picbox"><img class="pic" src="${IMG[i]}" alt="${alt(d)}"></div>
  <div class="txt"><p class="qt">${d.q}</p><div class="opts${lo ? " lo" : ""}">${d.o.map((t, j) => `<button class="opt${sel[i] === j ? " sel" : ""}" aria-label="${L[j]}) ${strip(t)}" onclick="pick(${j})"><b>${L[j]})</b>${lo ? "" : " " + t}</button>`).join("")}</div></div></div></div>
  <div class="nav"><button class="btn" onclick="go(-1)" ${i ? "" : "disabled"}>◀ Önceki</button><button class="btn${last ? " g" : ""}" onclick="go(1)">${last ? "Bitir ✔" : "Sonraki ▶"}</button></div>`;
      window.scrollTo(0, 0);
      fit();
    }
    function pick(j) { sel[i] = sel[i] === j ? null : j; document.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("sel", k === sel[i])) }
    function go(n) { if (i + n >= Q.length) finish(); else { i += n; render() } }
    function bad() { return Q.map((d, k) => k).filter(k => sel[k] !== Q[k].a) }
    function wrongNav(k) {
      const B = bad(); if (!B.length || (B.length === 1 && B[0] === k)) return null;
      if (B.includes(k)) { const x = B.indexOf(k); return [B[(x - 1 + B.length) % B.length], B[(x + 1) % B.length]] }
      const nx = B.find(v => v > k), pv = [...B].reverse().find(v => v < k);
      return [pv === undefined ? B[B.length - 1] : pv, nx === undefined ? B[0] : nx];
    }
    function finish() {
      rv = false;
      const ok = Q.filter((d, k) => sel[k] === d.a).length, b = sel.filter(s => s === null).length, nb = bad().length;
      const w = $("game"); w.classList.add("resmode");
      w.innerHTML = `<div class="card res"><div class="rhead"><h2>🏆 Test bitti!</h2><div class="big">${ok} / ${Q.length}</div><p class="cnt"><b>${ok}</b> doğru • <b>${Q.length - ok - b}</b> yanlış • <b>${b}</b> boş</p><div class="rbtns"><button class="btn g" onclick="restart()">🔄 Yeniden Başlat</button><a class="btn" href="https://cdn.teachermurat.com/5/un2_lgstests/g5_un2_test_3.pdf?v=1" download>📄 Testi indir (PDF)</a></div></div>
  <p class="hint">${nb ? "👆 Yanlış ve boş soruların üzerine tıkla: soruya dön, doğru cevabı ve açıklamayı gör." : "🎉 Hepsi doğru, tebrikler! İstersen herhangi bir soruya tıklayıp tekrar bakabilirsin."}</p>
  <div class="rgrid">${Q.map((d, k) => { const s = sel[k], c = s === d.a; return `<button class="tile ${s === null ? "bl" : c ? "ok" : "no"}" onclick="review(${k})" aria-label="Soru ${k + 1}"><span class="th"><span class="tn">${k + 1}</span><span class="ti">${c ? "✅" : s === null ? "➖" : "❌"}</span></span><span class="tb">${c ? "<span class=\"tok\">Doğru</span>" : "<span class=\"ra\"><i>Senin</i><b class=\"mine\">" + (s === null ? "–" : L[s]) + "</b></span><span class=\"ra\"><i>Doğru</i><b class=\"rt\">" + L[d.a] + "</b></span>"}</span>${c ? "" : "<span class=\"tgo\">🔍 Soruya dön</span>"}</button>` }).join("")}</div></div>`;
      window.scrollTo(0, 0); fitRes();
    }
    function fitRes() {
      const w = $("game"), card = w.querySelector(".card"); if (!card) return;
      const vmin = Math.min(innerWidth, innerHeight); let fs = Math.max(14, Math.min(vmin * 0.04, 36));
      const over = () => card.scrollHeight > card.clientHeight + 1 || document.documentElement.scrollHeight > innerHeight + 1 || [...w.querySelectorAll(".tile")].some(t => t.scrollHeight > t.clientHeight + 1 || t.scrollWidth > t.clientWidth + 1);
      w.style.setProperty("--fs", fs + "px");
      while (fs > 9 && over()) { fs -= 0.5; w.style.setProperty("--fs", fs + "px") }
    }
    function review(k) {
      rv = true; i = k;
      const d = Q[k], lo = LO.includes(k), s = sel[k], c = s === d.a, w = $("game"), nv = wrongNav(k);
      w.classList.remove("resmode");
      const st = c ? "✅ Doğru cevapladın" : s === null ? "⬜ Bu soruyu boş bıraktın" : "❌ Senin cevabın: " + L[s];
      const cls = j => j === d.a ? "right" : j === s ? "wrong" : "dim";
      const dis = nv ? "" : "disabled";
      w.innerHTML = `<div class="top"><span>Soru ${k + 1} / ${Q.length}</span><span class="st ${c ? "okk" : "nok"}">${st}</span><span style="flex:1"></span><button id="fb" class="zbtn fbtn${isFs() ? " on" : ""}" onclick="classMode()">${isFs() ? "⛶ Tam Ekrandan Çık" : "⛶ Tam Ekran"}</button></div>
  <div class="card"><p class="intro"><span class="n">${k + 1}</span>${d.t}</p><div class="cols"><div class="picbox"><img class="pic" src="${IMG[k]}" alt="${alt(d)}"></div>
  <div class="txt"><p class="qt">${d.q}</p><div class="opts${lo ? " lo" : ""}">${d.o.map((t, j) => `<button class="opt ${cls(j)}" disabled aria-label="${L[j]}) ${strip(t)}"><b>${L[j]})</b>${lo ? "" : " " + t}</button>`).join("")}</div>
  <button id="xb" class="zbtn xbtn" onclick="toggleExp()">💡 Açıklamayı göster</button><div id="exp" class="exp hide">${d.w}</div></div></div></div>
  <div class="nav"><button class="btn" onclick="review(${nv ? nv[0] : k})" ${dis}>◀ Önceki yanlış</button><button class="btn g" onclick="finish()">📋 Sonuçlara dön</button><button class="btn" onclick="review(${nv ? nv[1] : k})" ${dis}>Sonraki yanlış ▶</button></div>`;
      window.scrollTo(0, 0); fit();
    }
    function toggleExp() { const e = $("exp"); e.classList.toggle("hide"); $("xb").textContent = e.classList.contains("hide") ? "💡 Açıklamayı göster" : "🙈 Açıklamayı gizle"; fit() }

    function fsLabel() { const b = $("fb"); if (b) { b.classList.toggle("on", isFs()); b.textContent = isFs() ? "⛶ Tam Ekrandan Çık" : "⛶ Tam Ekran" } }
    /* tam ekran / yeniden boyutlama / yazı tipi yüklenmesi sonrası yeniden sığdir */
    document.addEventListener("fullscreenchange", () => { document.body.classList.toggle("fsmode", isFs()); if (!isFs() && zoom) setZoom(false); fsLabel(); setTimeout(fit, 60) });
    document.addEventListener("webkitfullscreenchange", () => { document.body.classList.toggle("fsmode", isFs()); if (!isFs() && zoom) setZoom(false); fsLabel(); setTimeout(fit, 60) });
    addEventListener("resize", () => requestAnimationFrame(fit));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit());

    /* klavye kısayolları: ← → gezinme, A-D şık, Z büyüt, F tam ekran */
    addEventListener("keydown", e => {
      if ($("game").classList.contains("hide") || $("game").classList.contains("resmode")) return;
      const k = e.key.toLowerCase();
      if (rv) { if (k === "escape" || k === "backspace") finish(); else if (k === "e") toggleExp(); else if (k === "arrowright" || k === "arrowleft") { const nv = wrongNav(i); if (nv) review(k === "arrowright" ? nv[1] : nv[0]) } return }
      if (k === "arrowright") go(1); else if (k === "arrowleft") { if (i) go(-1) }
      else if ("abcd".includes(k) && k.length === 1) { if (Q[i].o[L.toLowerCase().indexOf(k)] !== undefined) pick(L.toLowerCase().indexOf(k)) }
      else if (k === "z") toggleZoom(); else if (k === "f") fullscr();
    });
  </script>
<script src="/pdf-download.js"></script>
<script src="/back.js"></script>
</body>

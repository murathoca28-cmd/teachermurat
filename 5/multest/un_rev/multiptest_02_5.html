<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grade 5 – Revision Test 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      min-height: 100vh;
      color: #1f2937;
      padding: 14px 12px 70px
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .hide {
      display: none !important
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #4338ca, #7e22ce, #db2777)
    }

    #splash h1 {
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 900;
      text-shadow: 0 3px 8px rgba(0, 0, 0, .25)
    }

    #splash p {
      font-weight: 700;
      max-width: 460px;
      font-size: clamp(14px, 2.4vw, 20px);
      opacity: .92
    }

    .start {
      width: 140px;
      height: 140px;
      border: 0;
      border-bottom: 8px solid #0284c7;
      border-radius: 28px;
      background: #38bdf8;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .3);
      transition: transform .15s
    }

    .start:hover {
      transform: scale(1.05)
    }

    .start:active {
      transform: scale(.96)
    }

    .start span:first-child {
      font-size: 52px;
      line-height: 1
    }

    .start span:last-child {
      font-size: 20px;
      font-weight: 900;
      margin-top: 4px
    }

    .fab {
      position: fixed;
      bottom: 10px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #bfdbfe;
      background: rgba(255, 255, 255, .92);
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2)
    }

    #fs {
      right: 10px;
      z-index: 50
    }

    #menuBtn {
      left: 10px;
      z-index: 60;
      background: #171717;
      border-color: #525252;
      color: #fff;
      font-size: 20px
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 70
    }

    #menu div {
      position: absolute;
      bottom: 60px;
      left: 10px;
      width: 220px;
      background: #171717;
      color: #fff;
      border-radius: 12px;
      border: 2px solid #525252;
      padding: 10px
    }

    #menu small {
      display: block;
      color: #a3a3a3;
      font-weight: 900;
      letter-spacing: .1em;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 2px solid #000
    }

    #menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      color: #fff;
      font-weight: 900;
      font-size: 17px;
      padding: 8px 10px;
      border-radius: 8px
    }

    #menu button:hover {
      background: #404040
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto
    }

    .top {
      background: rgba(255, 255, 255, .9);
      border: 4px solid #fff;
      border-radius: 20px;
      padding: 10px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .12);
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 900;
      color: #6b21a8
    }

    .bar {
      flex: 1;
      height: 12px;
      background: #e9d5ff;
      border-radius: 99px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      transition: width .3s
    }

    .card {
      margin-top: 12px;
      background: #fff;
      border: 6px solid #60a5fa;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .2)
    }

    .intro {
      font-weight: 900;
      color: #1e40af;
      font-size: clamp(15px, 2.4vw, 19px);
      margin-bottom: 10px
    }

    .n {
      display: inline-block;
      background: #7e22ce;
      color: #fff;
      border-radius: 10px;
      padding: 0 10px;
      margin-right: 8px
    }

    .cols {
      display: grid;
      gap: 14px
    }

    @media(min-width:760px) {
      .cols {
        grid-template-columns: 1fr 1fr;
        align-items: start
      }
    }

    .ctx {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 15px
    }

    .ctx p {
      margin: 3px 0
    }

    .ctx table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px
    }

    .ctx th,
    .ctx td {
      border: 1px solid #93c5fd;
      padding: 4px 6px;
      text-align: left
    }

    .pic {
      display: block;
      max-width: 100%;
      max-height: max(240px, calc(100vh - 240px));
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 12px
    }

    .qt {
      font-weight: 900;
      font-size: clamp(16px, 2.6vw, 21px);
      margin-bottom: 10px
    }

    .opts {
      display: grid;
      gap: 8px
    }

    .opt {
      text-align: left;
      padding: 10px 14px;
      border: 3px solid #93c5fd;
      border-bottom-width: 6px;
      border-radius: 16px;
      background: #fff;
      font-weight: 800;
      font-size: clamp(14px, 2.2vw, 18px);
      color: #1e3a8a;
      transition: transform .12s
    }

    .opt:hover {
      transform: translateY(-2px)
    }

    .opt.sel {
      background: #fde047;
      border-color: #f59e0b
    }

    .opts.lo {
      grid-template-columns: repeat(4, 1fr)
    }

    .lo .opt {
      text-align: center;
      font-size: 24px
    }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px
    }

    .btn {
      border: 0;
      border-bottom: 5px solid #0284c7;
      border-radius: 16px;
      background: linear-gradient(#4facfe, #00f2fe);
      color: #fff;
      font-weight: 900;
      font-size: clamp(15px, 2.4vw, 20px);
      padding: 10px 22px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, .3)
    }

    a.btn {
      display: inline-block;
      text-decoration: none
    }

    .btn.g {
      background: linear-gradient(#4ade80, #16a34a);
      border-color: #166534
    }

    .btn:disabled {
      background: #cbd5e1;
      border-color: #94a3b8;
      cursor: default
    }

    .res {
      text-align: center
    }

    .res h2 {
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 900;
      color: #7e22ce
    }

    .big {
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 900;
      color: #1e3a8a;
      margin: 6px 0
    }

    .rv {
      text-align: left;
      margin-top: 16px;
      display: grid;
      gap: 8px
    }

    .rv div {
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      border: 2px solid
    }

    .rv .ok {
      background: #dcfce7;
      border-color: #4ade80
    }

    .rv .no {
      background: #fee2e2;
      border-color: #f87171
    }

    .rv .bl {
      background: #f1f5f9;
      border-color: #cbd5e1
    }

    .rv small {
      display: block;
      font-weight: 700;
      color: #475569
    }
  </style>

  <script>
    const Q = [{ "t": "Read what four people say about their jobs. According to the comments above, who says something about <b>safety</b>?", "c": "Ece, Can, Selin ve Arda'nın mesleklerini anlatan yorumları", "q": "", "o": ["Ece", "Can", "Selin", "Arda"], "a": 0, "w": "Ece üniforma giyiyor ve şehri güvende tutuyor; bu bir polis memurunu anlatır." }, { "t": "Leyla and Zeynep are talking at school. Read their conversation. Which of the following does <u>NOT</u> fill in any of the blanks in the conversation above?", "c": "Leyla ve Zeynep'in yeni yağmurluk hakkındaki konuşması", "q": "", "o": ["fits like a glove", "Feel free to use it!", "Go ahead!", "I'm sorry to hear that."], "a": 3, "w": "(1) için “fits like a glove”, (2) için “Feel free to use it!” ya da “Go ahead!” uyar. D hiçbirine uymaz." }, { "t": "Jenny wants to join a school club. Read what she says and look at the table below. According to the information above, which club should Jenny join?", "c": "Jenny'nin sözü ve kulüp tablosu", "q": "", "o": ["Art Club", "Story Club", "Drama Club", "Science Club"], "a": 1, "w": "Jenny İngilizce hikâye yazmayı seviyor ve Çarşamba günü boş; Story Club Çarşamba günü." }, { "t": "Read what four students say about their lunch. According to the comments above, which two students had a healthy lunch?", "c": "Lara, Mark, Nil ve Oz'un öğle yemeği yorumları", "q": "", "o": ["Lara and Mark", "Mark and Oz", "Lara and Nil", "Nil and Oz"], "a": 2, "w": "Lara (balık, ıspanak) ve Nil (yumurta, üzüm, yoğurt) sağlıklı yemiş." }, { "t": "Ali writes a plan for Saturday. Read his note below. According to the note above, which place will Ali <u>NOT</u> visit?", "c": "Ali'nin Saturday Plan notu", "q": "", "o": ["the bakery", "the cinema", "the museum", "the greengrocer's"], "a": 3, "w": "Ekmek (bakery), ilaç (chemist's), film (cinema), tarih (museum). Manav (greengrocer's) yok." }, { "t": "Read the diary page below. Which of the following is correct according to the text above?", "c": "Günlük sayfası: deniz kaplumbağası, yengeçler ve plastik poşet", "q": "", "o": ["The weather was cold and rainy.", "The writer saw a dolphin.", "The writer was sad about a plastic bag.", "The family went to the museum."], "a": 2, "w": "Yazar denizde plastik poşet görüp üzülmüş." }, { "t": "A teacher asks four students about their hobbies. Look at the survey table below. Which of the following is <u>NOT</u> correct according to the table above?", "c": "Hobby Survey tablosu (read books / go for a walk / play football)", "q": "", "o": ["Zeynep never plays football.", "Ece goes for a walk three times a week.", "Ali often plays football.", "Can always goes for a walk."], "a": 1, "w": "Ece yürüyüşe “sometimes” çıkıyor; “three times a week” yazmıyor." }, { "t": "Mrs. Aydın talks to four students. Look at the clocks, too. According to the clocks above, who comes to the lesson on time?", "c": "Ders saat 10:45 (quarter to eleven); Ada, Ben, Cem ve Dina'nın saatleri", "q": "", "o": ["Ada", "Ben", "Cem", "Dina"], "a": 0, "w": "Quarter to eleven 10:45 demektir; yalnızca Ada'nın saati 10:45 gösteriyor." }, { "t": "Mrs. Kaya is an English teacher. Read what she says to her class. According to the situation above, which object does Mr. Kaya need?", "c": "Mrs. Kaya'nın dinleme etkinliği ve dört nesne (headphones, speaker, projector, printer)", "q": "", "o": ["headphones", "a speaker", "a projector", "a printer"], "a": 1, "w": "Herkes konuşmayı birlikte duymalı; hoparlör (speaker) gerekir." }, { "t": "Mina describes her best friend. Look at the cards below. According to the information above, who is Mina's best friend?", "c": "Mina'nın “short brown hair” tarifi ve dört kart (A Berk, B Kaan, C Deniz, D Kübra)", "q": "", "o": ["Berk", "Kaan", "Deniz", "Kübra"], "a": 0, "w": "Kısa kahverengi saçlı olan tek çocuk Berk. Kaan'ın saçı siyah, Deniz ve Kübra'nın saçı kıvırcık ve siyah." }];

    function go(n) { if (i + n >= Q.length) finish(); else { i += n; render() } }
    function finish() {
      const ok = Q.filter((d, k) => sel[k] === d.a).length, b = sel.filter(s => s === null).length, ot = (d, j) => L[j] + ") " + strip(d.o[j]);

<head>
    <meta charset="UTF-8">

    <title>Multiple Choice Tests</title>
    <style>
        /* Sıfırlama ve Genel Düzen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle, #ffffff 0%, #CDEFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 10px;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 35px 30px;
            border-radius: 35px;
            box-shadow: 0 15px 50px rgba(0, 100, 255, 0.15);
            border: 2px solid rgba(79, 172, 254, 0.4);
        }

        /* GERİ (BACK) BUTONU */
        .back-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 28px;
            background: #ffffff;
            color: #1e3c72;
            border: 2px solid #4facfe;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .back-btn:hover {
            background: linear-gradient(145deg, #4facfe, #0072ff);
            color: white;
            border-color: transparent;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.45);
        }

        .back-btn:active {
            transform: scale(0.96) translateY(0);
        }

        /* BAŞLIK */
        .title {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
            background: linear-gradient(to right, #1e3c72, #2a5298, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 6px rgba(30, 60, 114, 0.2));
        }

        .title span {
            -webkit-text-fill-color: initial;
            color: #4facfe;
        }

        /* GRID - 3 BUTON (ORİJİNAL BOYUT VE ORTALANMIŞ) */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(100px, 145px));
            gap: 18px;
            justify-content: center;
        }

        /* BUTONLAR - BÜYÜTÜLMÜŞ MODERN MAVİ GRADIENT */
        .test-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 0px;
            background: linear-gradient(145deg, #4facfe, #0072ff);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 32px;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            gap: 8px;
        }

        /* Butona hafif parlaklık efekti */
        .test-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .test-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 18px 40px rgba(79, 172, 254, 0.55);
            background: linear-gradient(145deg, #3b8dd9, #0055cc);
        }

        .test-btn:hover::after {
            opacity: 1;
        }

        .test-btn:active {
            transform: scale(0.95) translateY(0);
            box-shadow: 0 4px 10px rgba(79, 172, 254, 0.3);
        }

        /* Buton içindeki ikon */
        .test-btn .icon {
            font-size: 1.8rem;
            margin-right: 0;
        }

        .test-btn .sub-text {
            display: block;
            font-size: 0.75em;
            margin-top: -4px;
            line-height: 1;
            opacity: 0.9;
        }

        /* MOBİL UYUM */
        @media (max-width: 650px) {
            .container {
                padding: 25px 18px;
            }

            .title {
                font-size: 1.7rem;
                margin-bottom: 25px;
            }

            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .test-btn {
                font-size: 1rem;
                padding: 20px 10px;
                border-radius: 16px;
            }

            .test-btn .icon {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 450px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .test-btn {
                font-size: 0.95rem;
                padding: 18px 8px;
                border-radius: 14px;
            }

            .title {
                font-size: 1.4rem;
            }

            .back-btn {
                padding: 8px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
    <link rel="stylesheet" href="../theme.css">
</head>
